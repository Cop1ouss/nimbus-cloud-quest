delete.","kind":"one","miss":false},{"id":"q010","d":1,"topic":"Key Vault","q":"You must make sure no one, including a subscription Owner, can permanently delete keys in a vault before 90 days pass. What should you enable?","opts":["Vault access policies","A ReadOnly resource lock","Soft delete only","Purge protection"],"ans":[3],"why":"Purge protection blocks purging until the retention period ends and cannot be turned off.","kind":"one","miss":false},{"id":"q011","d":1,"topic":"Key Vault","q":"A storage account uses a customer-managed key. The vault firewall blocks public access. What lets the storage service reach the vault?","opts":["Allow trusted Microsoft services to bypass the firewall, plus key permissions for the storage identity","Turning off soft delete","Granting Key Vault Reader to all users","A user-defined route to the vault"],"ans":[0],"why":"The trusted services exception covers network access. The service identity still needs data-plane permission.","kind":"one","miss":false},{"id":"q012","d":1,"topic":"Key Vault","q":"Which TWO statements about Key Vault soft delete are true?","opts":["It only protects certificates","It cannot be disabled once on","The retention period cannot be changed after the vault is created","Its default retention is 14 days"],"ans":[1,2],"why":"Soft delete is permanent, 7 to 90 days (default 90), fixed at creation, and covers vaults, keys, secrets and certificates.","kind":"two","miss":false},{"id":"q013","d":1,"topic":"Key Vault","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Key Vault Reader can read the value of a secret.","Premium tier is needed for HSM-protected keys.","A user with Contributor on the vault can read secrets when the vault uses Azure RBAC, without any data-plane role."],"ans":[0,1,0],"why":"Reader sees metadata. Premium adds HSM keys. With RBAC, data access needs a data-plane role.","miss":false},{"id":"q014","d":1,"topic":"Key Vault","type":"match","kind":"match","q":"Match each task to the least-privileged Key Vault role.","rows":["Read a secret value","Create and delete secrets","Encrypt and decrypt with a key","Permanently delete a soft-deleted vault"],"choices":["Key Vault Secrets Officer","Key Vault Purge Operator","Key Vault Crypto User","Key Vault Secrets User"],"ans":[3,0,2,1],"why":"User roles use objects. Officer roles manage them.","miss":false},{"id":"q015","d":1,"topic":"Key Vault","q":"Defender for Cloud shows an attack path where an internet-exposed VM holds a plaintext storage key. Which capability found the key?","opts":["Agentless secrets scanning in Defender CSPM","Key Vault diagnostic logs","Azure Policy Audit effect","Defender for Key Vault alerts"],"ans":[0],"why":"Agentless secrets scanning inspects machine disks for secrets and feeds attack path analysis.","kind":"one","miss":false},{"id":"q016","d":1,"topic":"Key Vault","q":"You need an alert when a vault is accessed from a Tor exit node. What should you enable?","opts":["Defender for Key Vault","Key auto-rotation","A private endpoint","Purge protection"],"ans":[0],"why":"Defender for Key Vault detects unusual and suspicious access patterns.","kind":"one","miss":false},{"id":"q017","d":1,"topic":"Governance and compliance","q":"A backup admin's account is compromised. You need a second person, in another team, to approve disabling soft delete or reducing retention on the vault. What should you configure?","opts":["Multi-user authorization with a Resource Guard","A CanNotDelete lock","Vault redundancy set to GRS","A custom RBAC role with NotActions"],"ans":[0],"why":"A Resource Guard owned by someone else gates critical vault operations.","kind":"one","miss":false},{"id":"q018","d":1,"topic":"Governance and compliance","q":"You must show auditors how your subscriptions measure against PCI DSS. What should you do in Defender for Cloud?","opts":["Add the PCI DSS standard and review the regulatory compliance dashboard","Create an Azure budget","Enable just-in-time VM access","Raise the secure score to 100%"],"ans":[0],"why":"The dashboard maps assessments to each standard's controls.","kind":"one","miss":false},{"id":"q019","d":1,"topic":"Governance and compliance","q":"A custom role lists Actions: Microsoft.Compute/* and NotActions: Microsoft.Compute/virtualMachines/delete. A user also has Contributor on the same scope. Can the user delete VMs?","opts":["Yes, because NotActions is not a deny and Contributor grants delete","No, NotActions always blocks the action","Only after activating PIM","No, custom roles override built-in roles"],"ans":[0],"why":"NotActions only subtracts within that role. Another assignment can still grant the action.","kind":"one","miss":false},{"id":"q020","d":1,"topic":"Governance and compliance","q":"You need to stop anyone from deploying storage accounts that allow public blob access, across all subscriptions. What should you use?","opts":["An access review","A Defender for Storage alert","A resource lock on each subscription","An Azure Policy assignment with the Deny effect at the management group"],"ans":[3],"why":"Deny blocks non-compliant deployments, and management group scope covers every subscription under it.","kind":"one","miss":false},{"id":"q021","d":1,"topic":"Governance and compliance","q":"Which TWO help reduce standing privileged access?","opts":["Convert active role assignments to eligible in PIM","Share one admin account between the team","Run access reviews on privileged roles","Assign Owner at the root management group"],"ans":[0,2],"why":"PIM removes standing access. Reviews remove what is no longer needed.","kind":"two","miss":false},{"id":"q022","d":1,"topic":"Governance and compliance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["The Microsoft cloud security benchmark is assigned by default in Defender for Cloud.","A locked immutable vault's immutability setting can be turned off later.","Custom Microsoft Entra roles require Entra ID P1."],"ans":[1,0,1],"why":"MCSB is the default standard. Locking immutability is irreversible. Custom Entra roles need P1.","miss":false},{"id":"q023","d":1,"topic":"Governance and compliance","type":"match","kind":"match","q":"Match each requirement to the control.","rows":["Block resources outside approved regions","Protect recovery points from deletion","Stop accidental deletion of a resource group","Same security baseline in every environment"],"choices":["Resource lock","Immutable vault","Infrastructure as code","Azure Policy Deny"],"ans":[3,1,0,2],"why":"Policy shapes, vaults keep, locks protect, IaC repeats.","miss":false},{"id":"q024","d":1,"topic":"Governance and compliance","q":"A team needs to restart VMs and read their metrics, nothing more. No built-in role fits. What should you create?","opts":["A custom Azure role with only those Actions and the needed AssignableScopes","A custom Entra role","A policy initiative","A new management group"],"ans":[0],"why":"Custom Azure roles grant exactly the management-plane actions you list.","kind":"one","miss":false},{"id":"q025","d":2,"topic":"Storage security","q":"All access to a storage account must be authorized with Microsoft Entra ID so that every request maps to an identity. What should you configure?","opts":["Disallow Shared Key authorization","Set the default tier to Cool","Enable hierarchical namespace","Regenerate both access keys monthly"],"ans":[0],"why":"With Shared Key off, account keys and key-signed SAS stop working, leaving Entra authorization.","kind":"one","miss":false},{"id":"q026","d":2,"topic":"Storage security","q":"A web app lets customers upload files to Blob Storage. Files must be checked for malware as they arrive, and bad ones handled automatically. What should you enable?","opts":["A lifecycle management rule","Blob versioning","Defender for Storage on-upload malware scanning with results sent to Event Grid","Hash-based soft delete"],"ans":[2],"why":"On-upload scanning checks each blob, and Event Grid lets a function or logic app quarantine it.","kind":"one","miss":false},{"id":"q027","d":2,"topic":"Storage security","q":"A user with the Contributor role on a storage account gets 403 when listing blobs with Entra authorization in the portal. Why?","opts":["The account uses ZRS","The user needs the Reader role as well","Contributor is a management role; a Storage Blob Data role is needed","Blob soft delete is on"],"ans":[2],"why":"Data-plane access needs a data role such as Storage Blob Data Reader.","kind":"one","miss":false},{"id":"q028","d":2,"topic":"Storage security","q":"Which TWO settings reduce the risk of data being read anonymously or over an insecure channel?","opts":["Require secure transfer","Enable large file shares","Enable change feed","Disallow anonymous blob access"],"ans":[0,3],"why":"One blocks public containers, the other forces HTTPS.","kind":"two","miss":false},{"id":"q029","d":2,"topic":"Storage security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Defender for Storage activity monitoring needs diagnostic resource logs to be enabled first.","A stored access policy can revoke the service SAS tokens that reference it.","IP network rules can allow a private address range such as 10.0.0.0/24."],"ans":[0,1,0],"why":"Activity monitoring needs no resource logs. Policies revoke linked SAS. IP rules take public ranges only.","miss":false},{"id":"q030","d":2,"topic":"Storage security","type":"match","kind":"match","q":"Match each goal to the storage feature.","rows":["Detect a malicious file as it is uploaded","Use your own key in Key Vault","Reach the account on a private IP","Revoke a set of SAS tokens at once"],"choices":["On-upload malware scanning","Stored access policy","Private endpoint","Customer-managed keys"],"ans":[0,3,2,1],"why":"Detect, encrypt, isolate, revoke.","miss":false},{"id":"q031","d":2,"topic":"Storage security","q":"You need to keep malware scanning costs predictable on a high-traffic account. What should you set?","opts":["Infrastructure encryption","A SAS expiration policy","The access tier to Archive","A monthly cap on GB scanned"],"ans":[3],"why":"The cap stops scanning for the month when reached, and alerts warn at 75% and 100%.","kind":"one","miss":false},{"id":"q032","d":2,"topic":"Storage security","q":"Different containers in one account must be encrypted with different keys. What should you use?","opts":["Stored access policies","Blob index tags","Encryption scopes","Separate access keys"],"ans":[2],"why":"An encryption scope assigns its own key to a container or blob.","kind":"one","miss":false},{"id":"q033","d":2,"topic":"Database security","q":"Security policy says no SQL logins may exist; only identities from the directory may connect to Azure SQL Database. What should you enable?","opts":["Microsoft Entra-only authentication","A server-level firewall rule","Transparent data encryption","Dynamic data masking"],"ans":[0],"why":"Entra-only authentication disables SQL authentication for the server.","kind":"one","miss":false},{"id":"q034","d":2,"topic":"Database security","q":"Database administrators must not be able to read the credit card column, even when querying the table directly. What should you use?","opts":["Dynamic data masking","Transparent data encryption","Always Encrypted","Row-level security"],"ans":[2],"why":"Always Encrypted keeps data encrypted from the client, so the server and DBAs never see plaintext. Masking can be bypassed by privileged users.","kind":"one","miss":false},{"id":"q035","d":2,"topic":"Database security","q":"You need one audit configuration that covers every database on a logical server, including databases created later, queryable with KQL. What should you configure?","opts":["Database-level auditing on each database to a storage account","Defender for SQL vulnerability assessment","A resource lock on the id":"q040","d":2,"topic":"Database security","q":"Defender for Cloud should alert on a possible SQL injection against SQL Server running on Azure VMs and on-premises servers. Which plan should you enable?","opts":["Foundational CSPM","Defender for SQL servers on machines","Defender for Azure SQL databases","Defender for Storage"],"ans":[1],"why":"SQL Server on VMs and Arc-enabled servers is covered by the SQL servers on machines plan.","kind":"one","miss":false},{"id":"q041","d":2,"topic":"Network security","q":"The central security team must block inbound SSH from the internet in every virtual network, and application teams must not be able to override it with their NSGs. What should you use?","opts":["An application security group","An Azure Virtual Network Manager security admin rule with the Deny action","An NSG rule with priority 100 in each subnet","A user-defined route"],"ans":[1],"why":"Admin Deny rules are evaluated before NSGs and cannot be overridden by them.","kind":"one","miss":false},{"id":"q042","d":2,"topic":"Network security","q":"An AVNM security admin rule uses the Allow action for TCP 443. A subnet NSG denies TCP 443. What happens to the traffic?","opts":["It is allowed, because admin rules win","It bypasses both rule sets","It is allowed only for 60 seconds","It is denied by the NSG"],"ans":[3],"why":"Allow passes the traffic on to NSG evaluation. Only Always Allow skips the NSG.","kind":"one","miss":false},{"id":"q043","d":2,"topic":"Network security","q":"Remote users need access to an internal web app without a VPN, with per-app Conditional Access. What should you deploy?","opts":["A service endpoint","Azure Bastion","A site-to-site VPN","Microsoft Entra Private Access with a private network connector"],"ans":[3],"why":"Private Access is ZTNA for private apps through connectors and the Global Secure Access client.","kind":"one","miss":false},{"id":"q044","d":2,"topic":"Network security","q":"You must inspect outbound HTTPS traffic for malware and use signature-based intrusion detection and prevention. Which Azure Firewall SKU is required?","opts":["Premium","Any SKU with DNS proxy","Basic","Standard"],"ans":[0],"why":"TLS inspection and IDPS are Premium features.","kind":"one","miss":false},{"id":"q045","d":2,"topic":"Network security","q":"Your team hosts an API on VMs behind a Standard Load Balancer and wants customers in other tenants to reach it privately from their own VNets. What should you create?","opts":["A NAT gateway","A service endpoint policy","A VNet peering to each customer","A Private Link service"],"ans":[3],"why":"A Private Link service publishes your service so consumers create private endpoints to it.","kind":"one","miss":false},{"id":"q046","d":2,"topic":"Network security","q":"Which TWO authentication options are available for point-to-site VPN users?","opts":["Microsoft Entra ID","Certificates","Storage account keys","SAS tokens"],"ans":[0,1],"why":"P2S supports Entra ID, certificate and RADIUS authentication.","kind":"two","miss":false},{"id":"q047","d":2,"topic":"Network security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Only one security admin configuration can be deployed to a region per network manager.","An Always Allow admin rule can be blocked by a subnet NSG.","A secured virtual hub is a Virtual WAN hub with Azure Firewall or a security partner."],"ans":[1,0,1],"why":"One config per region. Always Allow ends evaluation. Secured hubs add a firewall.","miss":false},{"id":"q048","d":2,"topic":"Network security","type":"match","kind":"match","q":"Match each Azure Firewall rule type to its job.","rows":["Publish an internal server on a public IP and port","Allow by IP, port and protocol","Allow outbound by FQDN","Block known malicious IPs and domains"],"choices":["Threat intelligence","DNAT rule","Application rule","Network rule"],"ans":[1,3,2,0],"why":"Translate, filter by L3/L4, filter by name, block by intel.","miss":false},{"id":"q049","d":2,"topic":"Network security","q":"A VM cannot receive traffic on port 8080. You need to know which rule denies it, including any Virtual Network Manager admin rules. Which tool should you use?","opts":["Connection Monitor","Next hop","IP flow verify","Packet capture"],"ans":[2],"why":"IP flow verify returns allowed or denied and the rule, checking NSGs and AVNM admin rules.","kind":"one","miss":false},{"id":"q050","d":3,"topic":"Security for AI","q":"Before rolling out Microsoft 365 Copilot you must find SharePoint sites where sensitive files are shared too widely. What should you review first?","opts":["The Defender for Cloud secure score","Azure Policy compliance","The Entra sign-in logs","The default data risk assessment in Purview Data Security Posture Management"],"ans":[3],"why":"DSPM assesses the top 100 SharePoint sites weekly for oversharing without any setup.","kind":"one","miss":false},{"id":"q051","d":3,"topic":"Security for AI","q":"A Copilot Studio agent must have each planned tool call checked by your security platform, which can block it before it runs. What should you configure?","opts":["An NSG on the agent's subnet","External threat detection with Microsoft Defender as the provider","A Foundry guardrail on the agent's model","A DLP policy on SharePoint"],"ans":[1],"why":"The agent calls the threat detection endpoint before invoking each tool and follows its allow or block decision.","kind":"one","miss":false},{"id":"q052","d":3,"topic":"Security for AI","q":"All agents created from one blueprint must be blocked from signing in when their risk is high. Where should you apply the Conditional Access policy?","opts":["To each agent's sponsor","To the Foundry project","To the agent identity blueprint","To the Global Administrator role"],"ans":[2],"why":"Policies applied at the blueprint are inherited by every agent identity created from it.","kind":"one","miss":false},{"id":"q053","d":3,"topic":"Security for AI","q":"Several teams share one Foundry resource. One project must not consume more than a set number of tokens per minute. What should you configure?","opts":["Defender for AI Services","AI Gateway with a token limit for the project","A budget alert","A guardrail with the Violence risk"],"ans":[1],"why":"AI Gateway enforces TPM limits and token quotas at the project level.","kind":"one","miss":false},{"id":"q054","d":3,"topic":"Security for AI","q":"An agent in Foundry reads web pages through a tool. You must stop hidden instructions in a page from steering the agent. Which control fits?","opts":["An indirect attack control at the tool response intervention point","A protected material control at output","A Hate control at user input","A token quota in AI Gateway"],"ans":[0],"why":"Indirect prompt injection arrives in tool responses, so scan and block there.","kind":"one","miss":false},{"id":"q055","d":3,"topic":"Security for AI","q":"Which TWO are needed for DSPM to report on users' activity with third-party AI websites?","opts":["The Microsoft Purview browser extension","A Foundry guardrail","An Azure Firewall Premium policy","Devices onboarded to Microsoft Purview"],"ans":[0,3],"why":"Third-party AI site insights depend on onboarded devices and the browser extension.","kind":"two","miss":false},{"id":"q056","d":3,"topic":"Security for AI","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["An agent identity stores its own client secret.","If an agent has its own guardrail, the model's guardrail still applies as well.","Defender for AI Services alerts appear in the Defender XDR portal."],"ans":[0,0,1],"why":"Credentials sit on the blueprint. The agent guardrail fully overrides the model's. AI alerts integrate with Defender XDR.","miss":false},{"id":"q057","d":3,"topic":"Security for AI","type":"match","kind":"match","q":"Match each task to the tool.","rows":["Find overshared SharePoint content","Alert on a jailbreak attempt against a model","Cap tokens per project","Approve or block agents for Microsoft 365 users"],"choices":["Defender for AI Services","Microsoft 365 admin center","Purview DSPM","AI Gateway"],"ans":[2,0,3,1],"why":"Data posture, threat alerts, traffic control, admin control.","miss":false},{"id":"q058","d":3,"topic":"Security for AI","q":"Every agent identity must have someone accountable for deciding whether the agent is still needed. Which role is that?","opts":["Sponsor","Owner","Blueprint principal","Agent user"],"ans":[0],"why":"The sponsor carries business accountability. The owner handles technical operations.","kind":"one","miss":false},{"id":"q059","d":3,"topic":"Servers and VMs","q":"RDP on production VMs must be closed by default and opened only on request, for a limited time and from the requester's IP. What should you enable?","opts":["A permanent NSG allow rule for the corporate range","Just-in-time VM access in Defender for Servers Plan 2","Azure Bastion Developer SKU","Encryption at host"],"ans":[1],"why":"JIT keeps ports closed and adds time-limited rules on approved requests.","kind":"one","miss":false},{"id":"q060","d":3,"topic":"Servers and VMs","q":"You must scan VMs for vulnerabilities and exposed secrets without installing anything on them or affecting performance. What should you use?","opts":["File integrity monitoring","The Defender for Endpoint sensor only","Agentless scanning","Azure Machine Configuration"],"ans":[2],"why":"Agentless scanning analyzes disk snapshots outside the VM.","kind":"one","miss":false},{"id":"q061","d":3,"topic":"Servers and VMs","q":"On-premises Windows servers must be protected by Defender for Servers and governed with Azure Policy. What must you do first?","opts":["Deploy Azure Bastion","Create an AWS connector","Onboard the servers to Azure Arc","Enable Trusted launch"],"ans":[2],"why":"Arc makes the servers Azure resources so Defender and Policy can reach them.","kind":"one","miss":false},{"id":"q062","d":3,"topic":"Servers and VMs","q":"Compliance requires recording all administrator RDP sessions to VMs that have no public IP. Which Bastion SKU do you need?","opts":["Developer","Premium","Standard","Basic"],"ans":[1],"why":"Session recording is a Premium feature.","kind":"one","miss":false},{"id":"q063","d":3,"topic":"Servers and VMs","q":"Which TWO features are part of Trusted launch?","opts":["TLS inspection","vTPM","Just-in-time access","Secure Boot"],"ans":[1,3],"why":"Trusted launch combines Secure Boot, vTPM and boot integrity monitoring.","kind":"two","miss":false},{"id":"q064","d":3,"topic":"Servers and VMs","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Defender for Servers Plan 1 includes just-in-time VM access.","Azure Machine Configuration can apply to Arc-enabled servers.","Azure Disk Encryption is the recommended option for new VMs."],"ans":[0,1,0],"why":"JIT is Plan 2. Machine Configuration covers Arc servers. ADE is retiring; use encryption at host.","miss":false},{"id":"q065","d":3,"topic":"Servers and VMs","type":"match","kind":"match","q":"Match each requirement to the feature.","rows":["Enforce a password policy inside the OS","Detect changes to system files and registry","Encrypt temp disks and caches end to end","Block unsigned bootloaders"],"choices":["Azure Machine Configuration","Secure Boot","File integrity monitoring","Encryption at host"],"ans":[0,2,3,1],"why":"In-guest policy, change detection, host encryption, boot trust.","miss":false},{"id":"q066","d":3,"topic":"Servers and VMs","q":"Which Defender for Servers plan do you need for file integrity monitoring and premium vulnerability management capabilities?","opts":["Plan 2","Either plan","Plan 1","Foundational CSPM"],"ans":[0],"why":"Both are Plan 2 features.","kind":"one","miss":false},{"id":"q067","d":3,"topic":"App platform security","q":"A new WAF policy on Application Gateway must be tested against production traffic without blocking any requests. Which mode should you use?","opts":["Enforcement","Detection","Audit-if-not-exists","Prevention"],"ans":[1],"why":"Detection mode logs matches only. Prevention blocks them.","kind":"one","miss":false},{"id":"q068","d":3,"topic":"App platform security","q":"Developers currently use a cluster admin certificate to reach AKS. You must make all access go through directory identities and roles. Which TWO should you configure?","opts":["Disable local accounts","Enable the ACR admin user","Microsoft Entra integration with Azure RBAC for Kubernetes","Open the API server to all IP addresses"],"ans":[0,2],"why":"Entra plus Azure RBAC gives identity-based access, and disabling local accounts removes the shared admin credential.","kind":"two","miss":false},{"id":"q069","d":3,"topic":"App platform security","q":"An API in API Management must reject calls that do not carry a valid Microsoft Entra access token with the right audience. Which policy should you add?","opts":["ip-filter","rate-limit","validate-jwt","set-backend-service"],"ans":[2],"why":"validate-jwt checks the token's signature, issuer, audience and claims.","kind":"one","miss":false},{"id":"q070","d":3,"topic":"App platform security","q":"A logic app's run history shows customer passwords passed between actions. What should you turn on?","opts":["A consumption plan","Secure inputs and outputs on those actions","WAF in Detection mode","Access restrictions on the trigger"],"ans":[1],"why":"Secure inputs and outputs obfuscate the data in run history.","kind":"one","miss":false},{"id":"q071","d":3,"topic":"App platform security","q":"An HTTP-triggered function must only accept calls from signed-in users of your tenant. What should you configure?","opts":["A function-level key in the URL","A storage account firewall","App Service Authentication with Microsoft Entra ID","A host key shared with users"],"ans":[2],"why":"Keys are shared secrets, not user identity. Built-in authentication validates Entra tokens.","kind":"one","miss":false},{"id":"q072","d":3,"topic":"App platform security","q":"Defender for Cloud should alert when a container in AKS starts a crypto-mining process. Which component provides that runtime detection?","opts":["Azure Policy for Kubernetes","The ACR admin user","Network policies","The Defender sensor deployed by Defender for Containers"],"ans":[3],"why":"The sensor collects runtime signals from nodes for threat detection.","kind":"one","miss":false},{"id":"q073","d":3,"topic":"App platform security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["WAF Prevention mode blocks requests that match rules.","Function keys identify the individual user calling a function.","Premium tier is required for private endpoints on Azure Container Registry."],"ans":[1,0,1],"why":"Prevention blocks. Keys are shared secrets. ACR private endpoints need Premium.","miss":false},{"id":"q074","d":3,"topic":"App platform security","type":"match","kind":"match","q":"Match each service to its key control.","rows":["AKS pod-to-pod traffic","ACR image pulls","App Service secrets","Throttle API callers"],"choices":["Network policies","Key Vault references","API Management rate-limit policy","Managed identity with AcrPull"],"ans":[0,3,1,2],"why":"Segment, authenticate, hide secrets, throttle.","miss":false},{"id":"q075","d":3,"topic":"App platform security","q":"A WAF managed rule blocks a legitimate form field that contains SQL-like text. What is the best fix?","opts":["Switch the whole policy to Detection mode","Add an exclusion for that field","Delete the managed rule set","Open the back end directly to the internet"],"ans":[1],"why":"An exclusion removes the false positive while the rest of the rule set stays on.","kind":"one","miss":false},{"id":"q076","d":4,"topic":"Defender for Cloud posture","q":"You need to see how an attacker could move from an internet-exposed VM to a storage account that holds sensitive data. Which capability shows this?","opts":["A workbook in Microsoft Sentinel","Azure Advisor","Secure score in Foundational CSPM","Attack path analysis in Defender CSPM"],"ans":[3],"why":"Attack path analysis is a Defender CSPM feature that chains exposures to targets.","kind":"one","miss":false},{"id":"q077","d":4,"topic":"Defender for Cloud posture","q":"Your company bought another firm. You must find its unknown public websites, hosts and certificates without access to its systems. What should you use?","opts":["Azure Policy","Agentless scanning","Defender External Attack Surface Management","Defender for Servers Plan 1"],"ans":[2],"why":"EASM discovers internet-facing assets from the outside using seeds.","kind":"one","miss":false},{"id":"q078","d":4,"topic":"Defender for Cloud posture","q":"You are connecting an AWS organization to Defender for Cloud. What do you deploy in AWS to create the required roles?","opts":["An Azure Bicep file","A Log Analytics agent on every EC2 instance","A site-to-site VPN","The CloudFormation template generated by the connector wizard"],"ans":[3],"why":"The AWS connector produces a CloudFormation template (stack or StackSet).","kind":"one","miss":false},{"id":"q079","d":4,"topic":"Defender for Cloud posture","q":"Which TWO capabilities require the paid Defender CSPM plan?","opts":["Microsoft cloud security benchmark recommendations","Cloud security explorer","Secure score","Attack path analysis"],"ans":[1,3],"why":"Secure score and MCSB recommendations are in free Foundational CSPM.","kind":"two","miss":false},{"id":"q080","d":4,"topic":"Defender for Cloud posture","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Foundational CSPM is free.","Defender workload protection plans produce security alerts.","EASM needs an agent on each discovered asset."],"ans":[1,1,0],"why":"Foundational CSPM costs nothing. Plans alert on threats. EASM is agentless and external.","miss":false},{"id":"q081","d":4,"topic":"Defender for Cloud posture","type":"match","kind":"match","q":"Match each question to the Defender for Cloud feature.","rows":["How hardened are we overall?","Do we meet ISO 27001 controls?","Which assets can an attacker chain together?","What is exposed to the internet that we forgot?"],"choices":["Defender EASM","Attack path analysis","Secure score","Regulatory compliance dashboard"],"ans":[2,3,1,0],"why":"Posture, compliance, paths, outside view.","miss":false},{"id":"q082","d":4,"topic":"Defender for Cloud posture","q":"You want Defender for Storage and Defender for Servers enabled on every current and future subscription under a management group. What is the best way?","opts":["Add an AWS connector","Create a budget","Enable each plan by hand per subscription","Assign the built-in Azure Policy definitions that configure the Defender plans"],"ans":[3],"why":"Policy enables plans at scale and covers new subscriptions.","kind":"one","miss":false},{"id":"q083","d":4,"topic":"Defender for Cloud posture","q":"Which scanning approach for Azure VM vulnerabilities is available in both Defender for Servers Plan 1 and Plan 2?","opts":["Packet capture","Agent-based scanning with the Defender for Endpoint sensor","Agentless scanning","BYOL only"],"ans":[1],"why":"Agentless scanning is Plan 2 only. Agent-based works in both.","kind":"one","miss":false},{"id":"q084","d":4,"topic":"Microsoft Sentinel","q":"A tier-1 analyst must assign and close incidents and run existing playbooks, but must not edit analytics rules. Which TWO roles should you assign?","opts":["Microsoft Sentinel Responder","Microsoft Sentinel Playbook Operator","Owner","Microsoft Sentinel Contributor"],"ans":[0,1],"why":"Responder manages incidents, Playbook Operator runs playbooks. Contributor could edit rules.","kind":"two","miss":false},{"id":"q085","d":4,"topic":"Microsoft Sentinel","q":"Every new high-severity incident must be assigned to the on-call group and trigger a workflow that posts to Teams. What should you create?","opts":["A data collection rule","A workbook","An automation rule that sets the owner and runs a playbook","A hunting query"],"ans":[2],"why":"Automation rules react to incident creation and can call playbooks.","kind":"one","miss":false},{"id":"q086","d":4,"topic":"Microsoft Sentinel","q":"Firewall appliances send logs in Common Event Format. How should you collect them?","opts":["Diagnostic settings on the firewall vendor's portal","The Windows Forwarded Events connector","Install AMA on the firewalls","A Linux forwarder with Azure Monitor Agent and the CEF via AMA connector"],"ans":[3],"why":"CEF over Syslog goes through a Linux log forwarder running AMA with a DCR.","kind":"one","miss":false},{"id":"q087","d":4,"topic":"Microsoft Sentinel","q":"Proxy logs are huge, rarely queried, and must be kept seven years for compliance at the lowest cost. No detections use them. Where should they go?","opts":["The analytics tier with two-year retention","A workbook","The data lake tier with long total retention","An automation rule"],"ans":[2],"why":"The data lake tier is the low-cost long-retention option when real-time analytics is not needed.","kind":"one","miss":false},{"id":"q088","d":4,"topic":"Microsoft Sentinel","q":"Domain controllers already forward events to a Windows Event Collector server. Which connector brings those events into Sentinel?","opts":["Windows Forwarded Events","Microsoft Entra ID","Syslog via AMA","Common Event Format via AMA"],"ans":[0],"why":"AMA on the collector reads the forwarded events into the WindowsEvent table.","kind":"one","miss":false},{"id":"q089","d":4,"topic":"Microsoft Sentinel","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Analytics rules can run directly on data stored only in the data lake tier.","Playbooks in Microsoft Sentinel are built on Azure Logic Apps.","Microsoft Sentinel Automation Contributor is intended for analyst user accounts."],"ans":[0,1,0],"why":"Lake-only data does not feed real-time rules. Playbooks are Logic Apps. Automation Contributor is for Sentinel's service account.","miss":false},{"id":"q090","d":4,"topic":"Microsoft Sentinel","type":"match","kind":"match","q":"Match each data source to its table.","rows":["Linux syslog messages","Firewall logs in CEF","Windows Security events via AMA","A custom application log"],"choices":["Syslog","SecurityEvent","A table ending in _CL","CommonSecurityLog"],"ans":[0,3,1,2],"why":"Know where the data lands before you write KQL.","miss":false},{"id":"q091","d":4,"topic":"Microsoft Sentinel","q":"You need a packaged set of connector, analytics rules and workbooks for a product you just bought. Where do you get it?","opts":["Table management","Content hub","Automation rules","The Logs ingestion API"],"ans":[1],"why":"Content hub solutions bundle the content for a product.","kind":"one","miss":false},{"id":"q092","d":4,"topic":"Microsoft Sentinel","q":"You must drop a noisy field and mask part of another before custom data is stored. Where do you do this?","opts":["An automation rule","A workbook parameter","A playbook","A KQL transformation in the data collection rule"],"ans":[3],"why":"DCR transformations change data at ingestion time.","kind":"one","miss":false},{"id":"q093","d":4,"topic":"Security Copilot","q":"An analyst has the Security Copilot Contributor role but gets no results when asking about Microsoft Sentinel incidents. What is missing?","opts":["A custom plugin","A Microsoft Sentinel role such as Microsoft Sentinel Reader","The Security Copilot Owner role","More security compute units"],"ans":[1],"why":"Copilot roles grant platform access only. Data access comes from the user's role in each product.","kind":"one","miss":false},{"id":"q094","d":4,"topic":"Security Copilot","q":"You need to restrict who can upload and use custom plugins in Security Copilot. Which role can change this setting?","opts":["Security Copilot Contributor","Billing Reader","Microsoft Sentinel Contributor","Security Copilot Owner"],"ans":[3],"why":"Owners manage plugin settings, capacity and role assignment.","kind":"one","miss":false},{"id":"q095","d":4,"topic":"Security Copilot","q":"You want a partner-built agent for phishing triage. Where do you find and acquire it?","opts":["The Purview portal","Security Store","Azure Marketplace VM images","Content hub in Sentinel"],"ans":[1],"why":"Partner agents are discovered and bought through the Security Store, then set up in Security Copilot.","kind":"one","miss":false},{"id":"q096","d":4,"topic":"Security Copilot","q":"Which TWO are needed to provision Security Copilot capacity?","opts":["Key Vault Secrets User","Microsoft Sentinel Reader","Security Administrator or higher in the tenant","Azure Owner or Contributor on the subscription or resource group"],"ans":[2,3],"why":"Capacity is an Azure resource, and onboarding needs a tenant security admin.","kind":"two","miss":false},{"id":"q097","d":4,"topic":"Security Copilot","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Security Copilot roles are Microsoft Entra roles.","Running an agent consumes security compute units.","Security Copilot can show a user data they have no permission to see in the source product."],"ans":[0,1,0],"why":"The roles are Copilot-specific. Agents use SCUs. Copilot works within the user's permissions.","miss":false},{"id":"q098","d":4,"topic":"Security Copilot","type":"match","kind":"match","q":"Match each item to its meaning.","rows":["Unit of Copilot capacity","Connects Copilot to a product's data","Runs tasks with its own identity and triggers","Scoped environment with its own capacity"],"choices":["Agent","Security compute unit","Workspace","Plugin"],"ans":[1,3,0,2],"why":"Capacity, connection, automation, scope.","miss":false},{"id":"q099","d":4,"topic":"Security Copilot","q":"Security Copilot access is currently given to the Everyone group. You want only security staff to use it, with least effort. What should you do?","opts":["Remove Everyone and assign the Recommended Microsoft Security roles group as Contributor","Make all users Security Administrators","Delete the workspace","Disable all plugins"],"ans":[0],"why":"The recommended roles group gives platform access to people who already hold security roles.","kind":"one","miss":false},{"id":"q100","d":4,"topic":"Security Copilot","q":"After you get an agent that depends on a plugin, the agent fails. What is the most likely fix?","opts":["Configure the dependent plugin under Manage sources","Assign the agent the Global Administrator role","Turn off audit logging","Buy a second workspace"],"ans":[0],"why":"A dependent plugin is enabled with the agent but still needs to be configured.","kind":"one","miss":false}],"sections":[{"id":"s1","d":1,"title":"Secure access with Microsoft Entra ID","label":"High","note":"PIM, Conditional Access, app identity and consent. The identity base for everything else.","why":"","obj":["Implement and configure Privileged Identity Management (PIM)","Implement conditional access policies","Implement and configure authentication methods, including multifactor authentication (MFA) and passwordless","Implement and configure identity for applications, including enterprise applications and app registrations","Manage OAuth permission grants and consent settings","Implement and configure managed identities for Azure resources"],"cold":["**PIM:** eligible roles are activated just in time with MFA, approval and a time limit. Covers Entra roles, Azure roles and groups.","**Conditional Access:** assignments + conditions → grant or session controls. Start in **report-only**, exclude **break-glass** accounts.","**Phishing-resistant:** passkeys (FIDO2), Windows Hello for Business, certificate-based auth. Enforce with **authentication strength**.","**App registration** = definition. **Enterprise application** = service principal in your tenant.","**Delegated** = as the user. **Application** = as the app, admin consent always.","**Managed identity:** system-assigned (one resource) or user-assigned (shared)."],"traps":["Application permissions cannot be user-consented.","User assignment is set on the enterprise application, not the app registration."],"hooks":["Eligible until activated."],"topics":["Entra access"],"qtopics":["Entra access"],"mod":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview","modTitle":"Conditional Access overview","units":[],"models":["ca"]},{"id":"s2","d":1,"title":"Secrets and keys with Azure Key Vault","label":"High","note":"Roles, soft delete vs purge protection, and the firewall. Expect exact role names.","why":"","obj":["Deploy Key Vault","Configure Key Vault settings","Configure access to Key Vault","Configure firewall settings on Key Vault","Manage keys, secrets, and certificates","Scan for secrets by using Defender Cloud Security Posture Management (Defender CSPM)","Implement Defender for Key Vault"],"cold":["Stores **secrets, keys, certificates**. **Premium** = HSM-protected keys.","**Azure RBAC** is the recommended access model. Data-plane roles: Secrets User, Secrets Officer, Crypto User, Crypto Officer, Certificates Officer, Administrator, Reader.","**Soft delete:** always on, 7-90 days (default 90), fixed at creation.","**Purge protection:** optional, irreversible, blocks purge for everyone.","Firewall + **private endpoint**; **trusted Microsoft services** exception.","**Defender CSPM** finds exposed secrets. **Defender for Key Vault** alerts on suspicious access."],"traps":["Key Vault Reader cannot read secret values.","Management-plane Contributor is not data access under RBAC."],"hooks":["Soft delete is the recycle bin. Purge protection is the lock on it."],"topics":["Key Vault"],"qtopics":["Key Vault"],"mod":"https://learn.microsoft.com/en-us/azure/key-vault/general/secure-key-vault","modTitle":"Secure your Azure Key Vault","units":[]},{"id":"s3","d":1,"title":"Governance and regulatory compliance","label":"High","note":"Policy, standards, custom roles, least privilege and backup protection.","why":"","obj":["Implement and configure security controls by using Azure Policy, including built-in and custom policy definitions","Evaluate regulatory compliance by using Microsoft Defender for Cloud","Implement and configure security controls in Defender for Cloud, including security standards and recommendations","Implement resource locks","Manage Azure built-in role assignments","Manage custom roles, including Azure roles and Microsoft Entra roles","Evaluate and remediate overprivileged access assignments by using Azure role-based access control (RBAC)","Configure security controls for backup protection by using Azure Backup security features","Implement and configure security controls by using infrastructure as code"],"cold":["**Policy:** built-in or custom definitions, initiatives, assignments, exemptions. **Deny** blocks, **Audit** reports.","**MCSB** is the default standard behind recommendations and secure score. Add regulatory standards for the **compliance dashboard**.","**Custom Azure role:** Actions, NotActions, DataActions, AssignableScopes. NotActions is **not a deny**.","**Custom Entra roles** need P1.","Cut standing access with **PIM** and **access reviews**.","**Backup:** soft delete, **immutable vault**, **multi-user authorization** (Resource Guard).","Put controls in **IaC** so every environment matches."],"traps":["Another role can still grant what NotActions removes.","A locked immutable vault cannot be unlocked."],"hooks":["Policy shapes, roles permit, locks protect."],"topics":["Governance and compliance"],"qtopics":["Governance and compliance"],"mod":"https://learn.microsoft.com/en-us/training/modules/intro-to-azure-policy/","modTitle":"Introduction to Azure Policy","units":[],"models":["hier"]},{"id":"s4","d":2,"title":"Security for storage accounts","label":"High","note":"Hardening settings, access models and Defender for Storage.","why":"","obj":["Implement and configure security for storage accounts","Configure Azure Storage firewall rules","Implement Defender for Storage threat protection configurations","Manage access to storage, including access policies"],"cold":["Harden: **secure transfer**, **TLS 1.2**, **no anonymous access**, **disallow Shared Key**, network rules or **private endpoints**.","Data access needs **Storage Blob Data** roles; management roles are not enough.","Encryption: Microsoft-managed or **customer-managed keys**, **infrastructure encryption**, **encryption scopes**.","**Stored access policy** revokes the service SAS tokens that use it (max 5 per container).","**Defender for Storage:** activity monitoring, **malware scanning** (on-upload, on-demand, per GB, monthly cap), sensitive data threat detection."],"traps":["Disabling Shared Key also stops account and service SAS.","Activity monitoring needs no diagnostic logs."],"hooks":["Keys are anonymous. Identities are accountable."],"topics":["Storage security"],"qtopics":["Storage security"],"mod":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-storage-introduction","modTitle":"What is Microsoft Defender for Storage","units":[]},{"id":"s5","d":2,"title":"Security for databases","label":"High","note":"Know which SQL feature protects against which reader.","why":"","obj":["Implement platform-level security configurations in Azure SQL","Configure database auditing for Azure SQL Database and Azure SQL Managed Instance","Configure Defender for Databases protection across Azure database services"],"cold":["**Entra-only authentication** turns off SQL logins.","Firewall: **server-level** rules cover all databases, **database-level** one. Prefer private endpoints.","**TDE** = at rest, on by default. **Always Encrypted** = client side, hides data from DBAs.","**Dynamic data masking** hides results. **Row-level security** filters rows.","**Auditing** to storage, Log Analytics or Event Hubs. Server-level covers all databases.","**Defender for Databases:** Azure SQL, SQL on machines, open-source relational, Cosmos DB."],"traps":["TDE does not stop a DBA reading data.","Masking is not encryption."],"hooks":["At rest: TDE. In use: Always Encrypted."],"topics":["Database security"],"qtopics":["Database security"],"mod":"https://learn.microsoft.com/en-us/azure/azure-sql/database/security-best-practice","modTitle":"Azure SQL security best practices","units":[]},{"id":"s6","d":2,"title":"Security for Azure network services","label":"High","note":"The largest stop in the largest domain. Order of evaluation is the theme.","why":"","obj":["Implement and manage network security groups (NSGs) and application security groups (ASGs)","Implement and configure network access policies by using Azure Virtual Network Manager","Configure security for an Azure Virtual WAN","Implement and configure security for virtual private network (VPN) connections","Implement and configure Microsoft Entra Private Access","Configure Azure private endpoints to secure access to Azure platform as a service (PaaS) resources","Configure Azure Private Link services to secure access to network resources","Implement and configure Azure Firewall","Evaluate effective security rules by using Azure Network Watcher diagnostics"],"cold":["**AVNM security admin rules** run **before NSGs**: Allow (NSG still decides), Deny (final), Always Allow (final).","**NSG:** lowest priority number first, subnet then NIC inbound. **ASGs** group by role.","**Secured virtual hub** = Virtual WAN hub + Azure Firewall, managed in Firewall Manager.","**VPN:** S2S IPsec/IKE; P2S with Entra ID, certificates or RADIUS.","**Entra Private Access:** ZTNA to private apps with connectors and the Global Secure Access client.","**Private endpoint** consumes. **Private Link service** publishes your own service behind a Standard LB.","**Azure Firewall:** Basic, Standard, **Premium (TLS inspection, IDPS)**. DNAT, network and application rules.","**IP flow verify** names the rule, including AVNM admin rules."],"traps":["An admin Allow can still be denied by an NSG.","TLS inspection and IDPS need Firewall Premium."],"hooks":["Admin rules first, then subnet, then NIC."],"topics":["Network security"],"qtopics":["Network security"],"mod":"https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins","modTitle":"Security admin rules in Azure Virtual Network Manager","units":[],"models":["nsg","hub"]},{"id":"s7","d":3,"title":"Security for AI","label":"High","note":"New material. Match each AI risk to the product that handles it.","why":"","obj":["Identify overexposure of data in SharePoint","Identify risks related to Microsoft Copilot and AI apps by using Microsoft Purview Data Security Posture Management (DSPM)","Enable and configure real-time protection for Microsoft Copilot Studio agents","Implement conditional access for Microsoft Entra Agent ID","Analyze blast radius for security risks related to Entra Agent ID by using Defender XDR","Manage Entra Agent ID access","Configure and deploy AI Gateway in Azure API Management for Microsoft Foundry","Enable Defender for AI Service in Cloud Workload Protection in Defender for Cloud","Configure guardrails for agent security in Foundry","Monitor AI security by using the Data and AI security dashboard in Defender for Cloud","Manage agents in Microsoft 365 admin center"],"cold":["**Purview DSPM:** weekly oversharing assessment of the top 100 SharePoint sites; AI activity and one-click policies.","**Copilot Studio:** external threat detection (Microsoft Defender) approves or blocks each **tool invocation** at runtime.","**Entra Agent ID:** blueprint (credentials, kill switch) → agent identities. Every one needs a **sponsor**. Conditional Access at the blueprint.","**Defender XDR** shows what a compromised agent can reach (blast radius).","**AI Gateway** (API Management) limits tokens per project in Foundry: 429 for TPM, 403 for quota.","**Defender for AI Services:** runtime alerts for jailbreaks and data leakage.","**Foundry guardrails:** risk + intervention point (user input, tool call, tool response, output) + action. Agent guardrail overrides the model's.","**Data and AI security dashboard** in Defender for Cloud; agents for users are managed in the **Microsoft 365 admin center**."],"traps":["Agent identities hold no credentials; the blueprint does.","Guardrails scan content; they do not authorize tool use."],"hooks":["Posture: Purview. Identity: Entra. Runtime: Defender. Traffic: AI Gateway."],"topics":["Security for AI"],"qtopics":["Security for AI"],"mod":"https://learn.microsoft.com/en-us/entra/agent-id/what-are-agent-identities","modTitle":"What are agent identities","units":[]},{"id":"s8","d":3,"title":"Security for servers and VMs","label":"High","note":"Plan 1 vs Plan 2 decides half the answers here.","why":"","obj":["Implement and configure disk encryption","Plan and implement Azure Bastion","Enable and enforce use of just-in-time (JIT) VM access","Extend security controls to hybrid and multicloud servers by using Azure Arc","Onboard servers to Defender for Servers in Defender for Cloud, including hybrid and multicloud scenarios","Configure Defender for Servers settings, including vulnerability scanning, and endpoint detection and response (EDR)","Implement and manage agentless scanning for VMs in Defender for Servers","Configure security features on a VM, including secure boot, virtual Trusted Platform Module (vTPM), integrity monitoring, and security type","Enforce security configuration of Azure-managed servers by using Azure Machine Configuration"],"cold":["**Encryption at host** for new VMs; **ADE retires Sept 2028**.","**Bastion:** TLS 443, AzureBastionSubnet /26+. Session recording needs **Premium**.","**JIT:** ports closed until a timed, approved request. **Plan 2**.","**Arc** brings on-premises and multicloud servers under Policy and Defender.","**P1:** EDR. **P2:** + agentless scanning, JIT, FIM, premium vulnerability management.","**Agentless scanning:** snapshots; vulnerabilities, secrets, malware.","**Trusted launch:** Secure Boot, vTPM, boot integrity monitoring.","**Machine Configuration:** audit or enforce in-guest settings through Policy."],"traps":["JIT is not in Plan 1.","Bastion does not close ports; JIT does."],"hooks":["Arc first, then Defender."],"topics":["Servers and VMs"],"qtopics":["Servers and VMs"],"mod":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-servers-overview","modTitle":"Defender for Servers","units":[]},{"id":"s9","d":3,"title":"Security for application platform services","label":"Medium","note":"Many services, one or two controls each.","why":"","obj":["Detect misconfigurations and runtime risks in container workloads by using Defender for Containers","Implement and configure security controls for Azure Kubernetes Service (AKS)","Implement and configure security controls for Azure Container Registry","Implement and configure security controls for Azure Container Instances and Azure Container Apps","Implement and configure security controls for Azure Functions, including authentication and network access","Implement and configure security controls for Azure Logic Apps","Implement and configure security controls for Azure App Service","Implement and configure Azure Web Application Firewall","Implement security policies for back-end API protection by using API Management"],"cold":["**Defender for Containers:** posture, image vulnerability assessment, runtime detection with the Defender sensor.","**AKS:** Entra + Azure RBAC, disable local accounts, private cluster or authorized IPs, network policies, Azure Policy.","**ACR:** no admin user, AcrPull with managed identity, private endpoints (Premium).","**Functions:** keys are shared secrets; use App Service Authentication for identity.","**Logic Apps:** SAS URL, Entra OAuth, IP restrictions, secure inputs and outputs.","**App Service:** HTTPS only, TLS minimum, managed identity, Key Vault references.","**WAF:** Detection logs, Prevention blocks; managed + custom rules; exclusions.","**API Management:** validate-jwt, rate-limit, ip-filter; Defender for APIs."],"traps":["Detection mode never blocks.","Network policies are not Azure Policy."],"hooks":["Test in Detection, enforce in Prevention."],"topics":["App platform security"],"qtopics":["App platform security"],"mod":"https://learn.microsoft.com/en-us/azure/api-management/mitigate-owasp-api-threats","modTitle":"Mitigate OWASP API threats with API Management","units":[]},{"id":"s10","d":4,"title":"Security posture with Defender for Cloud","label":"High","note":"Free vs paid posture, and which tool looks from where.","why":"","obj":["Identify security risks by using Defender CSPM","Evaluate compliance against security frameworks by using Defender for Cloud","Enable and configure Defender for Cloud workload protection plans","Connect hybrid cloud and multicloud environments to Defender for Cloud, including Amazon Web Services (AWS) and Google Cloud Platform (GCP)","Configure Microsoft Defender Vulnerability Management settings for Azure VMs","Discover unprotected assets and vulnerabilities by using Microsoft Defender External Attack Surface Management (EASM)"],"cold":["**Foundational CSPM** (free): recommendations, secure score, MCSB.","**Defender CSPM** (paid): attack paths, cloud security explorer, agentless scanning, data posture.","**Workload protection plans** raise alerts; enable at scale with Azure Policy.","**AWS** connector uses CloudFormation; **GCP** uses a script. Servers arrive through Arc.","**Regulatory compliance dashboard** for standards.","**Defender Vulnerability Management:** agent-based in P1 and P2, agentless in P2.","**EASM:** outside-in discovery of internet-facing assets from seeds."],"traps":["Attack path analysis is not in the free tier.","EASM installs nothing."],"hooks":["CSPM finds weaknesses. Protection plans find attacks."],"topics":["Defender for Cloud posture"],"qtopics":["Defender for Cloud posture"],"mod":"https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction","modTitle":"What is Microsoft Defender for Cloud","units":[]},{"id":"s11","d":4,"title":"Event collection in Microsoft Sentinel","label":"High","note":"Roles, connectors, tables and tiers.","why":"","obj":["Create and connect workspaces in Microsoft Sentinel","Assign roles in Microsoft Sentinel","Implement and use content hub solutions","Configure and use Microsoft data connectors for Azure resources","Implement and configure syslog and Common Event Format (CEF) event collections","Implement and configure collection of Windows Security events by using data collection rules, including Windows Event Forwarding (WEF)","Create custom log tables in the workspace to store ingested data","Implement automation rules and playbooks in Microsoft Sentinel","Implement data retention in Microsoft Sentinel data stores","Query Microsoft Purview Audit in Defender XDR"],"cold":["Roles: **Reader, Responder, Contributor, Playbook Operator, Automation Contributor** (service use).","**Content hub** installs solutions.","**Syslog / CEF via AMA** through a Linux forwarder and DCR → Syslog / CommonSecurityLog.","**Windows Security Events via AMA** → SecurityEvent. **WEF** collector → WindowsEvent.","**Custom tables** (_CL) through the Logs ingestion API and a DCR with transformations.","**Automation rules** triage and call **playbooks** (Logic Apps).","**Analytics tier** for detections (up to 2 years); **data lake tier** for cheap retention (up to 12 years).","Purview Audit data is searchable from the Defender portal; **CloudAppEvents** in advanced hunting."],"traps":["Lake-only tables do not feed analytics rules.","Responder cannot run playbooks without Playbook Operator."],"hooks":["Rule fires, automation rule sorts, playbook acts."],"topics":["Microsoft Sentinel"],"qtopics":["Microsoft Sentinel"],"mod":"https://learn.microsoft.com/en-us/azure/sentinel/roles","modTitle":"Roles and permissions in Microsoft Sentinel","units":[]},{"id":"s12","d":4,"title":"Microsoft Security Copilot","label":"Medium","note":"Short stop. Roles and what they do not grant.","why":"","obj":["Configure workspaces for Security Copilot","Manage permissions and roles in Security Copilot","Enable and configure plugins","Enable and configure Microsoft agents and Security Store agents"],"cold":["**SCUs** are the capacity, an Azure resource attached to a **workspace**.","Roles: **Owner** and **Contributor**. Platform access only, not Entra roles, never data access.","Data comes from the user's own role in each product (on-behalf-of).","**Plugins:** Microsoft, non-Microsoft, custom; Owners restrict custom plugins.","**Agents:** Microsoft agents and **Security Store** partner agents; they use SCUs.","Capacity needs Azure Owner/Contributor plus Security Administrator."],"traps":["A Copilot role alone shows no Sentinel data.","Removing an agent does not cancel its Security Store subscription."],"hooks":["Copilot opens the door. Product roles open the data."],"topics":["Security Copilot"],"qtopics":["Security Copilot"],"mod":"https://learn.microsoft.com/en-us/copilot/security/authentication","modTitle":"Understand authentication in Microsoft Security Copilot","units":[]}],"duels":[{"id":"d001","d":1,"a":"Eligible assignment","b":"Active assignment","clue":"Must be activated before the role works.","ans":0,"why":"Eligible roles are activated just in time.","miss":false},{"id":"d002","d":1,"a":"App registration","b":"Enterprise application","clue":"Where you require user assignment for sign-in.","ans":1,"why":"The service principal controls access in your tenant.","miss":false},{"id":"d003","d":1,"a":"Delegated permission","b":"Application permission","clue":"Works without a signed-in user and always needs admin consent.","ans":1,"why":"Application permissions are app-only.","miss":false},{"id":"d004","d":1,"a":"System-assigned identity","b":"User-assigned identity","clue":"Deleted automatically when its resource is deleted.","ans":0,"why":"System-assigned identities share the resource's lifecycle.","miss":false},{"id":"d005","d":1,"a":"Soft delete","b":"Purge protection","clue":"Off by default and can never be disabled once on.","ans":1,"why":"Soft delete is on by default. Purge protection is optional and irreversible.","miss":false},{"id":"d006","d":1,"a":"Key Vault Secrets User","b":"Key Vault Reader","clue":"Can read the secret's value.","ans":0,"why":"Reader only sees properties.","miss":false},{"id":"d007","d":1,"a":"Azure RBAC","b":"Vault access policy","clue":"Recommended model that can scope access to a single secret.","ans":0,"why":"RBAC supports object-level scope.","miss":false},{"id":"d008","d":1,"a":"Defender CSPM","b":"Defender for Key Vault","clue":"Finds plaintext secrets left on VM disks.","ans":0,"why":"CSPM scans for exposed secrets. Defender for Key Vault alerts on vault access.","miss":false},{"id":"d009","d":1,"a":"Azure Policy","b":"Resource lock","clue":"Evaluates resource properties and reports compliance.","ans":0,"why":"Policy evaluates. Locks only block change or delete.","miss":false},{"id":"d010","d":1,"a":"NotActions","b":"Deny assignment","clue":"Truly blocks an action even if another role grants it.","ans":1,"why":"NotActions just subtracts inside one role.","miss":false},{"id":"d011","d":1,"a":"Secure score","b":"Regulatory compliance","clue":"Shows pass or fail per control of ISO 27001.","ans":1,"why":"Compliance maps to standards. Secure score measures overall posture.","miss":false},{"id":"d012","d":1,"a":"Soft delete (Backup)","b":"Multi-user authorization","clue":"Needs approval from the owner of a Resource Guard.","ans":1,"why":"MUA adds a second approver.","miss":false},{"id":"d013","d":2,"a":"Malware scanning","b":"Hash reputation analysis","clue":"Reads the full content of the file with Defender Antivirus.","ans":0,"why":"Hash reputation only compares hashes.","miss":false},{"id":"d014","d":2,"a":"Storage Blob Data Reader","b":"Reader","clue":"Can read the contents of blobs.","ans":0,"why":"Reader is management-plane only.","miss":false},{"id":"d015","d":2,"a":"Service endpoint","b":"Private endpoint","clue":"Gives the account a private IP in your VNet.","ans":1,"why":"Service endpoints keep the public IP.","miss":false},{"id":"d016","d":2,"a":"Shared Key","b":"Microsoft Entra authorization","clue":"Ties each request to a user or managed identity.","ans":1,"why":"Keys are anonymous to the audit trail.","miss":false},{"id":"d017","d":2,"a":"TDE","b":"Always Encrypted","clue":"Encrypts in the client driver, so the server never sees plaintext.","ans":1,"why":"TDE works at rest on the server.","miss":false},{"id":"d018","d":2,"a":"Dynamic data masking","b":"Always Encrypted","clue":"Stored data is unchanged; only query results are obfuscated.","ans":0,"why":"Masking is presentation, not encryption.","miss":false},{"id":"d019","d":2,"a":"Server-level firewall rule","b":"Database-level firewall rule","clue":"Applies to a single database and travels with it.","ans":1,"why":"Database rules are stored in the database.","miss":false},{"id":"d020","d":2,"a":"SQL auditing","b":"Defender for SQL","clue":"Raises an alert for a suspected brute-force attack.","ans":1,"why":"Auditing records. Defender detects threats.","miss":false},{"id":"d021","d":2,"a":"Security admin rule","b":"NSG rule","clue":"Evaluated first and set centrally across many VNets.","ans":0,"why":"Admin rules come before NSGs.","miss":false},{"id":"d022","d":2,"a":"Allow (admin rule)","b":"Always Allow (admin rule)","clue":"NSGs can still deny the traffic afterwards.","ans":0,"why":"Allow continues to NSG evaluation.","miss":false},{"id":"d023","d":2,"a":"Private endpoint","b":"Private Link service","clue":"Publishes your own load-balanced service to consumers.","ans":1,"why":"The service is the provider side.","miss":false},{"id":"d024","d":2,"a":"Azure Firewall Standard","b":"Azure Firewall Premium","clue":"Adds TLS inspection and IDPS.","ans":1,"why":"Premium features.","miss":false},{"id":"d025","d":2,"a":"Entra Private Access","b":"Point-to-site VPN","clue":"Per-app access through connectors, no network-level tunnel to the whole VNet.","ans":0,"why":"Private Access is Zero Trust network access.","miss":false},{"id":"d026","d":3,"a":"Sponsor","b":"Owner","clue":"Business accountability for the agent's lifecycle.","ans":0,"why":"Owners are the technical admins.","miss":false},{"id":"d027","d":3,"a":"Agent identity blueprint","b":"Agent identity","clue":"Holds the credentials and acts as the kill switch for all its agents.","ans":0,"why":"Agent identities have no credentials of their own.","miss":false},{"id":"d028","d":3,"a":"Tool call","b":"Tool response","clue":"Where indirect prompt injection from external content is caught.","ans":1,"why":"Injected content comes back in the tool response.","miss":false},{"id":"d029","d":3,"a":"Defender for AI Services","b":"Purview DSPM","clue":"Raises security alerts on jailbreak and data leakage attempts at runtime.","ans":0,"why":"DSPM is about data posture and oversharing.","miss":false},{"id":"d030","d":3,"a":"AI Gateway","b":"Foundry guardrail","clue":"Limits tokens per minute for a project.","ans":0,"why":"Guardrails scan content. The gateway governs traffic.","miss":false},{"id":"d031","d":3,"a":"Defender for Servers Plan 1","b":"Defender for Servers Plan 2","clue":"Includes agentless scanning and JIT.","ans":1,"why":"Plan 1 is EDR-focused.","miss":false},{"id":"d032","d":3,"a":"Azure Bastion","b":"Just-in-time access","clue":"Opens an NSG rule for a limited time after a request.","ans":1,"why":"Bastion is the managed jump service.","miss":false},{"id":"d033","d":3,"a":"Secure Boot","b":"vTPM","clue":"Stores keys and measurements for attestation.","ans":1,"why":"Secure Boot verifies signatures at boot.","miss":false},{"id":"d034","d":3,"a":"Azure Policy","b":"Azure Machine Configuration","clue":"Audits settings inside the guest operating system.","ans":1,"why":"Plain Policy evaluates resource properties from outside.","miss":false},{"id":"d035","d":3,"a":"Agent-based scanning","b":"Agentless scanning","clue":"Works from disk snapshots.","ans":1,"why":"Agentless scanning never runs in the VM.","miss":false},{"id":"d036","d":3,"a":"Detection mode","b":"Prevention mode","clue":"Logs matching requests but lets them through.","ans":0,"why":"Detection only logs.","miss":false},{"id":"d037","d":3,"a":"Function key","b":"App Service Authentication","clue":"Validates a Microsoft Entra token for the caller.","ans":1,"why":"Keys are shared secrets.","miss":false},{"id":"d038","d":3,"a":"Network policy","b":"Azure Policy for Kubernetes","clue":"Denies pods that run as privileged.","ans":1,"why":"Network policies filter traffic. Azure Policy governs pod specs.","miss":false},{"id":"d039","d":3,"a":"WAF","b":"API Management policies","clue":"Blocks SQL injection and cross-site scripting with managed rule sets.","ans":0,"why":"WAF is the OWASP layer.","miss":false},{"id":"d040","d":4,"a":"Foundational CSPM","b":"Defender CSPM","clue":"Includes attack path analysis.","ans":1,"why":"Attack paths are paid CSPM.","miss":false},{"id":"d041","d":4,"a":"CSPM","b":"Workload protection","clue":"Raises alerts when an attack is in progress.","ans":1,"why":"CSPM finds misconfigurations. Protection plans detect threats.","miss":false},{"id":"d042","d":4,"a":"Agentless scanning","b":"Defender EASM","clue":"Discovers assets from outside with no access to your environment.","ans":1,"why":"EASM is the outside-in view.","miss":false},{"id":"d043","d":4,"a":"Secure score","b":"Regulatory compliance","clue":"Driven by the default Microsoft cloud security benchmark recommendations.","ans":0,"why":"Compliance maps to chosen standards.","miss":false},{"id":"d044","d":4,"a":"Automation rule","b":"Playbook","clue":"A Logic Apps workflow that calls external systems.","ans":1,"why":"Automation rules orchestrate; playbooks act.","miss":false},{"id":"d045","d":4,"a":"Analytics tier","b":"Data lake tier","clue":"Supports real-time analytics rules and hunting.","ans":0,"why":"The lake is for cheap, long retention.","miss":false},{"id":"d046","d":4,"a":"Sentinel Responder","b":"Sentinel Contributor","clue":"Can create and edit analytics rules.","ans":1,"why":"Responder only manages incidents.","miss":false},{"id":"d047","d":4,"a":"SecurityEvent","b":"WindowsEvent","clue":"Receives events collected through Windows Event Forwarding.","ans":1,"why":"WEF data lands in WindowsEvent.","miss":false},{"id":"d048","d":4,"a":"Syslog","b":"CommonSecurityLog","clue":"Holds CEF-formatted messages.","ans":1,"why":"CEF is parsed into CommonSecurityLog.","miss":false},{"id":"d049","d":4,"a":"Copilot Owner","b":"Copilot Contributor","clue":"Can manage capacity and assign roles.","ans":0,"why":"Contributors use the platform.","miss":false},{"id":"d050","d":4,"a":"Plugin","b":"Agent","clue":"Runs autonomously on a trigger with its own identity.","ans":1,"why":"Plugins connect data sources.","miss":false},{"id":"d051","d":4,"a":"Security Store","b":"Content hub","clue":"Where you get partner-built Security Copilot agents.","ans":0,"why":"Content hub is for Sentinel solutions.","miss":false},{"id":"d052","d":4,"a":"Copilot role","b":"Product role (for example Sentinel Reader)","clue":"Decides which security data a user can see through Copilot.","ans":1,"why":"Copilot roles only open the platform.","miss":false}]}}}</script>

<script>
(function(){

/* ---------- state ---------- */
function fresh(){return {camp:{lv:{},mast:{}},rivals:{},recallQ:false,recallType:true,mockSave:false,cert:'az900',certs:{},voucher:'',layout:'',mute:false,v:4,xp:0,day:{d:'',cards:0,quiz:0,duel:0,claimed:[]},days:{},stats:{cards:0,quizRight:0,duelWins:0,bestCombo:0,bosses:0,mocks:0},
  read:{},badges:{},boss:{},att:BASE?[BASE]:[],cards:{},q:{},du:{},exam:'',theme:''}}
var state=fresh(),ref=null,saveT=0;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function lsGet(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
var SLICE=['cards','q','du','read','boss','att','exam','voucher'];
function blank(k,id){var b=PACKS[id].meta.base;return k==='att'?(b?[b]:[]):(k==='exam'||k==='voucher')?'':{}}
function syncSlice(){state.certs=state.certs||{};var o={};SLICE.forEach(function(k){o[k]=state[k]});state.certs[state.cert]=o}
function loadSlice(id){var o=(state.certs&&state.certs[id])||{};SLICE.forEach(function(k){state[k]=o[k]!==undefined&&o[k]!==null?o[k]:blank(k,id)})}
function ensureBase(){if(BASE&&!state.att.some(function(a){return a.src==='ms'&&a.t===BASE.t}))state.att.unshift(BASE)}
function switchCert(id){if(id===state.cert||!PACKS[id])return false;syncSlice();state.cert=id;usePack(id);loadSlice(id);ensureBase();return true}
function merge(s){if(!s||typeof s!=='object')return;try{s=JSON.parse(JSON.stringify(s))}catch(e){return}
  var f=fresh();Object.keys(f).forEach(function(k){if(s[k]!==undefined&&s[k]!==null)state[k]=s[k]});
  ['stats','day','days','badges','certs','cards','q','du','read','boss'].forEach(function(k){if(typeof state[k]!=='object'||!state[k]||Array.isArray(state[k]))state[k]=f[k]});
  Object.keys(f.stats).forEach(function(k){if(typeof state.stats[k]!=='number')state.stats[k]=0});
  if(!PACKS[state.cert])state.cert='az900';
  if(s.certs&&s.certs[state.cert]){usePack(state.cert);loadSlice(state.cert)}else{usePack(state.cert)}
  if(!Array.isArray(state.att)||!state.att.length)state.att=BASE?[BASE]:[];
  ensureBase();state.v=4}
var LS_OK=true;
function save(){syncSlice();try{localStorage.setItem('nimbus_az900',JSON.stringify(state));LS_OK=true}catch(e){LS_OK=false}
  clearTimeout(saveT);saveT=setTimeout(function(){if(!ref){SYNC.mode='local';return}var snap=JSON.parse(JSON.stringify(state));snap._n=SYNC.nonce||0;ref.set(snap).then(function(){SYNC.mode='cloud';SYNC.at=Date.now();SYNC.err='';if(tab==='me'&&!S&&!C)render()},function(e){SYNC.mode='error';SYNC.err=(e&&e.code)||'failed';if(tab==='me'&&!S&&!C)render()})},700)}
var SYNC={mode:'unknown',at:0,err:'',nonce:0,test:''};
function activity(s){return (s.xp||0)+Object.keys(s.cards||{}).length+Object.keys(s.q||{}).length}
function boot(){
  var old=lsGet('az900prep');if(old)merge({cards:old.cards,q:old.q,att:old.att,exam:old.exam,theme:old.theme});
  var cur=lsGet('nimbus_az900');if(cur)merge(cur);
  checkBadges();save();applyTheme();render();
  var cl=window.claude;if(!cl||!cl.use){SYNC.mode='local';return}
  cl.use('sample').then(function(sm){SAMPLE=sm||null;if(SAMPLE&&!S&&!C)render()}).catch(function(){});
  Promise.all([cl.use('db'),cl.use('user')]).then(function(r){
    if(!r[0]||!r[1]){SYNC.mode='local';return null}
    return r[1].id().then(function(id){if(!id)return null;ref=r[0].doc('data/users/'+id+'/progress');SYNC.mode='ready';return ref.get()})
  }).then(function(snap){
    if(snap&&snap.exists){var s=snap.data(),local=lsGet('nimbus_az900');
      if(s&&s.v>=3){if(local&&activity(local)>activity(s))merge(local);else merge(s)}
      else if(s){merge({cards:s.cards,q:s.q,att:s.att,exam:s.exam,theme:s.theme});if(local)merge(local)}
      checkBadges();applyTheme();SYNC.mode='cloud';SYNC.at=Date.now();save();if(!S&&!C)render()}
    else if(ref)save();
  }).catch(function(e){if(ref){SYNC.mode='error';SYNC.err=(e&&e.code)||'failed'}else SYNC.mode='local';if(tab==='me'&&!S&&!C)render()});
}
function fitZoom(){var z=(state.layout==='desktop'&&window.innerWidth<1000)?Math.max(.3,window.innerWidth/1000):1;document.body.style.zoom=z===1?'':String(z)}
window.addEventListener('resize',function(){fitZoom()});
function applyTheme(){fitZoom();var r=document.documentElement;if(state.layout)r.setAttribute('data-layout',state.layout);else r.removeAttribute('data-layout');if(state.theme)r.setAttribute('data-theme',state.theme);else r.removeAttribute('data-theme')}


/* ---------- sound + feel (synthesized, no files) ---------- */
var AC=null,FX={kind:null,xp:0,burst:false},LX=200,LY=300;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}try{if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,vol,slide){var c=ac();if(!c||state.mute)return;try{var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function buzz(ms){if(!state.mute&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
var SFX={
 tap:function(){tone(560,0,.04,'triangle',.05)},
 flip:function(){tone(320,0,.05,'triangle',.08);tone(480,.045,.06,'triangle',.08)},
 right:function(combo){var k=Math.pow(2,Math.min(combo||1,9)/12-.08),f=523*k;tone(f,0,.12,'sine',.16);tone(f*1.26,.08,.12,'sine',.16);tone(f*1.5,.16,.26,'sine',.17);if(combo>=3)tone(f*2,.26,.2,'triangle',.1);buzz(18)},
 wrong:function(){tone(190,0,.24,'sawtooth',.1,95);tone(150,.13,.3,'square',.06,70);buzz([40,40,60])},
 heart:function(){tone(300,0,.14,'square',.08,150);tone(220,.12,.2,'square',.08,90)},
 again:function(){tone(260,0,.12,'triangle',.1,190)},
 good:function(){tone(520,0,.09,'sine',.13);tone(700,.07,.14,'sine',.13)},
 easy:function(){tone(660,0,.08,'sine',.12);tone(880,.07,.08,'sine',.12);tone(1180,.14,.18,'sine',.12)},
 master:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.07,.14,'triangle',.12)})},
 quest:function(){[392,523,659,784].forEach(function(f,i){tone(f,i*.09,.18,'triangle',.13)})},
 badge:function(){tone(880,0,.1,'sine',.13);tone(1175,.09,.1,'sine',.13);tone(1568,.18,.3,'sine',.14)},
 level:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.1,.22,'square',.07);tone(f*.5,i*.1,.22,'triangle',.1)});tone(1568,.55,.5,'sine',.12);buzz([30,30,30,30,80])},
 win:function(){[523,659,784,659,784,1047].forEach(function(f,i){tone(f,i*.12,.2,'triangle',.14)});tone(1319,.8,.6,'sine',.14);buzz([40,40,40,40,120])},
 lose:function(){[392,349,294,247].forEach(function(f,i){tone(f,i*.16,.28,'sawtooth',.07,f*.8)});buzz([80,60,120])},
 tick:function(){tone(900,0,.03,'square',.04)}};
function burst(x,y,n){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;var box=$('#fx');if(!box)return;var cols=['#4ade80','#5cc8ff','#ffd36b','#c4a1ff','#ff6b8a'];
  for(var i=0;i<n;i++){var e=document.createElement('i');e.className='cf';var a=Math.random()*Math.PI*2,r=60+Math.random()*130;
    e.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[i%5]+';--dx:'+Math.cos(a)*r+'px;--dy:'+(Math.sin(a)*r-60)+'px;--rot:'+Math.round(Math.random()*720)+'deg';box.appendChild(e);(function(el){setTimeout(function(){el.remove()},1000)})(e)}}
function floatTxt(t,x,y){var box=$('#fx');if(!box)return;var e=document.createElement('b');e.className='fl';e.textContent=t;e.style.cssText='left:'+Math.max(30,Math.min(x,innerWidth-60))+'px;top:'+y+'px';box.appendChild(e);setTimeout(function(){e.remove()},1100)}
function playFx(){var f=FX;if(!f.kind&&!f.xp&&!f.burst)return;FX={kind:null,xp:0,burst:false};
  if(f.kind==='right')burst(LX,LY,16);
  if(f.kind==='wrong'){var box=$('#fx');if(box){var d=document.createElement('div');d.className='flash';box.appendChild(d);setTimeout(function(){d.remove()},500)}}
  if(f.burst)burst(innerWidth/2,innerHeight/3,44);
  if(f.xp)floatTxt('+'+f.xp+' XP',LX,Math.max(90,LY-40))}
var DBG={pd:'none yet',cl:'none yet',err:''};
function desc(n){if(!n||!n.tagName)return String(n);var b=n.closest&&n.closest('[data-act]');return n.tagName.toLowerCase()+(n.id?'#'+n.id:'')+(n.className&&typeof n.className==='string'?'.'+n.className.split(' ')[0]:'')+(b?' in act='+b.dataset.act:'')}
document.addEventListener('pointerdown',function(e){LX=e.clientX;LY=e.clientY;DBG.pd=desc(e.target)+' at '+Math.round(e.clientX)+','+Math.round(e.clientY)+' '+new Date().toLocaleTimeString();ac()},true);

/* ---------- xp, level, streak, quests, badges ---------- */
function ensureDay(){var t=today();if(state.day.d!==t)state.day={d:t,cards:0,quiz:0,duel:0,claimed:[]}}
function level(xp){var l=0;for(var i=0;i<LV.length;i++)if(xp>=LV[i])l=i;return l}
function toast(m){var q=toast.q=toast.q||[];q.push(m);if(!toast.on)nextToast()}
function nextToast(){var m=toast.q.shift();var n=$('#toast');if(!m){toast.on=false;n.innerHTML='';return}
  toast.on=true;n.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(nextToast,2100)}
function award(n,why){ensureDay();var before=level(state.xp);state.xp+=n;state.days[today()]=(state.days[today()]||0)+n;
  var after=level(state.xp);FX.xp+=n;if(after>before){toast('Level up! You are now '+TITLES[after]);SFX.level();FX.burst=true}return n}
function streak(){var d=new Date(),n=0;if((state.days[today()]||0)<30)d.setDate(d.getDate()-1);
  for(;;){var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);if((state.days[k]||0)>=30){n++;d.setDate(d.getDate()-1)}else break}return n}
function checkQuests(){ensureDay();var all=true;

function secOfQ(q){if(q.sec)return secBy(q.sec);return SECS.find(function(s){return s.d===q.d&&s.qtopics.indexOf(q.topic)>=0})}
function secOfCard(c){return SECS.find(function(s){return s.d===c.d&&s.topics.indexOf(c.topic)>=0})}
