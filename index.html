ates or deletes resources?","opts":["Management groups","Azure Resource Manager","Azure Advisor","Azure Arc"],"ans":[1],"why":"Every tool goes through ARM.","kind":"one","miss":true},{"id":"q047","d":3,"topic":"Management","q":"You need to manage on-premises servers with Azure governance and security without migrating them. What do you use?","opts":["Azure Advisor","Azure Arc","Azure Service Health","Availability sets"],"ans":[1],"why":"Azure Arc projects non-Azure servers into Azure for management.","kind":"one","miss":true},{"id":"q048","d":3,"topic":"Management","q":"Which TWO can create a virtual machine from a phone's browser?","opts":["Azure portal","Azure Cloud Shell","A local CLI install","SSH"],"ans":[0,1],"why":"Both run in a browser. Cloud Shell offers Bash and PowerShell.","kind":"two","miss":true},{"id":"q049","d":3,"topic":"Monitoring","q":"Which service recommends changes to improve reliability, security, performance and cost?","opts":["Azure Advisor","Azure Service Health","Azure Policy","Azure Monitor"],"ans":[0],"why":"Advisor evaluates your resources and gives recommendations.","kind":"one","miss":true},{"id":"q050","d":3,"topic":"Monitoring","q":"Which service notifies you of an Azure outage or planned maintenance in your region?","opts":["Azure Advisor","Azure Service Health","Azure Policy","Resource locks"],"ans":[1],"why":"Service Health reports service issues and planned maintenance that affect you.","kind":"one","miss":false},{"id":"q051","d":3,"topic":"Monitoring","q":"Which service can alert you when CPU stays above 80% for five minutes and trigger autoscale?","opts":["Azure Monitor","Azure Advisor","Azure Arc","Microsoft Purview"],"ans":[0],"why":"Azure Monitor collects metrics and drives alerts and autoscale.","kind":"one","miss":true},{"id":"q052","d":3,"topic":"Cost","q":"A batch rendering job can restart if interrupted and must cost as little as possible. Which pricing option fits?","opts":["Reservation","Azure Spot virtual machines","Azure savings plan for compute","Pay-as-you-go on a larger size"],"ans":[1],"why":"Spot uses unused capacity at a lower price, but Azure can evict the VM. That suits interruptible work.","kind":"one","miss":false},{"id":"q053","d":3,"topic":"Cost","q":"Your compute spend is steady, but workloads move between VM families and services. Which option gives a discount without tying you to one VM type?","opts":["Azure savings plan for compute","Azure Reservation for one VM size","Spot virtual machines","A resource lock"],"ans":[0],"why":"A savings plan commits you to an hourly spend, not a specific VM type.","kind":"one","miss":false},{"id":"q054","d":3,"topic":"Cost","q":"Which TWO are alert types in Cost Management?","opts":["Budget alerts","Credit alerts","Policy compliance alerts","Resource Health alerts"],"ans":[0,1],"why":"Cost Management has budget, credit and department spending quota alerts.","kind":"two","miss":false},{"id":"q055","d":3,"topic":"Cost","q":"You tag a resource group with Environment=Prod. What happens to resources already inside it?","opts":["They inherit the tag automatically","They inherit it only after a restart","They do not inherit it","They inherit it only if a lock is set"],"ans":[2],"why":"Resources don't inherit tags from resource groups or subscriptions. Policy can add or require tags.","kind":"one","miss":false},{"id":"q056","d":3,"topic":"Governance","q":"A subscription Owner needs to change a resource that has a ReadOnly lock. What must happen first?","opts":["Assign the Contributor role","Remove the lock","Move the resource to another subscription","Create an Azure Policy exemption"],"ans":[1],"why":"Locks apply regardless of RBAC permissions, so remove the lock before the change.","kind":"one","miss":false},{"id":"q057","d":3,"topic":"Governance","q":"Which service provides automated data discovery, sensitive data classification and end-to-end lineage?","opts":["Microsoft Purview","Azure Advisor","Azure Arc","Azure Monitor"],"ans":[0],"why":"Purview is Microsoft's data governance, risk and compliance solution.","kind":"one","miss":false},{"id":"q058","d":3,"topic":"Governance","q":"Where can you find Microsoft's audit reports and compliance documentation?","opts":["Service Trust Portal","Azure Advisor","Cost Management","Azure Service Health"],"ans":[0],"why":"The Service Trust Portal provides security, privacy and compliance content.","kind":"one","miss":false},{"id":"q059","d":3,"topic":"Monitoring","q":"You want to know whether a specific VM has a problem and whether it is on Azure's side or yours. Which view?","opts":["Azure Status","Service Health","Resource Health","Cost analysis"],"ans":[2],"why":"Resource Health covers individual resources. Service Health covers the services and regions you use; Azure Status is global.","kind":"one","miss":false},{"id":"q060","d":3,"topic":"Management","q":"Which TWO can Azure Arc manage outside Azure?","opts":["Servers","Kubernetes clusters","Microsoft 365 mailboxes","Azure Virtual Desktop host pools in Azure"],"ans":[0,1],"why":"Arc covers servers, Kubernetes clusters, Azure data services, SQL Server and (preview) VMs.","kind":"two","miss":false},{"id":"q061","d":3,"topic":"Management","q":"Which is a declarative language, simpler than JSON ARM templates, for deploying Azure resources?","opts":["Bicep","Azure CLI","Azure Policy","Cloud Shell"],"ans":[0],"why":"Bicep is declarative and deploys through ARM.","kind":"one","miss":false},{"id":"q062","d":3,"topic":"Monitoring","q":"What decides who is notified, and what happens, when an Azure Monitor alert fires?","opts":["An action group","A budget","A resource lock","An initiative"],"ans":[0],"why":"An alert rule defines the condition; an action group defines the response.","kind":"one","miss":false},{"id":"q063","d":3,"topic":"Monitoring","q":"Which Azure Monitor feature tracks response times and failure rates of a web application?","opts":["Application Insights","Azure Advisor","Azure Arc","Service Trust Portal"],"ans":[0],"why":"Application Insights monitors web app performance and usage.","kind":"one","miss":false},{"id":"q064","d":1,"topic":"Benefits","q":"A team runs a development environment only during business hours. Which action best supports sustainability and cost efficiency?","opts":["Run the VMs 24/7 so they are always ready","Automatically shut the environment down overnight and on weekends","Overprovision capacity to avoid slowdowns","Move the workload back on premises"],"ans":[1],"why":"Turning off or deallocating unused resources reduces waste. Learn ties sustainability to right-sizing, automating, monitoring and optimizing.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5a-describe-sustainability-cloud","learn":true},{"id":"q065","d":2,"topic":"Compute","q":"You want to add speech and vision features to an app through APIs without training your own model. Which should you use?","opts":["Azure Machine Learning","Azure AI services","Azure IoT Hub","Azure Virtual Desktop"],"ans":[1],"why":"Azure AI services provide prebuilt AI features through APIs. Azure Machine Learning is for building and training custom models.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q066","d":2,"topic":"Compute","q":"Your data scientists must build, train and manage a custom machine learning model. Which Azure service fits?","opts":["Azure AI services","Azure Machine Learning","Azure IoT Central","Azure App Service"],"ans":[1],"why":"Use Azure Machine Learning for custom model development, experimentation and lifecycle management.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q067","d":2,"topic":"Compute","q":"Which service enables secure, two-way communication between cloud services and IoT devices?","opts":["Azure IoT Edge","Azure Functions","Azure IoT Hub","Azure Bastion"],"ans":[2],"why":"IoT Hub is the messaging hub between the cloud and devices. IoT Edge runs workloads on the devices themselves.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q068","d":2,"topic":"Compute","q":"You need cloud analytics logic to run on devices close to where the data is generated. Which service extends the cloud to those devices?","opts":["Azure IoT Edge","Azure IoT Central","Azure Machine Learning","Azure Virtual Network"],"ans":[0],"why":"Azure IoT Edge extends cloud capabilities to edge devices so workloads run near the data.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q069","d":2,"topic":"Compute","q":"Which TWO workloads can Azure App Service host? Choose 2.","opts":["Web apps","Mobile app back ends","Active Directory domain controllers","Hypervisor hosts"],"ans":[0,1],"why":"App Service hosts web apps, API apps, WebJobs and mobile app back ends without you managing the infrastructure.","kind":"two","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options","learn":true},{"id":"q070","d":2,"topic":"Regions and zones","q":"Which Azure service does NOT require you to choose a region when you create it?","opts":["Azure Virtual Machines","Microsoft Entra ID","A storage account","Azure SQL Database"],"ans":[1],"why":"Global services such as Microsoft Entra ID, Azure Traffic Manager and Azure DNS do not need a region.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"q071","d":2,"topic":"Regions and zones","q":"What is the minimum number of separate availability zones in an availability zone-enabled region?","opts":["Two","Three","Four","Five"],"ans":[1],"why":"Every zone-enabled region has at least three separate zones. Not all regions support zones.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"q072","d":2,"topic":"Regions and zones","q":"Which TWO are advantages of Azure region pairs? Choose 2.","opts":["One region of each pair is prioritized for recovery after a large outage","Planned updates are rolled out to paired regions one at a time","All data is replicated to every Azure region automatically","Paired regions are always in different geographies"],"ans":[0,1],"why":"Pairs get prioritized recovery and staggered updates. Data stays in the same geography (Brazil South is the exception) and not every service replicates automatically.","kind":"two","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"q073","d":2,"topic":"Networking","q":"What is the main purpose of an alias record set in Azure DNS?","opts":["To buy a domain name","To follow an Azure resource automatically when its IP address changes","To encrypt DNS queries","To connect on-premises networks to Azure"],"ans":[1],"why":"An alias record points to an Azure resource (public IP, Traffic Manager, CDN endpoint) and updates itself when the IP changes.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"q074","d":2,"topic":"Networking","q":"You must register contoso.com and manage its records in Azure. What should you do?","opts":["Buy it in Azure DNS","Buy it from App Service domains or a registrar, then host it in Azure DNS","Create a private DNS zone","Deploy a VPN Gateway"],"ans":[1],"why":"You cannot buy a domain with Azure DNS. Purchase elsewhere, then host the domain in Azure DNS.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"q075","d":2,"topic":"Identity","q":"Which Microsoft Entra Domain Services statement is true?","opts":["Changes sync from the managed domain back to Entra ID","Sync is one-way from Microsoft Entra ID to the managed domain","You must deploy and patch the domain controllers yourself","It replaces Microsoft Entra Connect"],"ans":[1],"why":"A managed domain syncs one way from Entra ID. Microsoft runs the two domain controllers for you.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services","learn":true},{"id":"q076","d":2,"topic":"Security","q":"Which Zero Trust principle is about just-in-time and just-enough-access?","opts":["Verify explicitly","Use least privilege access","Assume breach","Trust the network perimeter"],"ans":[1],"why":"Least privilege access limits access with JIT/JEA and risk-based adaptive policies.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model","learn":true},{"id":"q077","d":2,"topic":"Security","q":"In defense in depth, DDoS protection belongs to which layer?","opts":["Physical","Perimeter","Compute","Data"],"ans":[1],"why":"The perimeter layer uses DDoS protection to filter large-scale attacks and perimeter firewalls to alert on malicious activity.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth","learn":true},{"id":"q078","d":2,"topic":"Security","q":"Storing application secrets in Azure Key Vault belongs to which defense-in-depth layer?","opts":["Application","Network","Physical","Identity and access"],"ans":[0],"why":"The application layer keeps sensitive application secrets in secure storage such as Key Vault.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth","learn":true},{"id":"q079","d":2,"topic":"Security","q":"Which TWO items can Azure Key Vault securely store? Choose 2.","opts":["Encryption keys","Certificates","Virtual machine images","Resource group templates"],"ans":[0,1],"why":"Key Vault stores secrets, encryption keys and certificates, with access control, rotation and auditing.","kind":"two","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9a-describe-encryption-key-management","learn":true},{"id":"q080","d":2,"topic":"Security","q":"Which Microsoft Defender for Cloud feature summarizes your overall security posture as a number?","opts":["Secure score","Cost analysis","Service Health","Resource lock"],"ans":[0],"why":"Recommendations are grouped into security controls and rolled into a secure score.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"q081","d":2,"topic":"Security","q":"To protect on-premises servers with Defender for Cloud, which Azure service do you deploy?","opts":["Azure Arc","Azure Bastion","Azure Front Door","Azure Backup"],"ans":[0],"why":"Azure Arc extends Defender plans to non-Azure machines.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"q082","d":2,"topic":"Security","q":"Which three needs does Microsoft Defender for Cloud address?","opts":["Assess, secure, defend","Plan, build, ship","Deploy, scale, retire","Backup, restore, archive"],"ans":[0],"why":"Defender for Cloud continuously assesses, helps secure (harden) and defends (alerts and threat protection).","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"q083","d":1,"topic":"Cloud models","q":"A company runs workloads in Azure and in another cloud provider at the same time. Which cloud model is this?","opts":["Hybrid cloud","Multi-cloud","Private cloud","Community cloud"],"ans":[1],"why":"Multi-cloud means using more than one public cloud provider. Hybrid means combining public cloud with private or on-premises resources.","kind":"one","miss":false},{"id":"q084","d":1,"topic":"Cloud models","q":"Which Azure service lets you manage servers and Kubernetes clusters in on-premises, multi-cloud and Azure environments from one place?","opts":["Azure Arc","Azure VMware Solution","Azure Migrate","Azure Resource Manager templates"],"ans":[0],"why":"Azure Arc extends Azure management to resources outside Azure, so hybrid and multi-cloud environments can be managed together.","kind":"one","miss":false},{"id":"q085","d":1,"topic":"Cloud models","q":"A company wants to run its existing VMware workloads in Azure with minimal changes. Which service fits?","opts":["Azure Virtual Desktop","Azure Arc","Azure VMware Solution","Azure Container Instances"],"ans":[2],"why":"Azure VMware Solution runs VMware workloads in Azure with seamless integration and scalability.","kind":"one","miss":false},{"id":"q086","d":1,"topic":"Cost model","q":"Which is NOT a characteristic of the consumption-based model?","opts":["No upfront infrastructure costs","Pay for additional resources only when needed","Stop paying for resources you no longer need","A large upfront investment in hardware"],"ans":[3],"why":"Consumption-based pricing means no upfront hardware purchase. You pay for what you use and stop paying when you stop using it.","kind":"one","miss":false},{"id":"q087","d":1,"topic":"Cost model","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Operational expenditure (OpEx) is spending on products and services as you use them.","Capital expenditure (CapEx) is typically a one-time, upfront spend on physical infrastructure.","Paying monthly for Azure resources you consume is an example of CapEx."],"ans":[1,1,0],"why":"Cloud consumption is OpEx: you pay as you use. CapEx is upfront spending on things like buildings and servers.","miss":false},{"id":"q088","d":1,"topic":"Shared responsibility","q":"Which item is ALWAYS the cloud provider's responsibility, whatever the service type?","opts":["Physical hosts, network and datacenter","Accounts and identities","Devices (mobile and PCs)","Information and data"],"ans":[0],"why":"Microsoft always owns the physical layer. The customer always owns their data, devices, accounts and identities.","kind":"one","miss":false},{"id":"q089","d":1,"topic":"Shared responsibility","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["With SaaS, the customer patches the operating system.","With IaaS, the customer manages the operating system.","The customer is always responsible for the information and data they store."],"ans":[0,1,1],"why":"In SaaS the provider manages the OS and the app. In IaaS you manage the OS. Data is always the customer's responsibility.","miss":false},{"id":"q090","d":1,"topic":"Benefits","q":"What does high availability focus on?","opts":["Making sure resources stay available, even when something goes wrong","Lowering the cost of storage","Adding resources when demand rises","Meeting regulatory requirements"],"ans":[0],"why":"High availability is about keeping resources available with maximum uptime, as described in service-level agreements (SLAs).","kind":"one","miss":false},{"id":"q091","d":1,"topic":"Benefits","type":"match","kind":"match","q":"Match each example to the cloud benefit it shows.","rows":["Resources are added automatically when demand rises","A workload keeps running when one datacenter fails","You forecast next month's bill with the pricing calculator","Policies make every deployment meet company standards"],"choices":["Scalability","Reliability","Predictability","Governance"],"ans":[0,1,2,3],"why":"Scalability adjusts resources to demand. Reliability means recovering from failures. Predictability covers performance and cost forecasting. Governance uses policies and templates to keep deployments compliant.","miss":false},{"id":"q092","d":1,"topic":"Benefits","q":"Managing Azure through the portal, CLI, APIs or PowerShell is an example of which benefit?","opts":["Management in the cloud","Management of the cloud","Predictability","Security"],"ans":[0],"why":"Management in the cloud is HOW you manage: portal, CLI, APIs, PowerShell. Management of the cloud is WHAT the cloud does for you, like autoscaling and alerts.","kind":"one","miss":false},{"id":"q093","d":1,"topic":"Benefits","q":"Automatically scaling resources based on need and getting alerts from monitoring are examples of what?","opts":["Management in the cloud","Management of the cloud","Capital expenditure","Shared responsibility"],"ans":[1],"why":"Management of the cloud covers managing your resources: autoscaling, templates, monitoring alerts and automatic replacement of failing resources.","kind":"one","miss":false},{"id":"q094","d":1,"topic":"Service types","type":"match","kind":"match","q":"Match each scenario to the cloud service type.","rows":["Lift-and-shift an on-premises server to a cloud VM","Use Microsoft 365 for company email","Deploy a web app to Azure App Service without managing the OS"],"choices":["IaaS","PaaS","SaaS"],"ans":[0,2,1],"why":"IaaS gives you VMs to manage. PaaS manages the platform so you deploy code. SaaS is a finished app you subscribe to.","miss":false},{"id":"q095","d":1,"topic":"Service types","q":"Which cloud service type leaves the customer the least management responsibility?","opts":["IaaS","PaaS","SaaS","On-premises"],"ans":[2],"why":"With SaaS the provider manages almost everything. You manage your data, devices, and accounts and identities.","kind":"one","miss":false},{"id":"q096","d":1,"topic":"Service types","q":"Serverless computing, such as Azure Functions, is most like which service type?","opts":["IaaS","PaaS","SaaS","On-premises"],"ans":[1],"why":"Like PaaS, serverless removes infrastructure management so developers focus on code.","kind":"one","miss":false},{"id":"q097","d":1,"topic":"Service types","q":"Which is an example of IaaS?","opts":["Azure Virtual Machines","Azure App Service","Microsoft 365","Azure Functions"],"ans":[0],"why":"Virtual machines give you control of the OS and software, which is infrastructure as a service.","kind":"one","miss":false},{"id":"q098","d":2,"topic":"Regions and zones","q":"What is the minimum number of availability zones in a region that supports them?","opts":["Two","Three","Four","Six"],"ans":[1],"why":"Each region that supports availability zones has a minimum of three separate zones.","kind":"one","miss":false},{"id":"q099","d":2,"topic":"Regions and zones","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Most regions are paired with another region in the same geography.","If a large outage affects both regions in a pair, one of them is prioritized for recovery.","Planned Azure updates roll out to both regions in a pair at the same time."],"ans":[1,1,0],"why":"Updates roll out to one region in a pair at a time to limit downtime. Pairs sit in the same geography, and one region per pair gets recovery priority.","miss":false},{"id":"q100","d":2,"topic":"Regions and zones","q":"A US government agency needs a physically isolated instance of Azure. Which should it use?","opts":["Azure Government regions","A region pair","An availability zone","Azure China (operated by 21Vianet)"],"ans":[0],"why":"Sovereign regions such as US DoD Central and US Gov Virginia are physically and logically isolated instances of Azure for government agencies and partners.","kind":"one","miss":false},{"id":"q101","d":2,"topic":"Regions and zones","q":"Which Azure services are always available from Azure geographies and are resilient to zone-wide and region-wide outages?","opts":["Zonal services","Zone-redundant services","Non-regional services","Sovereign services"],"ans":[2],"why":"Non-regional services are always available from Azure geographies. Zonal services pin to one zone; zone-redundant services replicate across zones.","kind":"one","miss":false},{"id":"q102","d":2,"topic":"Hierarchy","type":"match","kind":"match","q":"Match each description to the Azure organizing structure.","rows":["A single VM or storage account","A logical container that can't be nested","A unit of billing and an access boundary","Groups subscriptions so policy and access apply at scale"],"choices":["Resource","Resource group","Subscription","Management group"],"ans":[0,1,2,3],"why":"Resources live in resource groups, resource groups live in subscriptions, and management groups organize subscriptions.","miss":false},{"id":"q103","d":2,"topic":"Hierarchy","q":"How many levels of depth can a management group tree support, not counting the root level or the subscription level?","opts":["Three","Six","Ten","Unlimited"],"ans":[1],"why":"A management group tree supports up to six levels of depth. One directory can hold up to 10,000 management groups.","kind":"one","miss":false},{"id":"q104","d":2,"topic":"Hierarchy","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A resource can belong to two resource groups at the same time.","Deleting a resource group deletes every resource inside it.","Resource groups can be nested inside other resource groups."],"ans":[0,1,0],"why":"Each resource is in exactly one resource group, groups can't be nested, and deleting a group deletes everything in it.","miss":false},{"id":"q105","d":2,"topic":"Compute","q":"Which feature spreads VMs across racks with separate power and networking, so one rack failure doesn't take them all down?","opts":["Fault domains in an availability set","Update domains in an availability set","Virtual machine scale sets","Region pairs"],"ans":[0],"why":"Fault domains group VMs by common power source and network switch. Update domains group VMs that can be rebooted together during maintenance.","kind":"one","miss":false},{"id":"q106","d":2,"topic":"Compute","q":"You need to centrally manage and update a large number of identical, load-balanced VMs that scale with demand. What should you use?","opts":["Availability sets","Virtual machine scale sets","Azure Virtual Desktop","Azure Container Instances"],"ans":[1],"why":"Virtual machine scale sets create and manage a group of identical, load-balanced VMs and can scale automatically.","kind":"one","miss":false},{"id":"q107","d":2,"topic":"Compute","q":"Which service provides desktop and app virtualization in the cloud, including multi-session Windows?","opts":["Azure Virtual Desktop","Azure App Service","Azure Functions","Azure Arc"],"ans":[0],"why":"Azure Virtual Desktop delivers a full Windows desktop and apps from the cloud to almost any device.","kind":"one","miss":false},{"id":"q108","d":2,"topic":"Compute","q":"You want to run a single container quickly without managing VMs or an orchestrator. Which service fits?","opts":["Azure Kubernetes Service","Azure Container Instances","Azure Virtual Machines","Azure Virtual Desktop"],"ans":[1],"why":"Azure Container Instances is the fastest, simplest way to run a container in Azure as a PaaS offering.","kind":"one","miss":false},{"id":"q109","d":2,"topic":"Compute","type":"match","kind":"match","q":"Match each need to the compute service.","rows":["Event-driven code that runs only when triggered","Host a web app or REST API without managing servers","Full control of the operating system","Orchestrate many containerized microservices"],"choices":["Azure Functions","Azure App Service","Azure Virtual Machines","Azure Kubernetes Service"],"ans":[0,1,2,3],"why":"Functions is event-driven serverless code. App Service hosts web apps and APIs. VMs give OS control. AKS orchestrates containers.","miss":false},{"id":"q110","d":2,"topic":"Networking","q":"Which kind of VPN gateway is the preferred connection method for on-premises devices?","opts":["Policy-based","Route-based","Peering-based","DNS-based"],"ans":[1],"why":"Route-based VPN gateways use routes in the IP forwarding table to direct packets and are the preferred, more resilient option.","kind":"one","miss":false},{"id":"q111","d":2,"topic":"Networking","q":"Two Azure virtual networks must talk to each other directly, with traffic staying on the Microsoft backbone. What should you configure?","opts":["Virtual network peering","A public endpoint","Azure DNS","A resource lock"],"ans":[0],"why":"Virtual network peering connects VNets directly. Traffic between peered networks is private and stays on the Microsoft backbone.","kind":"one","miss":false},{"id":"q112","d":2,"topic":"Networking","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Azure DNS can host your DNS domains and manage their records.","You can buy a domain name through Azure DNS.","Azure DNS supports private DNS zones for names inside virtual networks."],"ans":[1,0,1],"why":"Azure DNS hosts domains and supports private zones, but you can't buy a domain name with Azure DNS. You buy it from a registrar.","miss":false},{"id":"q113","d":2,"topic":"Networking","q":"An Azure resource must be reachable only from inside your virtual network, not from the internet. What should you use?","opts":["A public endpoint","A private endpoint","A VPN gateway","Azure DNS"],"ans":[1],"why":"A private endpoint gives the resource a private IP address in your VNet, so it isn't exposed on the public internet.","kind":"one","miss":false},{"id":"q114","d":2,"topic":"Storage","type":"match","kind":"match","q":"Match each redundancy option to its description.","rows":["Three copies in one datacenter","Three copies across three availability zones in one region","Locally redundant copies plus copies in a secondary region","Zone-redundant copies plus copies in a secondary region"],"choices":["LRS","ZRS","GRS","GZRS"],"ans":[0,1,2,3],"why":"LRS is one datacenter. ZRS spreads across zones. GRS adds a secondary region to LRS. GZRS adds a secondary region to ZRS.","miss":false},{"id":"q115","d":2,"topic":"Storage","q":"Data is rarely accessed but must be stored at least 90 days and still be readable in milliseconds, at lower cost than the cool tier. Which tier?","opts":["Hot","Cool","Cold","Archive"],"ans":[2],"why":"The cold tier is online with fast retrieval, costs less to store than cool, and has a 90-day minimum. Archive is offline.","kind":"one","miss":false},{"id":"q116","d":2,"topic":"Storage","q":"Which statement about the archive access tier is true?","opts":["Data is offline and must be rehydrated before it can be read","Data can be read in milliseconds","It has no minimum storage duration","It has the highest storage cost"],"ans":[0],"why":"Archive is offline with the lowest storage cost. Data must be rehydrated (hours) and should stay at least 180 days.","kind":"one","miss":false},{"id":"q117","d":2,"topic":"Storage","q":"Which service offers fully managed file shares that can be mounted over SMB or NFS?","opts":["Azure Blob Storage","Azure Files","Azure Queue Storage","Azure Disk Storage"],"ans":[1],"why":"Azure Files provides fully managed file shares accessible over SMB and NFS.","kind":"one","miss":false},{"id":"q118","d":2,"topic":"Storage","q":"You must move a very large amount of data to Azure, and your network connection is too slow. What should you use?","opts":["Azure Data Box","AzCopy","Azure Storage Explorer","Azure File Sync"],"ans":[0],"why":"Azure Data Box is a physical device shipped to you to move large amounts of data offline.","kind":"one","miss":false},{"id":"q119","d":2,"topic":"Storage","q":"Which command-line utility copies blobs or files to or from a storage account?","opts":["AzCopy","Azure Data Box","Azure Migrate","Azure Arc"],"ans":[0],"why":"AzCopy is a command-line tool for copying blobs or files to or from your storage account.","kind":"one","miss":false},{"id":"q120","d":2,"topic":"Storage","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["With GRS, you can read data from the secondary region at any time.","The archive tier stores data offline.","Data in the cool tier should be stored for at least 30 days."],"ans":[0,1,1],"why":"Plain GRS doesn't allow reads from the secondary. You need RA-GRS or RA-GZRS for that. Archive is offline. Cool has a 30-day minimum.","miss":false},{"id":"q121","d":2,"topic":"Security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Zero Trust assumes a breach and verifies each request.","Zero Trust trusts devices on the corporate network by default.","Using least-privileged access is a Zero Trust principle."],"ans":[1,0,1],"why":"Zero Trust principles: verify explicitly, use least-privileged access, and assume breach. Nothing is trusted just because it is on the corporate network.","miss":false},{"id":"q122","d":2,"topic":"Security","q":"Which defense-in-depth layer focuses on limiting network connectivity between resources to only what is required?","opts":["Physical security","Network","Application","Data"],"ans":[1],"why":"The network layer limits communication between resources through segmentation and access controls.","kind":"one","miss":false},{"id":"q123","d":2,"topic":"Identity","q":"Users signing in from the office should sign in normally, but sign-ins from unknown locations must use MFA. What enforces this?","opts":["Conditional Access","Azure Policy","Resource locks","Microsoft Entra Domain Services"],"ans":[0],"why":"Conditional Access uses signals such as user, location and device to allow access, require MFA or block it.","kind":"one","miss":false},{"id":"q124","d":2,"topic":"Identity","q":"Which TWO are passwordless authentication methods?","opts":["Windows Hello for Business","FIDO2 security keys","A password plus security questions","A shared team password"],"ans":[0,1],"why":"Passwordless options include Windows Hello for Business, the Microsoft Authenticator app and FIDO2 security keys.","kind":"two","miss":false},{"id":"q125","d":2,"topic":"Identity","q":"A legacy app needs domain join, Kerberos and LDAP, but you don't want to deploy domain controllers. What should you use?","opts":["Microsoft Entra Domain Services","Conditional Access","Azure Arc","Azure Policy"],"ans":[0],"why":"Microsoft Entra Domain Services provides managed domain services such as domain join, Group Policy, LDAP and Kerberos without running your own domain controllers.","kind":"one","miss":false},{"id":"q126","d":2,"topic":"Identity","q":"Partner users must sign in to your apps with their own credentials. Which capability supports this?","opts":["External identities (B2B collaboration)","Resource locks","Azure Policy initiatives","Availability zones"],"ans":[0],"why":"External identities let people outside your organization use their own identity to access your apps and resources.","kind":"one","miss":false},{"id":"q127","d":3,"topic":"Cost","type":"match","kind":"match","q":"Match each need to the tool.","rows":["Estimate the monthly cost of new Azure services","Compare on-premises costs with running in Azure","Track actual spending and set budgets","Get recommendations such as shutting down underused VMs"],"choices":["Pricing calculator","TCO calculator","Microsoft Cost Management","Azure Advisor"],"ans":[0,1,2,3],"why":"The pricing calculator estimates new Azure costs. The TCO calculator compares on-premises with Azure. Cost Management tracks real spend and budgets. Advisor recommends savings.","miss":false},{"id":"q128","d":3,"topic":"Cost","q":"Which network traffic is generally free?","opts":["Inbound data transfers into Azure datacenters","Outbound data transfers out of Azure datacenters","Data transferred between regions","All bandwidth"],"ans":[0],"why":"Some inbound data transfers, such as data going into Azure datacenters, are free. Outbound transfers are usually charged.","kind":"one","miss":false},{"id":"q129","d":3,"topic":"Cost","q":"Which Cost Management alert tells you when spending reaches a threshold you set?","opts":["Budget alert","Credit alert","Department spending quota alert","Service Health alert"],"ans":[0],"why":"Budget alerts fire when spending, based on usage or cost, reaches or exceeds the amount in the budget alert condition.","kind":"one","miss":false},{"id":"q130","d":3,"topic":"Cost","q":"You want to group resources by cost center so billing reports can be broken down by team. What should you use?","opts":["Resource tags","Resource locks","Availability zones","Management groups only"],"ans":[0],"why":"Tags are name-value pairs such as CostCenter=Finance. They help organize resources and report costs by team or project.","kind":"one","miss":false},{"id":"q131","d":3,"topic":"Cost","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["The same resource can cost different amounts in different regions.","Third-party solutions from Azure Marketplace can add to your bill.","Reserved instances increase the cost of steady, predictable workloads."],"ans":[1,1,0],"why":"Geography affects price, Marketplace solutions can add charges, and reservations lower costs for steady workloads when you commit for one or three years.","miss":false},{"id":"q132","d":3,"topic":"Governance","q":"You want to stop a resource from being deleted but still allow changes to it. Which lock?","opts":["Delete (CanNotDelete) lock","Read-only lock","Azure Policy deny","Conditional Access"],"ans":[0],"why":"A Delete lock allows reads and changes but blocks deletion. A ReadOnly lock blocks both changes and deletion.","kind":"one","miss":false},{"id":"q133","d":3,"topic":"Governance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A ReadOnly lock prevents both changes and deletion.","Resource locks apply even to users with the Owner role.","Once a resource lock is applied, it can never be removed."],"ans":[1,1,0],"why":"Locks apply to everyone, including Owners. To delete or change the resource you first remove the lock, which takes a deliberate extra step.","miss":false},{"id":"q134","d":3,"topic":"Governance","q":"In Azure Policy, what is a group of related policy definitions tracked together toward one goal?","opts":["An initiative","A blueprint lock","A management group","A resource tag"],"ans":[0],"why":"An initiative groups related policies so you can assign and track them together, for example to meet a security standard.","kind":"one","miss":false},{"id":"q135","d":3,"topic":"Governance","q":"Which service helps you discover, classify and govern data across on-premises, multicloud and SaaS sources?","opts":["Microsoft Purview","Azure Advisor","Azure Arc","Microsoft Cost Management"],"ans":[0],"why":"Microsoft Purview is a family of data governance, risk and compliance solutions for a unified view of your data.","kind":"one","miss":false},{"id":"q136","d":3,"topic":"Governance","q":"Where can you get Microsoft's compliance and audit reports, such as ISO and SOC reports?","opts":["Service Trust Portal","Azure Advisor","Azure status page","Azure Cloud Shell"],"ans":[0],"why":"The Service Trust Portal gives access to Microsoft's security, privacy and compliance reports and documents.","kind":"one","miss":false},{"id":"q137","d":3,"topic":"Management","type":"match","kind":"match","q":"Match each need to the tool.","rows":["A browser-based shell with Bash or PowerShell and nothing to install","Declarative JSON files for repeatable deployments","A language that compiles to ARM JSON with simpler syntax","Manage on-premises and other-cloud servers as if they were in Azure"],"choices":["Azure Cloud Shell","ARM templates","Bicep","Azure Arc"],"ans":[0,1,2,3],"why":"Cloud Shell runs in the browser. ARM templates are declarative JSON. Bicep is a simpler language for the same deployments. Arc extends Azure management beyond Azure.","miss":false},{"id":"q138","d":3,"topic":"Management","q":"What does it mean that ARM templates are idempotent?","opts":["You can deploy the same template many times and get the same resources in the same state","The template runs only once","The template must be written in PowerShell","Resources deploy one at a time in a fixed order"],"ans":[0],"why":"Idempotent means repeated deployments of the same template produce the same result.","kind":"one","miss":false},{"id":"q139","d":3,"topic":"Management","q":"Requests from the Azure portal, CLI, PowerShell and REST APIs all go through which service?","opts":["Azure Resource Manager","Azure Monitor","Azure Advisor","Microsoft Entra ID"],"ans":[0],"why":"Azure Resource Manager is the deployment and management layer that receives requests from all Azure tools.","kind":"one","miss":false},{"id":"q140","d":3,"topic":"Monitoring","type":"match","kind":"match","q":"Match each description to the tool.","rows":["A global view of the health of all Azure services in all regions","A personalized view of the services and regions you use","The health of one specific VM","Best-practice recommendations in five categories"],"choices":["Azure status","Azure Service Health","Azure Resource Health","Azure Advisor"],"ans":[0,1,2,3],"why":"Azure status is global. Service Health is personalized to your services and regions. Resource Health is one resource. Advisor gives recommendations.","miss":false},{"id":"q141","d":3,"topic":"Monitoring","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Azure Advisor recommendations are based on your resource configuration and usage.","Azure Advisor gives recommendations about cost.","Azure Advisor is a paid add-on."],"ans":[1,1,0],"why":"Advisor is free. It gives recommendations for reliability, security, performance, operational excellence and cost.","miss":false},{"id":"q142","d":3,"topic":"Monitoring","q":"Which Azure Monitor tool lets you write queries against the log data it collects?","opts":["Log Analytics","Azure Advisor","Service Trust Portal","Azure status"],"ans":[0],"why":"Log Analytics is the Azure portal tool for writing and running log queries on data collected by Azure Monitor.","kind":"one","miss":false},{"id":"q143","d":3,"topic":"Monitoring","q":"You want to monitor a web app's request rates, response times and failures. Which feature fits?","opts":["Application Insights","Resource Health","Cost Management","Azure Policy"],"ans":[0],"why":"Application Insights, part of Azure Monitor, monitors web applications: requests, failures, response times and more.","kind":"one","miss":false},{"id":"q144","d":3,"topic":"Monitoring","q":"You want to be notified when a VM's CPU stays above 90% for 5 minutes. What should you set up?","opts":["An Azure Monitor alert","A resource lock","A budget alert","A Service Trust Portal report"],"ans":[0],"why":"Azure Monitor alerts notify you when a condition in your monitoring data is met.","kind":"one","miss":false},{"id":"q200","d":1,"topic":"Benefits","q":"Deploying an app and its data to regional datacenters around the world, so users everywhere get good performance, is called what?","opts":["High availability","Geo-distribution","Vertical scaling","Elasticity"],"ans":[1],"why":"Geo-distribution means deploying to regional datacenters around the globe. High availability is about staying up when something fails.","kind":"one","miss":true},{"id":"q201","d":1,"topic":"Shared responsibility","q":"Who manages the operating system of an Azure virtual machine?","opts":["The customer, because VMs are IaaS","Microsoft, because it is SaaS","Microsoft, because it is PaaS","Nobody, Azure patches it automatically"],"ans":[0],"why":"VMs are IaaS, so the customer manages the OS and apps. In PaaS and SaaS the provider manages the OS.","kind":"one","miss":true},{"id":"q202","d":2,"topic":"Identity","q":"What must you use to sync on-premises Active Directory users into Microsoft Entra ID to create hybrid identities?","opts":["Microsoft Entra Connect (Sync)","Azure Resource Manager","Conditional Access","Azure Arc"],"ans":[0],"why":"Microsoft Entra Connect syncs identities from on-premises AD DS to Microsoft Entra ID, so users can use SSO, MFA and self-service password reset in both.","kind":"one","miss":true},{"id":"q203","d":2,"topic":"Networking","q":"Which scenario is a use case for a VPN gateway?","opts":["Connecting an on-premises datacenter to an Azure virtual network over the internet","Filtering outbound network traffic","Hosting DNS records","Load balancing web traffic"],"ans":[0],"why":"A VPN gateway sends encrypted traffic between an Azure virtual network and an on-premises location (site-to-site). Filtering traffic is a firewall job.","kind":"one","miss":true},{"id":"q204","d":2,"topic":"Storage","q":"Which TWO protocols can be used to access Azure file shares?","opts":["Server Message Block (SMB)","Network File System (NFS)","FTP","SMTP"],"ans":[0,1],"why":"Azure Files shares are accessible over the industry-standard SMB and NFS protocols.","kind":"two","miss":true},{"id":"q205","d":3,"topic":"Cost","q":"Which TWO can you do with Microsoft Cost Management?","opts":["Create and manage budgets","Review historical costs and forecast future spending","Estimate on-premises total cost of ownership before moving","Restrict which regions resources can be deployed to"],"ans":[0,1],"why":"Cost Management tracks real spending: budgets, cost analysis, historical reports and forecasts. TCO estimates come from the TCO calculator. Region restrictions are Azure Policy.","kind":"two","miss":true},{"id":"q206","d":3,"topic":"Cost","q":"Which TWO factors affect Azure costs?","opts":["The region a resource is deployed in","Outbound data transfers","The number of resource groups in a subscription","Using ARM templates for deployment"],"ans":[0,1],"why":"Price varies by region, and outbound data transfer is billed. Resource groups and ARM templates are free organizing and deployment tools.","kind":"two","miss":true},{"id":"q207","d":3,"topic":"Governance","q":"You need to make sure VMs can only be deployed with four or fewer vCPUs, or only in approved regions. What should you use?","opts":["Azure Policy","Resource locks","RBAC","Resource tags"],"ans":[0],"why":"Azure Policy evaluates and enforces rules about resource properties, like allowed sizes and locations. Locks only prevent deletion or changes to existing resources.","kind":"one","miss":true},{"id":"q208","d":3,"topic":"Management","q":"What lets you define the resources you want to deploy in a declarative JSON format?","opts":["ARM templates","Azure CLI","Azure PowerShell","Azure portal"],"ans":[0],"why":"ARM templates are declarative JSON: you describe the end state. The CLI and PowerShell run imperative commands step by step.","kind":"one","miss":true},{"id":"q209","d":3,"topic":"Monitoring","q":"Where do you find planned maintenance and root cause analysis (RCA) reports for Azure service issues that affect you?","opts":["Azure Service Health","Log Analytics","Azure Advisor","Azure status page only"],"ans":[0],"why":"Service Health gives a personalized view of service issues, planned maintenance and health advisories, plus RCA reports after outages.","kind":"one","miss":true},{"id":"q301","d":1,"topic":"Shared responsibility","q":"Your company moves a database from a VM to Azure SQL Database (PaaS). Which task moves from you to Microsoft?","opts":["Managing which users can sign in","Protecting the devices users connect from","Classifying the data in the database","Patching the database server's operating system"],"ans":[3],"why":"In PaaS Microsoft runs the OS. Data, accounts and identities, and devices always stay with the customer.","kind":"one","miss":false,"crunch":true},{"id":"q302","d":1,"topic":"Shared responsibility","q":"In which service type is the customer responsible for the MOST?","opts":["IaaS","It is the same for all three","SaaS","PaaS"],"ans":[0],"why":"IaaS gives you the most control and the most responsibility: OS, network controls, apps and data are yours.","kind":"one","miss":false,"crunch":true},{"id":"q303","d":1,"topic":"Shared responsibility","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["In SaaS, Microsoft is responsible for the physical datacenter.","In IaaS, the customer is responsible for patching the virtual machine's operating system.","In SaaS, the customer is no longer responsible for its data."],"ans":[1,1,0],"why":"The physical datacenter is always Microsoft's. The OS of a VM is yours in IaaS. Data is always the customer's.","miss":false,"crunch":true},{"id":"q304","d":1,"topic":"Cost model","q":"Which describes the consumption-based model?","opts":["You pay only for the resources you use, with no upfront hardware cost","You pay one fixed price per year for unlimited capacity","You buy servers upfront and depreciate them over time","You pay for capacity reserved even when it is not used"],"ans":[0],"why":"Consumption-based means pay for what you use, when you use it. It is an OpEx model with no upfront CapEx.","kind":"one","miss":false,"crunch":true},{"id":"q305","d":1,"topic":"Cost model","q":"Which TWO are examples of operational expenditure (OpEx)?","opts":["Building a server room","Buying servers for a new datacenter","Paying monthly for Azure virtual machines","Paying per GB stored in Azure Storage"],"ans":[2,3],"why":"OpEx is spending on services as you use them. Buying hardware or buildings is CapEx.","kind":"two","miss":false,"crunch":true},{"id":"q306","d":1,"topic":"Cloud models","q":"Which describes serverless computing?","opts":["You manage the OS but not the hardware","You must reserve servers a year in advance","There are no servers involved at all","The cloud provider manages the servers and you are billed only when your code runs"],"ans":[3],"why":"Serverless still runs on servers, but the provider manages them and scales automatically. You pay only for execution. Azure Functions is the classic example.","kind":"one","miss":false,"crunch":true},{"id":"q307","d":1,"topic":"Cloud models","q":"A government agency must run workloads only on hardware that it owns and that no other organization uses. Which cloud model fits?","opts":["Hybrid cloud","Public cloud","Private cloud","Multicloud"],"ans":[2],"why":"A private cloud is used by one organization only. The public cloud shares hardware between many customers.","kind":"one","miss":false,"crunch":true},{"id":"q308","d":1,"topic":"Cloud models","type":"match","kind":"match","q":"Match each scenario to the cloud model.","rows":["Run everything on Microsoft-owned shared hardware","Keep all servers in your own datacenter, used only by you","Keep sensitive data on premises and burst to Azure for peaks"],"choices":["Public cloud","Private cloud","Hybrid cloud"],"ans":[0,1,2],"why":"Public = provider's shared hardware. Private = one organization only. Hybrid = both, connected.","miss":false,"crunch":true},{"id":"q309","d":1,"topic":"Benefits","q":"An online store adds VMs automatically during a holiday sale and removes them afterwards. Which benefit is this?","opts":["Elasticity (scalability)","Governance","Manageability","Predictability"],"ans":[0],"why":"Adding and removing resources automatically as demand changes is elasticity, a form of scalability.","kind":"one","miss":false,"crunch":true},{"id":"q310","d":1,"topic":"Benefits","q":"Which benefit lets you forecast your monthly cloud bill and expected performance?","opts":["Predictability","Security","Reliability","High availability"],"ans":[0],"why":"Predictability covers both cost and performance. Tools like the pricing calculator and autoscaling support it.","kind":"one","miss":false,"crunch":true},{"id":"q311","d":1,"topic":"Service types","q":"A team wants to deploy its web app without managing servers, operating systems or patching. Which service type fits?","opts":["On-premises","IaaS","SaaS","PaaS"],"ans":[3],"why":"PaaS gives a managed platform for your own code. IaaS would leave the OS to you. SaaS is a finished app, not your code.","kind":"one","miss":false,"crunch":true},{"id":"q312","d":2,"topic":"Regions and zones","q":"Which statement about Azure region pairs is true?","opts":["Every resource is automatically copied to the paired region","Both regions of a pair are always in different geographies","Region pairs replace the need for availability zones","Planned platform updates are rolled out to one region of a pair at a time"],"ans":[3],"why":"Updates go to one region of a pair at a time, and one region of each pair is prioritized for recovery in a wide outage. Pairs stay in the same geography (Brazil South is the exception). Replication is not automatic for every resource.","kind":"one","miss":false,"crunch":true},{"id":"q313","d":2,"topic":"Regions and zones","q":"A US federal agency needs a cloud physically and logically isolated for government use. What should it use?","opts":["A management group","Azure Government, a sovereign region","A region pair","An availability zone"],"ans":[1],"why":"Sovereign regions are separate instances of Azure for compliance or legal reasons, such as Azure Government (US) and Azure operated by 21Vianet (China).","kind":"one","miss":false,"crunch":true},{"id":"q314","d":2,"topic":"Regions and zones","q":"A VM must keep running if a whole datacenter in the region fails. What should you use?","opts":["Azure Advisor","A resource group","Availability zones","A single VM with a premium disk"],"ans":[2],"why":"Availability zones are physically separate datacenters in a region with their own power, cooling and network.","kind":"one","miss":false,"crunch":true},{"id":"q315","d":2,"topic":"Regions and zones","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Every Azure region supports availability zones.","An availability zone is made up of one or more datacenters.","A zone-enabled region has at least three availability zones."],"ans":[0,1,1],"why":"Not every region has zones. Each zone is one or more datacenters with independent power, cooling and networking, and zone-enabled regions have at least three.","miss":false,"crunch":true},{"id":"q316","d":2,"topic":"Hierarchy","q":"You apply an Azure Policy to a management group. Where does it take effect?","opts":["On every subscription, resource group and resource below that management group","Only on resources that are tagged","Only on the management group itself","Only on new subscriptions"],"ans":[0],"why":"Policy, access (RBAC) and locks are inherited down the hierarchy: management group, subscription, resource group, resource.","kind":"one","miss":false,"crunch":true},{"id":"q317","d":2,"topic":"Hierarchy","q":"Which statement about resource groups is true?","opts":["A resource group can span several subscriptions","Resource groups can be nested","A resource can belong to several resource groups","Deleting a resource group deletes every resource in it"],"ans":[3],"why":"A resource is in exactly one resource group, groups cannot be nested, and deleting the group deletes everything inside.","kind":"one","miss":false,"crunch":true},{"id":"q318","d":2,"topic":"Hierarchy","q":"A company needs separate billing for each department. What should it create for each department?","opts":["An availability zone","A resource tag only","A resource group","A subscription"],"ans":[3],"why":"A subscription is a billing boundary and an access boundary. Departments often get their own subscription, grouped under management groups.","kind":"one","miss":false,"crunch":true},{"id":"q319","d":2,"topic":"Hierarchy","type":"match","kind":"match","q":"Match each Azure scope to its description.","rows":["Groups subscriptions so policy and access apply to all of them","Billing and access boundary","Logical container for resources that share a lifecycle","A single VM, storage account or database"],"choices":["Management group","Subscription","Resource group","Resource"],"ans":[0,1,2,3],"why":"Management groups hold subscriptions, subscriptions hold resource groups, resource groups hold resources.","miss":false,"crunch":true},{"id":"q320","d":2,"topic":"Compute","q":"Which TWO resources are created along with an Azure virtual machine?","opts":["A network interface","A disk for the operating system","An Azure Function","A management group"],"ans":[0,1],"why":"A VM needs compute size, storage disks and networking: a virtual network, a network interface and optionally a public IP address.","kind":"two","miss":false,"crunch":true},{"id":"q321","d":2,"topic":"Compute","q":"You need to run a single container quickly with no orchestration or VMs to manage. Which service fits?","opts":["Azure Kubernetes Service","Virtual Machine Scale Sets","Azure Virtual Desktop","Azure Container Instances"],"ans":[3],"why":"Container Instances is the simplest way to run a container. AKS orchestrates many containers.","kind":"one","miss":false,"crunch":true},{"id":"q322","d":2,"topic":"Compute","q":"Which provides Windows desktops and apps hosted in Azure that users reach from any device?","opts":["Azure Container Instances","Azure App Service","Azure Virtual Desktop","Azure Bastion"],"ans":[2],"why":"Azure Virtual Desktop is desktop and app virtualization in the cloud, with multi-session Windows.","kind":"one","miss":false,"crunch":true},{"id":"q323","d":2,"topic":"Networking","q":"A web app should be reachable only from your virtual network, using a private IP address. What should you use?","opts":["Azure DNS","A private endpoint","A public endpoint","A VPN gateway"],"ans":[1],"why":"A private endpoint gives a service a private IP address in your virtual network (through Private Link), so traffic stays off the public internet.","kind":"one","miss":false,"crunch":true},{"id":"q324","d":2,"topic":"Networking","q":"Two virtual networks in different regions must talk to each other over the Microsoft backbone. What should you configure?","opts":["A public endpoint","ExpressRoute","Virtual network peering","Azure DNS"],"ans":[2],"why":"Peering connects virtual networks, including across regions (global peering), over Microsoft's backbone.","kind":"one","miss":false,"crunch":true},{"id":"q325","d":2,"topic":"Networking","q":"You need a private, dedicated connection from your datacenter to Azure that does not cross the public internet. What should you use?","opts":["ExpressRoute","VPN Gateway","Virtual network peering","Azure DNS"],"ans":[0],"why":"ExpressRoute is a private connection through a connectivity provider. A VPN gateway sends encrypted traffic over the public internet.","kind":"one","miss":false,"crunch":true},{"id":"q326","d":2,"topic":"Storage","q":"Data must be kept for at least 180 days and is almost never read. Retrieval can take hours. Which access tier costs least?","opts":["Archive","Hot","Cold","Cool"],"ans":[0],"why":"Archive has the lowest storage cost but is offline: data must be rehydrated, which takes hours. Minimum retention 180 days.","kind":"one","miss":false,"crunch":true},{"id":"q327","d":2,"topic":"Storage","type":"match","kind":"match","q":"Match each access tier to its minimum recommended retention.","rows":["Cool","Cold","Archive"],"choices":["30 days","90 days","180 days"],"ans":[0,1,2],"why":"Cool 30, cold 90, archive 180. Hot has no minimum. Moving data out early incurs an early deletion charge.","miss":false,"crunch":true},{"id":"q328","d":2,"topic":"Storage","q":"Which redundancy option keeps three copies in three availability zones of the primary region only?","opts":["Zone-redundant storage (ZRS)","Geo-redundant storage (GRS)","Locally redundant storage (LRS)","Geo-zone-redundant storage (GZRS)"],"ans":[0],"why":"ZRS spreads three copies across zones in one region. LRS keeps three copies in one datacenter. GRS and GZRS add a secondary region.","kind":"one","miss":false,"crunch":true},{"id":"q329","d":2,"topic":"Storage","q":"You need geo-redundancy AND the ability to read data from the secondary region at any time. Which option?","opts":["RA-GRS","ZRS","LRS","GRS"],"ans":[0],"why":"The RA (read-access) versions, RA-GRS and RA-GZRS, let you read from the secondary region without a failover.","kind":"one","miss":false,"crunch":true},{"id":"q330","d":2,"topic":"Storage","q":"Which storage account type is recommended for most scenarios and supports blobs, files, queues and tables?","opts":["Premium block blobs","Premium file shares","Premium page blobs","Standard general-purpose v2"],"ans":[3],"why":"Standard general-purpose v2 covers most scenarios. Premium accounts are for low-latency workloads of one type.","kind":"one","miss":false,"crunch":true},{"id":"q331","d":2,"topic":"Storage","q":"You must copy files to Azure Blob Storage from a command line script. Which tool fits?","opts":["AzCopy","Azure Storage Explorer","Azure File Sync","Azure Data Box"],"ans":[0],"why":"AzCopy is a command-line tool. Storage Explorer is a graphical app. File Sync keeps on-premises file servers in sync with Azure Files.","kind":"one","miss":false,"crunch":true},{"id":"q332","d":2,"topic":"Storage","q":"Branch offices want their Windows file servers to cache Azure file shares locally. Which service?","opts":["Azure Storage Explorer","AzCopy","Azure File Sync","Azure Migrate"],"ans":[2],"why":"Azure File Sync turns a Windows Server into a local cache of an Azure file share.","kind":"one","miss":false,"crunch":true},{"id":"q333","d":2,"topic":"Storage","q":"You must move 60 TB of data to Azure but the internet link is slow. What should you use?","opts":["Azure Data Box","Azure Migrate","AzCopy","Azure File Sync"],"ans":[0],"why":"Data Box is a physical device (up to 80 TB) shipped to you, filled, and returned to Microsoft for upload.","kind":"one","miss":false,"crunch":true},{"id":"q334","d":2,"topic":"Identity","q":"A legacy app needs domain join, Group Policy and Kerberos, but you do not want to run domain controllers in Azure. What should you use?","opts":["Microsoft Entra ID alone","Microsoft Entra Domain Services","Azure Policy","Microsoft Entra B2B"],"ans":[1],"why":"Entra Domain Services provides managed domain services (domain join, Group Policy, LDAP, Kerberos and NTLM) without you deploying domain controllers.","kind":"one","miss":false,"crunch":true},{"id":"q335","d":2,"topic":"Identity","q":"Partner company staff must sign in to your app using their own work accounts. Which feature?","opts":["Microsoft Entra External ID (B2B collaboration)","Azure RBAC","Conditional Access","Microsoft Entra Domain Services"],"ans":[0],"why":"External identities let people outside your organization use their own identities to reach your apps.","kind":"one","miss":false,"crunch":true},{"id":"q336","d":2,"topic":"Identity","q":"Users sign in once and then reach Microsoft 365, the Azure portal and other apps without signing in again. What is this?","opts":["Conditional Access","Passwordless authentication","Multifactor authentication","Single sign-on (SSO)"],"ans":[3],"why":"SSO means one sign-in, one set of credentials, many apps.","kind":"one","miss":false,"crunch":true},{"id":"q337","d":2,"topic":"Identity","q":"Which TWO are passwordless authentication methods in Azure?","opts":["A password plus an SMS code","Microsoft Authenticator app","Windows Hello for Business","A security question"],"ans":[1,2],"why":"Passwordless methods include Windows Hello for Business, the Microsoft Authenticator app and FIDO2 security keys (passkeys).","kind":"two","miss":false,"crunch":true},{"id":"q338","d":2,"topic":"Security","q":"A user needs to restart VMs in one resource group but nothing else. Which feature grants exactly that?","opts":["Azure Policy","A resource lock","Azure role-based access control (RBAC) at the resource group scope","Microsoft Defender for Cloud"],"ans":[2],"why":"RBAC assigns a role at a scope. Least privilege means the narrowest role at the narrowest scope.","kind":"one","miss":false,"crunch":true},{"id":"q339","d":3,"topic":"Governance","q":"Developers must be prevented from creating resources outside the East US region. What should you use?","opts":["Azure RBAC","Azure Policy","A resource lock","Tags"],"ans":[1],"why":"Azure Policy enforces rules about how resources are configured, such as allowed regions, and can deny non-compliant deployments.","kind":"one","miss":false,"crunch":true},{"id":"q340","d":3,"topic":"Governance","q":"A production database must not be deleted by accident, even by an Owner. What should you apply?","opts":["A Delete (CanNotDelete) resource lock","An RBAC Reader role","A ReadOnly tag","Azure Policy"],"ans":[0],"why":"Locks apply to everyone, including Owners. A Delete lock allows changes but blocks deletion. ReadOnly blocks both.","kind":"one","miss":false,"crunch":true},{"id":"q341","d":3,"topic":"Governance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A resource lock applies even to users with the Owner role.","To delete a resource with a Delete lock, you must first remove the lock.","A ReadOnly lock still allows the resource to be deleted."],"ans":[1,1,0],"why":"Locks override RBAC permissions for everyone. Remove the lock first. ReadOnly blocks changes AND deletion.","miss":false,"crunch":true},{"id":"q342","d":3,"topic":"Governance","type":"match","kind":"match","q":"Match each requirement to the right tool.","rows":["Only allow VM sizes from an approved list","Stop anyone deleting a storage account","Give the help desk permission to restart VMs","Group costs by department on the bill"],"choices":["Azure RBAC","Azure Policy","Tags","Resource lock"],"ans":[1,3,0,2],"why":"Policy controls HOW resources are configured. Locks stop change or deletion. RBAC controls WHO can do what. Tags add metadata for cost and organization.","miss":false,"crunch":true},{"id":"q343","d":3,"topic":"Governance","q":"What is an Azure Policy initiative?","opts":["A role with custom permissions","A lock applied to a whole subscription","A tag that is inherited by every resource","A group of related policy definitions assigned together"],"ans":[3],"why":"Initiatives bundle policies toward one goal, such as a compliance standard, so you assign and track them as one.","kind":"one","miss":false,"crunch":true},{"id":"q344","d":3,"topic":"Governance","q":"Which service gives a unified view to discover, classify and govern data across on-premises, multicloud and SaaS?","opts":["Azure Policy","Microsoft Defender for Cloud","Azure Advisor","Microsoft Purview"],"ans":[3],"why":"Microsoft Purview is a family of data governance, risk and compliance solutions with one view of your data estate.","kind":"one","miss":false,"crunch":true},{"id":"q345","d":3,"topic":"Cost","q":"Which TWO factors affect the cost of Azure resources?","opts":["The number of resource groups in the subscription","The number of tags on the resource","The Azure region the resource is deployed in","Outbound data transfer (egress) between regions"],"ans":[2,3],"why":"Cost depends on resource type, consumption, maintenance, geography (region), network traffic (egress), subscription type and Marketplace items. Tags and resource groups are free.","kind":"two","miss":false,"crunch":true},{"id":"q346","d":3,"topic":"Cost","q":"Before deploying anything, you want to estimate the monthly cost of three VMs and a SQL database. Which tool?","opts":["Azure pricing calculator","Microsoft Cost Management","Azure Service Health","Azure Advisor"],"ans":[0],"why":"The pricing calculator estimates costs before you deploy. Cost Management analyzes and controls what you are already spending.","kind":"one","miss":false,"crunch":true},{"id":"q347","d":3,"topic":"Cost","q":"You want an email when a subscription's spending reaches 80% of a monthly amount. What should you create?","opts":["An Azure Policy","A Service Health alert","A budget in Microsoft Cost Management","A resource lock"],"ans":[2],"why":"Budgets in Cost Management trigger alerts at thresholds you set. Budgets alert; they do not stop resources by themselves.","kind":"one","miss":false,"crunch":true},{"id":"q348","d":3,"topic":"Cost","q":"Which TWO are uses of resource tags?","opts":["Identifying which resources belong to a project","Grouping costs by department in cost reports","Encrypting data at rest","Preventing a resource from being deleted"],"ans":[0,1],"why":"Tags are name/value pairs for organization, cost reporting, automation and governance. Locks prevent deletion.","kind":"two","miss":false,"crunch":true},{"id":"q349","d":3,"topic":"Management","q":"You need a browser-based shell with Azure CLI and Azure PowerShell already installed and signed in. What should you use?","opts":["Azure Advisor","Azure Cloud Shell","ARM templates","Azure Arc"],"ans":[1],"why":"Cloud Shell runs in the browser (Bash or PowerShell) with the tools already installed and authenticated.","kind":"one","miss":false,"crunch":true},{"id":"q350","d":3,"topic":"Management","q":"You must manage on-premises servers and servers in AWS from the Azure portal, applying Azure Policy to them. What should you use?","opts":["ExpressRoute","Azure Cloud Shell","Azure Arc","Azure Migrate"],"ans":[2],"why":"Azure Arc projects non-Azure resources (servers, Kubernetes, data services) into Azure Resource Manager so you can manage and govern them in Azure.","kind":"one","miss":false,"crunch":true},{"id":"q351","d":3,"topic":"Management","q":"What is infrastructure as code (IaC)?","opts":["Buying hardware through a portal","Monitoring infrastructure with code-based alerts","Defining infrastructure in files so it can be deployed the same way every time","Writing app code that runs on infrastructure"],"ans":[2],"why":"IaC describes resources in code (ARM templates, Bicep) so deployments are repeatable and version-controlled.","kind":"one","miss":false,"crunch":true},{"id":"q352","d":3,"topic":"Management","q":"Which TWO are benefits of ARM templates?","opts":["They replace the need for Azure RBAC","They are declarative: you say what you want, not how to build it","Deploying the same template again gives the same result","They only work from the Azure portal"],"ans":[1,2],"why":"ARM templates are declarative JSON, repeatable (idempotent), orchestrated and modular. Bicep is a simpler language for the same deployments.","kind":"two","miss":false,"crunch":true},{"id":"q353","d":3,"topic":"Management","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Every request to manage Azure resources, from the portal, CLI or PowerShell, goes through Azure Resource Manager.","Bicep is a language for declaring Azure resources that is simpler than ARM template JSON.","Azure Cloud Shell requires installing the Azure CLI on your own computer."],"ans":[1,1,0],"why":"ARM is the single management layer for all tools. Bicep compiles to ARM templates. Cloud Shell runs in the browser with the tools preinstalled.","miss":false,"crunch":true},{"id":"q354","d":3,"topic":"Monitoring","q":"Which service gives personalized recommendations for reliability, security, performance, operational excellence and cost?","opts":["Azure Monitor alerts","Azure Advisor","Microsoft Purview","Azure Service Health"],"ans":[1],"why":"Advisor analyzes your resources and recommends improvements in those five categories.","kind":"one","miss":false,"crunch":true},{"id":"q355","d":3,"topic":"Monitoring","q":"Developers need to see request rates, response times and failure rates of their web app. Which feature?","opts":["Azure Service Health","Microsoft Cost Management","Azure Advisor","Application Insights"],"ans":[3],"why":"Application Insights, part of Azure Monitor, monitors the performance and usage of web applications.","kind":"one","miss":false,"crunch":true},{"id":"q356","d":3,"topic":"Monitoring","q":"Where do you write queries (KQL) against logs collected by Azure Monitor?","opts":["Azure Service Health","Application Insights availability tests","Azure Advisor","Log Analytics"],"ans":[3],"why":"Log Analytics is the Azure Monitor tool for writing and running log queries.","kind":"one","miss":false,"crunch":true},{"id":"q357","d":3,"topic":"Monitoring","type":"match","kind":"match","q":"Match each need to the right tool.","rows":["Is there an Azure outage in a region I use?","How can I cut costs on idle VMs?","Email me when CPU stays above 90%","Why is my web app slow for users?"],"choices":["Azure Monitor alerts","Azure Advisor","Application Insights","Azure Service Health"],"ans":[3,1,0,2],"why":"Service Health = Azure's health for you. Advisor = recommendations. Monitor alerts = act on your metrics and logs. Application Insights = app performance.","miss":false,"crunch":true},{"id":"q358","d":3,"topic":"Monitoring","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Azure status shows the health of Azure services globally.","Resource Health shows the health of your individual resources.","Azure Advisor can automatically fix every recommendation it makes."],"ans":[1,1,0],"why":"Service Health has three views: Azure status (global), Service Health (your services and regions) and Resource Health (your resources). Advisor recommends; you act.","miss":false,"crunch":true}],"sections":[{"id":"s1","d":1,"title":"Cloud computing","label":"High","note":"Shared responsibility and cloud models appear on almost every attempt.","why":"","obj":["Define cloud computing","shared responsibility model","public, private, hybrid and use cases","consumption-based model","pricing models","serverless."],"cold":["**Cloud computing**: services (servers, storage, databases, networking, software) over the internet, on demand.","**Public**: provider-owned, shared hardware, no upfront hardware cost. **Private**: one organization, you manage hardware. **Hybrid**: both, workloads move between.","**Shared responsibility**: Microsoft always owns physical datacenter, network, hosts. You always own data, devices, accounts and identities. OS, network controls, applications and identity infrastructure vary by service type.","**CapEx** = upfront spend on hardware. **OpEx** = pay as you go. Consumption-based = pay only for what you use.","**Use cases:** public = variable load and test/dev; private = strict compliance or control; hybrid = sensitive data on-premises plus public capacity.","**Pricing models:** pay-as-you-go (flexible), Reservations and savings plans (commit 1 or 3 years, cheaper if steady), Spot (interruptible, lowest price). Azure Hybrid Benefit reuses existing licenses.","**Serverless**: you run code, the provider manages servers and scales automatically (Azure Functions)."],"traps":["Which model buys hardware: private. Which is pay-as-you-go: public.","\"Who patches the OS?\" depends on IaaS (you) vs PaaS/SaaS (Microsoft).","Hybrid is not \"multiple public clouds\"."],"hooks":["Public = shared. Private = yours. Hybrid = both.","CapEx = buy it. OpEx = rent it."],"topics":["Cloud models","Pricing and cost model","Shared responsibility"],"qtopics":["Cloud models","Cost model","Shared responsibility"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/","modTitle":"Describe cloud computing","units":[{"t":"Introduction to cloud computing","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/2-introduction-cloud-compute"},{"t":"What is cloud computing","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"},{"t":"The shared responsibility model","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"},{"t":"Define cloud models","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"},{"t":"The consumption-based model","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"}],"models":["shared"]},{"id":"s2","d":1,"title":"Benefits of cloud services","label":"High","note":"Includes the SLA math you've missed in practice.","why":"","obj":["High availability and scalability","reliability and predictability","security and governance","manageability."],"cold":["**Scale up (vertical)** = bigger resource. **Scale out (horizontal)** = more instances.","**Scalability** = add or remove resources for load. **Elasticity** = do it automatically with demand.","**Reliability** = resiliency, redundancy, failover. **Predictability** = performance (autoscale, load balance, HA) and cost.","**Composite SLA = multiply** the SLAs; result is lower than any single one.","Downtime per year: 99% ≈ 3.65 days · 99.9% ≈ 8.76 hrs · 99.99% ≈ 52.6 min.","Management **of** the cloud (autoscale, templates, monitoring) vs management **in** the cloud (portal, CLI, PowerShell, APIs)."],"traps":["Scalability vs elasticity (weak area).","Adding a component to a chain lowers the composite SLA."],"hooks":["Up = bigger box. Out = more boxes.","Composite SLA = multiply."],"topics":["Benefits of the cloud"],"qtopics":["Benefits"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/","modTitle":"Describe the benefits of using cloud services","units":[{"t":"High availability and scalability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud"},{"t":"Reliability and predictability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud"},{"t":"Security and governance","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud"},{"t":"Manageability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud"},{"t":"Sustainability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5a-describe-sustainability-cloud"}]},{"id":"s3","d":1,"title":"Cloud service types","label":"High","note":"IaaS shared responsibility is a current weak area.","why":"","obj":["IaaS, PaaS, SaaS and their use cases."],"cold":["**IaaS**: rent VMs, storage, networks. You manage OS, apps, data. Lift and shift, test/dev.","**PaaS**: build and deploy apps without managing servers or OS. You manage app and data.","**SaaS**: finished software, usually subscription (Microsoft 365). You manage data and access.","Moving IaaS → PaaS → SaaS, Microsoft manages more."],"traps":["Azure VMs are IaaS: you patch the OS.","App Service, Functions are PaaS/serverless."],"hooks":["Moving right, Microsoft manages more."],"topics":["Service types"],"qtopics":["Service types"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/","modTitle":"Describe cloud service types","units":[{"t":"IaaS","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service"},{"t":"PaaS","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-pla
