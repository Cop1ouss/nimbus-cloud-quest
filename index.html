ent explorer"],"ans":[2],"why":"Activity explorer shows the history of actions on labeled content. Content explorer shows what exists and where.","kind":"one","miss":false},{"id":"q090","d":4,"topic":"Information protection","q":"Users must be warned and blocked when they try to email credit card numbers outside the company. What should you configure?","opts":["A sensitivity label policy","A Conditional Access policy","A data loss prevention policy","A retention policy"],"ans":[2],"why":"DLP detects sensitive information in use and blocks or warns about inappropriate sharing.","kind":"one","miss":false},{"id":"q091","d":4,"topic":"Information protection","q":"All email in every mailbox must be kept for seven years and then deleted. What is the simplest configuration?","opts":["A sensitivity label","A retention policy applied to Exchange mailboxes","An eDiscovery hold","A DLP policy"],"ans":[1],"why":"A retention policy applies the same retention settings across a whole location.","kind":"one","miss":false},{"id":"q092","d":4,"topic":"Information protection","q":"Which classification method recognizes content such as resumes by learning from example documents?","opts":["Sensitive information types","Retention labels","Trainable classifiers","Exact keyword match"],"ans":[2],"why":"Trainable classifiers use AI trained on examples. Sensitive information types match patterns.","kind":"one","miss":false},{"id":"q093","d":4,"topic":"Information protection","q":"Which TWO statements about sensitivity labels are true?","opts":["An item can have only one sensitivity label at a time","Labels are removed when a file is emailed","The label stays with the content when it moves","Labels can only be applied by administrators"],"ans":[0,2],"why":"Labels are persistent and one per item. Users apply them, or they are applied automatically.","kind":"two","miss":false},{"id":"q094","d":4,"topic":"Information protection","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A document can have multiple retention labels applied at the same time.","Content explorer shows where sensitive items are located.","DLP policies can show a policy tip to warn users before they share sensitive data."],"ans":[0,1,1],"why":"One retention label per item. Content explorer shows location and labels. Policy tips educate users at the moment of sharing.","miss":false},{"id":"q095","d":4,"topic":"Information protection","type":"match","kind":"match","q":"Match each need to the Microsoft Purview capability.","rows":["Encrypt and watermark a file","Stop credit card numbers leaving in email","Keep contracts for 10 years","Lock an item so it cannot be deleted"],"choices":["Data loss prevention","Retention label","Sensitivity label","Records management"],"ans":[2,0,1,3],"why":"Labels protect, DLP prevents leaks, retention governs lifetime, records management locks important items.","miss":false},{"id":"q096","d":4,"topic":"Insider risk, eDiscovery, audit","q":"An employee who has resigned is downloading large numbers of confidential files. Which solution is designed to detect this?","opts":["Azure DDoS Protection","eDiscovery","Compliance Manager","Insider Risk Management"],"ans":[3],"why":"Insider Risk Management detects risky activity by insiders such as data theft by departing employees.","kind":"one","miss":false},{"id":"q097","d":4,"topic":"Insider risk, eDiscovery, audit","q":"Legal needs all email and Teams messages about a lawsuit preserved and exported. Which solution should you use?","opts":["Insider Risk Management","Audit (Standard)","eDiscovery","Data loss prevention"],"ans":[2],"why":"eDiscovery cases let you hold, search and export content as legal evidence.","kind":"one","miss":false},{"id":"q098","d":4,"topic":"Insider risk, eDiscovery, audit","q":"You need to find out which admin changed a mailbox permission last week. Where do you look?","opts":["Service Trust Portal","Compliance score","Content explorer","Microsoft Purview Audit"],"ans":[3],"why":"The unified audit log records user and admin activities.","kind":"one","miss":false},{"id":"q099","d":4,"topic":"Insider risk, eDiscovery, audit","q":"How long does Audit (Standard) keep audit records by default?","opts":["1 year","30 days","10 years","180 days"],"ans":[3],"why":"Audit (Standard) retains records for 180 days. Longer retention needs Audit (Premium).","kind":"one","miss":false},{"id":"q100","d":4,"topic":"Insider risk, eDiscovery, audit","q":"In eDiscovery, what does placing a hold do?","opts":["Encrypts the content with a sensitivity label","Deletes the content after export","Blocks the user from signing in","Preserves content so it cannot be permanently deleted during the case"],"ans":[3],"why":"A hold preserves content relevant to a case.","kind":"one","miss":false},{"id":"q101","d":4,"topic":"Insider risk, eDiscovery, audit","q":"Which TWO are Audit (Premium) capabilities?","opts":["Blocking phishing links","Retention of audit records for up to 10 years with an add-on","Audit log retention policies","Creating access packages"],"ans":[1,2],"why":"Audit (Premium) adds retention policies, longer retention and intelligent insights.","kind":"two","miss":false},{"id":"q102","d":4,"topic":"Insider risk, eDiscovery, audit","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Insider Risk Management pseudonymizes usernames by default.","Audit (Standard) must be manually purchased and turned on before any activity is recorded.","eDiscovery can search content in Exchange mailboxes and Microsoft Teams."],"ans":[1,0,1],"why":"Pseudonymization protects privacy. Audit (Standard) is on by default. eDiscovery searches Microsoft 365 locations.","miss":false}],"sections":[{"id":"s1","d":1,"title":"Security and compliance concepts","label":"High","note":"Small domain, but these ideas show up inside questions in every other domain. Two 3D models below.","why":"","obj":["Shared responsibility model","defense-in-depth","Zero Trust model","encryption and hashing","Governance, Risk, and Compliance (GRC) concepts"],"cold":["**Shared responsibility:** you always own **data, devices, accounts and identities**. Microsoft always owns the **physical datacenter, network and hosts**. The middle varies by IaaS, PaaS, SaaS.","**Defense in depth:** seven layers. Physical, identity and access, perimeter, network, compute, application, data.","**CIA triad:** confidentiality, integrity, availability.","**Zero Trust:** verify explicitly, use least privilege access, assume breach. Six pillars: identities, devices, applications, data, infrastructure, networks.","**Encryption:** symmetric = one key, asymmetric = public/private pair. At rest, in transit, in use.","**Hashing:** one-way, fixed length, same input gives same output. Used for passwords, with a salt.","**GRC:** governance (rules), risk management (identify and respond), compliance (follow laws). **Residency** = where data is stored. **Sovereignty** = whose laws apply."],"traps":["Hashing is not encryption. It cannot be reversed.","'Trust the internal network' is never a Zero Trust answer.","Perimeter (DDoS, edge firewall) vs network (segmentation inside)."],"hooks":["Never trust, always verify.","Know, Have, Are is MFA. Verify, Least, Assume is Zero Trust."],"topics":["Security concepts"],"qtopics":["Security concepts"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/","modTitle":"Describe security and compliance concepts","units":[],"models":["shared","did","zt"]},{"id":"s2","d":1,"title":"Identity concepts","label":"Medium","note":"Authentication vs authorization is the most common pair on the exam.","why":"","obj":["Identity as the primary security perimeter","authentication","authorization","identity providers","directory services and Active Directory","federation"],"cold":["**Identity is the new perimeter** because apps, devices and people are outside the corporate network.","**Four pillars:** administration, authentication, authorization, auditing.","**AuthN** = who are you. **AuthZ** = what may you do.","**Identity provider:** issues security tokens that apps trust. Enables **single sign-on**.","**AD DS** = on-premises directory. **Microsoft Entra ID** = cloud identity provider.","**Federation:** trust between identity providers of different organizations. Not always two-way."],"traps":["Authentication always comes before authorization.","AD DS is not Entra ID."],"hooks":["AuthN = who. AuthZ = what."],"topics":["Identity concepts"],"qtopics":["Identity concepts"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/","modTitle":"Describe identity concepts","units":[]},{"id":"s3","d":2,"title":"Microsoft Entra ID and identity types","label":"High","note":"Know each identity type and the three hybrid sign-in methods.","why":"","obj":["Microsoft Entra ID","types of identities, including workload identities","hybrid identity"],"cold":["**Microsoft Entra ID:** cloud identity and access management. Every Microsoft 365 and Azure tenant has one.","**Identity types:** human (workforce, external), workload (apps, service principals, managed identities), device, and agent identities for AI.","**Managed identity:** Azure manages the credentials. System-assigned = one resource. User-assigned = shared, standalone.","**Devices:** registered (personal), joined (company, cloud), hybrid joined (company, on-premises AD plus Entra).","**External ID B2B:** guests sign in with their own identity.","**Hybrid identity:** Entra Connect Sync or Cloud Sync. Sign-in by password hash sync, pass-through authentication, or federation."],"traps":["Registered = personal device. Joined = company device.","Password hash sync still works if on-premises is down. Pass-through does not.","Guest users are human identities, not workload identities."],"hooks":["No secrets in code: managed identity."],"topics":["Entra ID and identities"],"qtopics":["Entra ID and identities"],"mod":"https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/","modTitle":"Describe the function and identity types of Microsoft Entra ID","units":[]},{"id":"s4","d":2,"title":"Authentication in Microsoft Entra ID","label":"High","note":"MFA factors and passwordless methods are near-certain questions.","why":"","obj":["Authentication methods","multifactor authentication (MFA)","password protection and management capabilities"],"cold":["**MFA:** two or more of know, have, are.","**Passwordless:** Windows Hello for Business, Microsoft Authenticator, passkeys (FIDO2).","**Security defaults:** free baseline. MFA registration for all, MFA for admins, legacy authentication blocked.","**SSPR:** users reset their own passwords. Fewer help desk calls.","**Password protection:** global banned list (Microsoft, automatic) and custom banned list (your terms). Works for on-premises AD too."],"traps":["Password plus PIN is not MFA: both are 'know'.","Security questions are for SSPR only, not for sign-in MFA.","A Windows Hello PIN never leaves the device."],"hooks":["Know, Have, Are."],"topics":["Authentication"],"qtopics":["Authentication"],"mod":"https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/","modTitle":"Describe the authentication capabilities of Microsoft Entra ID","units":[]},{"id":"s5","d":2,"title":"Access management in Microsoft Entra","label":"High","note":"Conditional Access: signal, decision, enforcement.","why":"","obj":["Microsoft Entra Conditional Access","Microsoft Entra roles and role-based access control (RBAC)"],"cold":["**Conditional Access:** if-then policies. **Signals** in (user, location, device, app, risk), **decision** (block or grant with requirements), **enforcement**.","**Entra roles** manage Entra resources (users, groups, apps). **Azure roles** manage Azure resources (VMs, storage).","**Built-in** roles are ready-made. **Custom** roles need a premium license.","**Least privilege:** the smallest role that does the job.","**Global Secure Access:** Entra Internet Access and Entra Private Access (Security Service Edge)."],"traps":["Global Administrator is an Entra role. Owner is an Azure role.","Security defaults and Conditional Access are not used together."],"hooks":["Conditional Access = if this, then that."],"topics":["Access management"],"qtopics":["Access management"],"mod":"https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/","modTitle":"Describe access management capabilities of Microsoft Entra","units":[],"models":["ca","hier"]},{"id":"s6","d":2,"title":"Identity protection and governance","label":"High","note":"Four tools that get mixed up: ID Governance, access reviews, PIM, ID Protection.","why":"","obj":["Microsoft Entra ID Governance","access reviews","Microsoft Entra Privileged Identity Management","Microsoft Entra ID Protection"],"cold":["**ID Governance:** right people, right access, right resources, right time. Entitlement management uses **access packages**.","**Access reviews:** regularly confirm who still needs access. Remove what is not confirmed.","**PIM:** just-in-time, time-bound, approval-based activation of privileged roles.","**ID Protection:** detects **user risk** (identity compromised) and **sign-in risk** (this sign-in is suspicious). Remediates with risk-based Conditional Access."],"traps":["Leaked credentials = user risk. Anonymous IP or atypical travel = sign-in risk.","PIM activates roles. Access reviews recertify them."],"hooks":["PIM = admin only when needed."],"topics":["Identity governance"],"qtopics":["Identity governance"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-identity-protection-governance-capabilities/","modTitle":"Describe the identity protection and governance capabilities of Microsoft Entra","units":[]},{"id":"s7","d":3,"title":"Core infrastructure security in Azure","label":"High","note":"Overlaps with AZ-900 Domain 2. Know which service does which job.","why":"","obj":["Azure DDoS Protection","Azure Firewall","Web Application Firewall (WAF)","network segmentation with Azure virtual networks","network security groups (NSGs)","Azure Bastion","Azure Key Vault"],"cold":["**DDoS Protection:** keeps apps available during traffic floods. Network Protection (per VNet) or IP Protection (per public IP).","**Azure Firewall:** managed, stateful, central firewall. Filters by IP, port and FQDN.","**WAF:** protects web apps from SQL injection and cross-site scripting. On Application Gateway or Front Door.","**VNets** isolate. **Subnets** segment inside a VNet.","**NSG:** allow and deny rules by priority on a subnet or network interface.","**Bastion:** RDP and SSH from the portal over TLS. No public IP on the VM.","**Key Vault:** secrets, keys, certificates."],"traps":["NSG cannot filter by domain name. Azure Firewall can.","WAF is for web apps (layer 7). Azure Firewall is for network traffic.","Just-in-time VM access is Defender for Cloud, not Bastion."],"hooks":["Bastion = the safe gate to your VMs."],"topics":["Azure infrastructure security"],"qtopics":["Azure infrastructure security"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/","modTitle":"Describe core infrastructure security services in Azure","units":[],"models":["vnet"]},{"id":"s8","d":3,"title":"Microsoft Defender for Cloud","label":"High","note":"Posture (CSPM) vs protection (workload plans).","why":"","obj":["Microsoft Defender for Cloud","Cloud Security Posture Management (CSPM)","security policies, standards, and recommendations","enhanced security features provided by cloud workload protection"],"cold":["**Defender for Cloud:** CNAPP covering Azure, AWS, GCP and on-premises.","**CSPM:** finds misconfigurations, gives recommendations. **Foundational CSPM is free.** Defender CSPM is paid.","**Secure score:** higher is better.","**Microsoft cloud security benchmark** is the default standard. Standards are built on Azure Policy.","**Workload protection:** paid Defender plans (Servers, Storage, Containers, Databases and more) that raise security alerts.","**JIT VM access:** opens management ports only on request, for a limited time."],"traps":["Secure score is Defender. Compliance score is Purview.","Defender for Cloud is not Defender for Cloud Apps."],"hooks":["Posture = how well set up. Protection = catching attacks."],"topics":["Defender for Cloud"],"qtopics":["Defender for Cloud"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/","modTitle":"Describe the security management capabilities in Azure","units":[]},{"id":"s9","d":3,"title":"Microsoft Sentinel","label":"Medium","note":"Know SIEM vs SOAR and which Sentinel feature does what.","why":"","obj":["security information and event management (SIEM) and security orchestration automated response (SOAR)","threat detection and mitigation capabilities in Microsoft Sentinel"],"cold":["**SIEM** collects and correlates. **SOAR** automates response. **Sentinel is both**, cloud-native.","**Collect** (data connectors), **Detect** (analytics rules), **Investigate** (incidents, hunting), **Respond** (playbooks).","**Playbooks** are built on Azure Logic Apps.","**Workbooks** are dashboards.","Sentinel now lives in the **Microsoft Defender portal**."],"traps":["Workbook shows. Playbook acts.","Sentinel is not a CASB and not an endpoint tool."],"hooks":["Collect, Detect, Investigate, Respond."],"topics":["Microsoft Sentinel"],"qtopics":["Microsoft Sentinel"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/","modTitle":"Describe security capabilities of Microsoft Sentinel","units":[]},{"id":"s10","d":3,"title":"Threat protection with Microsoft Defender XDR","label":"High","note":"The largest group in the largest domain. One job per Defender service.","why":"","obj":["Microsoft Defender XDR services","Microsoft Defender for Office 365","Microsoft Defender for Endpoint","Microsoft Defender for Cloud Apps","Microsoft Defender for Identity","Microsoft Defender Vulnerability Management","Microsoft Threat Intelligence","Microsoft Defender portal"],"cold":["**Defender XDR:** joins signals across endpoints, identities, email and apps into one incident.","**Defender for Office 365:** email and collaboration. Phishing, Safe Links, Safe Attachments.","**Defender for Endpoint:** devices. EDR.","**Defender for Cloud Apps:** CASB. Shadow IT and SaaS control.","**Defender for Identity:** on-premises Active Directory signals.","**Defender Vulnerability Management:** find and prioritize weaknesses.","**Defender Threat Intelligence:** who the attackers are and how they work.","**Defender portal:** security.microsoft.com."],"traps":["Defender for Identity = on-premises AD. Entra ID Protection = cloud identities.","Defender for Cloud Apps (SaaS) is not Defender for Cloud (Azure workloads)."],"hooks":["Office = email. Endpoint = device. Identity = AD. Cloud Apps = SaaS."],"topics":["Defender XDR"],"qtopics":["Defender XDR"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/","modTitle":"Describe threat protection with Microsoft Defender XDR","units":[],"models":["xdr"]},{"id":"s11","d":4,"title":"Service Trust Portal and privacy principles","label":"Medium","note":"Short stop. Memorize the six principles.","why":"","obj":["Service Trust Portal offerings","privacy principles of Microsoft"],"cold":["**Service Trust Portal:** Microsoft's audit reports, certifications and compliance guides. My Library saves documents.","**Six privacy principles:** control, transparency, security, strong legal protections, no content-based targeting, benefits to you."],"traps":["The Service Trust Portal shows Microsoft's compliance, not yours.","Transparency = Microsoft tells you. Control = you decide."],"hooks":["Microsoft runs on trust."],"topics":["Trust and privacy"],"qtopics":["Trust and privacy"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/","modTitle":"Describe Microsoft's Service Trust portal and privacy principles","units":[]},{"id":"s12","d":4,"title":"Compliance management in Microsoft Purview","label":"Medium","note":"Compliance Manager and its score.","why":"","obj":["Microsoft Purview portal","Compliance Manager","uses and benefits of compliance score"],"cold":["**Purview portal:** purview.microsoft.com.","**Compliance Manager:** assessments from regulation templates, improvement actions, compliance score.","**Controls:** Microsoft-managed, your controls, shared.","**Compliance score:** risk-based progress on improvement actions. Not a guarantee of compliance."],"traps":["Compliance score is not secure score.","A high score is not a certificate."],"hooks":["Compliance Manager = your to-do list for regulations."],"topics":["Compliance management"],"qtopics":["Compliance management"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/","modTitle":"Describe the data compliance solutions of Microsoft Purview","units":[]},{"id":"s13","d":4,"title":"Information protection and data lifecycle","label":"High","note":"Sensitivity labels, DLP and retention are asked from many angles.","why":"","obj":["data classification capabilities","Content explorer and Activity explorer","sensitivity labels and sensitivity label policies","data loss prevention (DLP)","records management","retention policies, retention labels, and retention label policies"],"cold":["**Classification:** sensitive information types (patterns) and trainable classifiers (learned from examples).","**Content explorer** = what exists and where. **Activity explorer** = what was done to it.","**Sensitivity labels:** persistent, can encrypt and mark content. One per item. Published with label policies.","**DLP:** stops sensitive data leaving through email, Teams, SharePoint, OneDrive and devices.","**Retention policy** = whole location. **Retention label** = one item. One retention label per item.","**Records management:** lock important items and review before disposal."],"traps":["Sensitivity label protects. Retention label keeps or deletes.","Content explorer vs Activity explorer."],"hooks":["Know, Protect, Prevent, Govern."],"topics":["Information protection"],"qtopics":["Information protection"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/","modTitle":"Describe the data security solutions of Microsoft Purview","units":[]},{"id":"s14","d":4,"title":"Insider risk, eDiscovery and audit","label":"Medium","note":"Three tools for investigations.","why":"","obj":["insider risk management","eDiscovery solutions in Microsoft Purview","audit solutions in Microsoft Purview"],"cold":["**Insider Risk Management:** risky activity by insiders. Usernames pseudonymized by default.","**eDiscovery:** find, hold and export content as legal evidence.","**Audit (Standard):** on by default, 180 days.","**Audit (Premium):** one year by default for core services, up to 10 years with an add-on, retention policies."],"traps":["eDiscovery hold is for a legal case. Retention policy is general.","Audit answers 'who did what, when'."],"hooks":["Insider = people. eDiscovery = evidence. Audit = activity."],"topics":["Insider risk, eDiscovery, audit"],"qtopics":["Insider risk, eDiscovery, audit"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/","modTitle":"Describe the data compliance solutions of Microsoft Purview","units":[]}],"duels":[{"id":"d001","d":1,"a":"Encryption","b":"Hashing","clue":"One-way. Cannot be reversed to get the original.","ans":1,"why":"Hashing is one-way and fixed-length. Encryption can be reversed with the right key.","miss":false},{"id":"d002","d":1,"a":"Symmetric encryption","b":"Asymmetric encryption","clue":"Uses a public and private key pair.","ans":1,"why":"Asymmetric uses a key pair. Symmetric uses one shared key.","miss":false},{"id":"d003","d":1,"a":"Data residency","b":"Data sovereignty","clue":"Data falls under the laws of the country where it is held.","ans":1,"why":"Sovereignty is about which laws apply. Residency is about where data may physically be stored.","miss":false},{"id":"d004","d":1,"a":"Verify explicitly","b":"Assume breach","clue":"Segment access and monitor so an intruder cannot spread.","ans":1,"why":"Assume breach minimizes blast radius. Verify explicitly checks every request on all available signals.","miss":false},{"id":"d005","d":1,"a":"Authentication","b":"Authorization","clue":"Decides what you are allowed to do.","ans":1,"why":"Authorization grants access levels. Authentication proves identity.","miss":false},{"id":"d006","d":1,"a":"Active Directory Domain Services","b":"Microsoft Entra ID","clue":"Cloud identity provider built for modern authentication.","ans":1,"why":"Entra ID is cloud-based. AD DS is the on-premises directory.","miss":false},{"id":"d007","d":1,"a":"Single sign-on","b":"Federation","clue":"A trust between identity providers of different organizations.","ans":1,"why":"Federation is the trust. SSO is the one-sign-in experience it can enable.","miss":false},{"id":"d008","d":2,"a":"System-assigned managed identity","b":"User-assigned managed identity","clue":"Deleted automatically when its one resource is deleted.","ans":0,"why":"System-assigned shares the lifecycle of one resource. User-assigned is standalone.","miss":false},{"id":"d009","d":2,"a":"Microsoft Entra registered","b":"Microsoft Entra joined","clue":"Organization-owned device signed in with a work account.","ans":1,"why":"Joined is for organization-owned devices. Registered is for personal devices.","miss":false},{"id":"d010","d":2,"a":"Password hash synchronization","b":"Pass-through authentication","clue":"Password is validated by an on-premises agent. Nothing stored in the cloud.","ans":1,"why":"Pass-through validates on-premises. Password hash sync stores a hash of the hash in Entra.","miss":false},{"id":"d011","d":2,"a":"Global banned password list","b":"Custom banned password list","clue":"You add your own company and product names.","ans":1,"why":"Custom holds your terms. Global is maintained by Microsoft.","miss":false},{"id":"d012","d":2,"a":"Security defaults","b":"Conditional Access","clue":"Free baseline that turns on MFA for everyone with no policy design.","ans":0,"why":"Security defaults are preset and free. Conditional Access gives granular if-then policies and needs a premium license.","miss":false},{"id":"d013","d":2,"a":"Something you have","b":"Something you are","clue":"A fingerprint or face scan.","ans":1,"why":"Biometrics are something you are. Phones and keys are something you have.","miss":false},{"id":"d014","d":2,"a":"Microsoft Entra roles","b":"Azure roles","clue":"Owner, Contributor and Reader on a resource group.","ans":1,"why":"Those are Azure RBAC roles for Azure resources. Entra roles manage directory objects.","miss":false},{"id":"d015","d":2,"a":"Signal","b":"Decision","clue":"Block access, or grant access with MFA.","ans":1,"why":"Block and grant are decisions. Signals are the inputs such as user, location and risk.","miss":false},{"id":"d016","d":2,"a":"Microsoft Entra Internet Access","b":"Microsoft Entra Private Access","clue":"Reach internal company apps without a traditional VPN.","ans":1,"why":"Private Access is for private apps. Internet Access secures internet and SaaS traffic.","miss":false},{"id":"d017","d":2,"a":"Privileged Identity Management","b":"Access reviews","clue":"Activate an admin role for two hours with approval.","ans":0,"why":"PIM handles just-in-time activation. Access reviews recertify existing access.","miss":false},{"id":"d018","d":2,"a":"User risk","b":"Sign-in risk","clue":"Atypical travel detected on one sign-in.","ans":1,"why":"Atypical travel relates to a specific sign-in. User risk is about the identity being compromised.","miss":false},{"id":"d019","d":2,"a":"Microsoft Entra ID Protection","b":"Microsoft Entra ID Governance","clue":"Detects leaked credentials and risky sign-ins.","ans":0,"why":"ID Protection detects and remediates risk. ID Governance manages who has access and for how long.","miss":false},{"id":"d020","d":3,"a":"Azure Firewall","b":"Network security group","clue":"Managed stateful firewall, central, can filter by FQDN.","ans":0,"why":"Azure Firewall is the central, fully featured firewall. NSGs are basic allow and deny rules on subnets or NICs.","miss":false},{"id":"d021","d":3,"a":"Azure Firewall","b":"Web Application Firewall","clue":"Stops SQL injection and cross-site scripting.","ans":1,"why":"WAF protects web apps at layer 7. Azure Firewall filters network traffic generally.","miss":false},{"id":"d022","d":3,"a":"Azure Bastion","b":"Azure Key Vault","clue":"Secure RDP and SSH from the portal.","ans":0,"why":"Bastion is remote access. Key Vault stores secrets, keys and certificates.","miss":false},{"id":"d023","d":3,"a":"DDoS Network Protection","b":"DDoS IP Protection","clue":"Billed per protected public IP address.","ans":1,"why":"IP Protection is per public IP. Network Protection covers a virtual network.","miss":false},{"id":"d024","d":3,"a":"CSPM","b":"Cloud workload protection","clue":"Finds misconfigurations and gives hardening recommendations.","ans":0,"why":"CSPM is posture. Workload protection detects active threats on specific workloads.","miss":false},{"id":"d025","d":3,"a":"Secure score","b":"Compliance score","clue":"Shown in Microsoft Defender for Cloud.","ans":0,"why":"Secure score is Defender for Cloud. Compliance score is Purview Compliance Manager.","miss":false},{"id":"d026","d":3,"a":"Foundational CSPM","b":"Defender CSPM","clue":"Paid. Adds attack path analysis.","ans":1,"why":"Defender CSPM is the paid plan with attack paths and agentless scanning.","miss":false},{"id":"d027","d":3,"a":"SIEM","b":"SOAR","clue":"Automates response workflows.","ans":1,"why":"SOAR automates the response. SIEM collects and correlates logs.","miss":false},{"id":"d028","d":3,"a":"Workbook","b":"Playbook","clue":"Runs an automated response built on Logic Apps.","ans":1,"why":"Playbooks act. Workbooks display data.","miss":false},{"id":"d029","d":3,"a":"Microsoft Sentinel","b":"Microsoft Defender for Cloud","clue":"Cloud-native SIEM and SOAR.","ans":0,"why":"Sentinel is the SIEM/SOAR. Defender for Cloud is posture management and workload protection.","miss":false},{"id":"d030","d":3,"a":"Microsoft Defender for Cloud","b":"Microsoft Defender for Cloud Apps","clue":"Cloud access security broker for SaaS apps.","ans":1,"why":"Cloud Apps is the CASB. Defender for Cloud is CSPM and workload protection for Azure, AWS and GCP.","miss":false},{"id":"d031","d":3,"a":"Microsoft Defender for Identity","b":"Microsoft Entra ID Protection","clue":"Monitors on-premises Active Directory signals.","ans":0,"why":"Defender for Identity watches on-premises AD. ID Protection covers Entra cloud identities.","miss":false},{"id":"d032","d":3,"a":"Microsoft Defender for Endpoint","b":"Microsoft Defender for Office 365","clue":"Safe Links and Safe Attachments.","ans":1,"why":"Those are Defender for Office 365 features for email and collaboration.","miss":false},{"id":"d033","d":3,"a":"Microsoft Defender Vulnerability Management","b":"Microsoft Defender Threat Intelligence","clue":"Threat actor profiles and indicators of compromise.","ans":1,"why":"Threat Intelligence describes attackers. Vulnerability Management finds weaknesses in your own assets.","miss":false},{"id":"d034","d":4,"a":"Service Trust Portal","b":"Microsoft Purview portal","clue":"Download Microsoft's ISO and SOC audit reports.","ans":0,"why":"The Service Trust Portal holds Microsoft's audit reports. The Purview portal is where you manage your own compliance.","miss":false},{"id":"d035","d":4,"a":"Control","b":"Transparency","clue":"Microsoft is open about what it collects and why.","ans":1,"why":"Transparency is openness. Control is your ability to manage the data.","miss":false},{"id":"d036","d":4,"a":"Security","b":"No content-based targeting","clue":"Your files and email are not used for ads.","ans":1,"why":"That is no content-based targeting. Security is protecting data with strong safeguards and encryption.","miss":false},{"id":"d037","d":4,"a":"Compliance score","b":"Secure score","clue":"Progress toward meeting regulations such as GDPR.","ans":0,"why":"Compliance score is about regulations. Secure score is about security posture.","miss":false},{"id":"d038","d":4,"a":"Microsoft-managed control","b":"Your control","clue":"You implement it yourself.","ans":1,"why":"Your controls are customer-managed. Microsoft-managed are done by Microsoft.","miss":false},{"id":"d039","d":4,"a":"Compliance Manager","b":"Service Trust Portal","clue":"Tracks your own improvement actions.","ans":0,"why":"Compliance Manager manages your compliance. The Service Trust Portal shows Microsoft's evidence.","miss":false},{"id":"d040","d":4,"a":"Sensitivity label","b":"Retention label","clue":"Controls how long content is kept before deletion.","ans":1,"why":"Retention labels govern lifetime. Sensitivity labels classify and protect.","miss":false},{"id":"d041","d":4,"a":"Content explorer","b":"Activity explorer","clue":"History of what users did with labeled files.","ans":1,"why":"Activity explorer is the history. Content explorer is the current inventory.","miss":false},{"id":"d042","d":4,"a":"Retention policy","b":"Retention label","clue":"Applies at item level, such as one document.","ans":1,"why":"Labels are per item. Policies cover a whole location.","miss":false},{"id":"d043","d":4,"a":"Sensitive information types","b":"Trainable classifiers","clue":"Pattern matching, such as a credit card number format.","ans":0,"why":"Sensitive information types use patterns. Trainable classifiers learn from examples.","miss":false},{"id":"d044","d":4,"a":"Audit (Standard)","b":"Audit (Premium)","clue":"Keeps records up to 10 years with an add-on license.","ans":1,"why":"Premium extends retention. Standard is 180 days.","miss":false},{"id":"d045","d":4,"a":"eDiscovery","b":"Insider Risk Management","clue":"Find and export evidence for a legal case.","ans":0,"why":"eDiscovery is for legal evidence. Insider Risk Management detects risky user activity.","miss":false},{"id":"d046","d":4,"a":"eDiscovery hold","b":"Retention policy","clue":"Preserves content tied to a specific legal case.","ans":0,"why":"Holds are case-based. Retention policies apply broadly for compliance.","miss":false}]}}}</script>

/* ---------- sources + helpers for Learn links ---------- */
function secOfQ(q){if(q.sec)return secBy(q.sec);return SECS.find(function(s){return s.d===q.d&&s.qtopics.indexOf(q.topic)>=0})}
function secOfCard(c){return SECS.find(function(s){return s.d===c.d&&s.topics.indexOf(c.topic)>=0})}
function learnFor(x){if(x.u)return x.u;var s=x.front?secOfCard(x):secOfQ(x);return s?s.mod:null}
function lnk(u,t){return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--acc);font-weight:800">'+t+' \u2197</a>':''}
/* ---------- derived ---------- */
function cs(id){return state.cards[id]||null}
function mastered(id){var c=cs(id);return !!c&&c.b>=3}
function isDue(id){var c=cs(id);return !c||c.due<=Date.now()}
function qWeak(q){var s=state.q[q.id];return (q.miss&&!(s&&s.c>=2&&s.c>s.w))||(s&&s.w>s.c)}
function cWeak(c){var s=cs(c.id);return (c.miss&&!mastered(c.id))||(s&&s.b<=1)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function secBy(id){return SECS.find(function(s){return s.id===id})}
function inScope(x,scope,kind){
  if(scope==='all')return true;
  if(scope==='weak')return kind==='c'?cWeak(x):kind==='q'?qWeak(x):(x.miss||(state.du[x.id]&&state.du[x.id].w>state.du[x.id].c));
  if(scope[0]==='d')return x.d===parseInt(scope.slice(1),10);
  if(scope.slice(0,4)==='sec:'){var s=secBy(scope.slice(4));if(!s)return false;
    if(kind==='c')return s.topics.indexOf(x.topic)>=0&&x.d===s.d;if(kind==='q')return s.qtopics.indexOf(x.topic)>=0&&x.d===s.d;return false}
  return true}
function secCards(s){return CARDS.filter(function(c){return s.topics.indexOf(c.topic)>=0&&c.d===s.d})}
function secQs(s){return QS.filter(function(q){return s.qtopics.indexOf(q.topic)>=0&&q.d===s.d})}
function secStars(s){var cs_=secCards(s),m=cs_.filter(function(c){return mastered(c.id)}).length;var r=0,w=0;secQs(s).forEach(function(q){var t=state.q[q.id];if(t){r+=t.c||0;w+=t.w||0}});
  return {read:!!state.read[s.id],cards:cs_.length?m/cs_.length:0,acc:(r+w)>=5?r/(r+w):null,n:r+w,weak:cs_.some(function(c){return c.miss&&!mastered(c.id)})}}
function stars(s){var t=secStars(s);var a=[t.read,t.cards>=.6,t.acc!==null&&t.acc>=.8];return a.map(function(x){return '<span class="'+(x?'on':'off')+'">★</span>'}).join('')}
function dueCount(){return CARDS.filter(function(c){return cs(c.id)&&isDue(c.id)}).length}
function newCount(){return CARDS.filter(function(c){return !cs(c.id)}).length}

function bubbleMsg(){var d=dueCount(),h=new Date().getHours(),n=state.stats.cards+state.stats.quizRight;
  if(!n)return 'Hi! I am Nimbo. '+(BASE?'Your latest Microsoft practice test was '+(lastMs()||BASE.pct)+'%. Let\u2019s fix the exact mix-ups that cost you points. ':'Welcome back. ')+'Start with a quick duel!';

  var t=e.target.closest('[data-tab]');if(t){SFX.tap();leave();go(t.dataset.tab);return}
  var lay=e.target.closest('#pLayout');if(lay){state.layout=state.layout===''?'desktop':state.layout==='desktop'?'phone':'';applyTheme();save();render();return}
  var snd=e.target.closest('#pSound');if(snd){state.mute=!state.mute;if(!state.mute){SFX.good();buzz(12)}save();header();return}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.dataset.act,p=a.split(':');if(['opt','rate','flip','duelpick','qnext','duelnext'].indexOf(p[0])<0)SFX.tap();
  var rerender=true;DBG.cl='act='+a+' '+new Date().toLocaleTimeString();
  try{switch(p[0]){
   case 'cscope':cf.scope=p[1];break;
   case 'm3':M3.sel[p[1]]=M3.sel[p[1]]===p[2]?'':p[2];break;
   case 'm3rot':M3.rz+=parseInt(p[1],10);break;
   case 'm3ex':M3.ex=!M3.ex;break;
   case 'pscope':pf.scope=p[1];break;
   case 'cards-go':cf.size=parseInt($('#cSize').value,10)||10;startCards(cf.scope,cf.size);break;
   case 'cards-again':startCards(S.scope||cf.scope,cf.size);break;
   case 'cards-due':tab='cards';startCards('all',15);break;
   case 'cards':if(p[1]==='sec'||p[1]==='weak'){var sc=p[1]==='weak'?'weak':'sec:'+p[2];cf.scope=sc;startCards(sc,cf.size);if(S)S.scope=sc}break;
   case 'flip':if(S&&S.type==='cards'){var ri=$('#recallIn');if(ri){S.typed=S.typed||{};S.typed[S.q[S.i]]=ri.value}SFX.flip();S.flip=!S.flip;S.flipAnim=true;if(S.flip)S.seen=true}break;
   case 'rate':rateCard(p[1]);break;
   case 'quiz-go':startQuiz(pf.scope);if(S)S.scope=pf.scope;break;
   case 'quiz-again':var sc2=S.scope||pf.scope;if(sc2==='ai'){startAIDrill();rerender=false;break}startQuiz(sc2);if(S)S.scope=sc2;break;
   case 'quiz':if(p[1]==='weak'){startQuiz('weak');if(S)S.scope='weak'}else{startQuiz('sec:'+p[2]);if(S)S.scope='sec:'+p[2]}break;
   case 'duel':startDuelSel('weak');break;
   case 'duel-go':startDuelSel(pf.scope);break;
   case 'duel-again':var sc3=S.scope||pf.scope,rv3=S.r||0;leave();startDuel(sc3,rv3);break;
   case 'duel-rivals':var sc5=S.scope||pf.scope;leave();startDuelSel(sc5);break;
   case 'duelpick':pickDuel(parseInt(p[1],10));break;
   case 'duelnext':S.i++;S.pick=null;if(S.r){if(S.me<=0||S.rhp<=0||S.i>=S.items.length)endDuel();else S.dl=Date.now()+RIVALS[S.r].sec*1000}break;
   case 'rival':var sc4=S&&S.scope||pf.scope;leave();startDuel(sc4,parseInt(p[1],10));break;
   case 'boss':startBoss(parseInt(p[1],10),parseInt(p[2],10)||2);break;
   case 'mock':startMock(p[1]!=='quick',p[1]==='hard');break;
   case 'mock-resume':if(!resumeMock()){toast('Nothing to resume');}break;
   case 'mock-discard':state.mockSave=false;save();toast('Paused exam discarded');break;
   case 'tog':state[p[1]]=!state[p[1]];save();toast((p[1]==='recallQ'?'Recall first ':'Type before flipping ')+(state[p[1]]?'on':'off'));break;
   case 'review-all':S.review=true;break;
   case 'review-back':S.review=false;break;
   case 'opt':var di=parseInt(p[1],10),it=S.items[S.i],need=it.q.ans.length;
     if(S.chk)break;
     if(need>1){var k=S.sel.indexOf(di);if(k>=0)S.sel.splice(k,1);else{if(S.sel.length>=need)S.sel.shift();S.sel.push(di)}}else S.sel=[di];
     if(S.type!=='mock'&&S.sel.length===need){checkAnswer();rerender=true}if(S.type==='mock')mockAnswerSave();break;
   case 'qcheck':var cit2=S.items[S.i];if(cmp(cit2.q)&&!isDone(cit2,S.sel)){toast('Answer every row first');rerender=false;break}checkAnswer();break;
   case 'cell':if(S.chk)break;S.sel[parseInt(p[1],10)]=parseInt(p[2],10);if(S.type==='mock')mockAnswerSave();break;
   case 'reveal':S.shown[S.i]=true;break;
   case 'qnext':nextQ();break;
   case 'flag':S.flag[S.i]=!S.flag[S.i];mockAnswerSave();break;
   case 'mnext':mockAnswerSave();if(S.i+1<S.items.length){S.i++;S.sel=(S.ans[S.i]||[]).slice()}else{S.i=0;S.sel=(S.ans[0]||[]).slice();toast('Use the grid to revisit flagged or blank questions')}break;
   case 'mprev':mockAnswerSave();S.i--;S.sel=(S.ans[S.i]||[]).slice();break;
   case 'mjump':mockAnswerSave();S.i=parseInt(p[1],10);S.sel=(S.ans[S.i]||[]).slice();break;
   case 'mfinish':var un=S.items.filter(function(it,i){var a=i===S.i?S.sel:S.ans[i];return !isDone(it,a)}).length;if(un&&!S.warned){S.warned=1;toast(un+' unanswered. Tap finish again to submit.');rerender=false;break}finishMock();break;
   case 'drill-missed':var seenId={},ids=[];S.missed.forEach(function(q){var sc=secOfQ(q);if(sc)secCards(sc).forEach(function(c){if(!seenId[c.id]){seenId[c.id]=1;ids.push(c.id)}})});
     leave();if(!ids.length){toast('No matching cards');break}S={type:'cards',q:shuffle(ids).slice(0,15),i:0,flip:false,n:{again:0,hard:0,good:0,easy:0},xp:0,rq:{}};break;
   case 'quit':if(S&&S.type==='mock'&&!S.done){mockAnswerSave();toast('Exam paused. Resume it from Home or Play.')}leave();break;
   case 'chat-all':startChat({kind:'all'});rerender=false;break;
   case 'chat-sec':startChat({kind:'sec',s:secBy(p[1])});rerender=false;break;
   case 'chat-q':var cit=S.items[S.i],cq=cit.q;startChat({kind:'q',q:cq},'I answered this practice question: "'+cq.q+'" '+(cmp(cq)?optsTxt(cq)+'. ':'')+'My answer: '+mineTxt(cit,S.sel)+' ('+(S.lastOk?'right':'wrong')+'). Correct answer: '+corrTxt(cq)+'. Explain it a different way than the official explanation, tell me why my pick was tempting if I was wrong, and give me one memory trick.','Explain this question differently');rerender=false;break;
   case 'chat-card':var ccd=CARDS.find(function(x){return x.id===S.q[S.i]});startChat({kind:'card',c:ccd},'Explain this flashcard simply with a real-world example, then ask me one quick check question. Card: "'+ccd.front+'" Answer: '+ccd.back,'Explain this card');rerender=false;break;
   case 'chat-duel':var dd=S.items[S.i].x;startChat({kind:'duel',x:dd},'Explain the difference between "'+dd.a+'" and "'+dd.b+'" in simple terms, with one example of when to pick each, and a trick to tell them apart on the exam.','Explain the difference');rerender=false;break;
   case 'chat-miss':var ms=S.missed.slice(0,8).map(function(q){return '- '+q.q+(cmp(q)?' '+optsTxt(q):'')+' (correct: '+corrTxt(q)+')'}).join('\n');startChat({kind:'all'},'I just finished a mock exam and missed these:\n'+ms+'\nFind the pattern in what I got wrong and give me a 3-step plan to fix it before my next attempt.','Coach me on my misses');rerender=false;break;
   case 'chat-chip':var ch=C.chips[parseInt(p[1],10)];C.chips=[];chatSend(ch);rerender=false;break;
   case 'chat-stop':if(C&&C.ctl)C.ctl.abort();rerender=false;break;
   case 'chat-retry':C.err='';chatAsk();rerender=false;break;
   case 'chat-exit':if(C&&C.ctl&&C.busy)C.ctl.abort();C=null;break;
   case 'ai-drill':startAIDrill();rerender=false;break;
   case 'ai-cancel':if(AICTL)AICTL.abort();S=null;break;
   case 'open':leave();go('learn/'+p[1]);return;
   case 'sec':leave();go('learn/'+p[1]);return;
   case 'back-learn':go('learn');return;
   case 'read':if(!state.read[p[1]]){state.read[p[1]]=today();award(30);toast('Section read! +30 XP');after()}break;
   case 'dl-cards':download(META.code+'_cards.csv',csv([['Front','Back','Domain','Topic']].concat(CARDS.map(function(c){return [c.front,c.back,'D'+c.d,c.topic]}))));rerender=false;break;
   case 'dl-prog':syncSlice();download('nimbus_progress_'+today()+'.json',JSON.stringify(state,null,1));rerender=false;break;
   case 'restore':var rin=$('#restoreIn');if(rin)rin.click();rerender=false;break;
   case 'restore-yes':var bk=window.__restore;window.__restore=null;if(bk){state=fresh();merge(bk);applyTheme();save();toast('Backup restored')}break;
   case 'restore-no':window.__restore=null;break;
   case 'sum':var sb=$('#sumBox');sb.hidden=false;sb.value=summary();sb.select();try{var cp=navigator.clipboard.writeText(sb.value);if(cp&&cp.catch)cp.catch(function(){})}catch(x){}rerender=false;break;
   case 'layout':state.layout=p[1]==='auto'?'':p[1];applyTheme();save();break;
   case 'dismiss-err':DBG.err='';break;
   case 'campmap':var keep=S&&S.type==='camp';if(!keep)leave();S={type:'camp',view:'map'};break;
   case 'camp':S=null;startCamp(parseInt(p[1],10));break;
   case 'cplay':campPlay(parseInt(p[1],10));break;
   case 'canswer':campAnswer(parseInt(p[1],10));break;
   case 'ccont':campContinue();break;
   case 'cend':campEndTurn();break;
   case 'cview':var mw0=S&&S.mw;if(!S||S.type!=='camp')leave();S={type:'camp',view:p[1],mw:mw0};break;
   case 'buy':campBuy(p[1],p[2]);break;
   case 'ltog':loadoutToggle(p[1]);break;
   case 'endless':if(!modesOpen()){toast('Clear World 1 to unlock');break}if(!S||S.type!=='camp')leave();startEndless();break;
   case 'daily':if(!S||S.type!=='camp')leave();startDaily();break;
   case 'edraft':if(S&&S.mode==='endless'&&S.over&&S.won)endlessPick(p[1],p[2]);break;
   case 'clane':if(S&&S.type==='camp')S.lane=parseInt(p[1],10);break;
   case 'cworld':if(S&&S.type==='camp')S.mw=parseInt(p[1],10);break;
   case 'go':leave();go(p[1]);return;
   case 'certs':leave();go('certs');return;
   case 'cert':leave();if(switchCert(p[1])){save();toast('Switched to '+META.code);go('home');return}break;
   case 'locked':toast('That content pack is not built yet');rerender=false;break;
   case 'synctest':syncTest();rerender=false;break;
   case 'theme':state.theme=state.theme===''?'dark':state.theme==='dark'?'light':'';applyTheme();save();break;
   case 'reset':window.__rs=true;break;
   case 'reset-no':window.__rs=false;break;
   case 'reset-yes':var th=state.theme;state=fresh();usePack('az900');state.theme=th;window.__rs=false;save();toast('Progress cleared');break;
   default:if(p[0]==='sec'){}
  }}catch(err){DBG.err=a+': '+String(err&&err.message||err);rerender=true;try{S&&0;}catch(x){}}
  if(a.indexOf('sec:')===0&&p[0]==='sec'){}
  if(rerender){render();if(p[0]!=='opt'&&p[0]!=='flip'&&p[0]!=='cscope'&&p[0]!=='pscope')window.scrollTo(0,0)}
});
document.addEventListener('submit',function(e){if(e.target.id==='chatForm'){e.preventDefault();var ta=$('#chatIn');if(ta&&ta.value.trim()){var v=ta.value;chatSend(v)}}});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='recallIn'&&e.key==='Enter'){e.preventDefault();var fb=document.querySelector('.fc3');if(fb)fb.click();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;var t=e.target,tn=t&&t.tagName;if(tn==='TEXTAREA'||tn==='INPUT'||tn==='SELECT')return;
  var k=e.key;if((tn==='BUTTON'||tn==='A')&&(k==='Enter'||k===' '))return;
  var q=function(sel){var n=document.querySelector(sel);if(n&&!n.disabled){e.preventDefault();n.click();return true}return false};
  if(C){if(k==='Escape')q('[data-act=chat-exit]');return}
  if(!S){var ti=['1','2','3','4','5'].indexOf(k);if(ti>=0)q('nav [data-tab="'+TABS[ti][0]+'"]');return}
  if(k==='Escape'){q('[data-act=quit]');return}
  var lk=k.toLowerCase();
  if(S.type==='cards'){if((k===' '||k==='Enter'||k==='b'||k==='B')&&S.i<S.q.length&&document.activeElement.tagName!=='BUTTON')q('.fc[data-act=flip]');else if(S.seen&&S.i<S.q.length){if(k==='1')q('[data-act="rate:again"]');else if(k==='2')q('[data-act="rate:hard"]');else if(k==='3')q('[data-act="rate:good"]');else if(k==='4')q('[data-act="rate:easy"]')}return}
  if(S.type==='camp'&&S.view==='battle'){if(S.chk){if(S.chk.done){if(k==='Enter'||k===' ')q('[data-act=ccont]')}else{var ai='abcd'.indexOf(k.toLowerCase());if(ai<0)ai='1234'.indexOf(k);if(ai>=0)q('[data-act="canswer:'+ai+'"]')}}else if('12345'.indexOf(k)>=0)q('[data-act="cplay:'+(parseInt(k,10)-1)+'"]');else if(k===' '||k==='e'||k==='E')q('[data-act=cend]');e.preventDefault();return}
  if(S.type==='duel'){if(k==='1'||k==='ArrowLeft')q('[data-act="duelpick:0"]');else if(k==='2'||k==='ArrowRight')q('[data-act="duelpick:1"]');else if(k==='Enter'||k===' ')q('[data-act=duelnext]');return}
  if(S.type==='mock'&&!S.done){var mi='abcdef'.indexOf(lk);if(mi<0&&/^[1-6]$/.test(k))mi=parseInt(k,10)-1;if(mi>=0)q('[data-act="opt:'+mi+'"]');else if(k==='ArrowRight'||k==='Enter')q('[data-act=mnext]');else if(k==='ArrowLeft')q('[data-act=mprev]');else if(lk==='f')q('[data-act=flag]');return}
  if(S.items&&!S.done){var oi='abcdef'.indexOf(lk);if(oi<0&&/^[1-6]$/.test(k))oi=parseInt(k,10)-1;if(oi>=0)q('[data-act="opt:'+oi+'"]');else if(k==='Enter'||k===' '||lk==='n')q('[data-act=qnext]')}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.fc')){e.preventDefault();e.target.click()}});
window.addEventListener('beforeunload',function(){leave()});
route();boot();
})();
</script>
