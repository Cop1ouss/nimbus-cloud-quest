tform-service"},{"t":"SaaS","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service"}]},{"id":"s4","d":2,"title":"Core architectural components","label":"High","note":"7 official objectives","why":"The first and most visible objective in Domain 2, and the hierarchy shows up again in Domain 3 (Policy, RBAC, locks, cost tags all apply at these scopes). Learn it once, use it everywhere.","obj":["Azure regions, region pairs, sovereign regions","Availability zones","Azure datacenters","Azure resources and resource groups","Subscriptions","Management groups","The hierarchy of resource groups, subscriptions and management groups"],"cold":["Geography → region → availability zone → datacenter","Region pair = same geography, at least 300 miles apart; Brazil South is the one-way exception","Zonal vs zone-redundant vs non-regional services","Hierarchy: Tenant Root Group → management groups → subscriptions → resource groups → resources","Resource group rules: one group per resource, no nesting, no renaming, delete group = delete contents","Subscription = billing boundary + access control boundary","Management groups: 6 levels deep, 10,000 per directory, one parent"],"traps":["Mixing up availability zones (inside a region) with region pairs (two regions)","Thinking a resource can be in two resource groups","Forgetting that group settings apply to current and future resources (module quiz miss)"],"hooks":["Mom Sells Real Rugs = Management group, Subscription, Resource group, Resource","300 miles = a pair; zones are neighbors","A group is a box: trash the box, trash the contents"],"topics":["Regions and zones","Management hierarchy"],"qtopics":["Regions and zones","Hierarchy"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/","modTitle":"Describe the core architectural components of Azure","units":[{"t":"What is Microsoft Azure","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/2-what-microsoft-azure"},{"t":"Azure accounts","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/3-get-started-azure-accounts"},{"t":"Physical infrastructure","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure"},{"t":"Management infrastructure","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure"}],"models":["hier","regions"]},{"id":"s5","d":2,"title":"Compute","label":"High","note":"4 official objectives (compute half of 'compute and networking'","why":"Questions here are scenario-style: pick the right compute option for a described need. The control ladder (VMs → containers → App Service → Functions) also reinforces the IaaS/PaaS/serverless weak area.","obj":["Compare compute types: containers, virtual machines, functions","VM options: Azure VMs, scale sets, availability sets, Azure Virtual Desktop","Resources required for virtual machines","Application hosting: web apps, containers, virtual machines"],"cold":["VMs are IaaS: you patch the OS","Scale set = identical VMs that auto scale; availability set = update and fault domains inside one region","VM name decoder: Standard_D2s_v5","Container Instances vs Container Apps vs AKS","Functions: event-driven, serverless, pay only while running; Durable Functions = stateful","App Service types: web apps, API apps, WebJobs, mobile apps","AI services (prebuilt) vs Machine Learning (custom) vs IoT"],"traps":["Confusing scale sets (scale) with availability sets (resiliency)","Update domain (planned reboots) vs fault domain (shared power or network)","Picking a VM when the scenario says 'no infrastructure to manage'"],"hooks":["Update = planned, Fault = failure","One container = ACI, smart scaling = Apps, a fleet = AKS","Event in, code runs, pay only while it runs"],"topics":["Compute"],"qtopics":["Compute"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/","modTitle":"Describe Azure compute services","units":[{"t":"Virtual machines","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines"},{"t":"Virtual Desktop","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/4-virtual-desktop"},{"t":"Containers","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers"},{"t":"Functions","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions"},{"t":"AI, ML and IoT/Edge","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services"},{"t":"Application hosting options","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options"}]},{"id":"s6","d":2,"title":"Networking","label":"Medium-High","note":"2 official objectives (virtual networking; public and private endpoints), but they cover a lot of ground","why":"Fewer objective lines than other sections, but each one is a service you must tell apart. The VPN vs ExpressRoute comparison is a classic exam question.","obj":["Virtual networking: virtual networks, subnets, peering, Azure DNS, VPN Gateway, ExpressRoute","Public and private endpoints"],"cold":["VNet = private IP space split into subnets; NSGs filter, route tables and UDRs route","Peering joins VNets privately over the Microsoft backbone, even across regions","VPN Gateway: encrypted over the internet; site-to-site, point-to-site, network-to-network","VPN HA: active/standby, active/active, ExpressRoute failover, zone-redundant","ExpressRoute: private circuit through a provider, no public internet; DNS, certificate checks and CDN still use the internet","Azure DNS: anycast, Resource Manager (RBAC, logs, locks), private zones, alias records","Public endpoint = public IP; private endpoint = private IP inside the VNet"],"traps":["VPN vs ExpressRoute: encrypted-over-internet vs private line","Point-to-site is one device, site-to-site is a building","Assuming ExpressRoute sends absolutely everything privately (DNS and CDN still go over the internet)"],"hooks":["Subnets slice it, NSGs guard it, peering joins it","Site = building, Point = person, Network = VNet","ExpressRoute = your own private road"],"topics":["Networking"],"qtopics":["Networking"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/","modTitle":"Describe Azure networking services","units":[{"t":"Virtual networking","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network"},{"t":"VPN Gateway","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/3-virtual-private-networks"},{"t":"ExpressRoute","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/4-expressroute"},{"t":"Azure DNS","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system"}],"models":["vnet"]},{"id":"s7","d":2,"title":"Storage","label":"High","note":"6 official objectives","why":"The most list-like section: six objectives, each with clear terms to memorize. Redundancy (LRS, ZRS, GRS, GZRS, RA variants) and blob tiers are very testable and build on your zones and region pairs notes.","obj":["Compare Azure Storage services","Describe storage tiers","Describe redundancy options","Describe storage account options and storage types","Options for moving files: AzCopy, Azure Storage Explorer, Azure File Sync","Migration options: Azure Migrate and Azure Data Box"],"cold":["Five services: Blobs, Files, Queues, Disks, Tables","Tiers: hot, cool (30 days), cold (90 days), archive (180 days); account level has no archive","Storage account names: 3-24 characters, lowercase and numbers, unique in Azure","Account types: standard general-purpose v2, premium block blobs, premium file shares, premium page blobs","LRS 11 nines, ZRS 12 nines, GRS and GZRS 16 nines; RA = read access to the secondary","AzCopy one-way, Storage Explorer graphical, File Sync two-way","Azure Migrate (whole move) vs Data Box (up to 80 TB, shipped)"],"traps":["Confusing ZRS (zones, one region) with GRS (second region)","Thinking the secondary region is readable by default (needs RA-GRS or RA-GZRS)","Mixing AzCopy (one-way) with File Sync (two-way)"],"hooks":["BFQDT = Blobs, Files, Queues, Disks, Tables","30 / 90 / 180: the longer it sleeps, the cheaper the bed","Z = zones, G = geo, RA = read access","Migrate = the whole move, Data Box = a truck for the data"],"topics":["Storage"],"qtopics":["Storage"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/","modTitle":"Describe Azure storage services","units":[{"t":"Storage accounts","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/2-accounts"},{"t":"Redundancy","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/3-redundancy"},{"t":"Storage services","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services"},{"t":"Data migration options","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/6-identify-azure-data-migration-options"},{"t":"File movement options","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/7-identify-azure-file-movement-options"}]},{"id":"s8","d":2,"title":"Identity, access and security","label":"High","note":"8 official objectives (the longest list in Domain 2","why":"The longest objective list in Domain 2, and the foundation of your whole security track: SC-900 and SC-500 build directly on these ideas. Time spent here pays off beyond AZ-900.","obj":["Directory services: Microsoft Entra ID and Entra Domain Services","Authentication methods: SSO, MFA, passwordless","External identities","Microsoft Entra Conditional Access","Azure role-based access control (RBAC)","Zero Trust","Defense in depth","Microsoft Defender for Cloud"],"cold":["Entra ID = cloud identity; Entra Connect syncs on-prem AD; Domain Services = managed domain for legacy apps","SSO is only as secure as the first sign-in; MFA = know, have, are","Passwordless: Windows Hello for Business, Microsoft Authenticator, FIDO2 keys","B2B collaboration (guests in your directory) vs B2B direct connect (not in your directory) vs External ID for customers","Conditional Access: signals → decision → enforcement","RBAC: role + scope, inherits downward, enforced through Resource Manager, allow model","Zero Trust: verify explicitly, least privilege, assume breach","Defense in depth: 7 layers, data at the center","Key Vault stores secrets, keys and certificates; Defender for Cloud: assess, secure, defend"],"traps":["Entra ID vs Entra Domain Services","RBAC (what you can do) vs Conditional Access (whether you get in)","Forgetting RBAC does not enforce permissions inside an application or at the data level"],"hooks":["Passwordless = high security AND high convenience","Signal → Decision → Enforcement","Never trust, always verify","Pat Is Proud Never Cooking Any Dinner = Physical, Identity, Perimeter, Network, Compute, Application, Data","Assess, Secure, Defend"],"topics":["Identity and security"],"qtopics":["Identity","Security"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/","modTitle":"Describe Azure identity, access, and security","units":[{"t":"Directory services","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services"},{"t":"Authentication methods","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods"},{"t":"External identities","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities"},{"t":"Conditional Access","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access"},{"t":"Role-based access control","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control"},{"t":"Zero Trust","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model"},{"t":"Defense in depth","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth"},{"t":"Encryption and key management","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9a-describe-encryption-key-management"},{"t":"Defender for Cloud","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud"}],"models":["did","zt","ca"]},{"id":"s9","d":3,"title":"Cost management","label":"High","note":"You missed all three cost questions on practice test 1.","why":"","obj":["Factors that affect cost","pricing calculator","Cost Management","tags","cost optimization (Reservations, savings plans, Spot)."],"cold":["**Six cost factors:** resource type, consumption, maintenance, geography, subscription type, Azure Marketplace.","**Billing zones** group regions for data-transfer pricing (not availability zones). Some inbound is free; outbound is priced by zone.","**Pricing calculator:** estimate before you deploy. Nothing is provisioned or charged. TCO calculator is retired.","**Cost Management:** cost analysis, cost alerts, budgets. Alerts: budget, credit (90% and 100%), department spending quota (EA). Budgets can trigger automation that suspends or changes resources.","**Tags:** name-value metadata for resource, cost, operations, security, governance and automation use. NOT inherited. Policy can require or reapply them.","**Pricing options:** pay-as-you-go (flexible), Reservations (stable, 1 or 3 years), savings plan for compute (hourly spend, flexible across compute), Spot (interruptible, can be evicted)."],"traps":["Cost Management does not estimate before deployment. The pricing calculator does.","Tags do not flow down from resource groups.","Reservation is tied to specific resources; savings plan is tied to spend."],"hooks":["\"Calculator = before. Cost Management = after.\"","\"Reserve it, plan it, or spot it.\""],"topics":["Cost management"],"qtopics":["Cost"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/","modTitle":"Describe cost management in Azure","units":[{"t":"Factors that affect costs","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure"},{"t":"Pricing calculator","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators"},{"t":"Cost Management","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool"},{"t":"Tags","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags"},{"t":"Cost optimization options","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7a-describe-cost-optimization-options"}]},{"id":"s10","d":3,"title":"Governance and compliance","label":"High","note":"## Objectives","why":"","obj":["Purview","Azure Policy","resource locks","Service Trust Portal."],"cold":["**Purview:** data governance, risk and compliance. Automated discovery, sensitive-data classification, end-to-end lineage across on-premises, multicloud and SaaS.","**Azure Policy:** create, assign and manage rules that audit or enforce configuration (allowed regions, VM sizes, required tags). Inherited downward. Evaluates new and existing resources. Can remediate. Groups of policies are initiatives.","**Resource locks:** Delete and ReadOnly. Inherited. Apply regardless of RBAC. Remove the lock first to make a change.","**Service Trust Portal:** Microsoft's security, privacy and compliance documents and audit reports. Sign in with an Entra work or school account; NDA for some content."],"traps":["Policy controls what resources can be. RBAC controls what users can do. Locks stop accidental change or deletion.","An Owner is still blocked by a lock."],"hooks":["\"Policy = rules. Lock = brake. RBAC = keys.\""],"topics":["Governance"],"qtopics":["Governance"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/","modTitle":"Describe features and tools for governance and compliance","units":[{"t":"Microsoft Purview","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview"},{"t":"Azure Policy","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-azure-policy"},{"t":"Resource locks","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-resource-locks"},{"t":"Service Trust Portal","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/6-describe-purpose-service-trust-portal"}]},{"id":"s11","d":3,"title":"Managing and deploying resources","label":"High","note":"## Objectives","why":"","obj":["Azure portal","Cloud Shell, CLI and PowerShell","Azure Arc","Azure Resource Manager and ARM templates (plus Bicep, IaC)."],"cold":["**Portal:** web GUI; dashboards; resilient, presence in every datacenter.","**Cloud Shell:** browser-based, no install, already authenticated; choose PowerShell or CLI (Bash).","**PowerShell vs CLI:** equivalent; cmdlets vs Bash-style commands; both scriptable.","**Arc:** extends Azure management and governance to servers, Kubernetes, data services, SQL Server, VMs outside Azure, through ARM.","**ARM:** every request from any tool goes through it (authenticate, authorize, send to service). ARM templates are declarative JSON: repeatable, orchestrated, modular. Bicep is a simpler declarative language.","**Copilot in Azure:** AI assistant; validate its output."],"traps":["Arc manages non-Azure resources without migrating them. Advisor does not.","\"Create a VM from a phone\" means portal or Cloud Shell.","ARM is a management layer, not a tool you install."],"hooks":["\"Everything goes through ARM.\"","\"Arc brings outside things in.\""],"topics":["Managing and deploying"],"qtopics":["Management"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/","modTitle":"Describe features and tools for managing and deploying Azure resources","units":[{"t":"Tools for interacting with Azure","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure"},{"t":"Azure Arc","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc"},{"t":"Resource Manager and ARM templates","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates"}]},{"id":"s12","d":3,"title":"Monitoring tools","label":"High","note":"Advisor, Service Health and Monitor are easy to mix up.","why":"","obj":["Azure Advisor","Azure Service Health","Azure Monitor (Log Analytics, alerts, Application Insights)."],"cold":["**Advisor:** recommendations in five categories: Reliability, Security, Performance, Operational Excellence, Cost.","**Service Health:** Azure Status (global), Service Health (your services and regions: outages, planned maintenance, advisories), Resource Health (one resource).","**Monitor:** collects metrics and logs; Log Analytics = queries; Alerts = rule + action group (metric or log based); Application Insights = web app performance and usage. Drives autoscale.","Action groups are reusable across Monitor, Service Health and Advisor."],"traps":["Outage or planned maintenance → Service Health, not Advisor.","CPU over 80% alert → Monitor.","Recommendation to cut cost → Advisor."],"hooks":["\"Advisor advises. Service Health warns. Monitor measures.\""],"topics":["Monitoring"],"qtopics":["Monitoring"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/","modTitle":"Describe monitoring tools in Azure","units":[{"t":"Azure Advisor","u":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/2-describe-purpose-of-azure-advisor"},{"t":"Azure Service Health","u":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/3-describe-azure-service-health"},{"t":"Azure Monitor","u":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor"}]}],"duels":[{"id":"d001","d":1,"a":"Public cloud","b":"Private cloud","clue":"You buy and maintain the hardware.","ans":1,"why":"Private cloud means you buy and maintain the hardware (CapEx) and control security. Public is shared and pay-as-you-go.","miss":true},{"id":"d002","d":1,"a":"CapEx","b":"OpEx","clue":"Upfront, one-time spend on hardware.","ans":0,"why":"CapEx is upfront spending. OpEx is billed as you use the service.","miss":true},{"id":"d003","d":1,"a":"Scale up","b":"Scale out","clue":"Add more virtual machines to handle load.","ans":1,"why":"Adding instances is scaling out (horizontal). Scaling up adds CPU or RAM to one instance.","miss":true},{"id":"d004","d":1,"a":"Elasticity","b":"Scalability","clue":"Resources grow and shrink automatically with demand.","ans":0,"why":"Elasticity is automatic, in both directions. Scalability is the ability to add or remove resources.","miss":true},{"id":"d005","d":1,"a":"High availability","b":"Scalability","clue":"Spread across multiple regions to survive an outage.","ans":0,"why":"Multiple regions keep a service running when one region fails. That is high availability.","miss":true},{"id":"d006","d":1,"a":"IaaS","b":"PaaS","clue":"You patch the operating system.","ans":0,"why":"In IaaS you manage the OS. In PaaS Microsoft does.","miss":true},{"id":"d007","d":1,"a":"PaaS","b":"SaaS","clue":"Azure App Service.","ans":0,"why":"App Service hosts your app without you managing servers: PaaS. Microsoft 365 is SaaS.","miss":true},{"id":"d008","d":1,"a":"PaaS","b":"IaaS","clue":"Azure Cosmos DB.","ans":0,"why":"Cosmos DB is a managed database platform: PaaS. Azure VMs and virtual networks are IaaS.","miss":true},{"id":"d009","d":1,"a":"Hybrid cloud","b":"Public cloud","clue":"Keep sensitive data on-premises but use cloud capacity at peak times.","ans":0,"why":"Hybrid connects private or on-premises resources with the public cloud.","miss":false},{"id":"d010","d":1,"a":"Serverless","b":"IaaS","clue":"Run code on events and pay only while it executes.","ans":0,"why":"Serverless (such as Azure Functions) hides the servers and bills for execution time.","miss":false},{"id":"d011","d":2,"a":"Availability zone","b":"Region pair","clue":"Separate datacenters inside one Azure region.","ans":0,"why":"Zones sit inside a region. A region pair is two regions in the same geography.","miss":true},{"id":"d012","d":2,"a":"Availability zone","b":"Region pair","clue":"Two regions in the same geography, at least 300 miles apart.","ans":1,"why":"Region pairs are for disaster recovery across regions. Zones are inside one region.","miss":true},{"id":"d013","d":2,"a":"Resource","b":"Resource group","clue":"A storage account named storage001.","ans":0,"why":"A storage account is a resource. A resource group is a container for resources.","miss":true},{"id":"d014","d":2,"a":"Management group","b":"Administrative unit","clue":"Applies policy and access across multiple subscriptions.","ans":0,"why":"Management groups sit above subscriptions. Administrative units are for Microsoft Entra resources.","miss":true},{"id":"d015","d":2,"a":"Subscription","b":"Resource group","clue":"A billing boundary.","ans":0,"why":"A subscription is a billing and access boundary. Resource groups organize resources inside it.","miss":false},{"id":"d016","d":2,"a":"Availability set","b":"Scale set","clue":"Identical, load-balanced VMs that autoscale.","ans":1,"why":"Scale sets autoscale identical VMs. Availability sets spread VMs across update and fault domains.","miss":false},{"id":"d017","d":2,"a":"Update domain","b":"Fault domain","clue":"VMs that reboot together during planned maintenance.","ans":0,"why":"Update domains are planned maintenance. Fault domains share power and network.","miss":false},{"id":"d018","d":2,"a":"Azure Functions","b":"App Service","clue":"Event-driven serverless code.","ans":0,"why":"Functions run code when triggered. App Service hosts web apps and APIs.","miss":false},{"id":"d019","d":2,"a":"Container Instances","b":"Kubernetes Service (AKS)","clue":"Kubernetes orchestration for containers.","ans":1,"why":"AKS is Azure's managed Kubernetes. Container Instances runs simple containers fast.","miss":false},{"id":"d020","d":2,"a":"VPN Gateway","b":"ExpressRoute","clue":"An encrypted tunnel over the public internet.","ans":0,"why":"A VPN Gateway tunnels over the internet. ExpressRoute is a private line.","miss":true},{"id":"d021","d":2,"a":"VPN Gateway","b":"ExpressRoute","clue":"A private connection through a provider that does not use the public internet.","ans":1,"why":"ExpressRoute is private. DNS, certificate checks and CDN still use the internet.","miss":true},{"id":"d022","d":2,"a":"VNet peering","b":"Point-to-site VPN","clue":"Connect two Azure virtual networks.","ans":0,"why":"Peering links VNets over Microsoft's backbone. Point-to-site connects one device.","miss":true},{"id":"d023","d":2,"a":"Service endpoint","b":"Private endpoint","clue":"Gives the Azure service a private IP inside your VNet.","ans":1,"why":"A private endpoint uses a private IP. A service endpoint keeps traffic on the backbone but the service keeps its public address.","miss":true},{"id":"d024","d":2,"a":"Service endpoint","b":"ExpressRoute","clue":"Connect Azure SQL to a VNet over the Azure backbone.","ans":0,"why":"Service endpoints extend a VNet to Azure services. ExpressRoute connects on-premises.","miss":true},{"id":"d025","d":2,"a":"NSG","b":"Route table","clue":"Allow or deny traffic by port and protocol.","ans":0,"why":"An NSG filters traffic. A route table decides where it goes.","miss":false},{"id":"d026","d":2,"a":"Azure Firewall","b":"Azure Bastion","clue":"Browser-based RDP and SSH to VMs without public IPs.","ans":1,"why":"Bastion gives secure remote access. Azure Firewall is a managed stateful firewall.","miss":false},{"id":"d027","d":2,"a":"Blob storage","b":"Azure Files","clue":"Mount a share as a drive on many VMs.","ans":1,"why":"Azure Files provides SMB and NFS shares you can mount. Blob stores unstructured objects.","miss":true},{"id":"d028","d":2,"a":"Blob storage","b":"Azure Files","clue":"Serve images directly to a browser.","ans":0,"why":"Blob is built for unstructured data such as images, backups and archives.","miss":true},{"id":"d029","d":2,"a":"Cold tier","b":"Archive tier","clue":"Offline; must be rehydrated before use.","ans":1,"why":"Archive is offline with the lowest storage cost and highest access cost.","miss":true},{"id":"d030","d":2,"a":"Hot tier","b":"Cool tier","clue":"Highest storage cost and fastest access.","ans":0,"why":"Hot is for frequently accessed data. Cool lowers storage cost and has a 30-day minimum.","miss":true},{"id":"d031","d":2,"a":"LRS","b":"GRS","clue":"Survives the loss of an entire region.","ans":1,"why":"GRS copies to a second region. LRS keeps copies in one datacenter.","miss":false},{"id":"d032","d":2,"a":"AzCopy","b":"Azure File Sync","clue":"Two-way sync between an on-premises file server and Azure Files.","ans":1,"why":"File Sync is two-way. AzCopy is a one-way command-line copy.","miss":false},{"id":"d033","d":2,"a":"Azure Migrate","b":"Data Box","clue":"A physical device for large offline transfers.","ans":1,"why":"Data Box ships data offline. Azure Migrate assesses and moves servers.","miss":false},{"id":"d034","d":2,"a":"Entra Domain Services","b":"Managed identities","clue":"Managed AD DS without deploying domain controllers.","ans":0,"why":"Domain Services provides domain join, group policy and LDAP. Managed identities give apps a credential-free identity.","miss":true},{"id":"d035","d":2,"a":"Entra Connect","b":"Entra Domain Services","clue":"Syncs on-premises Active Directory to Microsoft Entra ID.","ans":0,"why":"Entra Connect is the sync tool. Domain Services is a managed domain.","miss":false},{"id":"d036","d":2,"a":"B2B collaboration","b":"External ID for customers","clue":"Partners sign in as guests with their own credentials.","ans":0,"why":"B2B is for partners. External ID for customers is for your customers' apps.","miss":false},{"id":"d037","d":2,"a":"Conditional Access","b":"RBAC","clue":"Require MFA when a sign-in looks risky or is off-network.","ans":0,"why":"Conditional Access evaluates signals and then allows, blocks or requires MFA.","miss":false},{"id":"d038","d":2,"a":"RBAC","b":"Azure Policy","clue":"Decides what a user is allowed to do.","ans":0,"why":"RBAC grants permissions to users. Policy governs what resources may be.","miss":true},{"id":"d039","d":2,"a":"SSO","b":"MFA","clue":"Sign in once to reach many apps.","ans":0,"why":"SSO reuses one sign-in. MFA adds a second proof such as a phone code.","miss":false},{"id":"d040","d":2,"a":"Authentication","b":"Authorization","clue":"Proves who you are.","ans":0,"why":"Authentication verifies identity. Authorization decides what you can do.","miss":false},{"id":"d041","d":2,"a":"Defender for Cloud","b":"Key Vault","clue":"Secure score and security recommendations.","ans":0,"why":"Defender for Cloud assesses and protects. Key Vault stores secrets, keys and certificates.","miss":false},{"id":"d042","d":3,"a":"Pricing calculator","b":"Cost Management","clue":"Estimate the cost of a deployment before you create anything.","ans":0,"why":"The pricing calculator estimates before. Cost Management analyzes and budgets after.","miss":true},{"id":"d043","d":3,"a":"Pricing calculator","b":"Cost Management","clue":"Budgets, alerts and cost analysis for resources you already run.","ans":1,"why":"Cost Management tracks and controls spending that is already happening.","miss":true},{"id":"d044","d":3,"a":"Reservation","b":"Spot VM","clue":"Steady workload; commit for 1 or 3 years.","ans":0,"why":"Reservations reward predictable use. Spot suits interruptible work.","miss":true},{"id":"d045","d":3,"a":"Savings plan","b":"Reservation","clue":"Commit to an hourly spend that works across compute services.","ans":0,"why":"A savings plan is flexible across compute. A reservation is for specific resources.","miss":false},{"id":"d046","d":3,"a":"Spot VM","b":"Savings plan","clue":"Can be evicted when Azure needs the capacity back.","ans":0,"why":"Spot uses spare capacity at a lower price, so it can be evicted.","miss":false},{"id":"d047","d":3,"a":"Tags","b":"Resource groups","clue":"Name-value metadata to track cost by department.","ans":0,"why":"Tags label resources for cost and organization. They are not inherited.","miss":true},{"id":"d048","d":3,"a":"Azure Policy","b":"Resource lock","clue":"Restrict deployments to approved regions.","ans":0,"why":"Policy enforces rules such as allowed locations. Locks block deletion or changes.","miss":true},{"id":"d049","d":3,"a":"Azure Policy","b":"Resource lock","clue":"Prevent accidental deletion, even by an Owner.","ans":1,"why":"Locks apply regardless of RBAC role. Remove the lock first to change the resource.","miss":true},{"id":"d050","d":3,"a":"Microsoft Purview","b":"Service Trust Portal","clue":"Discover and classify sensitive data across your data estate.","ans":0,"why":"Purview governs and classifies data. The Service Trust Portal hosts Microsoft compliance documents.","miss":false},{"id":"d051","d":3,"a":"Azure portal","b":"Cloud Shell","clue":"A browser-based shell with PowerShell or Bash, no install.","ans":1,"why":"Cloud Shell is the browser shell. The portal is the graphical console.","miss":false},{"id":"d052","d":3,"a":"ARM template","b":"Bicep","clue":"Declarative JSON that describes resources to deploy.","ans":0,"why":"ARM templates are JSON. Bicep is a simpler declarative language for the same job.","miss":false},{"id":"d053","d":3,"a":"Azure Arc","b":"Azure Monitor","clue":"Manage on-premises servers with Azure without migrating them.","ans":0,"why":"Arc projects non-Azure resources into Azure Resource Manager.","miss":true},{"id":"d054","d":3,"a":"Azure Resource Manager","b":"Azure Advisor","clue":"The management layer every Azure tool sends requests through.","ans":0,"why":"ARM receives requests from the portal, CLI, PowerShell and APIs.","miss":true},{"id":"d055","d":3,"a":"Azure Advisor","b":"Service Health","clue":"Recommendations for reliability, security, performance and cost.","ans":0,"why":"Advisor advises. Service Health reports outages and maintenance.","miss":true},{"id":"d056","d":3,"a":"Service Health","b":"Azure Monitor","clue":"Planned maintenance and outage notices for your regions.","ans":0,"why":"Service Health warns about Azure-side events that affect you.","miss":true},{"id":"d057","d":3,"a":"Azure Monitor","b":"Azure Advisor","clue":"Alert when CPU stays above 80% for five minutes.","ans":0,"why":"Azure Monitor collects metrics and drives alerts and autoscale.","miss":true},{"id":"d058","d":3,"a":"Resource Health","b":"Service Health","clue":"Is this one VM healthy, and is the problem on Azure's side?","ans":0,"why":"Resource Health covers a single resource. Service Health covers the services and regions you use.","miss":false},{"id":"d059","d":3,"a":"Application Insights","b":"Log Analytics","clue":"Performance and usage of a web application.","ans":0,"why":"Application Insights monitors apps. Log Analytics is where you query collected logs.","miss":false},{"id":"d060","d":2,"a":"Zero Trust","b":"Defense in depth","clue":"Assume breach and verify every request, whatever the network location.","ans":0,"why":"Zero Trust verifies each request. Defense in depth stacks layers of protection around the data.","miss":false},{"id":"d061","d":2,"a":"Zero Trust","b":"Defense in depth","clue":"Seven layers from physical security in to data at the center.","ans":1,"why":"Defense in depth is the layered model: physical, identity, perimeter, network, compute, application, data.","miss":false},{"id":"d062","d":2,"a":"Azure AI services","b":"Azure Machine Learning","clue":"Prebuilt speech and vision through an API.","ans":0,"why":"AI services are prebuilt. Azure Machine Learning is for custom models.","miss":false},{"id":"d063","d":2,"a":"IoT Hub","b":"IoT Edge","clue":"Runs cloud logic on the device itself.","ans":1,"why":"IoT Edge runs near the data. IoT Hub is the cloud messaging hub for devices.","miss":false},{"id":"d064","d":2,"a":"Azure Key Vault","b":"Defender for Cloud","clue":"Stores secrets, keys and certificates.","ans":0,"why":"Key Vault stores and controls access to secrets. Defender for Cloud assesses and protects posture.","miss":false},{"id":"d065","d":2,"a":"Entra Connect","b":"Entra Domain Services","clue":"Managed domain controllers for lift and shift of legacy apps.","ans":1,"why":"Domain Services gives a managed domain. Entra Connect only synchronizes identities.","miss":false},{"id":"d200","d":1,"a":"Geo-distribution","b":"High availability","clue":"Deploy apps to regional datacenters near your users around the world.","ans":0,"why":"Geo-distribution is about where you deploy, close to users. High availability is about staying up during failures.","miss":true},{"id":"d201","d":1,"a":"IaaS","b":"SaaS","clue":"You patch and manage the operating system.","ans":0,"why":"In IaaS the customer manages the OS. In SaaS the provider manages everything except your data, devices and identities.","miss":true},{"id":"d202","d":2,"a":"Resource group","b":"Azure Resource Manager","clue":"A logical container that holds related Azure resources.","ans":0,"why":"A resource group is a container. Azure Resource Manager is the deployment and management service every tool talks to.","miss":true},{"id":"d203","d":2,"a":"Azure Resource Manager","b":"Microsoft Entra ID","clue":"The deployment and management service for Azure.","ans":0,"why":"ARM creates, updates and deletes resources. Entra ID handles identity and sign-in.","miss":true},{"id":"d204","d":2,"a":"Availability zones","b":"Region pairs","clue":"Physically separate datacenters inside one Azure region.","ans":0,"why":"Availability zones are inside a region. Region pairs are two regions in the same geography, usually far apart.","miss":true},{"id":"d205","d":2,"a":"Microsoft Entra Connect","b":"Conditional Access","clue":"Sync on-premises AD users into Microsoft Entra ID for hybrid identity.","ans":0,"why":"Entra Connect syncs identities from on-premises. Conditional Access decides when to allow, block or require MFA.","miss":true},{"id":"d206","d":2,"a":"VPN gateway","b":"Azure Firewall","clue":"Connect an on-premises datacenter to an Azure VNet over an encrypted tunnel.","ans":0,"why":"A VPN gateway connects networks over encrypted tunnels. Azure Firewall filters traffic.","miss":true},{"id":"d s":["hybridid","risky","brute","hybridid"]},{"id":24,"world":2,"n":"Too Much Access","teach":"RBAC least privilege.","unlock":["rbac","zt"],"foe":["rv",3,"Insider Phantom"],"hp":44,"up":24,"intents":["insider","hybridid","risky","insider"]},{"id":25,"world":2,"n":"Posture Check","teach":"Defender for Cloud watches security posture.","unlock":["defender"],"foe":["rv",3,"Insider Phantom"],"hp":46,"up":24,"intents":["vuln","insider","brute","vuln"]},{"id":26,"world":2,"n":"BOSS: Zone Hydra","teach":"Every World 2 threat, three heads at once.","unlock":[],"foe":["boss",2,"Zone Hydra"],"hp":80,"up":28,"intents":["zoneout","region","brute","exposed","spike","zoneout","insider","onprem","storebill","risky","zoneout","vuln"]},{"id":27,"world":3,"n":"Budget Day","teach":"Budget alerts catch Bill Shock.","unlock":["budget","resv","vm2"],"foe":["rv",1,"Bill Shock Imp"],"hp":26,"up":22,"intents":["billshock","hit","billshock"]},{"id":28,"world":3,"n":"Who Spent That?","teach":"Tags group costs by team.","unlock":["tags"],"foe":["rv",1,"Bill Shock Imp"],"hp":30,"up":22,"intents":["untagged","billshock","untagged","hit"]},{"id":29,"world":3,"n":"Price It First","teach":"Pricing calculator before you deploy.","unlock":["calc"],"foe":["rv",1,"Bill Shock Imp"],"hp":32,"up":22,"intents":["estimate","untagged","billshock","estimate"]},{"id":30,"world":3,"n":"Oops, Deleted","teach":"Resource locks stop accidental deletes.","unlock":["lock"],"foe":["rv",3,"Misconfig Phantom"],"hp":34,"up":22,"intents":["delete","billshock","delete","hit"]},{"id":31,"world":3,"n":"Rules of the Road","teach":"Azure Policy decides what can be deployed.","unlock":["policy"],"foe":["rv",3,"Misconfig Phantom"],"hp":36,"up":22,"intents":["rogue","delete","rogue","untagged"]},{"id":32,"world":3,"n":"Data and Audits","teach":"Purview governs data. The Service Trust Portal has the reports.","unlock":["purview","stp"],"foe":["rv",3,"Misconfig Phantom"],"hp":38,"up":22,"intents":["datamap","audit","rogue","datamap"]},{"id":33,"world":3,"n":"Same Every Time","teach":"ARM templates make deployments repeatable.","unlock":["arm","shell"],"foe":["rv",2,"Ops Gremlin"],"hp":40,"up":24,"intents":["snowflake","delete","rogue","snowflake"]},{"id":34,"world":3,"n":"Beyond Azure","teach":"Azure Arc manages servers anywhere.","unlock":["arc"],"foe":["rv",2,"Ops Gremlin"],"hp":42,"up":24,"intents":["unmanaged","snowflake","audit","unmanaged"]},{"id":35,"world":3,"n":"Eyes On","teach":"Monitor alerts and Service Health.","unlock":["monitor","health","advisor"],"foe":["rv",2,"Ops Gremlin"],"hp":44,"up":24,"intents":["blind","maint","overprov","blind"]},{"id":36,"world":3,"n":"BOSS: Policy Warden","teach":"Every World 3 threat. Policy decides; locks protect.","unlock":[],"foe":["boss",3,"Policy Warden"],"hp":80,"up":28,"intents":["rogue","delete","billshock","blind","snowflake","untagged","maint","delete","rogue","audit","overprov","unmanaged"]},{"id":37,"world":4,"n":"Exam Day: Concepts","teach":"Mixed World 1 threats with a full deck.","unlock":[],"foe":["rv",1,"Exam Imp"],"hp":40,"up":24,"intents":["capex","spike","crash","breach","disaster","latency","patch"],"deck":["payg","scale","ha","shared","dr","geo","vm","app"]},{"id":38,"world":4,"n":"Exam Day: Architecture","teach":"Mixed World 2 threats.","unlock":[],"foe":["rv",2,"Exam Gremlin"],"hp":48,"up":24,"intents":["zoneout","region","onprem","exposed","brute","risky","insider"],"deck":["az","vmss","pair","grs","vpn","er","pe","mfa","ca","rbac","vm2"]},{"id":39,"world":4,"n":"Exam Day: Governance","teach":"Mixed World 3 threats.","unlock":[],"foe":["rv",3,"Exam Phantom"],"hp":48,"up":24,"intents":["billshock","untagged","delete","rogue","snowflake","blind","maint"],"deck":["budget","tags","lock","policy","arm","monitor","health","advisor"]},{"id":40,"world":4,"n":"FINAL: The Exam","teach":"All three domains at once. Read each threat, pick the right service.","unlock":[],"foe":["boss",1,"Elder CapEx Colossus",3],"hp":110,"up":32,"intents":["capex","zoneout","delete","brute","billshock","region","rogue","spike","breach","blind","exposed","disaster","insider","maint"],"deck":["payg","scale","ha","shared","dr","az","vmss","pair","grs","pe","mfa","rbac","budget","lock","policy","monitor","health","vm2"]}]}},"sc900":{"meta":{"id":"sc900","code":"SC-900","name":"Microsoft Security, Compliance, and Identity Fundamentals","quest":"SC-900 Quest","domains":{"1":"Security, compliance and identity concepts","2":"Microsoft Entra","3":"Microsoft security solutions","4":"Microsoft compliance solutions"},"weights":{"1":"10-15%","2":"25-30%","3":"35-40%","4":"20-25%"},"bosses":{"1":["The Perimeter Phantom",""],"2":["The Credential Kraken",""],"3":["The Breach Warden",""],"4":["The Audit Colossus",""]},"mix":[6,14,19,11],"quickMix":[3,5,7,5],"fullMins":45,"quickMins":20,"passPct":70,"bookPct":80,"msUrl":"https://learn.microsoft.com/en-us/credentials/certifications/exams/sc-900/practice/assessment?assessment-type=practice&assessmentId=11","studyGuide":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-900","taunts":{"1":["\"The firewall is all you need.\"","\"Trust the internal network!\"","\"Hash it, then un-hash it.\"","\"One layer is plenty.\""],"2":["\"Password123 is fine.\"","\"MFA is too much work.\"","\"Everyone is Global Admin!\"","\"Standing access forever.\""],"3":["\"No one reads the alerts.\"","\"Port 3389, open to all.\"","\"Secrets belong in the code.\"","\"Shadow IT is my friend.\""],"4":["\"Labels? Never heard of them.\"","\"Delete the audit log.\"","\"Retention is optional.\"","\"That email was not sensitive.\""]}},"cards":[{"id":"c001","d":1,"topic":"Security concepts","front":"Shared responsibility: what is ALWAYS the customer's job?","back":"Your **information and data**, your **devices** (PCs and mobile), and your **accounts and identities**. This holds for IaaS, PaaS and SaaS.","miss":false},{"id":"c002","d":1,"topic":"Security concepts","front":"Shared responsibility: what is ALWAYS Microsoft's job in the cloud?","back":"The **physical datacenter**, the **physical network** and the **physical hosts**.","miss":false},{"id":"c003","d":1,"topic":"Security concepts","front":"Name the seven defense-in-depth layers, outside to inside.","back":"**Physical, Identity and access, Perimeter, Network, Compute, Application, Data.** Each layer slows an attacker if the one before it fails.","miss":false},{"id":"c004","d":1,"topic":"Security concepts","front":"What is the CIA triad?","back":"**Confidentiality** (only the right people see it), **Integrity** (it is not altered), **Availability** (it is there when needed).","miss":false},{"id":"c005","d":1,"topic":"Security concepts","front":"Zero Trust: the three guiding principles?","back":"**Verify explicitly** (always authenticate and authorize on all data points), **use least privilege access** (just-in-time, just-enough), **assume breach** (segment, encrypt, monitor).","miss":false},{"id":"c006","d":1,"topic":"Security concepts","front":"Zero Trust: the six foundational pillars?","back":"**Identities, Devices (endpoints), Applications, Data, Infrastructure, Networks.**","miss":false},{"id":"c007","d":1,"topic":"Security concepts","front":"Symmetric vs asymmetric encryption?","back":"**Symmetric:** one key encrypts and decrypts. **Asymmetric:** a public and private key pair. What one key encrypts, only the other decrypts.","miss":false},{"id":"c008","d":1,"topic":"Security concepts","front":"Encryption at rest, in transit, in use?","back":"**At rest:** stored data (disk, database). **In transit:** moving over a network (HTTPS/TLS). **In use:** data being processed in memory.","miss":false},{"id":"c009","d":1,"topic":"Security concepts","front":"What is hashing, and how is it different from encryption?","back":"Hashing turns data into a **fixed-length value** and is **one-way**: you cannot reverse it. The same input always gives the same hash. Used to store passwords and check integrity. **Salting** adds a random value so identical passwords get different hashes.","miss":false},{"id":"c010","d":1,"topic":"Security concepts","front":"GRC: what do the three letters cover?","back":"**Governance:** the rules and processes that direct the organization. **Risk management:** identify, assess and respond to threats. **Compliance:** follow the laws and regulations that apply.","miss":false},{"id":"c011","d":1,"topic":"Security concepts","front":"Data residency vs data sovereignty?","back":"**Residency:** rules about the physical place data may be stored. **Sovereignty:** data is subject to the laws of the country or region where it is collected, held or processed.","miss":false},{"id":"c012","d":1,"topic":"Identity concepts","front":"Why is identity called the primary security perimeter?","back":"Cloud apps, personal devices and remote work mean the corporate network is no longer the edge. **Who** is signing in (person, service or device) is what you can check everywhere.","miss":false},{"id":"c013","d":1,"topic":"Identity concepts","front":"The four pillars of an identity infrastructure?","back":"**Administration** (create and manage identities), **Authentication** (prove who you are), **Authorization** (what you may do), **Auditing** (track who did what).","miss":false},{"id":"c014","d":1,"topic":"Identity concepts","front":"Authentication vs authorization?","back":"**Authentication (AuthN):** proving you are who you say you are. **Authorization (AuthZ):** deciding what an authenticated identity is allowed to access.","miss":false},{"id":"c015","d":1,"topic":"Identity concepts","front":"What is an identity provider (IdP)?","back":"A service that **creates, stores and manages identities** and handles authentication, authorization and auditing for apps. With modern authentication the IdP issues a **security token** that apps trust. Microsoft Entra ID is one.","miss":false},{"id":"c016","d":1,"topic":"Identity concepts","front":"What is single sign-on (SSO)?","back":"Sign in **once** and use that one credential to reach many apps and resources, without signing in again for each.","miss":false},{"id":"c017","d":1,"topic":"Identity concepts","front":"What is a directory service? Name Microsoft's on-premises one.","back":"A hierarchical store of objects on a network (users, devices, groups). **Active Directory Domain Services (AD DS)** is the on-premises one. It does not natively support mobile devices, SaaS apps or modern authentication.","miss":false},{"id":"c018","d":1,"topic":"Identity concepts","front":"What is federation?","back":"A **trust relationship between identity providers** in different organizations or domains, so users sign in with their home identity. Trust is **not always two-way**.","miss":false},{"id":"c019","d":2,"topic":"Entra ID and identities","front":"What is Microsoft Entra ID?","back":"Microsoft's **cloud-based identity and access management** service. Microsoft 365, Azure and Dynamics 365 tenants use it automatically. Formerly Azure Active Directory.","miss":false},{"id":"c020","d":2,"topic":"Entra ID and identities","front":"The main identity types in Microsoft Entra ID?","back":"**Human** (workforce employees, and external guests, partners, customers), **workload** (applications, service principals, managed identities), **device**, and newer **agent identities** for AI agents.","miss":false},{"id":"c021","d":2,"topic":"Entra ID and identities","front":"What is a service principal?","back":"The identity an **application** uses in a tenant, so it can be authenticated and given permissions. You must manage its credentials unless it is a managed identity.","miss":false},{"id":"c022","d":2,"topic":"Entra ID and identities","front":"What is a managed identity? Two kinds?","back":"A service principal that **Azure manages for you**: no credentials to store or rotate. **System-assigned:** tied to one resource and deleted with it. **User-assigned:** standalone, can be shared by several resources.","miss":false},{"id":"c023","d":2,"topic":"Entra ID and identities","front":"Device identity: registered vs joined vs hybrid joined?","back":"**Entra registered:** personal (BYOD) device, sign in with a personal or local account. **Entra joined:** organization-owned, sign in with a work account, cloud only. **Hybrid joined:** organization-owned, joined to on-premises AD and registered in Entra.","miss":false},{"id":"c024","d":2,"topic":"Entra ID and identities","front":"What does Microsoft Entra External ID B2B collaboration do?","back":"Lets **guests** (partners, vendors) sign in with **their own identity** to use your apps. You manage their access, they manage their credentials.","miss":false},{"id":"c025","d":2,"topic":"Entra ID and identities","front":"What is hybrid identity, and what makes it work?","back":"One identity for on-premises and cloud. **Microsoft Entra Connect Sync** or **Cloud Sync** synchronizes on-premises Active Directory with Microsoft Entra ID.","miss":false},{"id":"c026","d":2,"topic":"Entra ID and identities","front":"Hybrid sign-in: password hash sync vs pass-through authentication vs federation?","back":"**Password hash sync:** a hash of the hash is stored in Entra, sign-in happens in the cloud, simplest. **Pass-through:** an on-premises agent validates the password, nothing stored in the cloud. **Federation:** Entra hands off to a separate trusted identity provider such as AD FS.","miss":false},{"id":"c027","d":2,"topic":"Authentication","front":"What is multifactor authentication (MFA)? The three factor types?","back":"Sign-in that needs **two or more** of: something you **know** (password, PIN), something you **have** (phone, security key), something you **are** (fingerprint, face).","miss":false},{"id":"c028","d":2,"topic":"Authentication","front":"Which authentication methods are passwordless in Microsoft Entra ID?","back":"**Windows Hello for Business**, **Microsoft Authenticator** (phone sign-in), and **passkeys (FIDO2)** security keys.","miss":false},{"id":"c029","d":2,"topic":"Authentication","front":"Why is a Windows Hello PIN safer than a password?","back":"The PIN is **tied to that one device** and backed by its TPM chip. It is never sent to a server, so a stolen PIN is useless without the device.","miss":false},{"id":"c030","d":2,"topic":"Authentication","front":"What are security defaults?","back":"Free, preconfigured baseline settings: **all users register for MFA**, **administrators must use MFA**, and **legacy authentication is blocked**. For organizations not using Conditional Access.","miss":false},{"id":"c031","d":2,"topic":"Authentication","front":"What is self-service password reset (SSPR)?","back":"Users **change, reset or unlock** their own password with no help desk call, after proving identity with registered methods. Cuts help desk cost and downtime.","miss":false},{"id":"c032","d":2,"topic":"Authentication","front":"Password protection: global vs custom banned password list?","back":"**Global:** maintained by Microsoft from real attack data, applied to everyone automatically. **Custom:** your own terms (brand, product names, locations). Both can also protect on-premises AD in a hybrid setup.","miss":false},{"id":"c033","d":2,"topic":"Authentication","front":"Rank these by strength: password only, password + SMS, passwordless.","back":"Weakest: **password only**. Better: **password + second factor**. Best: **passwordless** (Windows Hello, Authenticator, passkey).","miss":false},{"id":"c034","d":2,"topic":"Authentication","front":"Which methods can be used as a second factor in Entra MFA?","back":"Microsoft Authenticator, passkeys (FIDO2), Windows Hello for Business, OATH hardware or software tokens, SMS and voice call. A **password plus a security question is NOT MFA** in Entra sign-in.","miss":false},{"id":"c035","d":2,"topic":"Access management","front":"What is Conditional Access?","back":"Entra's policy engine: **if-then** rules that take **signals**, make a **decision**, and **enforce** it. Example: if a user signs in from outside the country, then require MFA.","miss":false},{"id":"c036","d":2,"topic":"Access management","front":"Conditional Access: name common signals.","back":"**User or group**, **location** (IP range, country), **device** (platform, compliance), **application**, and **real-time sign-in or user risk** from ID Protection.","miss":false},{"id":"c037","d":2,"topic":"Access management","front":"Conditional Access: what decisions can it make?","back":"**Block access**, or **grant access**, optionally with requirements: MFA, a compliant device, a hybrid joined device, an approved app, or a password change.","miss":false},{"id":"c038","d":2,"topic":"Access management","front":"Microsoft Entra roles vs Azure roles (Azure RBAC)?","back":"**Entra roles** control access to **Entra resources**: users, groups, apps, licenses (for example Global Administrator, User Administrator). **Azure roles** control access to **Azure resources** such as VMs and storage (Owner, Contributor, Reader).","miss":false},{"id":"c039","d":2,"topic":"Access management","front":"Built-in vs custom Entra roles?","back":"**Built-in:** fixed permission sets ready to use. **Custom:** you pick the permissions yourself, which needs a premium license. Always give the **least privileged** role that does the job.","miss":false},{"id":"c040","d":2,"topic":"Access management","front":"What is Global Secure Access?","back":"Microsoft's **Security Service Edge (SSE)** solution: **Microsoft Entra Internet Access** (secure access to internet and SaaS) and **Microsoft Entra Private Access** (secure access to private apps without a VPN).","miss":false},{"id":"c041","d":2,"topic":"Access management","front":"At which scopes can an Azure role be assigned?","back":"**Management group, subscription, resource group, or a single resource.** Access is inherited downward.","miss":false},{"id":"c042","d":2,"topic":"Identity governance","front":"What is Microsoft Entra ID Governance for?","back":"Making sure the **right people have the right access to the right resources at the right time**. Covers the identity lifecycle (join, move, leave), access lifecycle and privileged access lifecycle.","miss":false},{"id":"c043","d":2,"topic":"Identity governance","front":"What is entitlement management?","back":"Bundles the groups, apps and sites a role needs into an **access package**. Users request it, approval and **expiration** are built in. Works for guests too.","miss":false},{"id":"c044","d":2,"topic":"Identity governance","front":"What are access reviews?","back":"Scheduled checks where owners, managers or users themselves **confirm who still needs access** to groups, apps or roles. Access not confirmed can be removed automatically.","miss":false},{"id":"c045","d":2,"topic":"Identity governance","front":"What does Privileged Identity Management (PIM) do?","back":"Makes admin roles **just-in-time and time-bound**. Users are *eligible* and must **activate** the role, which can require **approval, MFA and a justification**. Everything is audited.","miss":false},{"id":"c046","d":2,"topic":"Identity governance","front":"What is Microsoft Entra ID Protection?","back":"Detects identity-based risks with Microsoft's threat signals, lets you **investigate** them in reports, and **remediates** automatically through risk-based Conditional Access.","miss":false},{"id":"c047","d":2,"topic":"Identity governance","front":"ID Protection: user risk vs sign-in risk?","back":"**Sign-in risk:** chance that this one sign-in is not the real owner (anonymous IP, atypical travel, password spray). **User risk:** chance that the identity itself is compromised (for example leaked credentials).","miss":false},{"id":"c048","d":2,"topic":"Identity governance","front":"How do you auto-remediate risk in ID Protection?","back":"Risk-based **Conditional Access**: medium or high **sign-in risk** requires MFA; high **user risk** requires a secure **password change**, or blocks access.","miss":false},{"id":"c049","d":3,"topic":"Azure infrastructure security","front":"What is a DDoS attack, and what does Azure DDoS Protection do?","back":"A flood of traffic meant to **exhaust an app's resources** so real users cannot reach it. Azure DDoS Protection detects and absorbs the attack at the Azure network edge.","miss":false},{"id":"c050","d":3,"topic":"Azure infrastructure security","front":"Azure DDoS Protection: the two paid tiers?","back":"**DDoS Network Protection** (covers a whole virtual network) and **DDoS IP Protection** (pay per protected public IP). Basic infrastructure protection for the Azure platform itself is on by default.","miss":false},{"id":"c051","d":3,"topic":"Azure infrastructure security","front":"What is Azure Firewall?","back":"A **managed, cloud-based, stateful network firewall**. Usually placed in a central hub virtual network to control traffic for all your networks. Built-in high availability, scales automatically, and filters with network rules, application (FQDN) rules and threat intelligence.","miss":false},{"id":"c052","d":3,"topic":"Azure infrastructure security","front":"What is Web Application Firewall (WAF)?","back":"Protects **web apps** from common exploits such as **SQL injection and cross-site scripting**. Works at layer 7. Runs on **Application Gateway, Azure Front Door** or Azure CDN.","miss":false},{"id":"c053","d":3,"topic":"Azure infrastructure security","front":"How do virtual networks give you segmentation?","back":"Each VNet is **isolated**: resources in different VNets cannot talk unless you connect them (peering). Inside a VNet you divide resources into **subnets**.","miss":false},{"id":"c054","d":3,"topic":"Azure infrastructure security","front":"What is a network security group (NSG)?","back":"A list of **allow and deny rules** that filters traffic to and from Azure resources in a VNet. Rules use **priority, source, destination, port and protocol**. Attached to a **subnet or a network interface**.","miss":false},{"id":"c055","d":3,"topic":"Azure infrastructure security","front":"NSG rules: how is priority processed?","back":"Lowest number first. The **first matching rule wins** and processing stops. Default rules (which you cannot delete) allow traffic inside the VNet and deny inbound from the internet.","miss":false},{"id":"c056","d":3,"topic":"Azure infrastructure security","front":"What is Azure Bastion?","back":"A managed service that gives **RDP and SSH to VMs from the Azure portal over TLS**. The VMs need **no public IP address**, so RDP/SSH ports are not exposed to the internet.","miss":false},{"id":"c057","d":3,"topic":"Azure infrastructure security","front":"What is Azure Key Vault?","back":"A secure store for **secrets** (passwords, connection strings), **keys** (encryption keys) and **certificates**. Access is controlled with Microsoft Entra authentication and logged.","miss":false},{"id":"c058","d":3,"topic":"Defender for Cloud","front":"What is Microsoft Defender for Cloud?","back":"A **cloud-native application protection platform (CNAPP)**. Three pillars: **DevSecOps**, **cloud security posture management (CSPM)** and **cloud workload protection (CWPP)**. Covers Azure, AWS, GCP and on-premises.","miss":false},{"id":"c059","d":3,"topic":"Defender for Cloud","front":"What is cloud security posture management (CSPM)?","back":"Continuously **assesses your resources for misconfigurations** and gives hardening **recommendations**. Shows the result as a **secure score**.","miss":false},{"id":"c060","d":3,"topic":"Defender for Cloud","front":"Foundational CSPM vs Defender CSPM?","back":"**Foundational CSPM is free:** recommendations, secure score, the Microsoft cloud security benchmark. **Defender CSPM is paid:** adds attack path analysis, cloud security explorer, agentless scanning and governance.","miss":false},{"id":"c061","d":3,"topic":"Defender for Cloud","front":"What is the secure score in Defender for Cloud?","back":"One number that sums up your security posture from the recommendations. **Higher score means lower identified risk.** Fix recommendations and it goes up.","miss":false},{"id":"c062","d":3,"topic":"Defender for Cloud","front":"What is the Microsoft cloud security benchmark (MCSB)?","back":"Microsoft's set of **security best-practice controls** for Azure and other clouds. It is the **default standard** applied when you turn on Defender for Cloud.","miss":false},{"id":"c063","d":3,"topic":"Defender for Cloud","front":"How do policies, standards and recommendations relate?","back":"A **security standard** (like MCSB or ISO 27001) is a set of rules built on **Azure Policy**. Resources are assessed against it. Each failed check becomes a **recommendation** telling you how to fix it.","miss":false},{"id":"c064","d":3,"topic":"Defender for Cloud","front":"What does cloud workload protection add?","back":"Paid **Defender plans** per workload type (Servers, Containers, Storage, Databases, App Service, Key Vault and more). They detect threats and raise **security alerts**.","miss":false},{"id":"c065","d":3,"topic":"Defender for Cloud","front":"What is just-in-time (JIT) VM access?","back":"A Defender for Servers feature that keeps management ports (RDP, SSH) **closed** and opens them **only on request, for a limited time**, to approved IPs.","miss":false},{"id":"c066","d":3,"topic":"Microsoft Sentinel","front":"SIEM vs SOAR vs XDR?","back":"**SIEM:** collects and correlates logs from everywhere, raises alerts and incidents. **SOAR:** automates the response to those alerts with workflows. **XDR:** integrated detection and response across endpoints, identities, email and apps.","miss":false},{"id":"c067","d":3,"topic":"Microsoft Sentinel","front":"What is Microsoft Sentinel?","back":"Microsoft's **cloud-native SIEM and SOAR** solution. Scales in the cloud, no servers to run.","miss":false},{"id":"c068","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: the four stages?","back":"**Collect** data at cloud scale, **Detect** threats with analytics and threat intelligence, **Investigate** incidents with AI and hunting, **Respond** rapidly with automation.","miss":false},{"id":"c069","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: what are data connectors?","back":"Built-in connections that **ingest data** from Microsoft services (Defender XDR, Entra ID, Microsoft 365), other clouds, and third-party products.","miss":false},{"id":"c070","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: analytics rules, incidents, hunting?","back":"**Analytics rules** correlate data into alerts. Related alerts are grouped into **incidents** to investigate. **Hunting** lets analysts search proactively with queries (KQL) before any alert fires.","miss":false},{"id":"c071","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: what are playbooks?","back":"Automated response workflows built on **Azure Logic Apps**. Triggered by alerts or incidents through automation rules. This is the SOAR part.","miss":false},{"id":"c072","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: what are workbooks?","back":"Interactive dashboards that **visualize and monitor** the data you have connected.","miss":false},{"id":"c073","d":3,"topic":"Microsoft Sentinel","front":"Where do you use Microsoft Sentinel today?","back":"In the **Microsoft Defender portal**, where SIEM and XDR are unified. Azure portal support for Sentinel ends after March 31, 2027.","miss":false},{"id":"c074","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender XDR?","back":"A suite that **coordinates detection, prevention, investigation and response** across **endpoints, identities, email and applications**, and joins the signals into single incidents.","miss":false},{"id":"c075","d":3,"topic":"Defender XDR","front":"What does Microsoft Defender for Office 365 protect?","back":"**Email and collaboration** (Exchange, Teams, SharePoint, OneDrive) against **phishing, malicious links and attachments**. Includes Safe Links, Safe Attachments and attack simulation training.","miss":false},{"id":"c076","d":3,"topic":"Defender XDR","front":"What does Microsoft Defender for Endpoint protect?","back":"**Devices**: laptops, phones, tablets, servers. Provides attack surface reduction, next-generation protection, **endpoint detection and response (EDR)** and automated investigation.","miss":false},{"id":"c077","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender for Cloud Apps?","back":"A **cloud access security broker (CASB)**. Discovers **shadow IT**, gives visibility and control over SaaS app use, and protects data in cloud apps.","miss":false},{"id":"c078","d":3,"topic":"Defender XDR","front":"What does Microsoft Defender for Identity do?","back":"Uses **on-premises Active Directory signals** to detect compromised identities, lateral movement and insider actions.","miss":false},{"id":"c079","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender Vulnerability Management?","back":"Continuous **asset discovery and vulnerability assessment** with **risk-based prioritization** and remediation tracking for devices and software.","miss":false},{"id":"c080","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender Threat Intelligence?","back":"Microsoft's threat intelligence: **threat actor profiles, indicators of compromise, intel articles and vulnerability data** to help analysts understand and hunt threats.","miss":false},{"id":"c081","d":3,"topic":"Defender XDR","front":"What is the Microsoft Defender portal?","back":"**security.microsoft.com**. One place for incidents and alerts, advanced hunting, Microsoft Secure Score, threat intelligence, and Microsoft Sentinel.","miss":false},{"id":"c082","d":4,"topic":"Trust and privacy","front":"What is the Service Trust Portal?","back":"Microsoft's public site (**servicetrust.microsoft.com**) for **audit reports, certifications, compliance guides and security assessments** that show how Microsoft cloud services protect your data.","miss":false},{"id":"c083","d":4,"topic":"Trust and privacy","front":"What kinds of documents are on the Service Trust Portal?","back":"Independent **audit reports** (SOC, ISO, FedRAMP), **penetration test and security assessment** results, compliance guides and white papers.","miss":false},{"id":"c084","d":4,"topic":"Trust and privacy","front":"Service Trust Portal: what is My Library?","back":"A place to **save (pin) documents** you use often. You can be **notified when Microsoft updates them**.","miss":false},{"id":"c085","d":4,"topic":"Trust and privacy","front":"Microsoft's six privacy principles?","back":"**Control, Transparency, Security, Strong legal protections, No content-based targeting, Benefits to you.**","miss":false},{"id":"c086","d":4,"topic":"Trust and privacy","front":"Privacy principle 'Control' vs 'Transparency'?","back":"**Control:** you are in charge of your data, with easy tools and clear choices. **Transparency:** Microsoft is open about data collection and use so you can make informed decisions.","miss":false},{"id":"c087","d":4,"topic":"Trust and privacy","front":"Privacy principle 'No content-based targeting'?","back":"Microsoft does **not use your email, chat, files or other personal content to target advertising** to you.","miss":false},{"id":"c088","d":4,"topic":"Trust and privacy","front":"Privacy principles 'Strong legal protections' and 'Benefits to you'?","back":"**Strong legal protections:** Microsoft respects local privacy laws and fights for privacy as a human right. **Benefits to you:** when data is collected, it is used to benefit you and improve your experience.","miss":false},{"id":"c089","d":4,"topic":"Compliance management","front":"What is the Microsoft Purview portal?","back":"**purview.microsoft.com**. One place for Purview's **data security, data governance, and risk and compliance** solutions.","miss":false},{"id":"c090","d":4,"topic":"Compliance management","front":"What is Compliance Manager?","back":"A Purview solution that helps you **assess and manage compliance** across your multicloud environment: prebuilt **assessments** for regulations, step-by-step **improvement actions**, and a **compliance score**.","miss":false},{"id":"c091","d":4,"topic":"Compliance management","front":"Compliance Manager: controls, assessments, regulations (templates), improvement actions?","back":"A **regulation** template (GDPR, ISO 27001) creates an **assessment**. The assessment is made of **controls**. Each control is met by **improvement actions** with guidance you carry out.","miss":false},{"id":"c092","d":4,"topic":"Compliance management","front":"Compliance Manager: three control types?","back":"**Microsoft-managed** (Microsoft implements), **your controls** (customer-managed, you implement), **shared** (both).","miss":false},{"id":"c093","d":4,"topic":"Compliance management","front":"What is the compliance score?","back":"A **risk-based** percentage showing progress on **improvement actions**. It helps you prioritize. It is **not a guarantee** of being compliant with a regulation.","miss":false},{"id":"c094","d":4,"topic":"Compliance management","front":"Compliance score vs secure score?","back":"**Compliance score:** Purview Compliance Manager, progress toward regulations and standards. **Secure score:** Microsoft Defender, strength of your security configuration.","miss":false},{"id":"c095","d":4,"topic":"Compliance management","front":"What does the default Compliance Manager assessment cover?","back":"The **data protection baseline**: key controls drawn from common regulations and standards, so every organization starts with an initial score.","miss":false},{"id":"c096","d":4,"topic":"Information protection","front":"Microsoft Purview Information Protection: the four steps?","back":"**Know your data, protect your data, prevent data loss, govern your data.**","miss":false},{"id":"c097","d":4,"topic":"Information protection","front":"Sensitive information types vs trainable classifiers?","back":"**Sensitive information types:** pattern-based (credit card, passport numbers). **Trainable classifiers:** AI that learns from examples to recognize kinds of content (resumes, source code, contracts).","miss":false},{"id":"c098","d":4,"topic":"Information protection","front":"Content explorer vs Activity explorer?","back":"**Content explorer:** a current snapshot of **which items** have a sensitivity label, retention label or sensitive info type, and where they are. **Activity explorer:** the **history of what was done** to labeled content (label changed, file copied to USB, printed).","miss":false},{"id":"c099","d":4,"topic":"Information protection","front":"What is a sensitivity label? What can it do?","back":"A tag you apply to documents and emails. It is **customizable, stored as clear-text metadata, and persistent** (it travels with the content). It can **encrypt**, add **markings** (header, footer, watermark), and protect containers like Teams and sites. **One sensitivity label per item.**","miss":false},{"id":"c100","d":4,"topic":"Information protection","front":"What is a sensitivity label policy?","back":"How labels are **published** to users and groups. Can set a **default label**, require **justification to lower** a label, and make **labeling mandatory**.","miss":false},{"id":"c101","d":4,"topic":"Information protection","front":"What is data loss prevention (DLP)?","back":"Policies that **detect and stop inappropriate sharing of sensitive information** across Exchange, SharePoint, OneDrive, Teams and devices (Endpoint DLP). Actions: block, show a **policy tip**, alert.","miss":false},{"id":"c102","d":4,"topic":"Information protection","front":"Retention policy vs retention label?","back":"**Retention policy:** the same settings for a whole location (site, mailbox). **Retention label:** set per item (document, email, folder). An item can have **only one retention label** at a time.","miss":false},{"id":"c103","d":4,"topic":"Information protection","front":"What is records management?","back":"Declaring items as **records**: they get restrictions (cannot be deleted, edits limited), activities are logged, and at the end there is **disposition review** and proof of disposition.","miss":false},{"id":"c104","d":4,"topic":"Information protection","front":"What can retention settings do?","back":"**Retain only**, **delete only**, or **retain then delete**. Labels can be published for users to apply or applied automatically.","miss":false},{"id":"c105","d":4,"topic":"Insider risk, eDiscovery, audit","front":"What is Insider Risk Management?","back":"A Purview solution to **detect, investigate and act on risky activity by people inside** the organization: data theft by departing employees, data leaks, security policy violations.","miss":false},{"id":"c106","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Insider Risk Management workflow?","back":"**Policies** define risk indicators, **alerts** are raised, then **triage**, **investigate** in a case, and take **action** (reminder notice, or escalate).","miss":false},{"id":"c107","d":4,"topic":"Insider risk, eDiscovery, audit","front":"How does Insider Risk Management protect privacy?","back":"**Privacy by design:** usernames are **pseudonymized by default**, access is role-based, and investigator actions are audited.","miss":false},{"id":"c108","d":4,"topic":"Insider risk, eDiscovery, audit","front":"What is eDiscovery?","back":"Identifying and delivering **electronic information as evidence in legal cases**. Purview eDiscovery searches mailboxes, Teams, SharePoint and OneDrive.","miss":false},{"id":"c109","d":4,"topic":"Insider risk, eDiscovery, audit","front":"eDiscovery: cases, holds, search, export?","back":"A **case** groups everything for one investigation. A **hold** preserves content so it cannot be deleted. **Search** finds content. **Export** delivers it. Premium features add review sets and analytics.","miss":false},{"id":"c110","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Microsoft Purview Audit (Standard)?","back":"**On by default.** Records user and admin activity across Microsoft 365 in the unified audit log. Records are kept **180 days**.","miss":false},{"id":"c111","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Microsoft Purview Audit (Premium)?","back":"Adds **longer retention** (one year by default for Entra ID, Exchange, SharePoint and OneDrive, **up to 10 years** with an add-on), **audit log retention policies**, and **intelligent insights** for investigations.","miss":false},{"id":"c112","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Hold vs retention policy?","back":"An **eDiscovery hold** preserves content tied to a legal **case**. A **retention policy** governs content lifetime for compliance generally.","miss":false}],"questions":[{"id":"q001","d":1,"topic":"Security concepts","q":"A company moves its email to a SaaS service. Which is still the company's responsibility?","opts":["Physical security of the datacenter","The accounts and identities used to sign in","Maintaining the physical network","Patching the mail server operating system"],"ans":[1],"why":"Customers always keep responsibility for data, devices, and accounts and identities, even in SaaS.","kind":"one","miss":false},{"id":"q002","d":1,"topic":"Security concepts","q":"A file's contents were changed by an attacker without anyone noticing. Which part of the CIA triad was broken?","opts":["Confidentiality","Accountability","Availability","Integrity"],"ans":[3],"why":"Integrity means data is not altered without authorization. Confidentiality is about who can see it, availability about access when needed.","kind":"one","miss":false},{"id":"q003","d":1,"topic":"Security concepts","q":"Which Zero Trust principle is met by limiting admins to just-in-time and just-enough access?","opts":["Verify explicitly","Defense in depth","Use least privilege access","Assume breach"],"ans":[2],"why":"Least privilege limits access with JIT and JEA. Verify explicitly is about authenticating on all signals. Assume breach is about segmenting and monitoring.","kind":"one","miss":false},{"id":"q004","d":1,"topic":"Security concepts","q":"You need to store user passwords so that the original password cannot be recovered from the stored value. What should you use?","opts":["Asymmetric encryption","Symmetric encryption","Hashing with a salt","Encryption in transit"],"ans":[2],"why":"Hashing is one-way. Encryption can be reversed with the key, so it does not meet the requirement.","kind":"one","miss":false},{"id":"q005","d":1,"topic":"Security concepts","q":"Which defense-in-depth layer do DDoS protection and firewalls at the edge of the network belong to?","opts":["Data","Perimeter","Compute","Application"],"ans":[1],"why":"The perimeter layer guards against network-based attacks from outside, such as DDoS. The network layer is about segmentation inside.","kind":"one","miss":false},{"id":"q006","d":1,"topic":"Security concepts","q":"Which TWO are Zero Trust guiding principles?","opts":["Encrypt only data at rest","Trust the corporate network","Assume breach","Verify explicitly"],"ans":[2,3],"why":"The three principles are verify explicitly, use least privilege access and assume breach. Zero Trust never trusts a network location by itself.","kind":"two","miss":false},{"id":"q007","d":1,"topic":"Security concepts","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["In asymmetric encryption, data encrypted with the public key can be decrypted with the same public key.","A hash value can be decrypted to get the original data back.","HTTPS is an example of encryption in transit."],"ans":[0,0,1],"why":"Asymmetric encryption needs the other key of the pair. Hashing is one-way. HTTPS (TLS) protects data moving across a network.","miss":false},{"id":"q008","d":1,"topic":"Security concepts","type":"match","kind":"match","q":
