ault stores secrets, keys and certificates.","miss":false},{"id":"d042","d":3,"a":"Pricing calculator","b":"Cost Management","clue":"Estimate the cost of a deployment before you create anything.","ans":0,"why":"The pricing calculator estimates before. Cost Management analyzes and budgets after.","miss":true},{"id":"d043","d":3,"a":"Pricing calculator","b":"Cost Management","clue":"Budgets, alerts and cost analysis for resources you already run.","ans":1,"why":"Cost Management tracks and controls spending that is already happening.","miss":true},{"id":"d044","d":3,"a":"Reservation","b":"Spot VM","clue":"Steady workload; commit for 1 or 3 years.","ans":0,"why":"Reservations reward predictable use. Spot suits interruptible work.","miss":true},{"id":"d045","d":3,"a":"Savings plan","b":"Reservation","clue":"Commit to an hourly spend that works across compute services.","ans":0,"why":"A savings plan is flexible across compute. A reservation is for specific resources.","miss":false},{"id":"d046","d":3,"a":"Spot VM","b":"Savings plan","clue":"Can be evicted when Azure needs the capacity back.","ans":0,"why":"Spot uses spare capacity at a lower price, so it can be evicted.","miss":false},{"id":"d047","d":3,"a":"Tags","b":"Resource groups","clue":"Name-value metadata to track cost by department.","ans":0,"why":"Tags label resources for cost and organization. They are not inherited.","miss":true},{"id":"d048","d":3,"a":"Azure Policy","b":"Resource lock","clue":"Restrict deployments to approved regions.","ans":0,"why":"Policy enforces rules such as allowed locations. Locks block deletion or changes.","miss":true},{"id":"d049","d":3,"a":"Azure Policy","b":"Resource lock","clue":"Prevent accidental deletion, even by an Owner.","ans":1,"why":"Locks apply regardless of RBAC role. Remove the lock first to change the resource.","miss":true},{"id":"d050","d":3,"a":"Microsoft Purview","b":"Service Trust Portal","clue":"Discover and classify sensitive data across your data estate.","ans":0,"why":"Purview governs and classifies data. The Service Trust Portal hosts Microsoft compliance documents.","miss":false},{"id":"d051","d":3,"a":"Azure portal","b":"Cloud Shell","clue":"A browser-based shell with PowerShell or Bash, no install.","ans":1,"why":"Cloud Shell is the browser shell. The portal is the graphical console.","miss":false},{"id":"d052","d":3,"a":"ARM template","b":"Bicep","clue":"Declarative JSON that describes resources to deploy.","ans":0,"why":"ARM templates are JSON. Bicep is a simpler declarative language for the same job.","miss":false},{"id":"d053","d":3,"a":"Azure Arc","b":"Azure Monitor","clue":"Manage on-premises servers with Azure without migrating them.","ans":0,"why":"Arc projects non-Azure resources into Azure Resource Manager.","miss":true},{"id":"d054","d":3,"a":"Azure Resource Manager","b":"Azure Advisor","clue":"The management layer every Azure tool sends requests through.","ans":0,"why":"ARM receives requests from the portal, CLI, PowerShell and APIs.","miss":true},{"id":"d055","d":3,"a":"Azure Advisor","b":"Service Health","clue":"Recommendations for reliability, security, performance and cost.","ans":0,"why":"Advisor advises. Service Health reports outages and maintenance.","miss":true},{"id":"d056","d":3,"a":"Service Health","b":"Azure Monitor","clue":"Planned maintenance and outage notices for your regions.","ans":0,"why":"Service Health warns about Azure-side events that affect you.","miss":true},{"id":"d057","d":3,"a":"Azure Monitor","b":"Azure Advisor","clue":"Alert when CPU stays above 80% for five minutes.","ans":0,"why":"Azure Monitor collects metrics and drives alerts and autoscale.","miss":true},{"id":"d058","d":3,"a":"Resource Health","b":"Service Health","clue":"Is this one VM healthy, and is the problem on Azure's side?","ans":0,"why":"Resource Health covers a single resource. Service Health covers the services and regions you use.","miss":false},{"id":"d059","d":3,"a":"Application Insights","b":"Log Analytics","clue":"Performance and usage of a web application.","ans":0,"why":"Application Insights monitors apps. Log Analytics is where you query collected logs.","miss":false},{"id":"d060","d":2,"a":"Zero Trust","b":"Defense in depth","clue":"Assume breach and verify every request, whatever the network location.","ans":0,"why":"Zero Trust verifies each request. Defense in depth stacks layers of protection around the data.","miss":false},{"id":"d061","d":2,"a":"Zero Trust","b":"Defense in depth","clue":"Seven layers from physical security in to data at the center.","ans":1,"why":"Defense in depth is the layered model: physical, identity, perimeter, network, compute, application, data.","miss":false},{"id":"d062","d":2,"a":"Azure AI services","b":"Azure Machine Learning","clue":"Prebuilt speech and vision through an API.","ans":0,"why":"AI services are prebuilt. Azure Machine Learning is for custom models.","miss":false},{"id":"d063","d":2,"a":"IoT Hub","b":"IoT Edge","clue":"Runs cloud logic on the device itself.","ans":1,"why":"IoT Edge runs near the data. IoT Hub is the cloud messaging hub for devices.","miss":false},{"id":"d064","d":2,"a":"Azure Key Vault","b":"Defender for Cloud","clue":"Stores secrets, keys and certificates.","ans":0,"why":"Key Vault stores and controls access to secrets. Defender for Cloud assesses and protects posture.","miss":false},{"id":"d065","d":2,"a":"Entra Connect","b":"Entra Domain Services","clue":"Managed domain controllers for lift and shift of legacy apps.","ans":1,"why":"Domain Services gives a managed domain. Entra Connect only synchronizes identities.","miss":false},{"id":"d200","d":1,"a":"Geo-distribution","b":"High availability","clue":"Deploy apps to regional datacenters near your users around the world.","ans":0,"why":"Geo-distribution is about where you deploy, close to users. High availability is about staying up during failures.","miss":true},{"id":"d201","d":1,"a":"IaaS","b":"SaaS","clue":"You patch and manage the operating ],"hp":42,"up":24,"intents":["unmanaged","snowflake","audit","unmanaged"]},{"id":35,"world":3,"n":"Eyes On","teach":"Monitor alerts and Service Health.","unlock":["monitor","health","advisor"],"foe":["rv",2,"Ops Gremlin"],"hp":44,"up":24,"intents":["blind","maint","overprov","blind"]},{"id":36,"world":3,"n":"BOSS: Policy Warden","teach":"Every World 3 threat. Policy decides; locks protect.","unlock":[],"foe":["boss",3,"Policy Warden"],"hp":80,"up":28,"intents":["rogue","delete","billshock","blind","snowflake","untagged","maint","delete","rogue","audit","overprov","unmanaged"]},{"id":37,"world":4,"n":"Exam Day: Concepts","teach":"Mixed World 1 threats with a full deck.","unlock":[],"foe":["rv",1,"Exam Imp"],"hp":40,"up":24,"intents":["capex","spike","crash","breach","disaster","latency","patch"],"deck":["payg","scale","ha","shared","dr","geo","vm","app"]},{"id":38,"world":4,"n":"Exam Day: Architecture","teach":"Mixed World 2 threats.","unlock":[],"foe":["rv",2,"Exam Gremlin"],"hp":48,"up":24,"intents":["zoneout","region","onprem","exposed","brute","risky","insider"],"deck":["az","vmss","pair","grs","vpn","er","pe","mfa","ca","rbac","vm2"]},{"id":39,"world":4,"n":"Exam Day: Governance","teach":"Mixed World 3 threats.","unlock":[],"foe":["rv",3,"Exam Phantom"],"hp":48,"up":24,"intents":["billshock","untagged","delete","rogue","snowflake","blind","maint"],"deck":["budget","tags","lock","policy","arm","monitor","health","advisor"]},{"id":40,"world":4,"n":"FINAL: The Exam","teach":"All three domains at once. Read each threat, pick the right service.","unlock":[],"foe":["boss",1,"Elder CapEx Colossus",3],"hp":110,"up":32,"intents":["capex","zoneout","delete","brute","billshock","region","rogue","spike","breach","blind","exposed","disaster","insider","maint"],"deck":["payg","scale","ha","shared","dr","az","vmss","pair","grs","pe","mfa","rbac","budget","lock","policy","monitor","health","vm2"]}]}},"sc900":{"meta":{"id":"sc900","code":"SC-900","name":"Microsoft Security, Compliance, and Identity Fundamentals","quest":"SC-900 Quest","domains":{"1":"Security, compliance and identity concepts","2":"Microsoft Entra","3":"Microsoft security solutions","4":"Microsoft compliance solutions"},"weights":{"1":"10-15%","2":"25-30%","3":"35-40%","4":"20-25%"},"bosses":{"1":["The Perimeter Phantom",""],"2":["The Credential Kraken",""],"3":["The Breach Warden",""],"4":["The Audit Colossus",""]},"mix":[6,14,19,11],"quickMix":[3,5,7,5],"fullMins":45,"quickMins":20,"passPct":70,"bookPct":80,"msUrl":"https://learn.microsoft.com/en-us/credentials/certifications/exams/sc-900/practice/assessment?assessment-type=practice&assessmentId=11","studyGuide":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-900","taunts":{"1":["\"The firewall is all you need.\"","\"Trust the internal network!\"","\"Hash it, then un-hash it.\"","\"One layer is plenty.\""],"2":["\"Password123 is fine.\"","\"MFA is too much work.\"","\"Everyone is Global Admin!\"","\"Standing access forever.\""],"3":["\"No one reads the alerts.\"","\"Port 3389, open to all.\"","\"Secrets belong in the code.\"","\"Shadow IT is my friend.\""],"4":["\"Labels? Never heard of them.\"","\"Delete the audit log.\"","\"Retention is optional.\"","\"That email was not sensitive.\""]}},"cards":[{"id":"c001","d":1,"topic":"Security concepts","front":"Shared responsibility: what is ALWAYS the customer's job?","back":"Your **information and data**, your **devices** (PCs and mobile), and your **accounts and identities**. This holds for IaaS, PaaS and SaaS.","miss":false},{"id":"c002","d":1,"topic":"Security concepts","front":"Shared responsibility: what is ALWAYS Microsoft's job in the cloud?","back":"The **physical datacenter**, the **physical network** and the **physical hosts**.","miss":false},{"id":"c003","d":1,"topic":"Security concepts","front":"Name the seven defense-in-depth layers, outside to inside.","back":"**Physical, Identity and access, Perimeter, Network, Compute, Application, Data.** Each layer slows an attacker if the one before it fails.","miss":false},{"id":"c004","d":1,"topic":"Security concepts","front":"What is the CIA triad?","back":"**Confidentiality** (only the right people see it), **Integrity** (it is not altered), **Availability** (it is there when needed).","miss":false},{"id":"c005","d":1,"topic":"Security concepts","front":"Zero Trust: the three guiding principles?","back":"**Verify explicitly** (always authenticate and authorize on all data points), **use least privilege access** (just-in-time, just-enough), **assume breach** (segment, encrypt, monitor).","miss":false},{"id":"c006","d":1,"topic":"Security concepts","front":"Zero Trust: the six foundational pillars?","back":"**Identities, Devices (endpoints), Applications, Data, Infrastructure, Networks.**","miss":false},{"id":"c007","d":1,"topic":"Security concepts","front":"Symmetric vs asymmetric encryption?","back":"**Symmetric:** one key encrypts and decrypts. **Asymmetric:** a public and private key pair. What one key encrypts, only the other decrypts.","miss":false},{"id":"c008","d":1,"topic":"Security concepts","front":"Encryption at rest, in transit, in use?","back":"**At rest:** stored data (disk, database). **In transit:** moving over a network (HTTPS/TLS). **In use:** data being processed in memory.","miss":false},{"id":"c009","d":1,"topic":"Security concepts","front":"What is hashing, and how is it different from encryption?","back":"Hashing turns data into a **fixed-length value** and is **one-way**: you cannot reverse it. The same input always gives the same hash. Used to store passwords and check integrity. **Salting** adds a random value so identical passwords get different hashes.","miss":false},{"id":"c010","d":1,"topic":"Security concepts","front":"GRC: what do the three letters cover?","back":"**Governance:** the rules and processes that direct the organization. **Risk management:** identify, assess and respond to threats. **Compliance:** follow the laws and regulations that apply.","miss":false},{"id":"c011","d":1,"topic":"Security concepts","front":"Data residency vs data sovereignty?","back":"**Residency:** rules about the physical place data may be stored. **Sovereignty:** data is subject to the laws of the country or region where it is collected, held or processed.","miss":false},{"id":"c012","d":1,"topic":"Identity concepts","front":"Why is identity called the primary security perimeter?","back":"Cloud apps, personal devices and remote work mean the corporate network is no longer the edge. **Who** is signing in (person, service or device) is what you can check everywhere.","miss":false},{"id":"c013","d":1,"topic":"Identity concepts","front":"The four pillars of an identity infrastructure?","back":"**Administration** (create and manage identities), **Authentication** (prove who you are), **Authorization** (what you may do), **Auditing** (track who did what).","miss":false},{"id":"c014","d":1,"topic":"Identity concepts","front":"Authentication vs authorization?","back":"**Authentication (AuthN):** proving you are who you say you are. **Authorization (AuthZ):** deciding what an authenticated identity is allowed to access.","miss":false},{"id":"c015","d":1,"topic":"Identity concepts","front":"What is an identity provider (IdP)?","back":"A service that **creates, stores and manages identities** and handles authentication, authorization and auditing for apps. With modern authentication the IdP issues a **security token** that apps trust. Microsoft Entra ID is one.","miss":false},{"id":"c016","d":1,"topic":"Identity concepts","front":"What is single sign-on (SSO)?","back":"Sign in **once** and use that one credential to reach many apps and resources, without signing in again for each.","miss":false},{"id":"c017","d":1,"topic":"Identity concepts","front":"What is a directory service? Name Microsoft's on-premises one.","back":"A hierarchical store of objects on a network (users, devices, groups). **Active Directory Domain Services (AD DS)** is the on-premises one. It does not natively support mobile devices, SaaS apps or modern authentication.","miss":false},{"id":"c018","d":1,"topic":"Identity concepts","front":"What is federation?","back":"A **trust relationship between identity providers** in different organizations or domains, so users sign in with their home identity. Trust is **not always two-way**.","miss":false},{"id":"c019","d":2,"topic":"Entra ID and identities","front":"What is Microsoft Entra ID?","back":"Microsoft's **cloud-based identity and access management** service. Microsoft 365, Azure and Dynamics 365 tenants use it automatically. Formerly Azure Active Directory.","miss":false},{"id":"c020","d":2,"topic":"Entra ID and identities","front":"The main identity types in Microsoft Entra ID?","back":"**Human** (workforce employees, and external guests, partners, customers), **workload** (applications, service principals, managed identities), **device**, and newer **agent identities** for AI agents.","miss":false},{"id":"c021","d":2,"topic":"Entra ID and identities","front":"What is a service principal?","back":"The identity an **application** uses in a tenant, so it can be authenticated and given permissions. You must manage its credentials unless it is a managed identity.","miss":false},{"id":"c022","d":2,"topic":"Entra ID and identities","front":"What is a managed identity? Two kinds?","back":"A service principal that **Azure manages for you**: no credentials to store or rotate. **System-assigned:** tied to one resource and deleted with it. **User-assigned:** standalone, can be shared by several resources.","miss":false},{"id":"c023","d":2,"topic":"Entra ID and identities","front":"Device identity: registered vs joined vs hybrid joined?","back":"**Entra registered:** personal (BYOD) device, sign in with a personal or local account. **Entra joined:** organization-owned, sign in with a work account, cloud only. **Hybrid joined:** organization-owned, joined to on-premises AD and registered in Entra.","miss":false},{"id":"c024","d":2,"topic":"Entra ID and identities","front":"What does Microsoft Entra External ID B2B collaboration do?","back":"Lets **guests** (partners, vendors) sign in with **their own identity** to use your apps. You manage their access, they manage their credentials.","miss":false},{"id":"c025","d":2,"topic":"Entra ID and identities","front":"What is hybrid identity, and what makes it work?","back":"One identity for on-premises and cloud. **Microsoft Entra Connect Sync** or **Cloud Sync** synchronizes on-premises Active Directory with Microsoft Entra ID.","miss":false},{"id":"c026","d":2,"topic":"Entra ID and identities","front":"Hybrid sign-in: password hash sync vs pass-through authentication vs federation?","back":"**Password hash sync:** a hash of the hash is stored in Entra, sign-in happens in the cloud, simplest. **Pass-through:** an on-premises agent validates the password, nothing stored in the cloud. **Federation:** Entra hands off to a separate trusted identity provider such as AD FS.","miss":false},{"id":"c027","d":2,"topic":"Authentication","front":"What is multifactor authentication (MFA)? The three factor types?","back":"Sign-in that needs **two or more** of: something you **know** (password, PIN), something you **have** (phone, security key), something you **are** (fingerprint, face).","miss":false},{"id":"c028","d":2,"topic":"Authentication","front":"Which authentication methods are passwordless in Microsoft Entra ID?","back":"**Windows Hello for Business**, **Microsoft Authenticator** (phone sign-in), and **passkeys (FIDO2)** security keys.","miss":false},{"id":"c029","d":2,"topic":"Authentication","front":"Why is a Windows Hello PIN safer than a password?","back":"The PIN is **tied to that one device** and backed by its TPM chip. It is never sent to a server, so a stolen PIN is useless without the device.","miss":false},{"id":"c030","d":2,"topic":"Authentication","front":"What are security defaults?","back":"Free, preconfigured baseline settings: **all users register for MFA**, **administrators must use MFA**, and **legacy authentication is blocked**. For organizations not using Conditional Access.","miss":false},{"id":"c031","d":2,"topic":"Authentication","front":"What is self-service password reset (SSPR)?","back":"Users **change, reset or unlock** their own password with no help desk call, after proving identity with registered methods. Cuts help desk cost and downtime.","miss":false},{"id":"c032","d":2,"topic":"Authentication","front":"Password protection: global vs custom banned password list?","back":"**Global:** maintained by Microsoft from real attack data, applied to everyone automatically. **Custom:** your own terms (brand, product names, locations). Both can also protect on-premises AD in a hybrid setup.","miss":false},{"id":"c033","d":2,"topic":"Authentication","front":"Rank these by strength: password only, password + SMS, passwordless.","back":"Weakest: **password only**. Better: **password + second factor**. Best: **passwordless** (Windows Hello, Authenticator, passkey).","miss":false},{"id":"c034","d":2,"topic":"Authentication","front":"Which methods can be used as a second factor in Entra MFA?","back":"Microsoft Authenticator, passkeys (FIDO2), Windows Hello for Business, OATH hardware or software tokens, SMS and voice call. A **password plus a security question is NOT MFA** in Entra sign-in.","miss":false},{"id":"c035","d":2,"topic":"Access management","front":"What is Conditional Access?","back":"Entra's policy engine: **if-then** rules that take **signals**, make a **decision**, and **enforce** it. Example: if a user signs in from outside the country, then require MFA.","miss":false},{"id":"c036","d":2,"topic":"Access management","front":"Conditional Access: name common signals.","back":"**User or group**, **location** (IP range, country), **device** (platform, compliance), **application**, and **real-time sign-in or user risk** from ID Protection.","miss":false},{"id":"c037","d":2,"topic":"Access management","front":"Conditional Access: what decisions can it make?","back":"**Block access**, or **grant access**, optionally with requirements: MFA, a compliant device, a hybrid joined device, an approved app, or a password change.","miss":false},{"id":"c038","d":2,"topic":"Access management","front":"Microsoft Entra roles vs Azure roles (Azure RBAC)?","back":"**Entra roles** control access to **Entra resources**: users, groups, apps, licenses (for example Global Administrator, User Administrator). **Azure roles** control access to **Azure resources** such as VMs and storage (Owner, Contributor, Reader).","miss":false},{"id":"c039","d":2,"topic":"Access management","front":"Built-in vs custom Entra roles?","back":"**Built-in:** fixed permission sets ready to use. **Custom:** you pick the permissions yourself, which needs a premium license. Always give the **least privileged** role that does the job.","miss":false},{"id":"c040","d":2,"topic":"Access management","front":"What is Global Secure Access?","back":"Microsoft's **Security Service Edge (SSE)** solution: **Microsoft Entra Internet Access** (secure access to internet and SaaS) and **Microsoft Entra Private Access** (secure access to private apps without a VPN).","miss":false},{"id":"c041","d":2,"topic":"Access management","front":"At which scopes can an Azure role be assigned?","back":"**Management group, subscription, resource group, or a single resource.** Access is inherited downward.","miss":false},{"id":"c042","d":2,"topic":"Identity governance","front":"What is Microsoft Entra ID Governance for?","back":"Making sure the **right people have the right access to the right resources at the right time**. Covers the identity lifecycle (join, move, leave), access lifecycle and privileged access lifecycle.","miss":false},{"id":"c043","d":2,"topic":"Identity governance","front":"What is entitlement management?","back":"Bundles the groups, apps and sites a role needs into an **access package**. Users request it, approval and **expiration** are built in. Works for guests too.","miss":false},{"id":"c044","d":2,"topic":"Identity governance","front":"What are access reviews?","back":"Scheduled checks where owners, managers or users themselves **confirm who still needs access** to groups, apps or roles. Access not confirmed can be removed automatically.","miss":false},{"id":"c045","d":2,"topic":"Identity governance","front":"What does Privileged Identity Management (PIM) do?","back":"Makes admin roles **just-in-time and time-bound**. Users are *eligible* and must **activate** the role, which can require **approval, MFA and a justification**. Everything is audited.","miss":false},{"id":"c046","d":2,"topic":"Identity governance","front":"What is Microsoft Entra ID Protection?","back":"Detects identity-based risks with Microsoft's threat signals, lets you **investigate** them in reports, and **remediates** automatically through risk-based Conditional Access.","miss":false},{"id":"c047","d":2,"topic":"Identity governance","front":"ID Protection: user risk vs sign-in risk?","back":"**Sign-in risk:** chance that this one sign-in is not the real owner (anonymous IP, atypical travel, password spray). **User risk:** chance that the identity itself is compromised (for example leaked credentials).","miss":false},{"id":"c048","d":2,"topic":"Identity governance","front":"How do you auto-remediate risk in ID Protection?","back":"Risk-based **Conditional Access**: medium or high **sign-in risk** requires MFA; high **user risk** requires a secure **password change**, or blocks access.","miss":false},{"id":"c049","d":3,"topic":"Azure infrastructure security","front":"What is a DDoS attack, and what does Azure DDoS Protection do?","back":"A flood of traffic meant to **exhaust an app's resources** so real users cannot reach it. Azure DDoS Protection detects and absorbs the attack at the Azure network edge.","miss":false},{"id":"c050","d":3,"topic":"Azure infrastructure security","front":"Azure DDoS Protection: the two paid tiers?","back":"**DDoS Network Protection** (covers a whole virtual network) and **DDoS IP Protection** (pay per protected public IP). Basic infrastructure protection for the Azure platform itself is on by default.","miss":false},{"id":"c051","d":3,"topic":"Azure infrastructure security","front":"What is Azure Firewall?","back":"A **managed, cloud-based, stateful network firewall**. Usually placed in a central hub virtual network to control traffic for all your networks. Built-in high availability, scales automatically, and filters with network rules, application (FQDN) rules and threat intelligence.","miss":false},{"id":"c052","d":3,"topic":"Azure infrastructure security","front":"What is Web Application Firewall (WAF)?","back":"Protects **web apps** from common exploits such as **SQL injection and cross-site scripting**. Works at layer 7. Runs on **Application Gateway, Azure Front Door** or Azure CDN.","miss":false},{"id":"c053","d":3,"topic":"Azure infrastructure security","front":"How do virtual networks give you segmentation?","back":"Each VNet is **isolated**: resources in different VNets cannot talk unless you connect them (peering). Inside a VNet you divide resources into **subnets**.","miss":false},{"id":"c054","d":3,"topic":"Azure infrastructure security","front":"What is a network security group (NSG)?","back":"A list of **allow and deny rules** that filters traffic to and from Azure resources in a VNet. Rules use **priority, source, destination, port and protocol**. Attached to a **subnet or a network interface**.","miss":false},{"id":"c055","d":3,"topic":"Azure infrastructure security","front":"NSG rules: how is priority processed?","back":"Lowest number first. The **first matching rule wins** and processing stops. Default rules (which you cannot delete) allow traffic inside the VNet and deny inbound from the internet.","miss":false},{"id":"c056","d":3,"topic":"Azure infrastructure security","front":"What is Azure Bastion?","back":"A managed service that gives **RDP and SSH to VMs from the Azure portal over TLS**. The VMs need **no public IP address**, so RDP/SSH ports are not exposed to the internet.","miss":false},{"id":"c057","d":3,"topic":"Azure infrastructure security","front":"What is Azure Key Vault?","back":"A secure store for **secrets** (passwords, connection strings), **keys** (encryption keys) and **certificates**. Access is controlled with Microsoft Entra authentication and logged.","miss":false},{"id":"c058","d":3,"topic":"Defender for Cloud","front":"What is Microsoft Defender for Cloud?","back":"A **cloud-native application protection platform (CNAPP)**. Three pillars: **DevSecOps**, **cloud security posture management (CSPM)** and **cloud workload protection (CWPP)**. Covers Azure, AWS, GCP and on-premises.","miss":false},{"id":"c059","d":3,"topic":"Defender for Cloud","front":"What is cloud security posture management (CSPM)?","back":"Continuously **assesses your resources for misconfigurations** and gives hardening **recommendations**. Shows the result as a **secure score**.","miss":false},{"id":"c060","d":3,"topic":"Defender for Cloud","front":"Foundational CSPM vs Defender CSPM?","back":"**Foundational CSPM is free:** recommendations, secure score, the Microsoft cloud security benchmark. **Defender CSPM is paid:** adds attack path analysis, cloud security explorer, agentless scanning and governance.","miss":false},{"id":"c061","d":3,"topic":"Defender for Cloud","front":"What is the secure score in Defender for Cloud?","back":"One number that sums up your security posture from the recommendations. **Higher score means lower identified risk.** Fix recommendations and it goes up.","miss":false},{"id":"c062","d":3,"topic":"Defender for Cloud","front":"What is the Microsoft cloud security benchmark (MCSB)?","back":"Microsoft's set of **security best-practice controls** for Azure and other clouds. It is the **default standard** applied when you turn on Defender for Cloud.","miss":false},{"id":"c063","d":3,"topic":"Defender for Cloud","front":"How do policies, standards and recommendations relate?","back":"A **security standard** (like MCSB or ISO 27001) is a set of rules built on **Azure Policy**. Resources are assessed against it. Each failed check becomes a **recommendation** telling you how to fix it.","miss":false},{"id":"c064","d":3,"topic":"Defender for Cloud","front":"What does cloud workload protection add?","back":"Paid **Defender plans** per workload type (Servers, Containers, Storage, Databases, App Service, Key Vault and more). They detect threats and raise **security alerts**.","miss":false},{"id":"c065","d":3,"topic":"Defender for Cloud","front":"What is just-in-time (JIT) VM access?","back":"A Defender for Servers feature that keeps management ports (RDP, SSH) **closed** and opens them **only on request, for a limited time**, to approved IPs.","miss":false},{"id":"c066","d":3,"topic":"Microsoft Sentinel","front":"SIEM vs SOAR vs XDR?","back":"**SIEM:** collects and correlates logs from everywhere, raises alerts and incidents. **SOAR:** automates the response to those alerts with workflows. **XDR:** integrated detection and response across endpoints, identities, email and apps.","miss":false},{"id":"c067","d":3,"topic":"Microsoft Sentinel","front":"What is Microsoft Sentinel?","back":"Microsoft's **cloud-native SIEM and SOAR** solution. Scales in the cloud, no servers to run.","miss":false},{"id":"c068","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: the four stages?","back":"**Collect** data at cloud scale, **Detect** threats with analytics and threat intelligence, **Investigate** incidents with AI and hunting, **Respond** rapidly with automation.","miss":false},{"id":"c069","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: what are data connectors?","back":"Built-in connections that **ingest data** from Microsoft services (Defender XDR, Entra ID, Microsoft 365), other clouds, and third-party products.","miss":false},{"id":"c070","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: analytics rules, incidents, hunting?","back":"**Analytics rules** correlate data into alerts. Related alerts are grouped into **incidents** to investigate. **Hunting** lets analysts search proactively with queries (KQL) before any alert fires.","miss":false},{"id":"c071","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: what are playbooks?","back":"Automated response workflows built on **Azure Logic Apps**. Triggered by alerts or incidents through automation rules. This is the SOAR part.","miss":false},{"id":"c072","d":3,"topic":"Microsoft Sentinel","front":"Sentinel: what are workbooks?","back":"Interactive dashboards that **visualize and monitor** the data you have connected.","miss":false},{"id":"c073","d":3,"topic":"Microsoft Sentinel","front":"Where do you use Microsoft Sentinel today?","back":"In the **Microsoft Defender portal**, where SIEM and XDR are unified. Azure portal support for Sentinel ends after March 31, 2027.","miss":false},{"id":"c074","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender XDR?","back":"A suite that **coordinates detection, prevention, investigation and response** across **endpoints, identities, email and applications**, and joins the signals into single incidents.","miss":false},{"id":"c075","d":3,"topic":"Defender XDR","front":"What does Microsoft Defender for Office 365 protect?","back":"**Email and collaboration** (Exchange, Teams, SharePoint, OneDrive) against **phishing, malicious links and attachments**. Includes Safe Links, Safe Attachments and attack simulation training.","miss":false},{"id":"c076","d":3,"topic":"Defender XDR","front":"What does Microsoft Defender for Endpoint protect?","back":"**Devices**: laptops, phones, tablets, servers. Provides attack surface reduction, next-generation protection, **endpoint detection and response (EDR)** and automated investigation.","miss":false},{"id":"c077","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender for Cloud Apps?","back":"A **cloud access security broker (CASB)**. Discovers **shadow IT**, gives visibility and control over SaaS app use, and protects data in cloud apps.","miss":false},{"id":"c078","d":3,"topic":"Defender XDR","front":"What does Microsoft Defender for Identity do?","back":"Uses **on-premises Active Directory signals** to detect compromised identities, lateral movement and insider actions.","miss":false},{"id":"c079","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender Vulnerability Management?","back":"Continuous **asset discovery and vulnerability assessment** with **risk-based prioritization** and remediation tracking for devices and software.","miss":false},{"id":"c080","d":3,"topic":"Defender XDR","front":"What is Microsoft Defender Threat Intelligence?","back":"Microsoft's threat intelligence: **threat actor profiles, indicators of compromise, intel articles and vulnerability data** to help analysts understand and hunt threats.","miss":false},{"id":"c081","d":3,"topic":"Defender XDR","front":"What is the Microsoft Defender portal?","back":"**security.microsoft.com**. One place for incidents and alerts, advanced hunting, Microsoft Secure Score, threat intelligence, and Microsoft Sentinel.","miss":false},{"id":"c082","d":4,"topic":"Trust and privacy","front":"What is the Service Trust Portal?","back":"Microsoft's public site (**servicetrust.microsoft.com**) for **audit reports, certifications, compliance guides and security assessments** that show how Microsoft cloud services protect your data.","miss":false},{"id":"c083","d":4,"topic":"Trust and privacy","front":"What kinds of documents are on the Service Trust Portal?","back":"Independent **audit reports** (SOC, ISO, FedRAMP), **penetration test and security assessment** results, compliance guides and white papers.","miss":false},{"id":"c084","d":4,"topic":"Trust and privacy","front":"Service Trust Portal: what is My Library?","back":"A place to **save (pin) documents** you use often. You can be **notified when Microsoft updates them**.","miss":false},{"id":"c085","d":4,"topic":"Trust and privacy","front":"Microsoft's six privacy principles?","back":"**Control, Transparency, Security, Strong legal protections, No content-based targeting, Benefits to you.**","miss":false},{"id":"c086","d":4,"topic":"Trust and privacy","front":"Privacy principle 'Control' vs 'Transparency'?","back":"**Control:** you are in charge of your data, with easy tools and clear choices. **Transparency:** Microsoft is open about data collection and use so you can make informed decisions.","miss":false},{"id":"c087","d":4,"topic":"Trust and privacy","front":"Privacy principle 'No content-based targeting'?","back":"Microsoft does **not use your email, chat, files or other personal content to target advertising** to you.","miss":false},{"id":"c088","d":4,"topic":"Trust and privacy","front":"Privacy principles 'Strong legal protections' and 'Benefits to you'?","back":"**Strong legal protections:** Microsoft respects local privacy laws and fights for privacy as a human right. **Benefits to you:** when data is collected, it is used to benefit you and improve your experience.","miss":false},{"id":"c089","d":4,"topic":"Compliance management","front":"What is the Microsoft Purview portal?","back":"**purview.microsoft.com**. One place for Purview's **data security, data governance, and risk and compliance** solutions.","miss":false},{"id":"c090","d":4,"topic":"Compliance management","front":"What is Compliance Manager?","back":"A Purview solution that helps you **assess and manage compliance** across your multicloud environment: prebuilt **assessments** for regulations, step-by-step **improvement actions**, and a **compliance score**.","miss":false},{"id":"c091","d":4,"topic":"Compliance management","front":"Compliance Manager: controls, assessments, regulations (templates), improvement actions?","back":"A **regulation** template (GDPR, ISO 27001) creates an **assessment**. The assessment is made of **controls**. Each control is met by **improvement actions** with guidance you carry out.","miss":false},{"id":"c092","d":4,"topic":"Compliance management","front":"Compliance Manager: three control types?","back":"**Microsoft-managed** (Microsoft implements), **your controls** (customer-managed, you implement), **shared** (both).","miss":false},{"id":"c093","d":4,"topic":"Compliance management","front":"What is the compliance score?","back":"A **risk-based** percentage showing progress on **improvement actions**. It helps you prioritize. It is **not a guarantee** of being compliant with a regulation.","miss":false},{"id":"c094","d":4,"topic":"Compliance management","front":"Compliance score vs secure score?","back":"**Compliance score:** Purview Compliance Manager, progress toward regulations and standards. **Secure score:** Microsoft Defender, strength of your security configuration.","miss":false},{"id":"c095","d":4,"topic":"Compliance management","front":"What does the default Compliance Manager assessment cover?","back":"The **data protection baseline**: key controls drawn from common regulations and standards, so every organization starts with an initial score.","miss":false},{"id":"c096","d":4,"topic":"Information protection","front":"Microsoft Purview Information Protection: the four steps?","back":"**Know your data, protect your data, prevent data loss, govern your data.**","miss":false},{"id":"c097","d":4,"topic":"Information protection","front":"Sensitive information types vs trainable classifiers?","back":"**Sensitive information types:** pattern-based (credit card, passport numbers). **Trainable classifiers:** AI that learns from examples to recognize kinds of content (resumes, source code, contracts).","miss":false},{"id":"c098","d":4,"topic":"Information protection","front":"Content explorer vs Activity explorer?","back":"**Content explorer:** a current snapshot of **which items** have a sensitivity label, retention label or sensitive info type, and where they are. **Activity explorer:** the **history of what was done** to labeled content (label changed, file copied to USB, printed).","miss":false},{"id":"c099","d":4,"topic":"Information protection","front":"What is a sensitivity label? What can it do?","back":"A tag you apply to documents and emails. It is **customizable, stored as clear-text metadata, and persistent** (it travels with the content). It can **encrypt**, add **markings** (header, footer, watermark), and protect containers like Teams and sites. **One sensitivity label per item.**","miss":false},{"id":"c100","d":4,"topic":"Information protection","front":"What is a sensitivity label policy?","back":"How labels are **published** to users and groups. Can set a **default label**, require **justification to lower** a label, and make **labeling mandatory**.","miss":false},{"id":"c101","d":4,"topic":"Information protection","front":"What is data loss prevention (DLP)?","back":"Policies that **detect and stop inappropriate sharing of sensitive information** across Exchange, SharePoint, OneDrive, Teams and devices (Endpoint DLP). Actions: block, show a **policy tip**, alert.","miss":false},{"id":"c102","d":4,"topic":"Information protection","front":"Retention policy vs retention label?","back":"**Retention policy:** the same settings for a whole location (site, mailbox). **Retention label:** set per item (document, email, folder). An item can have **only one retention label** at a time.","miss":false},{"id":"c103","d":4,"topic":"Information protection","front":"What is records management?","back":"Declaring items as **records**: they get restrictions (cannot be deleted, edits limited), activities are logged, and at the end there is **disposition review** and proof of disposition.","miss":false},{"id":"c104","d":4,"topic":"Information protection","front":"What can retention settings do?","back":"**Retain only**, **delete only**, or **retain then delete**. Labels can be published for users to apply or applied automatically.","miss":false},{"id":"c105","d":4,"topic":"Insider risk, eDiscovery, audit","front":"What is Insider Risk Management?","back":"A Purview solution to **detect, investigate and act on risky activity by people inside** the organization: data theft by departing employees, data leaks, security policy violations.","miss":false},{"id":"c106","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Insider Risk Management workflow?","back":"**Policies** define risk indicators, **alerts** are raised, then **triage**, **investigate** in a case, and take **action** (reminder notice, or escalate).","miss":false},{"id":"c107","d":4,"topic":"Insider risk, eDiscovery, audit","front":"How does Insider Risk Management protect privacy?","back":"**Privacy by design:** usernames are **pseudonymized by default**, access is role-based, and investigator actions are audited.","miss":false},{"id":"c108","d":4,"topic":"Insider risk, eDiscovery, audit","front":"What is eDiscovery?","back":"Identifying and delivering **electronic information as evidence in legal cases**. Purview eDiscovery searches mailboxes, Teams, SharePoint and OneDrive.","miss":false},{"id":"c109","d":4,"topic":"Insider risk, eDiscovery, audit","front":"eDiscovery: cases, holds, search, export?","back":"A **case** groups everything for one investigation. A **hold** preserves content so it cannot be deleted. **Search** finds content. **Export** delivers it. Premium features add review sets and analytics.","miss":false},{"id":"c110","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Microsoft Purview Audit (Standard)?","back":"**On by default.** Records user and admin activity across Microsoft 365 in the unified audit log. Records are kept **180 days**.","miss":false},{"id":"c111","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Microsoft Purview Audit (Premium)?","back":"Adds **longer retention** (one year by default for Entra ID, Exchange, SharePoint and OneDrive, **up to 10 years** with an add-on), **audit log retention policies**, and **intelligent insights** for investigations.","miss":false},{"id":"c112","d":4,"topic":"Insider risk, eDiscovery, audit","front":"Hold vs retention policy?","back":"An **eDiscovery hold** preserves content tied to a legal **case**. A **retention policy** governs content lifetime for compliance generally.","miss":false}],"questions":[{"id":"q001","d":1,"topic":"Security concepts","q":"A company moves its email to a SaaS service. Which is still the company's responsibility?","opts":["Physical security of the datacenter","The accounts and identities used to sign in","Maintaining the physical network","Patching the mail server operating system"],"ans":[1],"why":"Customers always keep responsibility for data, devices, and accounts and identities, even in SaaS.","kind":"one","miss":false},{"id":"q002","d":1,"topic":"Security concepts","q":"A file's contents were changed by an attacker without anyone noticing. Which part of the CIA triad was broken?","opts":["Confidentiality","Accountability","Availability","Integrity"],"ans":[3],"why":"Integrity means data is not altered without authorization. Confidentiality is about who can see it, availability about access when needed.","kind":"one","miss":false},{"id":"q003","d":1,"topic":"Security concepts","q":"Which Zero Trust principle is met by limiting admins to just-in-time and just-enough access?","opts":["Verify explicitly","Defense in depth","Use least privilege access","Assume breach"],"ans":[2],"why":"Least privilege limits access with JIT and JEA. Verify explicitly is about authenticating on all signals. Assume breach is about segmenting and monitoring.","kind":"one","miss":false},{"id":"q004","d":1,"topic":"Security concepts","q":"You need to store user passwords so that the original password cannot be recovered from the stored value. What should you use?","opts":["Asymmetric encryption","Symmetric encryption","Hashing with a salt","Encryption in transit"],"ans":[2],"why":"Hashing is one-way. Encryption can be reversed with the key, so it does not meet the requirement.","kind":"one","miss":false},{"id":"q005","d":1,"topic":"Security concepts","q":"Which defense-in-depth layer do DDoS protection and firewalls at the edge of the network belong to?","opts":["Data","Perimeter","Compute","Application"],"ans":[1],"why":"The perimeter layer guards against network-based attacks from outside, such as DDoS. The network layer is about segmentation inside.","kind":"one","miss":false},{"id":"q006","d":1,"topic":"Security concepts","q":"Which TWO are Zero Trust guiding principles?","opts":["Encrypt only data at rest","Trust the corporate network","Assume breach","Verify explicitly"],"ans":[2,3],"why":"The three principles are verify explicitly, use least privilege access and assume breach. Zero Trust never trusts a network location by itself.","kind":"two","miss":false},{"id":"q007","d":1,"topic":"Security concepts","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["In asymmetric encryption, data encrypted with the public key can be decrypted with the same public key.","A hash value can be decrypted to get the original data back.","HTTPS is an example of encryption in transit."],"ans":[0,0,1],"why":"Asymmetric encryption needs the other key of the pair. Hashing is one-way. HTTPS (TLS) protects data moving across a network.","miss":false},{"id":"q008","d":1,"topic":"Security concepts","type":"match","kind":"match","q":"Match each example to the defense-in-depth layer.","rows":["Badge access to the datacenter building","Multifactor authentication for sign-in","Patching virtual machine operating systems","Encrypting a database"],"choices":["Identity and access","Data","Physical","Compute"],"ans":[2,0,3,1],"why":"Physical is the building. Identity and access controls who signs in. Compute covers VMs and endpoints. Data is the innermost layer.","miss":false},{"id":"q009","d":1,"topic":"Identity concepts","q":"A user enters a password and then approves a prompt on their phone. Which process is this?","opts":["Federation","Authorization","Auditing","Authentication"],"ans":[3],"why":"Proving who you are is authentication. Authorization happens afterwards and decides what you can access.","kind":"one","miss":false},{"id":"q010","d":1,"topic":"Identity concepts","q":"After sign-in, a user can read a SharePoint site but cannot edit it. Which process decided that?","opts":["Single sign-on","Administration","Authorization","Authentication"],"ans":[2],"why":"Authorization sets the level of access an authenticated identity gets.","kind":"one","miss":false},{"id":"q011","d":1,"topic":"Identity concepts","q":"Users at Contoso sign in to a partner's app with their Contoso accounts. The partner's identity provider trusts Contoso's. What is this called?","opts":["Password hash synchronization","Multifactor authentication","Conditional Access","Federation"],"ans":[3],"why":"Federation is a trust relationship between identity providers across organizations.","kind":"one","miss":false},{"id":"q012","d":1,"topic":"Identity concepts","q":"Which statement about Active Directory Domain Services (AD DS) is true?","opts":["It is an on-premises directory service that does not natively support SaaS apps and modern authentication","It replaces the need for any authentication","It is the cloud identity provider included with Microsoft 365","It only stores device objects"],"ans":[0],"why":"AD DS is the on-premises directory. Microsoft Entra ID is the cloud identity provider built for modern authentication.","kind":"one","miss":false},{"id":"q013","d":1,"topic":"Identity concepts","q":"With modern authentication, what does the identity provider give the client after a successful sign-in?","opts":["A firewall rule","An encryption key for the disk","The user's password","A security token"],"ans":[3],"why":"The identity provider issues a security token that the client presents to apps. Apps trust the token, not the password.","kind":"one","miss":false},{"id":"q014","d":1,"topic":"Identity concepts","q":"Which TWO are pillars of an identity infrastructure?","opts":["Authentication","Encryption at rest","Auditing","Virtualization"],"ans":[0,2],"why":"The four pillars are administration, authentication, authorization and auditing.","kind":"two","miss":false},{"id":"q015","d":1,"topic":"Identity concepts","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Authorization happens before authentication.","In a federation, trust between two identity providers is always bidirectional.","Single sign-on lets a user sign in once and access multiple applications."],"ans":[0,0,1],"why":"Authentication comes first. Federation trust can be one-way. SSO means one sign-in for many apps.","miss":false},{"id":"q016","d":2,"topic":"Entra ID and identities","q":"An Azure VM needs to read secrets from Key Vault. You do not want to store or rotate any credentials. What should you use?","opts":["A shared administrator password","A device identity","A guest user account","A managed identity"],"ans":[3],"why":"Managed identities are managed by Azure, so there are no credentials in code or to rotate.","kind":"one","miss":false},{"id":"q017","d":2,"topic":"Entra ID and identities","q":"A managed identity must be used by five different virtual machines and should exist independently of them. Which type fits?","opts":["Guest identity","System-assigned managed identity","Hybrid joined device","User-assigned managed identity"],"ans":[3],"why":"User-assigned identities are standalone and can be shared. System-assigned is tied to exactly one resource.","kind":"one","miss":false},{"id":"q018","d":2,"topic":"Entra ID and identities","q":"An employee wants to use a personal phone for work email. Which device identity type fits a personal device?","opts":["Microsoft Entra hybrid joined","Managed identity","Microsoft Entra registered","Microsoft Entra joined"],"ans":[2],"why":"Registered is for personally owned (BYOD) devices. Joined and hybrid joined are for organization-owned devices.","kind":"one","miss":false},{"id":"q019","d":2,"topic":"Entra ID and identities","q":"A company wants on-premises AD users to sign in to Microsoft 365 with the same password, and wants sign-in to keep working if the on-premises servers go down. Which method fits?","opts":["Pass-through authentication","Password hash synchronization","Security defaults","Federation with AD FS"],"ans":[1],"why":"With password hash sync, authentication happens in the cloud, so it does not depend on on-premises servers. Pass-through and federation both need on-premises components at sign-in.","kind":"one","miss":false},{"id":"q020","d":2,"topic":"Entra ID and identities","q":"A vendor's staff must access your SharePoint site using their own company accounts. What should you use?","opts":["Microsoft Entra B2B collaboration","A system-assigned managed identity","Pass-through authentication","Microsoft Entra joined devices"],"ans":[0],"why":"B2B collaboration invites external users as guests who sign in with their own identity.","kind":"one","miss":false},{"id":"q021","d":2,"topic":"Entra ID and identities","q":"Which TWO are workload identities?","opts":["Managed identity","Microsoft Entra registered device","Guest user","Service principal"],"ans":[0,3],"why":"Workload identities are for software: applications, service principals and managed identities. Guests are human identities.","kind":"two","miss":false},{"id":"q022","d":2,"topic":"Entra ID and identities","type":"match","kind":"match","q":"Match each description to the identity type.","rows":["An employee's work account","A partner invited as a guest","An app that authenticates to call an API","A company laptop joined to Entra"],"choices":["External identity","Device identity","Workload identity","Workforce user identity"],"ans":[3,0,2,1],"why":"Human identities are workforce or external. Workload identities are for software. Devices have their own identity.","miss":false},{"id":"q023","d":2,"topic":"Authentication","q":"A user signs in with a password and a PIN they memorized. Is this multifactor authentication?","opts":["Yes, a PIN is something you have","Yes, because two items were entered","No, both are something you know","No, MFA requires three factors"],"ans":[2],"why":"MFA needs factors from different categories. A password and a memorized PIN are both knowledge factors.","kind":"one","miss":false},{"id":"q024","d":2,"topic":"Authentication","q":"Which sign-in method is passwordless?","opts":["A complex 20-character password","A FIDO2 passkey on a security key","A password plus a voice call","A password plus an SMS code"],"ans":[1],"why":"Passkeys (FIDO2), Windows Hello for Business and Microsoft Authenticator phone sign-in remove the password.","kind":"one","miss":false},{"id":"q025","d":2,"topic":"Authentication","q":"A small company has no Conditional Access licenses but wants MFA for all users and legacy authentication blocked. What should it turn on?","opts":["Microsoft Entra ID Protection","Privileged Identity Management","Password hash synchronization","Security defaults"],"ans":[3],"why":"Security defaults give a free baseline: MFA registration for all, MFA for admins, legacy authentication blocked.","kind":"one","miss":false},{"id":"q026","d":2,"topic":"Authentication","q":"Help desk calls for forgotten passwords are costing too much. Which feature lets users fix this themselves?","opts":["Custom banned password list","Access reviews","Microsoft Entra Connect","Self-service password reset"],"ans":[3],"why":"SSPR lets users reset or unlock their own accounts after verifying identity.","kind":"one","miss":false},{"id":"q027","d":2,"topic":"Authentication","q":"You want to stop users choosing passwords that contain your company name. What should you configure?","opts":["Custom banned password list","Global banned password list","Smart lockout","Security defaults"],"ans":[0],"why":"The custom list holds organization-specific terms. The global list is maintained by Microsoft and cannot be edited.","kind":"one","miss":false},{"id":"q028","d":2,"topic":"Authentication","q":"Which TWO are authentication factors that count as something you have?","opts":["A registered phone running Microsoft Authenticator","A password","A fingerprint","A FIDO2 security key"],"ans":[0,3],"why":"A phone or key is something you have. A fingerprint is something you are. A password is something you know.","kind":"two","miss":false},{"id":"q029","d":2,"topic":"Authentication","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Windows Hello for Business replaces passwords with a credential tied to the device.","Self-service password reset requires a help desk agent to approve each reset.","The global banned password list is applied automatically to all users."],"ans":[1,0,1],"why":"Windows Hello uses a device-bound credential unlocked by PIN or biometrics. SSPR needs no help desk. The global list is automatic.","miss":false},{"id":"q030","d":2,"topic":"Access management","q":"You must require MFA only when users sign in from outside the corporate network. Which feature should you use?","opts":["Security defaults","Conditional Access","Self-service password reset","Access reviews"],"ans":[1],"why":"Conditional Access applies controls based on signals such as location. Security defaults cannot target conditions.","kind":"one","miss":false},{"id":"q031","d":2,"topic":"Access management","q":"In a Conditional Access policy, what is the user's sign-in location an example of?","opts":["An enforcement","A role assignment","A signal","A decision"],"ans":[2],"why":"Signals are the inputs (user, location, device, app, risk). The decision is block or grant. Enforcement applies it.","kind":"one","miss":false},{"id":"q032","d":2,"topic":"Access management","q":"A help desk worker must reset user passwords in Microsoft Entra ID but must not manage Azure virtual machines. Which kind of role should you assign?","opts":["A sensitivity label","A managed identity","An Azure role at subscription scope","A Microsoft Entra role"],"ans":[3],"why":"Entra roles manage directory objects such as users and passwords. Azure roles manage Azure resources.","kind":"one","miss":false},{"id":"q033","d":2,"topic":"Access management","q":"Which role has the broadest permissions across Microsoft Entra ID and should be limited to very few people?","opts":["Reader","Billing Administrator","User Administrator","Global Administrator"],"ans":[3],"why":"Global Administrator can manage everything in Entra ID. Least privilege means few people hold it.","kind":"one","miss":false},{"id":"q034","d":2,"topic":"Access management","q":"Which outcome can a Conditional Access policy NOT produce by itself?","opts":["Granting access only from a compliant device","Automatically deleting the user account","Granting access with MFA required","Blocking access"],"ans":[1],"why":"Conditional Access blocks or grants access with requirements. It does not delete accounts.","kind":"one","miss":false},{"id":"q035","d":2,"topic":"Access management","q":"Which TWO can be used as signals in a Conditional Access policy?","opts":["The size of the user's mailbox","The application being accessed","The Azure region of a VM","The device platform"],"ans":[1,3],"why":"Common signals are user or group, location, device, application and risk.","kind":"two","miss":false},{"id":"q036","d":2,"topic":"Access management","type":"match","kind":"match","q":"Match each Conditional Access example to its part of the policy.","rows":["The user signs in from an unfamiliar country","Grant access, but require MFA","The requirement is applied when the user opens the app"],"choices":["Enforcement","Decision","Signal"],"ans":[2,1,0],"why":"Signals are inputs, the decision is block or grant with requirements, and enforcement applies it at access time.","miss":false},{"id":"q037","d":2,"topic":"Identity governance","q":"Administrators should hold the Global Administrator role only for the hour they need it, after approval. Which feature provides this?","opts":["Microsoft Entra ID Protection","Privileged Identity Management","Security defaults","Access reviews"],"ans":[1],"why":"PIM gives just-in-time, time-bound, approval-based role activation.","kind":"one","miss":false},{"id":"q038","d":2,"topic":"Identity governance","q":"Every quarter, group owners must confirm that members still need access, and unconfirmed members should be removed. What should you use?","opts":["Self-service password reset","Conditional Access","Privileged Identity Management","Access reviews"],"ans":[3],"why":"Access reviews recertify access on a schedule and can remove access automatically.","kind":"one","miss":false},{"id":"q039","d":2,"topic":"Identity governance","q":"A user's credentials are found in a leaked list on the dark web. Which type of risk does Microsoft Entra ID Protection raise?","opts":["Insider risk","Compliance risk","User risk","Sign-in risk"],"ans":[2],"why":"Leaked credentials suggest the identity itself is compromised, which is user risk. Sign-in risk is about a specific sign-in attempt.","kind":"one","miss":false},{"id":"q040","d":2,"topic":"Identity governance","q":"A sign-in comes from an anonymous IP address in a country the user has never visited. Which risk type is this?","opts":["Compliance score","Sign-in risk","User risk","Secure score"],"ans":[1],"why":"Sign-in risk is the probability that a given sign-in was not performed by the identity owner.","kind":"one","miss":false},{"id":"q041","d":2,"topic":"Identity governance","q":"New project members need a set of groups, an app and a SharePoint site, with access that expires after 90 days. Which feature bundles this?","opts":["Microsoft Entra Connect Sync","Azure Bastion","Custom banned password list","Entitlement management access packages"],"ans":[3],"why":"Access packages bundle resources with approval and expiration policies.","kind":"one","miss":false},{"id":"q042","d":2,"topic":"Identity governance","q":"Which TWO can PIM require before a user activates an eligible role?","opts":["Deleting their mailbox","Multifactor authentication","Approval from a designated approver","A new device purchase"],"ans":[1,2],"why":"PIM activation can require MFA, justification and approval, and is time-limited.","kind":"two","miss":false},{"id":"q043","d":2,"topic":"Identity governance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Privileged Identity Management provides time-bound access to roles.","Access reviews can only be completed by Global Administrators.","Microsoft Entra ID Protection can feed risk into Conditional Access policies."],"ans":[1,0,1],"why":"PIM is just-in-time and time-bound. Reviewers can be owners, managers or the users themselves. Risk is a Conditional Access signal.","miss":false},{"id":"q044","d":3,"topic":"Azure infrastructure security","q":"Admins need to RDP to Azure VMs without giving the VMs public IP addresses. What should you deploy?","opts":["Azure Bastion","Azure DDoS Protection","Azure Firewall","A network security group"],"ans":[0],"why":"Bastion provides RDP and SSH through the portal over TLS, so VMs need no public IP.","kind":"one","miss":false},{"id":"q045","d":3,"topic":"Azure infrastructure security","q":"A public website must be protected against SQL injection and cross-site scripting. What should you use?","opts":["Network security group","Azure DDoS Protection","Azure Bastion","Web Application Firewall"],"ans":[3],"why":"WAF inspects web requests at layer 7 for common exploits. NSGs filter by IP, port and protocol only.","kind":"one","miss":false},{"id":"q046","d":3,"topic":"Azure infrastructure security","q":"You need to allow only port 443 into one subnet and deny everything else. What is the simplest tool?","opts":["Web Application Firewall","Network security group","Azure Key Vault","Microsoft Sentinel"],"ans":[1],"why":"NSGs filter traffic to subnets or network interfaces with allow and deny rules.","kind":"one","miss":false},{"id":"q047","d":3,"topic":"Azure infrastructure security","q":"An application's connection strings are stored in its source code. Where should they be stored instead?","opts":["An NSG rule","Azure Key Vault","Azure Bastion","A sensitivity label"],"ans":[1],"why":"Key Vault centrally stores secrets, keys and certificates with controlled, logged access.","kind":"one","miss":false},{"id":"q048","d":3,"topic":"Azure infrastructure security","q":"You need one central, stateful firewall that filters outbound traffic by fully qualified domain name for several virtual networks. What should you use?","opts":["Azure Firewall","Network security group","Azure Bastion","Azure DDoS Protection"],"ans":[0],"why":"Azure Firewall is a managed, stateful firewall with application (FQDN) rules, used centrally. NSGs cannot filter by FQDN.","kind":"one","miss":false},{"id":"q049","d":3,"topic":"Azure infrastructure security","q":"Which TWO can be stored in Azure Key Vault?","opts":["Encryption keys","Certificates","NSG flow logs","Virtual machine images"],"ans":[0,1],"why":"Key Vault stores secrets, keys and certificates.","kind":"two","miss":false},{"id":"q050","d":3,"topic":"Azure infrastructure security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A network security group can be associated with a subnet.","Azure Bastion requires each virtual machine to have a public IP address.","Azure DDoS Protection helps keep an application available during a traffic flood."],"ans":[1,0,1],"why":"NSGs attach to subnets or NICs. Bastion removes the need for public IPs. DDoS Protection defends availability.","miss":false},{"id":"q051","d":3,"topic":"Azure infrastructure security","type":"match","kind":"match","q":"Match each need to the Azure service.","rows":["Absorb a flood of malicious traffic","Block SQL injection against a web app","Store an API key safely","SSH to a VM with no public IP"],"choices":["Azure Key Vault","Web Application Firewall","Azure DDoS Protection","Azure Bastion"],"ans":[2,1,0,3],"why":"Each service covers one job: availability under attack, web exploits, secret storage, and secure remote access.","miss":false},{"id":"q052","d":3,"topic":"Defender for Cloud","q":"Which Defender for Cloud feature gives one number that summarizes your security posture?","opts":["Access reviews","Workbooks","Compliance score","Secure score"],"ans":[3],"why":"Secure score is the Defender for Cloud posture measure. Compliance score belongs to Microsoft Purview Compliance Manager.","kind":"one","miss":false},{"id":"q053","d":3,"topic":"Defender for Cloud","q":"Which standard is applied by default when you enable Defender for Cloud on a subscription?","opts":["GDPR","Microsoft cloud security benchmark","PCI DSS","ISO 27001"],"ans":[1],"why":"MCSB is the default standard. Others can be added in the regulatory compliance dashboard.","kind":"one","miss":false},{"id":"q054","d":3,"topic":"Defender for Cloud","q":"You want to find misconfigured resources and get hardening guidance at no extra cost. Which capability provides this?","opts":["Defender for Servers","Microsoft Sentinel playbooks","Foundational CSPM","Azure Bastion"],"ans":[2],"why":"Foundational CSPM is free and provides recommendations and secure score.","kind":"one","miss":false},{"id":"q055","d":3,"topic":"Defender for Cloud","q":"Management ports on VMs should stay closed and open only when an admin requests access for a short time. Which feature does this?","opts":["Network security group default rules","Azure Bastion","Privileged Identity Management","Just-in-time VM access"],"ans":[3],"why":"JIT VM access in Defender for Cloud opens ports on request for a limited time.","kind":"one","miss":false},{"id":"q056","d":3,"topic":"Defender for Cloud","q":"What is the purpose of the Defender plans such as Defender for Servers and Defender for Storage?","opts":["Classifying documents with labels","Storing encryption keys","Reviewing guest user access","Cloud workload protection with threat detection and alerts"],"ans":[3],"why":"The Defender plans are the cloud workload protection pillar. They detect threats against specific resource types.","kind":"one","miss":false},{"id":"q057","d":3,"topic":"Defender for Cloud","q":"Which TWO environments besides Azure can Defender for Cloud protect?","opts":["On-premises servers","Amazon Web Services","Exchange Online mailboxes","Microsoft Teams chats"],"ans":[0,1],"why":"Defender for Cloud is multicloud (AWS, GCP) and hybrid. Email and Teams are covered by Defender for Office 365.","kind":"two","miss":false},{"id":"q058","d":3,"topic":"Defender for Cloud","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A higher secure score indicates a lower identified risk level.","Security recommendations in Defender for Cloud are generated by assessing resources against security standards.","Foundational CSPM requires a paid Defender plan."],"ans":[1,1,0],"why":"Higher score means lower risk. Recommendations come from standards built on Azure Policy. Foundational CSPM is free.","miss":false},{"id":"q059","d":3,"topic":"Microsoft Sentinel","q":"Which statement describes a SIEM system?","opts":["It stores secrets and certificates","It filters traffic between subnets","It classifies documents with labels","It collects log data from across the estate, analyzes it and raises alerts and incidents"],"ans":[3],"why":"SIEM is security information and event management: collect, correlate, alert.","kind":"one","miss":false},{"id":"q060","d":3,"topic":"Microsoft Sentinel","q":"You want Sentinel to automatically disable a user account when a specific incident is created. What should you build?","opts":["A data connector","A workbook","A sensitivity label","A playbook"],"ans":[3],"why":"Playbooks are automated response workflows based on Azure Logic Apps.","kind":"one","miss":false},{"id":"q061","d":3,"topic":"Microsoft Sentinel","q":"Which Sentinel feature brings in sign-in logs from Microsoft Entra ID?","opts":["A data connector","A playbook","An analytics rule","A notebook"],"ans":[0],"why":"Data connectors ingest data. Analytics rules then detect threats in it.","kind":"one","miss":false},{"id":"q062","d":3,"topic":"Microsoft Sentinel","q":"A security analyst wants to search proactively for signs of an attacker before any alert is raised. Which Sentinel capability is this?","opts":["Playbooks","Data connectors","Workbooks","Hunting"],"ans":[3],"why":"Hunting is proactive searching with queries. Workbooks visualize, playbooks respond.","kind":"one","miss":false},{"id":"q063","d":3,"topic":"Microsoft Sentinel","q":"Which term describes automating the response to security alerts with workflows?","opts":["CASB","SIEM","SOAR","CSPM"],"ans":[2],"why":"SOAR is security orchestration, automation and response.","kind":"one","miss":false},{"id":"q064","d":3,"topic":"Microsoft Sentinel","q":"Which TWO describe Microsoft Sentinel?","opts":["SOAR solution","Password manager","Cloud access security broker","Cloud-native SIEM"],"ans":[0,3],"why":"Sentinel is a SIEM and SOAR solution. The CASB is Defender for Cloud Apps.","kind":"two","miss":false},{"id":"q065","d":3,"topic":"Microsoft Sentinel","type":"match","kind":"match","q":"Match each Sentinel feature to what it does.","rows":["Data connectors","Analytics rules","Workbooks","Playbooks"],"choices":["Automate response","Visualize and monitor","Detect threats","Collect data"],"ans":[3,2,1,0],"why":"Connectors collect, analytics detect, workbooks visualize, playbooks respond.","miss":false},{"id":"q066","d":3,"topic":"Defender XDR","q":"Users are receiving phishing emails with malicious links. Which service protects against this?","opts":["Microsoft Defender for Identity","Azure Firewall","Microsoft Defender for Cloud","Microsoft Defender for Office 365"],"ans":[3],"why":"Defender for Office 365 protects email and collaboration from phishing, malicious links and attachments.","kind":"one","miss":false},{"id":"q067","d":3,"topic":"Defender XDR","q":"You want to discover which unsanctioned SaaS apps employees are using (shadow IT). Which service should you use?","opts":["Microsoft Defender for Endpoint","Microsoft Defender for Cloud","Microsoft Defender for Office 365","Microsoft Defender for Cloud Apps"],"ans":[3],"why":"Defender for Cloud Apps is the CASB that discovers and controls cloud app use. Defender for Cloud protects Azure and multicloud workloads.","kind":"one","miss":false},{"id":"q068","d":3,"topic":"Defender XDR","q":"Which service uses on-premises Active Directory signals to detect lateral movement and compromised identities?","opts":["Microsoft Purview Audit","Microsoft Defender for Identity","Microsoft Defender for Endpoint","Microsoft Entra ID Protection"],"ans":[1],"why":"Defender for Identity monitors on-premises AD signals. Entra ID Protection detects risk on cloud identities.","kind":"one","miss":false},{"id":"q069","d":3,"topic":"Defender XDR","q":"Which service provides endpoint detection and response (EDR) for laptops and servers?","opts":["Azure Bastion","Microsoft Defender for Cloud Apps","Microsoft Defender for Office 365","Microsoft Defender for Endpoint"],"ans":[3],"why":"Defender for Endpoint protects devices and includes EDR.","kind":"one","miss":false},{"id":"q070","d":3,"topic":"Defender XDR","q":"Which service continuously finds and prioritizes software weaknesses on devices by risk?","opts":["Microsoft Sentinel workbooks","Microsoft Defender Threat Intelligence","Microsoft Purview Compliance Manager","Microsoft Defender Vulnerability Management"],"ans":[3],"why":"Defender Vulnerability Management discovers assets, assesses vulnerabilities and prioritizes by risk.","kind":"one","miss":false},{"id":"q071","d":3,"topic":"Defender XDR","q":"Which TWO are available in the Microsoft Defender portal?","opts":["Sensitivity label publishing","Incidents that combine alerts from several Defender services","Retention label policies","Advanced hunting"],"ans":[1,3],"why":"The Defender portal unifies incidents, alerts and hunting. Labels and retention live in the Microsoft Purview portal.","kind":"two","miss":false},{"id":"q072","d":3,"topic":"Defender XDR","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Microsoft Defender for Cloud Apps is a cloud access security broker.","Microsoft Defender for Endpoint is designed to protect email from phishing.","Microsoft Defender XDR correlates signals across endpoints, identities, email and apps."],"ans":[1,0,1],"why":"Cloud Apps is the CASB. Email protection is Defender for Office 365. XDR correlates across domains.","miss":false},{"id":"q073","d":3,"topic":"Defender XDR","type":"match","kind":"match","q":"Match each Defender service to what it protects.","rows":["Defender for Office 365","Defender for Endpoint","Defender for Identity","Defender for Cloud Apps"],"choices":["SaaS applications","Devices","Email and collaboration","On-premises Active Directory identities"],"ans":[2,1,3,0],"why":"Each Defender XDR service covers one domain, and the portal joins their signals.","miss":false},{"id":"q074","d":4,"topic":"Trust and privacy","q":"An auditor asks for Microsoft's SOC 2 audit report for Azure. Where can you download it?","opts":["Service Trust Portal","Microsoft Entra admin center","Azure Advisor","Microsoft Defender portal"],"ans":[0],"why":"The Service Trust Portal publishes independent audit reports and compliance documents.","kind":"one","miss":false},{"id":"q075","d":4,"topic":"Trust and privacy","q":"Which Microsoft privacy principle says your email and chat content is not used to target ads?","opts":["Transparency","No content-based targeting","Benefits to you","Strong legal protections"],"ans":[1],"why":"No content-based targeting: personal content is not used for advertising.","kind":"one","miss":false},{"id":"q076","d":4,"topic":"Trust and privacy","q":"Which privacy principle is about Microsoft being open about what data it collects and how it is used?","opts":["Security","Transparency","Benefits to you","Control"],"ans":[1],"why":"Transparency is being open about collection and use. Control is about your choices over the data.","kind":"one","miss":false},{"id":"q077","d":4,"topic":"Trust and privacy","q":"On the Service Trust Portal, which feature lets you save documents and get notified when they are updated?","opts":["Secure score","My Library","Compliance Manager","Content explorer"],"ans":[1],"why":"My Library pins documents and can notify you of updates.","kind":"one","miss":false},{"id":"q078","d":4,"topic":"Trust and privacy","q":"Which of these is NOT one of Microsoft's six privacy principles?","opts":["Control","Strong legal protections","Zero standing access","Security"],"ans":[2],"why":"The six are control, transparency, security, strong legal protections, no content-based targeting and benefits to you.","kind":"one","miss":false},{"id":"q079","d":4,"topic":"Trust and privacy","q":"Which TWO can you find on the Service Trust Portal?","opts":["Penetration test and security assessment reports","Independent audit reports for Microsoft cloud services","Your organization's secure score","Your tenant's sign-in logs"],"ans":[0,1],"why":"The portal publishes Microsoft's own compliance evidence. Tenant data lives in your admin portals.","kind":"two","miss":false},{"id":"q080","d":4,"topic":"Trust and privacy","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["The Service Trust Portal shows how Microsoft cloud services meet compliance standards.","Under Microsoft's privacy principles, customer content is used to target advertising.","'Control' means customers have tools and choices to manage their own data."],"ans":[1,0,1],"why":"The portal provides compliance evidence. Content is never used for ad targeting. Control puts the customer in charge.","miss":false},{"id":"q081","d":4,"topic":"Compliance management","q":"You must track your organization's progress toward GDPR requirements with recommended actions. Which tool should you use?","opts":["Service Trust Portal","Compliance Manager","Azure Policy","Microsoft Sentinel"],"ans":[1],"why":"Compliance Manager has prebuilt assessments for regulations, improvement actions and a compliance score.","kind":"one","miss":false},{"id":"q082","d":4,"topic":"Compliance management","q":"What does the compliance score measure?","opts":["The percentage of emails encrypted","The number of blocked sign-ins","Progress in completing improvement actions that reduce compliance risk","How many resources pass Azure Policy"],"ans":[2],"why":"The compliance score reflects completed improvement actions, weighted by risk.","kind":"one","miss":false},{"id":"q083","d":4,"topic":"Compliance management","q":"In Compliance Manager, a control that Microsoft implements on your behalf is called what?","opts":["Your control","Technical control","Shared control","Microsoft-managed control"],"ans":[3],"why":"Microsoft-managed controls are Microsoft's responsibility. Your controls are yours. Shared controls are both.","kind":"one","miss":false},{"id":"q084","d":4,"topic":"Compliance management","q":"Where do you open Compliance Manager?","opts":["Microsoft Purview portal","Azure portal Cost Management","Microsoft Entra admin center","Microsoft Defender portal"],"ans":[0],"why":"Compliance Manager is a Microsoft Purview solution.","kind":"one","miss":false},{"id":"q085","d":4,"topic":"Compliance management","q":"Your compliance score is 85%. What does that tell you?","opts":["You have completed most recommended improvement actions, but it does not prove legal compliance","85% of your users have MFA","Microsoft has audited your tenant","You are certified as compliant with all regulations"],"ans":[0],"why":"The score measures progress on actions. It is not a certification or a guarantee.","kind":"one","miss":false},{"id":"q086","d":4,"topic":"Compliance management","q":"Which TWO does Compliance Manager provide?","opts":["Real-time blocking of phishing emails","Prebuilt assessments for common regulations","Step-by-step guidance on improvement actions","Just-in-time VM access"],"ans":[1,2],"why":"Compliance Manager provides assessments, improvement actions and the compliance score.","kind":"two","miss":false},{"id":"q087","d":4,"topic":"Compliance management","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Compliance Manager includes templates for regulations and standards.","A high compliance score guarantees that the organization is compliant with a regulation.","Shared controls are implemented by both Microsoft and the customer."],"ans":[1,0,1],"why":"Templates create assessments. The score is not a guarantee. Shared controls belong to both.","miss":false},{"id":"q088","d":4,"topic":"Information protection","q":"A document must stay encrypted and show a 'Confidential' watermark even after it is emailed outside the company. What should you apply?","opts":["A sensitivity label","A retention label","An access review","An NSG rule"],"ans":[0],"why":"Sensitivity labels are persistent and can encrypt and mark content. Retention labels control how long content is kept.","kind":"one","miss":false},{"id":"q089","d":4,"topic":"Information protection","q":"You need to see that a user copied a labeled file to a USB drive yesterday. Which tool shows this?","opts":["Compliance Manager","Service Trust Portal","Activity explorer","Cont
