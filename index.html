<style>
/* Phone-first quest app. Night-sky indigo, one sky-blue accent, gold for XP. Domain hues: D1 violet, D2 sky, D3 mint.
   Type: Fredoka for headings and numbers, Nunito for reading. Bottom tab bar with safe-area padding. */
:root{
  --bg:#303446;--bg2:#232634;--card:#292c3c;--line:#414559;--text:#c6d0f5;--sub:#b5bfe2;--mute:#a5adce;
  --acc:#ca9ee6;--xp:#e5c890;--ok:#a6d189;--bad:#e78284;--warn:#ef9f76;--d1:#babbf1;--d2:#85c1dc;--d3:#81c8be;--d4:#f4b8e4;
  --on:#232634;--cloud:#c6d0f5;--cloudln:#838ba7;
  --fh:"JetBrainsMono Nerd Font","JetBrainsMono NF","JetBrains Mono",ui-monospace,monospace;--fb:"JetBrainsMono Nerd Font","JetBrainsMono NF","JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{
  --bg:#eff1f5;--bg2:#e6e9ef;--card:#ffffff;--line:#ccd0da;--text:#4c4f69;--sub:#5c5f77;--mute:#5c5f77;
  --acc:#8839ef;--xp:#9a5b00;--ok:#15803d;--bad:#c00e35;--warn:#b45309;--d1:#4655d0;--d2:#1a5ce0;--d3:#0f766e;--d4:#a8327f;
  --on:#ffffff;--cloud:#ffffff;--cloudln:#8c8fa1;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--fh);font-weight:700;letter-spacing:-.2px;margin:0;line-height:1.2}
h2{font-size:20px;margin-bottom:8px}h3{font-size:17px}
p{margin:0 0 10px}
.mute{color:var(--mute)}.sub{color:var(--sub)}.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--fh);font-weight:600;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:6px}.bmark{width:28px;height:28px;flex:0 0 28px}
.brand small{display:block;white-space:nowrap;font-family:var(--fb);font-weight:600;font-size:11px;color:var(--mute);letter-spacing:.6px;text-transform:uppercase;margin-top:-2px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px}
.pill b{font-family:var(--fh);font-weight:600}
.xpbar{height:8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--xp);border-radius:99px;transition:width .4s}
/* cards and buttons */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.btn{min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.gold{background:var(--xp);border-color:var(--xp);color:var(--on)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>.btn{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:0 0 auto;min-height:40px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--bg2);font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.bar{height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.d1{--c:var(--d1)}.d2{--c:var(--d2)}.d3{--c:var(--d3)}.d4{--c:var(--d4)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;border:1.5px solid var(--c,var(--line));color:var(--c,var(--sub))}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav button{background:none;border:0;border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;color:var(--mute)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--acc);background:var(--card)}
/* mascot */
.hero{display:flex;gap:12px;align-items:flex-end}
.hero svg{width:104px;flex:0 0 104px;height:auto}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:600;flex:1}
.bubble:before{content:"";position:absolute;left:-8px;bottom:18px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* quests */
.quest{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.quest .bar{grid-column:1/3}
.done{color:var(--ok)}
/* map */
.node{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:12px;margin:10px 0}
.num{width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--on);font-family:var(--fh);font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center}
.stars{font-size:20px;letter-spacing:2px;white-space:nowrap}
.stars .on{color:var(--xp)}.stars .off{color:var(--line)}
ul.pts{margin:6px 0 0;padding-left:20px}ul.pts li{margin:5px 0}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--bg2)}
summary{padding:12px 14px;font-weight:800;cursor:pointer;min-height:44px}
details .in{padding:0 14px 12px}
.fact{padding:8px 0;border-top:1px solid var(--line)}.fact b{display:block}
/* flashcard */
.fc{min-height:240px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:20px;font-weight:600;cursor:pointer;border:2px solid var(--c,var(--line))}
.fc .lab{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.fc.back{background:var(--bg2);font-size:18px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rate .btn{padding:8px 2px;min-width:0;flex-direction:column;gap:2px;line-height:1.15;text-align:center;font-size:15px}.rate .btn br{display:none}.rate .btn .small{font-size:10.5px;font-weight:600;white-space:nowrap}
/* quiz */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:56px;padding:12px 14px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg2);font-weight:600}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:600;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--card)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg2))}
.why{border-left:5px solid var(--acc);background:var(--bg2);border-radius:10px;padding:10px 14px;margin:10px 0}
.why.good{border-color:var(--ok)}.why.nope{border-color:var(--bad)}
.hearts{color:var(--bad);font-size:20px;letter-spacing:2px}.hearts .lost{color:var(--line)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duel .opt{min-height:96px;justify-content:center;text-align:center;font-family:var(--fh);font-size:19px;margin:0}
.clue{font-size:19px;font-weight:800;text-align:center;padding:10px 4px 16px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid button{min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);font-weight:800;font-size:14px}
.grid .a{background:var(--acc);color:var(--on);border-color:var(--acc)}.grid .f{border-color:var(--warn)}.grid .cur{outline:3px solid var(--text)}
.big{font-family:var(--fh);font-weight:600;font-size:44px;line-height:1}
.mode{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.mode .ic{width:48px;height:48px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:26px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{text-align:center;padding:10px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);font-size:12px;font-weight:800}
.bdg .e{font-size:28px;display:block}.bdg.lock{border-style:dashed;color:var(--mute)}
.chk{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--xp);color:var(--on);font-weight:800;padding:10px 18px;border-radius:99px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.35);animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
textarea,input[type=number],input[type=date],select{width:100%;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;min-height:46px}
.center{text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;margin:10px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.me{margin-left:auto;background:var(--acc);color:var(--on);border-bottom-right-radius:6px;font-weight:600}
.msg.nb{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg code{background:var(--bg2);padding:1px 6px;border-radius:6px}
.chatbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg2);border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.chatbar textarea{flex:1;min-height:48px;max-height:120px;resize:none}
.chatbar .btn{flex:0 0 auto}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop2{40%{transform:scale(1.04)}}
.opt.wrong{animation:shake .4s}.opt.right{animation:pop2 .35s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.cf{position:absolute;width:9px;height:9px;border-radius:2px;animation:cfb .9s ease-out forwards}
@keyframes cfb{to{transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--rot));opacity:0}}
.fl{position:absolute;transform:translateX(-50%);color:var(--xp);font-family:var(--fh);font-size:24px;text-shadow:0 2px 8px rgba(0,0,0,.4);animation:flt 1s ease-out forwards}
@keyframes flt{to{transform:translate(-50%,-70px);opacity:0}}
.flash{position:absolute;inset:0;background:var(--bad);opacity:.0;animation:fl2 .45s ease-out}
@keyframes fl2{20%{opacity:.22}to{opacity:0}}

.hintd{display:none}
@media (hover:hover){.opt:hover:not(:disabled),.btn:hover:not(:disabled),.node:hover,.mode:hover,.chip:hover{border-color:var(--acc);transform:translateY(-1px)}.btn,.opt,.node,.mode{transition:transform .12s,border-color .12s}}

@media (max-width:499px){#pLayout{display:none}}

.bossart{display:inline-block}.bossart svg{display:block;overflow:visible}
.b-idle svg,.b-win svg{animation:bob 2.6s ease-in-out infinite}.b-win svg{animation-duration:1.1s}
.b-hit svg{animation:bhit .5s}@keyframes bhit{0%{filter:brightness(2.4)}25%{transform:translateX(-12px) rotate(-6deg)}55%{transform:translateX(9px) rotate(5deg)}100%{transform:none;filter:none}}
.b-atk svg{animation:batk .55s}@keyframes batk{40%{transform:translateY(18px) scale(1.2)}100%{transform:none}}
.bossart.b-dead svg{transform:rotate(14deg) translateY(10px);filter:grayscale(.9) brightness(.92);opacity:.92;animation:bfall .9s}@keyframes bfall{from{transform:none;filter:none;opacity:1}}
.hrow{display:flex;gap:8px;justify-content:center;margin:2px 0 6px}.hrt svg{width:32px;height:32px;display:block}.hrt.lost svg{opacity:.7}
.hrt.brk svg{animation:hbrk .8s}@keyframes hbrk{0%{transform:scale(1.5);filter:none}30%{transform:scale(1.5) rotate(-14deg)}60%{transform:scale(.8) rotate(10deg)}100%{transform:scale(1)}}

<script type="application/json" id="data">{"order":["az900","sc900","az104","sc500"],"planned":[{"id":"az104","code":"AZ-104","name":"Microsoft Azure Administrator"},{"id":"sc500","code":"SC-500","name":"Microsoft Cloud and AI Security Engineer Associate"}],"packs":{"az900":{"meta":{"id":"az900","code":"AZ-900","name":"Microsoft Azure Fundamentals","quest":"AZ-900 Quest","domains":{"1":"Cloud concepts","2":"Architecture and services","3":"Management and governance"},"weights":{"1":"25-30%","2":"35-40%","3":"30-35%"},"bosses":{"1":["The CapEx Colossus","🗄️"],"2":["The Zone Hydra","🐉"],"3":["The Policy Warden","🛡️"]},"mix":[14,19,17],"quickMix":[6,8,6],"fullMins":60,"quickMins":20,"passPct":70,"bookPct":80,"msUrl":"https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/practice/assessment?assessment-type=practice&assessmentId=23&practice-assessment-type=certification","studyGuide":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-900","base":{"t":"2026-11-02","pct":36,"src":"ms","dom":{"1":[5,14],"2":[7,19],"3":[6,17]}},"baseSecs":31,"taunts":{"1":["\"Buy more servers. Upfront!\"","\"Pay for 100 servers, use 3!\"","\"Who needs elasticity? I am HUGE.\"","\"Your capacity plan is my lunch.\""],"2":["\"One zone down, two to go.\"","\"No region pair can save you.\"","\"Your VNet is wide open!\"","\"Hot tier, cold tier, wrong tier!\""],"3":["\"Denied by policy!\"","\"Locked. ReadOnly.\"","\"Tag your resources, peasant.\"","\"No budget alert for you.\""]}},"cards":[{"id":"c001","d":1,"topic":"Cloud models","front":"What is cloud computing?","back":"Computing services (servers, storage, databases, networking, software) delivered over the internet, on demand, billed for what you use.","miss":false},{"id":"c002","d":1,"topic":"Cloud models","front":"Public cloud: who owns the hardware, and what do you pay?","back":"The provider owns and runs it; hardware is shared. No upfront hardware cost, pay as you go, easy to scale. You get less control.","miss":true},{"id":"c003","d":1,"topic":"Cloud models","front":"Private cloud: what are its characteristics?","back":"Used by one organization. You buy and maintain the hardware (CapEx), and you control the resources and security. Fits strict compliance needs.","miss":true},{"id":"c004","d":1,"topic":"Cloud models","front":"Hybrid cloud: what is it and when do you use it?","back":"Public and private connected, with workloads moving between them. Keep sensitive data on-premises, use the public cloud for extra capacity. Azure Arc manages both sides.","miss":false},{"id":"c005","d":1,"topic":"Cloud models","front":"“Hardware must be purchased.” Public, private or hybrid?","back":"Private. (“Pay only for what you use” and quick provisioning are public cloud traits.)","miss":true},{"id":"c006","d":1,"topic":"Cloud models","front":"What is serverless?","back":"You run code or logic and the provider manages the servers. It scales automatically and bills for execution time. Example: Azure Functions. Servers still exist; you just don't manage them.","miss":false},{"id":"c007","d":1,"topic":"Cloud models","front":"Name two cloud advantages that come from geo-distribution.","back":"Deploy to regional datacenters near users (better performance) and keep running if one region fails.","miss":false},{"id":"c008","d":1,"topic":"Pricing and cost model","front":"What is the consumption-based model?","back":"Pay only for what you use. No upfront cost, and the bill stops when usage stops. It is an OpEx model.","miss":true},{"id":"c009","d":1,"topic":"Pricing and cost model","front":"CapEx or OpEx: “upfront, one-time spend such as buying hardware”?","back":"CapEx (capital expenditure). OpEx is spending as you go, billed by use, with no upfront cost.","miss":true},{"id":"c010","d":1,"topic":"Pricing and cost model","front":"Why is the cloud often cheaper than an on-premises datacenter?","back":"You are billed only for what you use, with no hardware to buy, house, power or maintain.","miss":true},{"id":"c011","d":1,"topic":"Pricing and cost model","front":"Compare pay-as-you-go and commitment-based pricing.","back":"Pay-as-you-go: flexible, no commitment, best for variable or short-term use. Commitment (reservations, savings plans, 1 or 3 years): lower unit price, best for steady, predictable use.","miss":false},{"id":"c012","d":1,"topic":"Pricing and cost model","front":"What does Azure Hybrid Benefit do?","back":"Lets you reuse existing Windows Server and SQL Server licenses (with Software Assurance) in Azure to reduce cost.","miss":false},{"id":"c013","d":1,"topic":"Shared responsibility","front":"Shared responsibility: what does Microsoft ALWAYS own?","back":"The physical datacenter, physical network and physical hosts.","miss":false},{"id":"c014","d":1,"topic":"Shared responsibility","front":"Shared responsibility: what do YOU ALWAYS own?","back":"Your information and data, devices, and accounts and identities.","miss":false},{"id":"c015","d":1,"topic":"Shared responsibility","front":"Who manages the OS in IaaS, PaaS and SaaS?","back":"IaaS: you. PaaS: Microsoft. SaaS: Microsoft.","miss":false},{"id":"c016","d":1,"topic":"Shared responsibility","front":"Who manages the application in IaaS, PaaS and SaaS?","back":"IaaS: you. PaaS: you. SaaS: Microsoft.","miss":false},{"id":"c017","d":1,"topic":"Service types","front":"What is IaaS and what are its examples and use cases?","back":"Rent infrastructure: VMs, storage, virtual networks. You manage the OS, apps and data. Use for lift and shift, test and dev, datacenter extension. Examples: Azure VMs, virtual networks.","miss":true},{"id":"c018","d":1,"topic":"Service types","front":"What is PaaS and what are its examples?","back":"Build and run apps without managing servers or the OS. You manage your app and data. Examples: App Service, Azure SQL Database, Cosmos DB, Azure Functions.","miss":true},{"id":"c019","d":1,"topic":"Service types","front":"What is SaaS and how is it usually paid for?","back":"Finished software hosted and managed for you, used over the internet, usually licensed by monthly or annual subscription. Example: Microsoft 365.","miss":false},{"id":"c020","d":1,"topic":"Service types","front":"Your developers want to focus on building the app, not managing servers. Which service type?","back":"PaaS.","miss":true},{"id":"c021","d":1,"topic":"Service types","front":"Is Azure Cosmos DB IaaS, PaaS or SaaS? And Azure VMs?","back":"Cosmos DB: PaaS. Azure VMs: IaaS.","miss":true},{"id":"c022","d":1,"topic":"Benefits of the cloud","front":"What does high availability depend on in the public cloud?","back":"The service-level agreement (SLA). Different services and tiers have different SLAs.","miss":true},{"id":"c023","d":1,"topic":"Benefits of the cloud","front":"Scalability vs elasticity?","back":"Scalability: you can add or remove resources to handle load. Elasticity: it happens automatically and quickly with demand, in and back out.","miss":false},{"id":"c024","d":1,"topic":"Benefits of the cloud","front":"Scale up or scale out: adding more VMs to handle load?","back":"Scale out (horizontal scaling). Scale up (vertical) = a bigger VM with more CPU or RAM.","miss":true},{"id":"c025","d":1,"topic":"Benefits of the cloud","front":"Which benefit comes from spreading resources across multiple Azure regions?","back":"High availability (resilience to a regional outage). Scalability is about capacity, not location.","miss":true},{"id":"c026","d":1,"topic":"Benefits of the cloud","front":"Cloud backup, data replication and geo-distribution are features of which plan?","back":"A disaster recovery plan.","miss":true},{"id":"c027","d":1,"topic":"Benefits of the cloud","front":"Reliability: what three ideas?","back":"Resiliency, redundancy and failover. Predictability covers performance (autoscaling, load balancing, high availability) and cost.","miss":false},{"id":"c028","d":1,"topic":"Benefits of the cloud","front":"How do you calculate a composite SLA?","back":"Multiply the SLAs of the services together. It is always lower than the lowest single SLA. Example: 99.9% × 99.95% ≈ 99.85%.","miss":false},{"id":"c029","d":1,"topic":"Benefits of the cloud","front":"Downtime per year at 99%, 99.9% and 99.99%?","back":"99% ≈ 3.65 days. 99.9% ≈ 8.76 hours. 99.99% ≈ 52.6 minutes.","miss":false},{"id":"c030","d":1,"topic":"Benefits of the cloud","front":"Management OF the cloud vs management IN the cloud?","back":"Of: autoscaling, deploying from templates, monitoring and alerts. In: using the portal, CLI, PowerShell and APIs to manage your resources.","miss":false},{"id":"c031","d":1,"topic":"Benefits of the cloud","front":"Security and governance in the cloud: who is responsible?","back":"Responsibility is shared. The provider supplies security tools and compliance; governance sets your standards and policies.","miss":false},{"id":"c032","d":2,"topic":"Regions and zones","front":"What is an availability zone?","back":"A physically separate datacenter (or group of datacenters) inside one Azure region, with independent power, cooling and networking.","miss":true},{"id":"c033","d":2,"topic":"Regions and zones","front":"What is a region pair?","back":"Two regions in the same geography, at least 300 miles apart, used for disaster recovery. Microsoft updates paired regions one at a time.","miss":true},{"id":"c034","d":2,"topic":"Regions and zones","front":"A region pair is always within the same what?","back":"The same geography (for example US or Europe). Not the same availability zone.","miss":true},{"id":"c035","d":2,"topic":"Regions and zones","front":"Region, availability zone, geography: which contains which?","back":"Geography > region > availability zones > datacenters.","miss":false},{"id":"c036","d":2,"topic":"Regions and zones","front":"Zonal, zone-redundant and non-regional services: what are they?","back":"Zonal: you pin a resource to one zone. Zone-redundant: replicated across zones automatically. Non-regional: not tied to a region (for example Entra ID).","miss":false},{"id":"c037","d":2,"topic":"Regions and zones","front":"What are sovereign regions?","back":"Instances isolated from the main Azure instance for compliance or legal reasons, such as Azure Government (US) and Azure China 21Vianet.","miss":false},{"id":"c038","d":2,"topic":"Management hierarchy","front":"Order the Azure hierarchy from top to bottom.","back":"Management groups > subscriptions > resource groups > resources.","miss":false},{"id":"c039","d":2,"topic":"Management hierarchy","front":"What is a resource? Is a storage account named storage001 a resource or a resource group?","back":"A resource is a manageable item such as a VM, storage account, web app, database or VNet. storage001 is a resource.","miss":true},{"id":"c040","d":2,"topic":"Management hierarchy","front":"Resource group rules to know.","back":"A resource lives in exactly one group. Groups cannot nest. Deleting a group deletes everything in it. Access, policy and locks applied to a group apply to current and future resources.","miss":false},{"id":"c041","d":2,"topic":"Management hierarchy","front":"What are the two jobs of a subscription?","back":"A billing boundary and an access-control boundary. Subscriptions hold resource groups and resources.","miss":false},{"id":"c042","d":2,"topic":"Management hierarchy","front":"What do management groups do, and how do they differ from administrative units?","back":"Management groups apply access, policy and compliance across multiple subscriptions. Administrative units delegate admin of Microsoft Entra resources (users, groups), not Azure resources.","miss":true},{"id":"c043","d":2,"topic":"Management hierarchy","front":"Management group limits.","back":"Up to 6 levels of depth (not counting root or subscription level), 10,000 per directory, and each has one parent.","miss":false},{"id":"c044","d":2,"topic":"Management hierarchy","front":"What is Azure Resource Manager (ARM)?","back":"The deployment and management service for Azure. Every tool (portal, CLI, PowerShell, APIs) goes through it, so you get consistent results, access control, locks and tags.","miss":true},{"id":"c045","d":2,"topic":"Compute","front":"Virtual machines: service type and your responsibility?","back":"IaaS. You patch and update the OS and software inside the VM.","miss":false},{"id":"c046","d":2,"topic":"Compute","front":"VM size letters.","back":"B burstable, D general purpose, E memory optimized, F compute optimized, M large memory, L storage optimized, N GPU.","miss":false},{"id":"c047","d":2,"topic":"Compute","front":"Virtual machine scale set: what is it?","back":"A group of identical, load-balanced VMs that scale out and in automatically on demand or a schedule.","miss":false},{"id":"c048","d":2,"topic":"Compute","front":"Availability set: what does it protect against?","back":"Hardware failure and planned maintenance within a region, using update domains (reboot together) and fault domains (share power and network). No extra cost.","miss":false},{"id":"c049","d":2,"topic":"Compute","front":"What is Azure Virtual Desktop?","back":"A cloud-hosted desktop and app virtualization service, accessible from many devices.","miss":false},{"id":"c050","d":2,"topic":"Compute","front":"Containers vs VMs.","back":"Containers share the host OS and start fast and light. VMs each carry a full OS. Azure options: Container Instances (simple, fast), Container Apps (serverless containers), AKS (Kubernetes orchestration).","miss":false},{"id":"c051","d":2,"topic":"Compute","front":"What is Azure App Service?","back":"A PaaS platform for hosting web apps, APIs and mobile backends without managing servers.","miss":false},{"id":"c052","d":2,"topic":"Compute","front":"What is Azure Functions?","back":"Serverless, event-driven code. Runs when triggered (timer, HTTP, queue) and scales automatically.","miss":false},{"id":"c053","d":2,"topic":"Compute","front":"Which resources does a VM need?","back":"The VM itself plus a disk, a virtual network and subnet, a network interface, and usually an IP address and network security rules.","miss":false},{"id":"c054","d":2,"topic":"Networking","front":"What is a virtual network (VNet)?","back":"Your private network in Azure. Resources inside communicate with each other, the internet and on-premises, and you divide it into subnets.","miss":false},{"id":"c055","d":2,"topic":"Networking","front":"How do you let two virtual networks communicate?","back":"VNet peering, over Microsoft's backbone as if they were one network.","miss":true},{"id":"c056","d":2,"topic":"Networking","front":"What is VPN Gateway used for?","back":"An encrypted tunnel over the public internet that connects an on-premises datacenter to an Azure VNet (site-to-site), one device to a VNet (point-to-site), or two VNets (VNet-to-VNet).","miss":true},{"id":"c057","d":2,"topic":"Networking","front":"VPN Gateway high availability options.","back":"Active/standby (failover in about 90 seconds on unplanned failure), active/active (two tunnels), and zone-redundant gateways.","miss":false},{"id":"c058","d":2,"topic":"Networking","front":"What is ExpressRoute?","back":"A private connection to Microsoft through a provider that does not use the public internet. More reliable, faster, lower and steadier latency. DNS queries, certificate revocation checks and CDN requests still use the internet.","miss":false},{"id":"c059","d":2,"topic":"Networking","front":"What is ExpressRoute Global Reach?","back":"Connects your own sites to each other through Microsoft's network.","miss":false},{"id":"c060","d":2,"topic":"Networking","front":"VPN Gateway or ExpressRoute: a private line with higher bandwidth and no internet?","back":"ExpressRoute.","miss":false},{"id":"c061","d":2,"topic":"Networking","front":"Service endpoint vs private endpoint.","back":"Service endpoint: keeps traffic to an Azure service on the Azure backbone, but the service keeps its public address. Private endpoint: gives the service a private IP in your VNet.","miss":true},{"id":"c062","d":2,"topic":"Networking","front":"What connects Azure services such as Azure SQL to a VNet over the backbone?","back":"Service endpoints.","miss":true},{"id":"c063","d":2,"topic":"Networking","front":"NSG vs route table (UDR).","back":"NSG: allow or deny traffic by source, destination, port and protocol. Route table: overrides Azure's default routing, for example to send traffic through a firewall.","miss":false},{"id":"c064","d":2,"topic":"Networking","front":"What are Azure Firewall, NVA and Bastion?","back":"Azure Firewall: managed stateful firewall. NVA: a VM acting as a firewall or router. Bastion: browser-based RDP/SSH to VMs without public IPs.","miss":false},{"id":"c065","d":2,"topic":"Networking","front":"What does Azure DNS offer?","back":"Hosts DNS domains on Azure with the same tools, credentials and billing. Anycast routing (nearest server answers), alias records (follow a resource's IP changes), private DNS zones for names inside VNets.","miss":false},{"id":"c066","d":2,"topic":"Storage","front":"Name the five core Azure Storage services.","back":"Blobs, Files, Queues, Disks, Tables (BFQDT).","miss":false},{"id":"c067","d":2,"topic":"Storage","front":"What is Blob storage used for?","back":"Massive amounts of unstructured data: serving images or documents to a browser, backup and restore, archives, streaming.","miss":true},{"id":"c068","d":2,"topic":"Storage","front":"What is Azure Files and which protocols does it use?","back":"Managed cloud file shares that can be mounted as a drive by multiple machines, over SMB and NFS (not FTP).","miss":true},{"id":"c069","d":2,"topic":"Storage","front":"Blob access tiers: which is which?","back":"Hot: frequent access, highest storage cost, fastest access. Cool: 30-day minimum. Cold: 90-day minimum. Archive: 180-day minimum, offline, lowest storage cost, highest access cost, must be rehydrated.","miss":true},{"id":"c070","d":2,"topic":"Storage","front":"Which tier cannot be set at the storage account level?","back":"Archive (it is set on individual blobs).","miss":false},{"id":"c071","d":2,"topic":"Storage","front":"Storage account name rules.","back":"3 to 24 characters, lowercase letters and numbers only, globally unique.","miss":false},{"id":"c072","d":2,"topic":"Storage","front":"Redundancy options and durability.","back":"LRS: one datacenter, 11 nines. ZRS: across zones, 12 nines. GRS and GZRS: another region too, 16 nines. RA-GRS/RA-GZRS add read access to the secondary.","miss":false},{"id":"c073","d":2,"topic":"Storage","front":"Which redundancy survives the loss of an entire region?","back":"GRS or GZRS (and their read-access versions).","miss":false},{"id":"c074","d":2,"topic":"Storage","front":"How does geo-redundant replication to the secondary region work?","back":"Asynchronously, typically with a recovery point objective under 15 minutes.","miss":false},{"id":"c075","d":2,"topic":"Storage","front":"Tool picker: AzCopy, Storage Explorer, File Sync, Azure Migrate, Data Box.","back":"AzCopy: command-line copy (one-way). Storage Explorer: GUI. File Sync: two-way sync of on-premises file servers with Azure Files. Azure Migrate: assess and move servers. Data Box: physical device for large offline transfers (up to 80 TB).","miss":false},{"id":"c076","d":2,"topic":"Identity and security","front":"What is Microsoft Entra ID?","back":"Cloud identity and access management: authentication, SSO, MFA, app and device management. It does not provide traditional AD DS.","miss":false},{"id":"c077","d":2,"topic":"Identity and security","front":"Microsoft Entra Domain Services vs Entra Connect vs managed identities.","back":"Domain Services: managed AD DS (domain join, group policy, LDAP, Kerberos) without domain controllers. Entra Connect: syncs on-premises Active Directory to Entra ID. Managed identities: let Azure apps and resources authenticate to other Azure services without stored credentials.","miss":true},{"id":"c078","d":2,"topic":"Identity and security","front":"Authentication vs authorization.","back":"Authentication proves who you are. Authorization decides what you can do.","miss":false},{"id":"c079","d":2,"topic":"Identity and security","front":"What is SSO and what is its weakness?","back":"Sign in once to reach many apps. It is only as secure as the first sign-in, so pair it with MFA.","miss":false},{"id":"c080","d":2,"topic":"Identity and security","front":"MFA factors and passwordless options.","back":"Something you know, have, or are. Passwordless: Windows Hello for Business, Microsoft Authenticator, FIDO2 security keys.","miss":false},{"id":"c081","d":2,"topic":"Identity and security","front":"External identities: B2B vs External ID for customers.","back":"B2B: partners and guests sign in with their own credentials; you control access. External ID for customers: sign-up and sign-in for your customers' apps (formerly Azure AD B2C).","miss":false},{"id":"c082","d":2,"topic":"Identity and security","front":"What is Conditional Access?","back":"If-then access policies. Signals (user, location, device, risk) lead to a decision (allow, block, require MFA) that is then enforced.","miss":false},{"id":"c083","d":2,"topic":"Identity and security","front":"What is Azure RBAC?","back":"Access control by role at a scope (management group, subscription, resource group, resource). It is an allow model enforced through ARM. Roles: Owner, Contributor, Reader.","miss":false},{"id":"c084","d":2,"topic":"Identity and security","front":"Zero Trust principles.","back":"Verify explicitly, use least privilege access, assume breach.","miss":false},{"id":"c085","d":2,"topic":"Identity and security","front":"Defense in depth layers.","back":"Physical, identity and access, perimeter, network, compute, application, data.","miss":false},{"id":"c086","d":2,"topic":"Identity and security","front":"Encryption at rest vs in transit; what is Key Vault?","back":"At rest: data stored on disk. In transit: data moving over a network. Key Vault: central secure store for secrets, keys and certificates.","miss":false},{"id":"c087","d":2,"topic":"Identity and security","front":"What is Microsoft Defender for Cloud?","back":"Monitors security posture across Azure, hybrid and multicloud: assess (secure score and recommendations), secure, defend (threat protection).","miss":false},{"id":"c088","d":3,"topic":"Cost management","front":"What can Cost Management + Billing do?","back":"Create and manage budgets and alerts, analyze costs, generate reports from historical data and forecast future spend.","miss":true},{"id":"c089","d":3,"topic":"Cost management","front":"Which tool estimates what Azure services will cost BEFORE you deploy?","back":"The Azure pricing calculator.","miss":true},{"id":"c090","d":3,"topic":"Cost management","front":"Which option lowers the cost of VMs with steady usage all year?","back":"Azure Reservations (commit for 1 or 3 years; saves up to about 72% versus pay-as-you-go). Savings plans are a flexible commitment alternative.","miss":true},{"id":"c091","d":3,"topic":"Cost management","front":"What does a spending limit do?","back":"Suspends the subscription when the limit is reached. It does not reduce prices.","miss":true},{"id":"c092","d":3,"topic":"Cost management","front":"What are tags?","back":"Name-value pairs applied to resources to organize them and track cost by department, project or environment. They are not inherited automatically.","miss":true},{"id":"c093","d":3,"topic":"Cost management","front":"What affects Azure costs?","back":"Resource type, region, size and usage time, bandwidth (data leaving Azure is charged; data coming in is free), and subscription type.","miss":false},{"id":"c094","d":3,"topic":"Governance","front":"What does Azure Policy do?","back":"Creates, assigns and manages rules that audit or enforce resource configuration, such as allowed regions or allowed VM sizes, for new and existing resources. Groups of policies are initiatives.","miss":true},{"id":"c095","d":3,"topic":"Governance","front":"Policy vs RBAC vs locks.","back":"RBAC: what users can do. Policy: what resources are allowed to be. Locks (CanNotDelete, ReadOnly): stop accidental deletion or changes, even for owners.","miss":true},{"id":"c096","d":3,"topic":"Governance","front":"What is a resource lock?","back":"A protection on a subscription, resource group or resource. Delete (CanNotDelete in the API) lets you read and modify but not delete; ReadOnly allows only reading. Locks inherit down and apply even to Owners, so remove the lock first to make a change.","miss":false},{"id":"c097","d":3,"topic":"Governance","front":"What is Microsoft Purview?","back":"Data governance, risk and compliance: discover, classify and protect data across your estate.","miss":false},{"id":"c098","d":3,"topic":"Managing and deploying","front":"What can you do in the Azure portal?","back":"Browser GUI to create, configure and view resources and reports (and create Entra users). It works from any device with a browser.","miss":true},{"id":"c099","d":3,"topic":"Managing and deploying","front":"What is Azure Cloud Shell?","back":"A browser-accessible shell with Bash and PowerShell for managing Azure, with no local install.","miss":false},{"id":"c100","d":3,"topic":"Managing and deploying","front":"Azure CLI vs PowerShell.","back":"Both are command-line ways to manage Azure and script it. CLI uses az commands; PowerShell uses Az cmdlets. Both go through ARM.","miss":false},{"id":"c101","d":3,"topic":"Managing and deploying","front":"What is Azure Arc?","back":"Extends Azure management, governance and security to servers and resources outside Azure, on-premises or in other clouds, without migrating them.","miss":true},{"id":"c102","d":3,"topic":"Managing and deploying","front":"What is infrastructure as code (IaC) and what are ARM templates?","back":"IaC: define infrastructure in files so deployments are repeatable and consistent. ARM templates are declarative JSON that describe resources to deploy; Bicep is a simpler language that compiles to them.","miss":false},{"id":"c103","d":3,"topic":"Monitoring","front":"Azure Advisor: what does it do?","back":"Evaluates your Azure resources and recommends improvements for reliability, security, performance, operational excellence and cost.","miss":true},{"id":"c104","d":3,"topic":"Monitoring","front":"Azure Service Health: what does it do?","back":"Notifies you of Azure service problems that affect you, such as a regional outage, and of planned maintenance.","miss":true},{"id":"c105","d":3,"topic":"Monitoring","front":"Azure Monitor: what does it do?","back":"Collects, analyzes and acts on metrics and logs. Builds alerts (for example CPU over 80% for 5 minutes) and can trigger autoscale.","miss":true},{"id":"c106","d":3,"topic":"Monitoring","front":"Log Analytics and Application Insights?","back":"Log Analytics: query and analyze log data. Application Insights: monitors the performance and usage of applications.","miss":false},{"id":"c107","d":3,"topic":"Monitoring","front":"Advisor, Service Health or Monitor? “Tell me about an Azure outage in my region.”","back":"Service Health.","miss":true},{"id":"c108","d":3,"topic":"Cost management","front":"Name the six factors that affect Azure costs.","back":"Resource type, consumption, maintenance, geography, subscription type, and Azure Marketplace.","miss":false},{"id":"c109","d":3,"topic":"Cost management","front":"What are Spot virtual machines?","back":"Use unused Azure capacity at a lower price, but Azure can evict them when it needs the capacity back. Best for interruptible, fault-tolerant work such as batch jobs.","miss":false},{"id":"c110","d":3,"topic":"Cost management","front":"What is an Azure savings plan for compute?","back":"You commit to an hourly spend for 1 or 3 years on eligible compute, and Azure applies the best price. More flexible than reservations because it isn't tied to one VM type.","miss":false},{"id":"c111","d":3,"topic":"Cost management","front":"Choose: pay-as-you-go, reservation, savings plan or Spot?","back":"Pay-as-you-go: flexible, variable use. Reservation: stable, predictable, specific resources (1 or 3 years). Savings plan: steady spend but flexibility across compute. Spot: interruptible work at the lowest price.","miss":false},{"id":"c112","d":3,"topic":"Cost management","front":"Billing zones vs availability zones?","back":"A billing zone is a geographic grouping of regions used for data-transfer pricing. It is not an availability zone. Some inbound transfers are free; outbound is priced by zone.","miss":false},{"id":"c113","d":3,"topic":"Cost management","front":"What does the pricing calculator do, and what happened to the TCO calculator?","back":"The pricing calculator estimates the cost of resources you plan to provision. Nothing is provisioned or charged. The Total Cost of Ownership (TCO) calculator has been retired.","miss":false},{"id":"c114","d":3,"topic":"Cost management","front":"What are the three parts of Cost Management?","back":"Cost analysis (view costs by billing cycle, region, resource, subscription, resource group or service), cost alerts, and budgets.","miss":false},{"id":"c115","d":3,"topic":"Cost management","front":"Name the three types of cost alerts.","back":"Budget alerts (spend reaches a threshold), credit alerts (Azure Prepayment used up, at 90% and 100%), and department spending quota alerts (Enterprise Agreement customers).","miss":false},{"id":"c116","d":3,"topic":"Cost management","front":"Can a budget do more than send an alert?","back":"Yes. Budgets can trigger automation that suspends or changes resources when a threshold is reached, for example shutting down nonproduction resources.","miss":false},{"id":"c117","d":3,"topic":"Cost management","front":"What do tags help with, and how are they managed?","back":"Resource management, cost management, operations, security, governance and automation. Managed in the portal, PowerShell, CLI, ARM templates or REST API. Azure Policy can require or reapply tags. Resources do not inherit tags from groups or subscriptions.","miss":false},{"id":"c118","d":3,"topic":"Cost management","front":"What does an Azure free account include?","back":"Credit to spend in the first 30 days, popular products free for 12 months, and 25+ products that are always free.","miss":false},{"id":"c119","d":3,"topic":"Governance","front":"What are Microsoft Purview's two solution areas?","back":"Risk and compliance, and unified data governance. Together they provide automated data discovery, sensitive data classification and end-to-end lineage across on-premises, multicloud and SaaS data.","miss":false},{"id":"c120","d":3,"topic":"Governance","front":"Azure Policy: scope, inheritance and what it evaluates.","back":"Set at resource, resource group, subscription or management group level and inherited downward. Evaluates new and existing resources, can block noncompliant ones, and can remediate some (for example adding a missing tag). Resources can be marked as exceptions.","miss":false},{"id":"c121","d":3,"topic":"Governance","front":"What is an Azure Policy initiative?","back":"A group of related policy definitions that tracks compliance with a larger goal, for example Enable Monitoring in Azure Security Center (100+ policies).","miss":false},{"id":"c122","d":3,"topic":"Governance","front":"What is the Service Trust Portal?","back":"Microsoft's portal for security, privacy and compliance documents and audit reports. You sign in with an Entra work or school account and accept an NDA for some content. My Library saves documents; All Documents lists them.","miss":false},{"id":"c123","d":3,"topic":"Governance","front":"Why can't an Owner change a resource with a ReadOnly lock?","back":"Locks apply regardless of RBAC permissions. You must remove the lock first, then perform the action.","miss":false},{"id":"c124","d":3,"topic":"Managing and deploying","front":"Azure portal: key facts.","back":"A web-based GUI for building, managing and monitoring resources, with custom dashboards and accessibility options. It is resilient, with a presence in every Azure datacenter, and updates without downtime.","miss":false},{"id":"c125","d":3,"topic":"Managing and deploying","front":"Azure Cloud Shell: key features.","back":"Browser-based shell, no local install, already authenticated with your Azure credentials, and you choose PowerShell or Azure CLI (Bash). Open it from the portal.","miss":false},{"id":"c126","d":3,"topic":"Managing and deploying","front":"Azure PowerShell vs Azure CLI?","back":"Functionally equivalent. PowerShell runs cmdlets; CLI uses Bash-style commands. Both can be scripted and installed on Windows, Linux and Mac, or used in Cloud Shell. Pick the language you know.","miss":false},{"id":"c127","d":3,"topic":"Managing and deploying","front":"What is Copilot in Azure?","back":"An AI assistant for administrators that helps explore services, understand options and draft commands or scripts. Validate its recommendations and permissions before applying changes.","miss":false},{"id":"c128","d":3,"topic":"Managing and deploying","front":"Which resource types can Azure Arc manage outside Azure?","back":"Servers, Kubernetes clusters, Azure data services, SQL Server, and virtual machines (preview). Arc projects them into Azure Resource Manager.","miss":false},{"id":"c129","d":3,"topic":"Managing and deploying","front":"Azure Resource Manager: how does a request flow?","back":"A request from any tool, API or SDK goes to ARM, which authenticates and authorizes it, then sends it to the Azure service. All tools give consistent results because they share the same API.","miss":false},{"id":"c130","d":3,"topic":"Managing and deploying","front":"ARM template benefits.","back":"Declarative JSON, repeatable results, orchestration (dependency order and parallel deployment), modularity (nested templates) and extensibility (deployment scripts).","miss":false},{"id":"c131","d":3,"topic":"Managing and deploying","front":"What is Bicep?","back":"A declarative language for deploying Azure resources through ARM. Simpler and more concise than JSON templates, with idempotent, repeatable deployments and modules.","miss":false},{"id":"c132","d":3,"topic":"Monitoring","front":"Azure Advisor's five recommendation categories.","back":"Reliability, Security, Performance, Operational Excellence and Cost. You can act, postpone or dismiss each one.","miss":false},{"id":"c133","d":3,"topic":"Monitoring","front":"Service Health: the three views.","back":"Azure Status: global health of all services and regions. Service Health: outages, planned maintenance and advisories for the services and regions you use. Resource Health: whether one specific resource (such as a VM) is healthy and whether the problem is Azure's or yours.","miss":false},{"id":"c134","d":3,"topic":"Monitoring","front":"What are Azure Monitor alerts made of?","back":"An alert rule (the condition, metric-based or log-based) and an action group (who is notified and what happens). Action groups are reusable across Monitor, Service Health and Advisor.","miss":false},{"id":"c135","d":3,"topic":"Monitoring","front":"What is Application Insights?","back":"An Azure Monitor feature for the performance and usage of web apps, in Azure, on-premises or another cloud. Tracks requests, response times, failures, dependencies and page views. Add an SDK or enable the agent. Availability tests send synthetic requests.","miss":false},{"id":"c136","d":1,"topic":"Benefits of the cloud","front":"Sustainability in the cloud: what practices does Learn list?","back":"Right-size, automate, monitor, keep optimizing. Examples: scale down when demand drops, turn off or deallocate unused resources, pick efficient configurations to avoid overprovisioning, and track usage trends with governance and monitoring. A dev environment that shuts down nights and weekends is the classic example.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5a-describe-sustainability-cloud","learn":true},{"id":"c137","d":2,"topic":"Compute","front":"AI services, Azure Machine Learning or IoT services: how do you choose?","back":"Azure AI services: prebuilt AI features (language, speech, vision, documents) through APIs. Azure Machine Learning: build, train and manage your OWN custom models. Azure IoT services: the solution centers on connected devices and telemetry.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"c138","d":2,"topic":"Compute","front":"IoT Hub vs IoT Central vs IoT Edge?","back":"IoT Hub: secure two-way communication between cloud services and devices. IoT Central: simplified SaaS IoT platform for solution builders. IoT Edge: runs cloud workloads on devices closer to where the data is generated.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"c139","d":2,"topic":"Compute","front":"What is Azure OpenAI Service, and what is agentic AI at this level?","back":"Azure OpenAI Service supports generative AI such as chat and content generation with built-in security and governance. Agentic AI is an application pattern (a model plus instructions, context and tools to finish multistep goals) built from Azure AI services, not a separate compute category.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"c140","d":2,"topic":"Compute","front":"What can Azure App Service host?","back":"Web apps, API apps, WebJobs (scheduled or triggered background programs) and mobile app back ends. Windows or Linux, many languages (.NET, Java, PHP, Python, Node.js), automatic scaling, built-in high availability, and continuous deployment from GitHub, Azure DevOps or any Git repo.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options","learn":true},{"id":"c141","d":2,"topic":"Compute","front":"Hosting spectrum: VMs, containers, App Service?","back":"VMs give the most control (and the most to manage). Containers isolate and individually manage parts of the app. App Service gives the least operational effort: you build the app, Azure keeps the environment running.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options","learn":true},{"id":"c142","d":2,"topic":"Regions and zones","front":"Which Azure services are global, with no region to choose?","back":"Microsoft Entra ID, Azure Traffic Manager and Azure DNS. Other services (and some VM sizes and storage types) are only available in certain regions.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"c143","d":2,"topic":"Regions and zones","front":"How many availability zones does a zone-enabled region have?","back":"At least three separate zones. Each zone has independent power, cooling and networking, and zones connect over high-speed private fiber. Not every region supports zones, and spreading across them can cost extra for duplication and data transfer.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"c144","d":2,"topic":"Regions and zones","front":"What extra advantages do region pairs give?","back":"In a large outage one region of each pair is prioritized for recovery. Planned updates roll out to paired regions one at a time. Data stays inside the same geography for residency and compliance (except Brazil South).","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"c145","d":2,"topic":"Regions and zones","front":"Which regions are exceptions to normal region pairing?","back":"Brazil South pairs one-way with South Central US, outside its geography. Italy North, Poland Central and Israel Central have no traditional pair and rely on availability zones plus geo-redundant storage. Not every service fails over automatically: some recovery must be configured by you.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"c146","d":2,"topic":"Networking","front":"Azure DNS: what are its main benefits?","back":"Reliability from anycast (the closest DNS server answers), security through Azure Resource Manager (RBAC, activity logs, resource locks), ease of use (portal, CLI, PowerShell, API, same billing), private DNS domains for your VNets, and alias records.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"c147","d":2,"topic":"Networking","front":"What is an alias record in Azure DNS?","back":"A record set that points to an Azure resource (public IP, Traffic Manager profile or CDN endpoint). If the resource IP changes, the alias updates itself during resolution.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"c148","d":2,"topic":"Networking","front":"Can you buy a domain name with Azure DNS?","back":"No. Buy it from App Service domains or a third-party registrar (annual fee), then host the domain in Azure DNS to manage its records.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"c149","d":2,"topic":"Identity and security","front":"What does Microsoft Entra ID provide?","back":"Authentication (self-service password reset, MFA, banned password lists, smart lockout), single sign-on, application management (Application Proxy, SaaS integration, My Apps) and device management (Intune, device-based Conditional Access). Connected to on-premises AD it can also flag suspicious sign-ins at no extra cost.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services","learn":true},{"id":"c150","d":2,"topic":"Identity and security","front":"How does Microsoft Entra Domain Services work?","back":"You pick a namespace and Azure deploys two Windows Server domain controllers (a replica set) that Microsoft manages. Gives domain join, group policy, LDAP and Kerberos/NTLM without running DCs yourself, ideal for lifting legacy apps. Sync is ONE-WAY from Entra ID to the managed domain.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services","learn":true},{"id":"c151","d":2,"topic":"Identity and security","front":"Microsoft Entra Connect: what does it do?","back":"Synchronizes identities between on-premises Active Directory and Microsoft Entra ID so users get one consistent experience (SSO, MFA, self-service password reset) on premises and in the cloud, instead of maintaining two identity sets.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services","learn":true},{"id":"c152","d":2,"topic":"Identity and security","front":"Zero Trust: the three principles and their actions?","back":"Verify explicitly (authenticate and authorize on all data points). Use least privilege access (just-in-time and just-enough-access, risk-based adaptive policies). Assume breach (segment access, verify end-to-end encryption, use analytics for threat detection). Access depends on authentication, not network location.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model","learn":true},{"id":"c153","d":2,"topic":"Identity and security","front":"Defense in depth: name the seven layers, outermost to innermost.","back":"Physical, Identity and access, Perimeter (DDoS protection, perimeter firewalls), Network (segmentation, deny by default), Compute (secure VM access, patching, endpoint protection), Application (secure code, secrets in Key Vault), Data (encryption at rest and in transit).","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth","learn":true},{"id":"c154","d":2,"topic":"Identity and security","front":"Azure Key Vault: what does it hold and why use it?","back":"Secrets (connection strings, passwords), encryption keys and certificates. Gives access control, key rotation and usage auditing, and lets apps fetch secrets at runtime with managed identities instead of hard-coded credentials. Can separate duties for who views, uses and rotates keys.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9a-describe-encryption-key-management","learn":true},{"id":"c155","d":2,"topic":"Identity and security","front":"Defender for Cloud: assess, secure, defend?","back":"Continuously assess (vulnerability assessment, track posture). Secure (harden with the Microsoft cloud security benchmark, recommendations grouped into controls with a secure score, built on Azure Policy). Defend (security alerts, kill-chain correlation, advanced threat protection such as just-in-time VM access).","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"c156","d":2,"topic":"Identity and security","front":"Where does Defender for Cloud protect?","back":"Azure PaaS and data services, networks, on-premises servers (deploy Azure Arc and enable enhanced security), and other clouds (AWS EC2 and EKS, GCP). One control plane for hybrid and multicloud.","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true}],"questions":[{"id":"q001","d":1,"topic":"Cloud models","q":"A hospital must keep patient records in its own datacenter but wants to run public-facing apps with extra capacity during flu season. Which model fits?","opts":["Public cloud","Private cloud","Hybrid cloud","Community cloud"],"ans":[2],"why":"Hybrid combines on-premises or private resources with public cloud capacity. Sensitive data stays private while peaks use the public cloud.","kind":"one","miss":true},{"id":"q002","d":1,"topic":"Cloud models","q":"Which TWO describe a private cloud?","opts":["You purchase and maintain the hardware","You pay only for the capacity you use","You control the physical resources and security","Resources are provisioned instantly from shared capacity"],"ans":[0,2],"why":"Hardware purchase (CapEx) and control of resources and security are private cloud traits. Pay-for-use and instant shared provisioning describe the public cloud.","kind":"two","miss":true},{"id":"q003","d":1,"topic":"Cost model","q":"Buying servers for a new datacenter is an example of which expense type?","opts":["Operational expenditure","Capital expenditure","Consumption-based billing","Subscription licensing"],"ans":[1],"why":"One-time upfront spending on hardware is capital expenditure. Operational expenditure is billed as you go.","kind":"one","miss":true},{"id":"q004","d":1,"topic":"Cost model","q":"A startup wants no upfront infrastructure cost and a bill that drops when it uses less. Which model fits?","opts":["Capital expenditure","Consumption-based","Reserved capacity for 3 years","Private cloud"],"ans":[1],"why":"Consumption-based billing means you pay only for what you use, so cost follows demand.","kind":"one","miss":true},{"id":"q005","d":1,"topic":"Cost model","q":"A company will run the same VMs at steady usage for three years. Which pricing approach is usually cheapest?","opts":["Pay-as-you-go","Commitment-based (reservation)","A spending limit","Serverless"],"ans":[1],"why":"Predictable, steady usage is what commitment-based pricing rewards with a lower unit price.","kind":"one","miss":false},{"id":"q006","d":1,"topic":"Shared responsibility","q":"In every cloud service type, which item stays the customer's responsibility?","opts":["The physical network","The hypervisor","Information and data","The datacenter building"],"ans":[2],"why":"Customers always own their data, devices and accounts. Microsoft always owns the physical datacenter, network and hosts.","kind":"one","miss":false},{"id":"q007","d":1,"topic":"Shared responsibility","q":"You run an app on an Azure virtual machine. Who patches the guest operating system?","opts":["Microsoft","You","The region's operator","Azure Advisor"],"ans":[1],"why":"A VM is IaaS, so you manage the OS and everything above it.","kind":"one","miss":false},{"id":"q008","d":1,"topic":"Service types","q":"Developers want to ship a web app without managing servers or the OS. Which service type?","opts":["IaaS","PaaS","SaaS","On-premises"],"ans":[1],"why":"PaaS handles the platform so developers focus on their app and data.","kind":"one","miss":true},{"id":"q009","d":1,"topic":"Service types","q":"Which of these is a PaaS offering?","opts":["Azure Virtual Machines","Azure Virtual Network","Azure Cosmos DB","Microsoft 365"],"ans":[2],"why":"Cosmos DB is a managed database platform (PaaS). VMs and virtual networks are IaaS; Microsoft 365 is SaaS.","kind":"one","miss":true},{"id":"q010","d":1,"topic":"Service types","q":"Which service type is usually licensed by monthly or annual subscription?","opts":["IaaS","PaaS","SaaS","Serverless only"],"ans":[2],"why":"SaaS is finished software hosted for you and billed by subscription.","kind":"one","miss":false},{"id":"q011","d":1,"topic":"Benefits","q":"An app adds extra virtual machines when traffic rises. What is this?","opts":["Scaling up","Scaling out","Failover","Geo-replication"],"ans":[1],"why":"Adding instances is scaling out (horizontal). Scaling up adds CPU or RAM to one instance.","kind":"one","miss":true},{"id":"q012","d":1,"topic":"Benefits","q":"An app shrinks back to two instances at night and grows to ten at lunchtime, automatically. This is an example of:","opts":["Elasticity","Disaster recovery","Governance","Reservations"],"ans":[0],"why":"Elasticity means resources scale automatically with demand, in both directions.","kind":"one","miss":false},{"id":"q013","d":1,"topic":"Benefits","q":"Which benefit do you gain by spreading resources across multiple Azure regions?","opts":["Scalability","High availability","Lower storage cost","Faster deployment"],"ans":[1],"why":"Multiple regions keep the service running if one region has an outage.","kind":"one","miss":true},{"id":"q014","d":1,"topic":"Benefits","q":"Cloud-based backup, replication and geo-distribution are all part of a:","opts":["Pricing model","Disaster recovery plan","Governance policy","Scaling rule"],"ans":[1],"why":"These services keep data and code safe if a disaster hits one site.","kind":"one","miss":true},{"id":"q015","d":1,"topic":"Benefits","q":"Two services in a chain have SLAs of 99.9% and 99.95%. The composite SLA is closest to:","opts":["99.95%","99.9%","99.85%","100%"],"ans":[2],"why":"Multiply: 0.999 × 0.9995 ≈ 0.9985, so about 99.85%. It is always lower than the weakest link.","kind":"one","miss":false},{"id":"q016","d":1,"topic":"Benefits","q":"Which TWO are cloud benefits listed for reliability and predictability?","opts":["Resiliency and failover","Physical access to servers","Predictable performance and cost","Unlimited free storage"],"ans":[0,2],"why":"Reliability: resiliency, redundancy, failover. Predictability: performance and cost.","kind":"two","miss":false},{"id":"q017","d":2,"topic":"Regions and zones","q":"Physically separate datacenters inside one Azure region, each with independent power, cooling and networking, are called:","opts":["Region pairs","Availability zones","Geographies","Availability sets"],"ans":[1],"why":"Availability zones sit inside a region. Region pairs link two regions.","kind":"one","miss":true},{"id":"q018","d":2,"topic":"Regions and zones","q":"A region pair always sits within the same:","opts":["Availability zone","Datacenter","Geography","Subscription"],"ans":[2],"why":"Pairs are in the same geography and at least 300 miles apart.","kind":"one","miss":true},{"id":"q019","d":2,"topic":"Hierarchy","q":"A storage account is an example of a:","opts":["Resource group","Resource","Subscription","Management group"],"ans":[1],"why":"A resource is a manageable item. Resource groups hold resources.","kind":"one","miss":true},{"id":"q020","d":2,"topic":"Hierarchy","q":"Which can you use to apply policy and access control across multiple subscriptions?","opts":["Resource groups","Administrative units","Management groups","Tags"],"ans":[2],"why":"Management groups sit above subscriptions. Administrative units are for Entra resources.","kind":"one","miss":true},{"id":"q021","d":2,"topic":"Hierarchy","q":"You assign a role at a resource group. Which resources does it apply to?","opts":["Only existing resources","Only new resources","Existing and future resources in the group","Every resource in the subscription"],"ans":[2],"why":"Access applied at the group scope inherits to all current and future resources in it.","kind":"one","miss":false},{"id":"q022","d":2,"topic":"Compute","q":"Which service runs code only when triggered by an event and bills for execution time?","opts":["Azure Virtual Machines","Azure Functions","Availability sets","Azure Virtual Desktop"],"ans":[1],"why":"Functions is serverless, event-driven compute.","kind":"one","miss":false},{"id":"q023","d":2,"topic":"Compute","q":"Which option protects VMs from planned maintenance and hardware failures within a region at no extra cost?","opts":["Availability set","Scale set","Region pair","Reservation"],"ans":[0],"why":"An availability set spreads VMs across update and fault domains.","kind":"one","miss":false},{"id":"q024","d":2,"topic":"Networking","q":"You need an encrypted connection between an on-premises datacenter and an Azure virtual network over the internet. Which service?","opts":["ExpressRoute","VPN Gateway","VNet peering","Azure DNS"],"ans":[1],"why":"VPN Gateway builds encrypted tunnels over the public internet. ExpressRoute is a private line.","kind":"one","miss":true},{"id":"q025","d":2,"topic":"Networking","q":"Resources in two Azure virtual networks must communicate. What do you configure?","opts":["Point-to-site VPN","VNet peering","A service endpoint","An NSG"],"ans":[1],"why":"Peering links two VNets over Microsoft's backbone.","kind":"one","miss":true},{"id":"q026","d":2,"topic":"Networking","q":"How can an Azure SQL database be reached from a VNet over the Azure backbone?","opts":["ExpressRoute","Service endpoint","A VPN Gateway","A route table"],"ans":[1],"why":"Service endpoints extend your VNet identity to the Azure service. Private endpoints give it a private IP.","kind":"one","miss":true},{"id":"q027","d":2,"topic":"Networking","q":"Which TWO connect an on-premises network to Azure?","opts":["Azure VPN Gateway","ExpressRoute","Azure Bastion","Network security group"],"ans":[0,1],"why":"VPN Gateway and ExpressRoute both link on-premises to Azure. Bastion is browser RDP/SSH; an NSG filters traffic.","kind":"two","miss":false},{"id":"q028","d":2,"topic":"Networking","q":"Which connection does NOT travel over the public internet?","opts":["Site-to-site VPN","Point-to-site VPN","ExpressRoute","VNet peering over a public IP"],"ans":[2],"why":"ExpressRoute is a private connection through a provider.","kind":"one","miss":false},{"id":"q029","d":2,"topic":"Storage","q":"Which blob tier stores data offline with the lowest storage cost and the highest access cost?","opts":["Hot","Cool","Cold","Archive"],"ans":[3],"why":"Archive is offline and must be rehydrated before use.","kind":"one","miss":true},{"id":"q030","d":2,"topic":"Storage","q":"Which blob tier has the highest storage cost and fastest access?","opts":["Hot","Cool","Cold","Archive"],"ans":[0],"why":"Hot is for frequently accessed data.","kind":"one","miss":true},{"id":"q031","d":2,"topic":"Storage","q":"Which TWO protocols can you use to access an Azure file share?","opts":["SMB","NFS","FTP","RDP"],"ans":[0,1],"why":"Azure Files supports SMB and NFS.","kind":"two","miss":true},{"id":"q032","d":2,"topic":"Storage","q":"Which TWO are common uses of Blob storage?","opts":["Serving images directly to a browser","Backup and restore","Mounting a shared drive on many VMs","Providing VM operating system disks"],"ans":[0,1],"why":"Blob handles unstructured data and backups. Azure Files is the mountable share and Disk storage backs VMs.","kind":"two","miss":true},{"id":"q033","d":2,"topic":"Storage","q":"Which redundancy option protects against a whole-region outage?","opts":["LRS","ZRS","GRS","None, Azure always does"],"ans":[2],"why":"GRS (and GZRS) copy data to a second region.","kind":"one","miss":false},{"id":"q034","d":2,"topic":"Identity","q":"Which service gives you managed Active Directory features such as domain join and Group Policy without deploying domain controllers?","opts":["Microsoft Entra ID","Microsoft Entra Domain Services","Managed identities","Microsoft Entra Connect"],"ans":[1],"why":"Domain Services provides managed AD DS. Connect syncs on-premises AD to Entra ID.","kind":"one","miss":true},{"id":"q035","d":2,"topic":"Identity","q":"A user signs in once and can open many apps without signing in again. This is:","opts":["MFA","Single sign-on","Passwordless","RBAC"],"ans":[1],"why":"SSO reuses one sign-in across apps.","kind":"one","miss":false},{"id":"q036","d":2,"topic":"Identity","q":"Access is allowed only if the user is on a compliant device, otherwise MFA is required. Which feature?","opts":["Azure RBAC","Conditional Access","Azure Policy","Resource locks"],"ans":[1],"why":"Conditional Access evaluates signals and then allows, blocks or requires more proof.","kind":"one","miss":false},{"id":"q037","d":2,"topic":"Identity","q":"Which TWO are passwordless methods?","opts":["FIDO2 security key","Microsoft Authenticator","Security questions","SMS password reset"],"ans":[0,1],"why":"FIDO2 keys, Windows Hello for Business and Authenticator are passwordless options.","kind":"two","miss":false},{"id":"q038","d":2,"topic":"Security","q":"Which Azure service stores secrets, keys and certificates securely?","opts":["Key Vault","Defender for Cloud","Azure Policy","Azure Monitor"],"ans":[0],"why":"Key Vault is the central secure store.","kind":"one","miss":false},{"id":"q039","d":3,"topic":"Cost","q":"Which TWO can you do with Cost Management + Billing?","opts":["Create and manage budgets","Estimate cost before deploying","Generate historical reports and forecasts","Restrict allowed regions"],"ans":[0,2],"why":"Cost Management covers budgets, analysis and forecasts. The pricing calculator estimates before deployment; Policy restricts regions.","kind":"two","miss":true},{"id":"q040","d":3,"topic":"Cost","q":"You need to estimate the cost of a planned deployment before creating any resources. What do you use?","opts":["Azure pricing calculator","Azure Advisor","Resource locks","Azure Monitor"],"ans":[0],"why":"The pricing calculator estimates cost from the services and usage you choose.","kind":"one","miss":true},{"id":"q041","d":3,"topic":"Cost","q":"You want to group costs by department across resources. Which feature helps?","opts":["Availability sets","Tags","Resource locks","Region pairs"],"ans":[1],"why":"Tags are name-value pairs used to organize and track cost.","kind":"one","miss":true},{"id":"q042","d":3,"topic":"Governance","q":"Which service stops people from deploying resources outside approved regions?","opts":["Azure Advisor","Azure Policy","Azure Monitor","RBAC read-only role"],"ans":[1],"why":"Azure Policy enforces rules such as allowed locations.","kind":"one","miss":true},{"id":"q043","d":3,"topic":"Governance","q":"Which feature prevents anyone, even an Owner, from accidentally deleting a resource group?","opts":["Tags","Resource lock","Azure Advisor","Management group"],"ans":[1],"why":"A CanNotDelete lock blocks deletion until the lock is removed.","kind":"one","miss":false},{"id":"q044","d":3,"topic":"Governance","q":"What controls WHAT a user can do, rather than what a resource may be?","opts":["Azure Policy","Azure RBAC","Resource locks","Tags"],"ans":[1],"why":"RBAC grants permissions to users. Policy governs resource configuration.","kind":"one","miss":false},{"id":"q045","d":3,"topic":"Management","q":"Which TWO actions can you take in the Azure portal?","opts":["Create new resources","Create a Microsoft Entra user","Move a VM to another region by dragging it","Change a VM's availability zone in place"],"ans":[0,1],"why":"The portal can create resources and Entra users. Zone placement is fixed at creation.","kind":"two","miss":true},{"id":"q046","d":3,"topic":"Management","q":"Which management layer receives requests from any Azure tool and creates, updates or deletes resources?","opts":["Management groups","Azure Resource Manager","Azure Advisor","Azure Arc"],"ans":[1],"why":"Every tool goes through ARM.","kind":"one","miss":true},{"id":"q047","d":3,"topic":"Management","q":"You need to manage on-premises servers with Azure governance and security without migrating them. What do you use?","opts":["Azure Advisor","Azure Arc","Azure Service Health","Availability sets"],"ans":[1],"why":"Azure Arc projects non-Azure servers into Azure for management.","kind":"one","miss":true},{"id":"q048","d":3,"topic":"Management","q":"Which TWO can create a virtual machine from a phone's browser?","opts":["Azure portal","Azure Cloud Shell","A local CLI install","SSH"],"ans":[0,1],"why":"Both run in a browser. Cloud Shell offers Bash and PowerShell.","kind":"two","miss":true},{"id":"q049","d":3,"topic":"Monitoring","q":"Which service recommends changes to improve reliability, security, performance and cost?","opts":["Azure Advisor","Azure Service Health","Azure Policy","Azure Monitor"],"ans":[0],"why":"Advisor evaluates your resources and gives recommendations.","kind":"one","miss":true},{"id":"q050","d":3,"topic":"Monitoring","q":"Which service notifies you of an Azure outage or planned maintenance in your region?","opts":["Azure Advisor","Azure Service Health","Azure Policy","Resource locks"],"ans":[1],"why":"Service Health reports service issues and planned maintenance that affect you.","kind":"one","miss":false},{"id":"q051","d":3,"topic":"Monitoring","q":"Which service can alert you when CPU stays above 80% for five minutes and trigger autoscale?","opts":["Azure Monitor","Azure Advisor","Azure Arc","Microsoft Purview"],"ans":[0],"why":"Azure Monitor collects metrics and drives alerts and autoscale.","kind":"one","miss":true},{"id":"q052","d":3,"topic":"Cost","q":"A batch rendering job can restart if interrupted and must cost as little as possible. Which pricing option fits?","opts":["Reservation","Azure Spot virtual machines","Azure savings plan for compute","Pay-as-you-go on a larger size"],"ans":[1],"why":"Spot uses unused capacity at a lower price, but Azure can evict the VM. That suits interruptible work.","kind":"one","miss":false},{"id":"q053","d":3,"topic":"Cost","q":"Your compute spend is steady, but workloads move between VM families and services. Which option gives a discount without tying you to one VM type?","opts":["Azure savings plan for compute","Azure Reservation for one VM size","Spot virtual machines","A resource lock"],"ans":[0],"why":"A savings plan commits you to an hourly spend, not a specific VM type.","kind":"one","miss":false},{"id":"q054","d":3,"topic":"Cost","q":"Which TWO are alert types in Cost Management?","opts":["Budget alerts","Credit alerts","Policy compliance alerts","Resource Health alerts"],"ans":[0,1],"why":"Cost Management has budget, credit and department spending quota alerts.","kind":"two","miss":false},{"id":"q055","d":3,"topic":"Cost","q":"You tag a resource group with Environment=Prod. What happens to resources already inside it?","opts":["They inherit the tag automatically","They inherit it only after a restart","They do not inherit it","They inherit it only if a lock is set"],"ans":[2],"why":"Resources don't inherit tags from resource groups or subscriptions. Policy can add or require tags.","kind":"one","miss":false},{"id":"q056","d":3,"topic":"Governance","q":"A subscription Owner needs to change a resource that has a ReadOnly lock. What must happen first?","opts":["Assign the Contributor role","Remove the lock","Move the resource to another subscription","Create an Azure Policy exemption"],"ans":[1],"why":"Locks apply regardless of RBAC permissions, so remove the lock before the change.","kind":"one","miss":false},{"id":"q057","d":3,"topic":"Governance","q":"Which service provides automated data discovery, sensitive data classification and end-to-end lineage?","opts":["Microsoft Purview","Azure Advisor","Azure Arc","Azure Monitor"],"ans":[0],"why":"Purview is Microsoft's data governance, risk and compliance solution.","kind":"one","miss":false},{"id":"q058","d":3,"topic":"Governance","q":"Where can you find Microsoft's audit reports and compliance documentation?","opts":["Service Trust Portal","Azure Advisor","Cost Management","Azure Service Health"],"ans":[0],"why":"The Service Trust Portal provides securi
