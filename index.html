nd West US. What is the minimum number of Recovery Services vaults?","opts":["4","2","3","1"],"ans":[1],"why":"A vault protects VMs in its own region only.","kind":"one","miss":false},{"id":"q123","d":5,"topic":"Backup and recovery","q":"Which vault type should you create to back up Azure Blobs and Azure managed disks?","opts":["Key Vault","Backup vault","Recovery Services vault","Storage account"],"ans":[1],"why":"Backup vault supports disks, blobs, PostgreSQL and AKS.","kind":"one","miss":false},{"id":"q124","d":5,"topic":"Backup and recovery","q":"You must validate a disaster recovery plan without affecting production replication. What should you run in Site Recovery?","opts":["Commit failover","A planned failover","Disable replication","A test failover into an isolated virtual network"],"ans":[3],"why":"Test failover creates VMs in a test network without stopping replication.","kind":"one","miss":false},{"id":"q125","d":5,"topic":"Backup and recovery","q":"After failing over VMs to the secondary region and committing, what must you do before failing back?","opts":["Run a test failover cleanup","Re-protect the VMs","Change the vault to LRS","Delete the recovery plan"],"ans":[1],"why":"Re-protect starts replication from the secondary back to the primary.","kind":"one","miss":false},{"id":"q126","d":5,"topic":"Backup and recovery","q":"You need to restore one deleted file from yesterday's backup of an Azure VM without restoring the whole VM. What should you use?","opts":["Cross Region Restore","Create a new VM","Replace existing disks","File recovery"],"ans":[3],"why":"File recovery mounts the recovery point so you can copy files.","kind":"one","miss":false},{"id":"q127","d":5,"topic":"Backup and recovery","q":"Which TWO workloads are protected with a Recovery Services vault?","opts":["Azure Database for PostgreSQL","Azure virtual machines","Azure Blobs (vaulted)","Azure file shares"],"ans":[1,3],"why":"Blobs and PostgreSQL use a Backup vault.","kind":"two","miss":false},{"id":"q128","d":5,"topic":"Backup and recovery","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["You can change a vault's storage redundancy from GRS to LRS after backups have started.","Cross Region Restore requires a GRS vault.","Soft-deleted backup items are kept for 14 days by default."],"ans":[0,1,1],"why":"Redundancy locks once items are protected. CRR needs GRS. Soft delete default is 14 days.","miss":false},{"id":"q129","d":5,"topic":"Backup and recovery","type":"match","kind":"match","q":"Match each Site Recovery action to its purpose.","rows":["Prove DR works without impact","Make the failover permanent","Start replicating back to the primary","Fail over a group of VMs in order"],"choices":["Re-protect","Commit","Recovery plan","Test failover"],"ans":[3,1,0,2],"why":"Test, commit, re-protect, plan.","miss":false},{"id":"q130","d":5,"topic":"Backup and recovery","q":"You want weekly backup reports across vaults. What must you configure first?","opts":["An alert processing rule","A resource lock on the vault","Diagnostic settings that send vault data to a Log Analytics workspace","A second vault in the paired region"],"ans":[2],"why":"Backup reports read from Log Analytics.","kind":"one","miss":false}],"sections":[{"id":"s1","d":1,"title":"Microsoft Entra users and groups","label":"Medium","note":"Groups, licenses, guests and SSPR. Know which features need Entra ID P1.","why":"","obj":["Create users and groups","Manage user and group properties","Manage licenses in Microsoft Entra ID","Manage external users","Configure self-service password reset (SSPR)"],"cold":["**Security groups** grant access. **Microsoft 365 groups** are for collaboration.","**Dynamic membership** (user or device rules) needs **P1** and blocks manual adds.","Set **usage location** before assigning a license. **Group-based licensing** needs P1.","**B2B guests** sign in with their own identity and show as **UserType Guest**.","**SSPR reset** needs **P1**. Scope None, Selected (one group) or All. **Admins always get SSPR with two methods.**","Deleted users can be **restored for 30 days**."],"traps":["Dynamic groups cannot have manually added members.","Password change is free. Password reset needs P1."],"hooks":["No usage location, no license."],"topics":["Entra users and groups"],"qtopics":["Entra users and groups"],"mod":"https://learn.microsoft.com/en-us/training/modules/create-configure-manage-identities/","modTitle":"Create, configure, and manage identities","units":[]},{"id":"s2","d":1,"title":"Access to Azure resources","label":"High","note":"Scopes and inheritance decide most RBAC questions. Read every scope in the question.","why":"","obj":["Manage built-in Azure roles","Assign roles at different scopes","Interpret access assignments"],"cold":["Role assignment = **principal + role + scope**.","Scopes: **management group → subscription → resource group → resource**. Assignments are **inherited** downward.","**Owner** = everything + assign roles. **Contributor** = everything except assign roles. **Reader** = view. **User Access Administrator** / **RBAC Administrator** = manage access only.","Assignments are **additive**. Deny assignments win.","**Actions** = management plane. **DataActions** = data plane (needs data roles like Storage Blob Data Reader).","**Azure roles** ≠ **Entra roles**. Global Administrator can **elevate** to User Access Administrator at root."],"traps":["Contributor cannot grant access.","Entra Global Administrator does not automatically manage Azure resources."],"hooks":["Who + what + where."],"topics":["Azure RBAC"],"qtopics":["Azure RBAC"],"mod":"https://learn.microsoft.com/en-us/training/modules/secure-azure-resources-with-rbac/","modTitle":"Secure your Azure resources with Azure RBAC","units":[],"models":["hier"]},{"id":"s3","d":1,"title":"Subscriptions and governance","label":"High","note":"Policy, locks, tags, management groups and cost tools. Lots of easy points.","why":"","obj":["Implement and manage Azure Policy","Configure resource locks","Apply and manage tags on resources","Manage resource groups","Manage subscriptions","Manage costs by using alerts, budgets, and Azure Advisor recommendations","Configure management groups"],"cold":["**Policy** = what resources may look like. **RBAC** = who can act. Policy applies even to Owners.","Effects: **Deny, Audit, Append, Modify, AuditIfNotExists, DeployIfNotExists, Disabled**. Modify and DINE fix things with a **remediation task** and a **managed identity**.","**Initiative** = group of definitions. Assign at a scope with **exclusions**.","Locks: **CanNotDelete** and **ReadOnly**. Inherited, apply to everyone. Owner or User Access Administrator manage them.","**Tags are not inherited.** Use a Modify policy to inherit them.","**Management groups** up to six levels deep. **Budgets** alert but do not stop resources. **Advisor** recommends savings."],"traps":["ReadOnly also blocks POST actions like List Keys.","Deleting a resource group deletes everything in it."],"hooks":["Policy shapes. Locks protect. Tags label. Budgets warn."],"topics":["Governance"],"qtopics":["Governance"],"mod":"https://learn.microsoft.com/en-us/training/modules/intro-to-azure-policy/","modTitle":"Introduction to Azure Policy","units":[],"models":["hier"]},{"id":"s4","d":2,"title":"Access to storage","label":"High","note":"SAS types and stored access policies come up every time.","why":"","obj":["Configure Azure Storage firewalls and virtual networks","Create and use shared access signature (SAS) tokens","Configure stored access policies","Manage access keys","Configure identity-based access for Azure Files"],"cold":["Storage firewall: allow **selected VNets** (service endpoint) and **public IP ranges**, plus **trusted Microsoft services**.","**Access keys**: two, full access, rotate one at a time, store in Key Vault.","**User delegation SAS** (Entra, recommended), **service SAS** (account key, one service), **account SAS** (account key, many services).","**Stored access policy**: service SAS only, max 5 per container, revoke by editing or deleting the policy.","**Azure Files identity**: AD DS, Entra Domain Services or Entra Kerberos. One source per account. Share-level RBAC + NTFS ACLs. Port **445**."],"traps":["IP rules cannot use private address ranges.","Revoking an ad hoc SAS means rotating the key that signed it."],"hooks":["Policy-backed SAS can be pulled back."],"topics":["Storage access"],"qtopics":["Storage access"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-storage-security/","modTitle":"Configure Azure Storage security","units":[]},{"id":"s5","d":2,"title":"Storage accounts","label":"High","note":"Redundancy options are near-certain questions. Count where the copies live.","why":"","obj":["Create and configure storage accounts","Configure Azure Storage redundancy","Configure object replication","Configure storage account encryption","Manage data by using Azure Storage Explorer and AzCopy"],"cold":["**GPv2** for most things. **Premium** (block blobs, file shares, page blobs) for SSD speed.","**LRS** one datacenter, **ZRS** across zones, **GRS** + paired region, **GZRS** zones + paired region. **RA-** = read the secondary any time.","Premium supports **LRS and ZRS only**.","**Object replication**: versioning on both, change feed on source, block blobs only, no HNS.","Encryption is **always on**. Customer-managed keys in **Key Vault** with purge protection. Infrastructure encryption **at creation only**.","**AzCopy** for scripted copy and sync. **Storage Explorer** for a GUI."],"traps":["GRS without RA- cannot be read until failover.","Name and region are fixed after creation."],"hooks":["L-Z-G: Local, Zone, Geo."],"topics":["Storage accounts"],"qtopics":["Storage accounts"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-storage-accounts/","modTitle":"Configure storage accounts","units":[]},{"id":"s6","d":2,"title":"Azure Files and Blob Storage","label":"High","note":"Tiers, lifecycle, versioning, soft delete, snapshots. Know which one fixes which accident.","why":"","obj":["Create and configure a file share in Azure Storage","Create and configure a container in Blob Storage","Configure storage tiers","Configure snapshots and soft delete for Azure Files","Configure blob lifecycle management","Configure blob versioning"],"cold":["**Hot, Cool (30 days), Cold (90), Archive (180, offline)**. Archive must be **rehydrated** (high priority under 1 hour).","**Lifecycle management** moves or deletes blobs by age or last access.","**Versioning** protects overwrites. **Soft delete** protects deletes. **Snapshots** are manual.","Container access: **Private, Blob, Container**. Anonymous access must be allowed on the account.","Azure Files: **share snapshots** (point in time) and **share soft delete** (1-365 days). **Azure File Sync** caches on Windows Server.","**Immutable storage**: time-based retention and legal hold."],"traps":["Archive cannot be the account default tier.","Deleting a share deletes its snapshots."],"hooks":["Version for overwrite, soft delete for delete."],"topics":["Files and Blob"],"qtopics":["Files and Blob"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-blob-storage/","modTitle":"Configure Azure Blob Storage","units":[]},{"id":"s7","d":3,"title":"ARM templates and Bicep","label":"Medium","note":"Read a template and predict the result. Know build vs decompile and the two modes.","why":"","obj":["Interpret an Azure Resource Manager template or a Bicep file","Modify an existing Azure Resource Manager template","Modify an existing Bicep file","Deploy resources by using an Azure Resource Manager template or a Bicep file","Export a deployment as an Azure Resource Manager template or convert an Azure Resource Manager template to a Bicep file"],"cold":["ARM JSON: **$schema, contentVersion, parameters, variables, functions, resources, outputs**. Resources is required.","Bicep: **param, var, resource, module, output**. Compiles to ARM JSON. No state file.","**az bicep build** (Bicep→JSON), **az bicep decompile** (JSON→Bicep).","**Incremental** (default) leaves extra resources. **Complete** deletes them. **What-if** previews.","**Export template** from a resource group, or reuse the template from **deployment history**.","**uniqueString()** is repeatable, **@secure()** hides values."],"traps":["Complete mode deletes resources not in the template.","dependsOn is automatic in Bicep when you reference a symbolic name."],"hooks":["Build goes to JSON. Decompile comes back."],"topics":["ARM and Bicep"],"qtopics":["ARM and Bicep"],"mod":"https://learn.microsoft.com/en-us/training/modules/build-first-bicep-file/","modTitle":"Build your first Bicep file","units":[]},{"id":"s8","d":3,"title":"Virtual machines","label":"High","note":"The biggest compute stop. Availability options and disks are favorites.","why":"","obj":["Create a virtual machine","Configure Azure Disk Encryption","Move a virtual machine to another resource group, subscription, or region","Manage virtual machine sizes","Manage virtual machine disks","Deploy virtual machines to availability zones and availability sets","Deploy and configure an Azure Virtual Machine Scale Sets"],"cold":["Families: **B** burst, **D** general, **E** memory, **F** compute, **L** storage, **N** GPU.","Resize may need **deallocate** if the size is not on the current cluster.","**Temp disk** loses data. Disks grow but **never shrink**. **Ultra** and **Premium SSD v2** are data disks only.","**Availability set**: 3 fault domains, up to 20 update domains, 99.95%. **Zones**: 99.99%.","**Scale sets**: Flexible (recommended, mixed sizes) or Uniform. Autoscale with min, max, rules.","**Encryption at host** for new VMs. **ADE retires Sept 2028.**","Move to another RG/subscription keeps the region. **Resource Mover** for another region."],"traps":["Availability sets do not protect against a datacenter outage.","Moving a VM to another resource group does not move it to another region."],"hooks":["Set = racks. Zones = buildings."],"topics":["Virtual machines"],"qtopics":["Virtual machines"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-virtual-machine-availability/","modTitle":"Configure virtual machine availability","units":[],"models":["regions"]},{"id":"s9","d":3,"title":"Containers","label":"Medium","note":"Pick the right container service and know who scales.","why":"","obj":["Create and manage an Azure container registry","Provision a container by using Azure Container Instances","Provision a container by using Azure Container Apps","Manage sizing and scaling for containers, including Azure Container Instances and Azure Container Apps"],"cold":["**ACR**: Basic, Standard, **Premium** (geo-replication, private endpoints). Pull with **AcrPull** + managed identity. Admin user off by default.","**az acr build** builds in the cloud.","**ACI**: container groups share lifecycle and network. CPU and memory fixed at deploy. **No autoscale.** Multi-container is Linux only.","**Container Apps**: KEDA scale rules (HTTP, TCP, CPU, memory, events), **scale to zero**, **revisions**. No vertical scaling."],"traps":["To give ACI more memory, redeploy.","Changing Container Apps scale rules creates a new revision."],"hooks":["ACI = run it. Container Apps = scale it. AKS = run Kubernetes yourself."],"topics":["Containers"],"qtopics":["Containers"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-azure-container-instances/","modTitle":"Configure Azure Container Instances","units":[]},{"id":"s10","d":3,"title":"Azure App Service","label":"High","note":"Tiers decide features. Memorize what starts at Basic and what starts at Standard.","why":"","obj":["Provision an App Service plan","Configure scaling for an App Service plan","Create an App Service","Configure certificates and Transport Layer Security (TLS) for an App Service","Map an existing custom DNS name to an App Service","Configure backup for an App Service","Configure networking settings for an App Service","Configure deployment slots for an App Service"],"cold":["The **plan** sets region, OS, tier, size and count. All apps in the plan share it.","**Basic**: custom domains, TLS, backup, manual scale to **3**. **Standard**: **autoscale**, **slots**, scale to **10**. **Premium**: 30. **Isolated**: 100.","Custom domain: **CNAME or A** + **TXT asuid**. Managed certificate is free but **not wildcard**.","**Access restrictions** and **private endpoints** = inbound. **VNet integration** = outbound.","**Slots**: swap warms up first, **swap back** to roll back, **sticky settings** stay with the slot."],"traps":["Free tier cannot use a custom domain.","VNet integration does not give the app a private inbound IP."],"hooks":["Basic builds it. Standard scales and slots it."],"topics":["App Service"],"qtopics":["App Service"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-azure-app-services/","modTitle":"Configure Azure App Service","units":[]},{"id":"s11","d":4,"title":"Virtual networks","label":"High","note":"Peering and routing questions need careful reading of which side has which setting.","why":"","obj":["Create and configure virtual networks and subnets","Create and configure virtual network peering","Configure public IP addresses","Configure user-defined network routes","Troubleshoot network connectivity"],"cold":["Each subnet loses **5 IPs** to Azure. Smallest subnet /29.","**Peering**: regional or global, **not transitive**, no overlapping address spaces.","**Gateway transit**: hub = Allow gateway transit, spoke = Use remote gateways.","**Standard public IP**: static, secure by default, zone-redundant.","**UDR** next hops: virtual appliance, virtual network gateway, VNet, internet, none. **Longest prefix**, then UDR > BGP > system.","Troubleshoot with **effective routes**, **next hop**, **IP flow verify**, **connection troubleshoot**."],"traps":["A /24 subnet has 251 usable IPs, not 254.","Spoke-to-spoke needs an NVA and UDRs, not just peering."],"hooks":["Peering is a handshake, not a chain."],"topics":["Virtual networks"],"qtopics":["Virtual networks"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-vnet-peering/","modTitle":"Configure Azure Virtual Network peering","units":[],"models":["vnet","hub"]},{"id":"s12","d":4,"title":"Secure access to virtual networks","label":"High","note":"NSG evaluation is the classic trap. Walk the rules in priority order.","why":"","obj":["Create and configure network security groups (NSGs) and application security groups","Evaluate effective security rules in NSGs","Implement Azure Bastion","Configure service endpoints for Azure platform as a service (PaaS)","Configure private endpoints for Azure PaaS"],"cold":["Priority **100-4096**, lower first, **first match wins**. Stateful.","Defaults: **65000** AllowVNet, **65001** AllowAzureLoadBalancer, **65500** DenyAll. Cannot be deleted.","Inbound: **subnet NSG then NIC NSG**. Both must allow.","**ASGs** group NICs by role. **Service tags** name Microsoft IP ranges.","**Bastion**: AzureBastionSubnet /26+, Standard public IP, TLS 443, no public IP on VMs. Native client and file transfer need **Standard**.","**Service endpoint**: subnet to PaaS over the backbone, free, PaaS keeps its public IP. **Private endpoint**: private IP NIC, reachable from on-premises, needs private DNS."],"traps":["An allow on the subnet NSG is not enough if the NIC NSG denies.","Service endpoints do not work from on-premises."],"hooks":["Lowest number speaks first."],"topics":["Network security"],"qtopics":["Network security"],"mod":"https://learn.microsoft.com/en-us/training/modules/configure-network-security-groups/","modTitle":"Configure network security groups","units":[],"models":["nsg"]},{"id":"s13","d":4,"title":"Name resolution and load balancing","label":"Medium","note":"DNS record rules and the Layer 4 vs Layer 7 split.","why":"","obj":["Configure Azure DNS","Configure an internal or public load balancer","Troubleshoot load balancing"],"cold":["**Azure DNS** hosts zones; delegate with **NS records** at the registrar. **CNAME not at apex**; **alias records** can be.","**Private DNS zones** resolve only for **linked VNets**. **Autoregistration** adds VM A records.","Custom DNS servers must **forward to 168.63.129.16** to use private zones.","**Load Balancer**: Layer 4, public or internal, frontend, pool, **probe**, rule. Standard is **secure by default** and needs a Standard public IP.","**Application Gateway**: regional Layer 7, path routing, TLS, **WAF**. **Front Door**: global Layer 7."],"traps":["Healthy probes but no traffic? Check the NSG.","Azure DNS does not register domain names."],"hooks":["Four layers for LB, seven for App Gateway."],"topics":["DNS and load balancing"],"qtopics":["DNS and load balancing"],"mod":"https://learn.microsoft.com/en-us/training/modules/intro-to-azure-load-balancer/","modTitle":"Introduction to Azure Load Balancer","units":[],"models":["lbag"]},{"id":"s14","d":5,"title":"Monitoring","label":"Medium","note":"Alerts, action groups and processing rules are the core. Know which Network Watcher tool answers which question.","why":"","obj":["Interpret metrics in Azure Monitor","Configure log settings in Azure Monitor","Query and analyze logs in Azure Monitor","Set up alert rules, action groups, and alert processing rules in Azure Monitor","Configure and interpret monitoring of virtual machines, storage accounts, and networks by using Azure Monitor Insights","Use Azure Network Watcher and Connection Monitor"],"cold":["**Metrics** (numbers, 93 days) vs **logs** (Log Analytics, **KQL**).","**Activity log**: control plane, 90 days. **Diagnostic settings** send resource logs to a workspace, storage or Event Hubs.","VMs: **Azure Monitor Agent** + **data collection rule**. **VM insights** for performance and dependency map.","Alert rules: **metric, log search, activity log** (service and resource health too).","**Action group** = who and how. **Alert processing rule** = add or **suppress** action groups on a schedule.","Network Watcher: **IP flow verify, next hop, effective security rules, connection troubleshoot, packet capture**. **Connection Monitor** is continuous. **VNet flow logs** replace NSG flow logs."],"traps":["Disabling alert rules for maintenance is the wrong answer; use a processing rule.","Resource logs need a diagnostic setting."],"hooks":["Rule fires, processing rule filters, action group notifies."],"topics":["Monitoring"],"qtopics":["Monitoring"],"mod":"https://learn.microsoft.com/en-us/training/modules/monitor-azure-vm-using-diagnostic-data/","modTitle":"Monitor your Azure virtual machines with Azure Monitor","units":[]},{"id":"s15","d":5,"title":"Backup and recovery","label":"High","note":"Which vault, which region, and the failover order.","why":"","obj":["Create a Recovery Services vault","Create an Azure Backup vault","Create and configure a backup policy","Perform backup and restore operations by using Azure Backup","Configure Azure Site Recovery for Azure resources","Perform a failover to a secondary region by using Site Recovery","Configure and interpret reports and alerts for backups"],"cold":["**Recovery Services vault**: VMs, SQL/SAP HANA in VMs, Azure Files, MARS, **Site Recovery**. **Backup vault**: Disks, Blobs, PostgreSQL, AKS.","Vault in the **same region** as the VMs it backs up.","Policy: **schedule + retention**. Enhanced policy for several backups a day.","Vault redundancy **LRS/ZRS/GRS**, locked once items are protected. **Cross Region Restore** needs GRS.","Restore: **new VM, restore disks, replace existing, file recovery**. **Soft delete** 14 days default.","Site Recovery: **test failover → failover → commit → re-protect → failback**. Recovery plans order the VMs."],"traps":["A Backup vault cannot back up Azure VMs.","Reports need diagnostic settings to Log Analytics."],"hooks":["Test, fail, commit, re-protect, fail back."],"topics":["Backup and recovery"],"qtopics":["Backup and recovery"],"mod":"https://learn.microsoft.com/en-us/training/modules/protect-virtual-machines-with-azure-backup/","modTitle":"Protect your virtual machines by using Azure Backup","units":[]}],"duels":[{"id":"d001","d":1,"a":"Security group","b":"Microsoft 365 group","clue":"Gives a team a shared mailbox, calendar and SharePoint site.","ans":1,"why":"Microsoft 365 groups are for collaboration. Security groups grant access.","miss":false},{"id":"d002","d":1,"a":"Assigned membership","b":"Dynamic membership","clue":"Needs Microsoft Entra ID P1 and blocks manual adds.","ans":1,"why":"Dynamic groups are rule-based and premium.","miss":false},{"id":"d003","d":1,"a":"Member user","b":"Guest user","clue":"Signs in with their own organization's identity after an invitation.","ans":1,"why":"B2B guests keep their home identity.","miss":false},{"id":"d004","d":1,"a":"Password change","b":"Password reset","clue":"Needs Entra ID P1 for cloud users.","ans":1,"why":"Reset (forgotten password) is P1. Change (you know the old one) is free.","miss":false},{"id":"d005","d":1,"a":"Owner","b":"Contributor","clue":"Can manage resources AND assign roles.","ans":0,"why":"Owner = Contributor plus role assignment.","miss":false},{"id":"d006","d":1,"a":"Azure role","b":"Microsoft Entra role","clue":"User Administrator, which resets passwords for directory users.","ans":1,"why":"Entra roles manage directory objects.","miss":false},{"id":"d007","d":1,"a":"Actions","b":"DataActions","clue":"Reading the contents of a blob.","ans":1,"why":"Data-plane operations are DataActions.","miss":false},{"id":"d008","d":1,"a":"Reader at subscription","b":"Contributor at resource group","clue":"Effective permission on a VM inside that resource group.","ans":1,"why":"Assignments add up: Contributor wins in that group.","miss":false},{"id":"d009","d":1,"a":"Azure Policy","b":"Azure RBAC","clue":"Controls which SKUs may be deployed, whoever deploys them.","ans":0,"why":"Policy governs resource properties. RBAC governs who can act.","miss":false},{"id":"d010","d":1,"a":"CanNotDelete lock","b":"ReadOnly lock","clue":"Allows changes but blocks deletion.","ans":0,"why":"ReadOnly blocks changes too.","miss":false},{"id":"d011","d":1,"a":"Budget","b":"Azure Advisor","clue":"Recommends buying reserved instances to save money.","ans":1,"why":"Advisor recommends. Budgets alert on spend.","miss":false},{"id":"d012","d":1,"a":"Policy initiative","b":"Management group","clue":"A container that groups subscriptions.","ans":1,"why":"An initiative groups policy definitions. A management group groups subscriptions.","miss":false},{"id":"d013","d":2,"a":"Service SAS","b":"Account SAS","clue":"Covers blobs and queues in one token.","ans":1,"why":"Account SAS can span services.","miss":false},{"id":"d014","d":2,"a":"Stored access policy","b":"Regenerate key","clue":"Revokes SAS tokens without breaking apps that use the keys.","ans":0,"why":"Changing the policy only affects SAS tokens tied to it.","miss":false},{"id":"d015","d":2,"a":"Share-level permission","b":"NTFS ACL","clue":"Uses Azure RBAC roles such as Storage File Data SMB Share Reader.","ans":0,"why":"Share level is RBAC. File level is NTFS.","miss":false},{"id":"d016","d":2,"a":"Service endpoint","b":"IP network rule","clue":"Lets a VNet subnet reach the storage account over its private address.","ans":0,"why":"Private RFC 1918 addresses cannot be used in IP rules.","miss":false},{"id":"d017","d":2,"a":"GRS","b":"RA-GRS","clue":"Lets apps read from the secondary region without a failover.","ans":1,"why":"RA = read access.","miss":false},{"id":"d018","d":2,"a":"LRS","b":"ZRS","clue":"Survives the loss of one availability zone.","ans":1,"why":"ZRS spreads copies across zones.","miss":false},{"id":"d019","d":2,"a":"AzCopy","b":"Storage Explorer","clue":"A desktop GUI to browse containers and shares.","ans":1,"why":"AzCopy is the command line tool.","miss":false},{"id":"d020","d":2,"a":"Microsoft-managed keys","b":"Customer-managed keys","clue":"Needs Key Vault with purge protection.","ans":1,"why":"CMK keys live in your vault.","miss":false},{"id":"d021","d":2,"a":"Share snapshot","b":"Share soft delete","clue":"Brings back a file share that was deleted.","ans":1,"why":"Soft delete restores deleted shares. Snapshots restore earlier file versions.","miss":false},{"id":"d022","d":2,"a":"Blob versioning","b":"Blob snapshot","clue":"Created automatically every time a blob is overwritten.","ans":0,"why":"Snapshots are manual.","miss":false},{"id":"d023","d":2,"a":"Cool tier","b":"Archive tier","clue":"Must be rehydrated before reading.","ans":1,"why":"Archive is offline.","miss":false},{"id":"d024","d":2,"a":"Lifecycle management","b":"Object replication","clue":"Moves blobs to a cheaper tier after 60 days.","ans":0,"why":"Lifecycle rules tier and delete. Object replication copies between accounts.","miss":false},{"id":"d025","d":3,"a":"Incremental mode","b":"Complete mode","clue":"Deletes resources not in the template.","ans":1,"why":"Complete removes extras. Incremental leaves them.","miss":false},{"id":"d026","d":3,"a":"az bicep build","b":"az bicep decompile","clue":"Turns ARM JSON into Bicep.","ans":1,"why":"Decompile = JSON to Bicep.","miss":false},{"id":"d027","d":3,"a":"parameters","b":"variables","clue":"Values computed inside the template, not supplied by the user.","ans":1,"why":"Variables are internal.","miss":false},{"id":"d028","d":3,"a":"Export template","b":"Deployment history","clue":"Shows the exact template that was used in an earlier deployment.","ans":1,"why":"Export shows current state, not the original template.","miss":false},{"id":"d029","d":3,"a":"Availability set","b":"Availability zone","clue":"Protects against a whole datacenter failing.","ans":1,"why":"Zones are separate datacenters.","miss":false},{"id":"d030","d":3,"a":"Fault domain","b":"Update domain","clue":"VMs rebooted together during planned maintenance.","ans":1,"why":"Update domains group maintenance reboots.","miss":false},{"id":"d031","d":3,"a":"Flexible scale set","b":"Uniform scale set","clue":"Can mix different VM sizes.","ans":0,"why":"Flexible orchestration allows mixed sizes.","miss":false},{"id":"d032","d":3,"a":"Azure Disk Encryption","b":"Encryption at host","clue":"The recommended choice for new VMs.","ans":1,"why":"ADE is retiring in 2028.","miss":false},{"id":"d033","d":3,"a":"Azure Container Instances","b":"Azure Container Apps","clue":"Scales to zero with KEDA rules.","ans":1,"why":"ACI has no autoscale.","miss":false},{"id":"d034","d":3,"a":"Standard ACR","b":"Premium ACR","clue":"Supports geo-replication.","ans":1,"why":"Premium only.","miss":false},{"id":"d035","d":3,"a":"Admin user","b":"Managed identity with AcrPull","clue":"Recommended way for apps to pull images.","ans":1,"why":"Admin user is for testing only.","miss":false},{"id":"d036","d":3,"a":"VNet integration","b":"Private endpoint","clue":"Gives the app a private inbound IP address.","ans":1,"why":"Private endpoint is inbound. VNet integration is outbound.","miss":false},{"id":"d037","d":3,"a":"Scale up","b":"Scale out","clue":"Add more instances.","ans":1,"why":"Scale out adds instances. Scale up changes size or tier.","miss":false},{"id":"d038","d":3,"a":"Basic tier","b":"Standard tier","clue":"First tier with deployment slots.","ans":1,"why":"Slots start at Standard.","miss":false},{"id":"d039","d":3,"a":"App Service managed certificate","b":"Key Vault certificate","clue":"Supports a wildcard domain.","ans":1,"why":"Managed certificates are not wildcard.","miss":false},{"id":"d040","d":4,"a":"Allow gateway transit","b":"Use remote gateways","clue":"Set on the spoke's peering.","ans":1,"why":"Spokes use remote gateways. The hub allows transit.","miss":false},{"id":"d041","d":4,"a":"Standard public IP","b":"Basic public IP","clue":"Always static and closed until an NSG allows traffic.","ans":0,"why":"Standard is secure by default.","miss":false},{"id":"d042","d":4,"a":"UDR","b":"System route","clue":"Wins when both have the same prefix.","ans":0,"why":"User-defined routes beat system routes on a tie.","miss":false},{"id":"d043","d":4,"a":"VNet peering","b":"VPN gateway","clue":"Connects two Azure VNets over the backbone without a gateway.","ans":0,"why":"Peering needs no gateway.","miss":false},{"id":"d044","d":4,"a":"Service endpoint","b":"Private endpoint","clue":"Gives the PaaS resource a private IP that on-premises can reach.","ans":1,"why":"Private endpoints are NICs in your VNet.","miss":false},{"id":"d045","d":4,"a":"Lower priority number","b":"Higher priority number","clue":"Processed first.","ans":0,"why":"100 is checked before 4096.","miss":false},{"id":"d046","d":4,"a":"ASG","b":"Service tag","clue":"A Microsoft-maintained set of IP prefixes such as Storage.","ans":1,"why":"Service tags are Microsoft-defined. ASGs group your NICs.","miss":false},{"id":"d047","d":4,"a":"Bastion Basic","b":"Bastion Standard","clue":"Supports file transfer and shareable links.","ans":1,"why":"Those are Standard features.","miss":false},{"id":"d048","d":4,"a":"CNAME record","b":"Alias record","clue":"Can be used at the zone apex.","ans":1,"why":"Alias records allow the apex.","miss":false},{"id":"d049","d":4,"a":"Load Balancer","b":"Application Gateway","clue":"Terminates TLS and routes by URL path.","ans":1,"why":"Layer 7 is Application Gateway.","miss":false},{"id":"d050","d":4,"a":"Public DNS zone","b":"Private DNS zone","clue":"Resolves names only from linked VNets.","ans":1,"why":"Private zones need VNet links.","miss":false},{"id":"d051","d":4,"a":"Front Door","b":"Application Gateway","clue":"Global Layer 7 entry point.","ans":0,"why":"Front Door is global. App Gateway is regional.","miss":false},{"id":"d052","d":5,"a":"Action group","b":"Alert processing rule","clue":"Suppresses notifications during a maintenance window.","ans":1,"why":"Processing rules modify fired alerts.","miss":false},{"id":"d053","d":5,"a":"Metrics","b":"Logs","clue":"Queried with KQL in a Log Analytics workspace.","ans":1,"why":"Logs use KQL.","miss":false},{"id":"d054","d":5,"a":"IP flow verify","b":"Connection Monitor","clue":"Continuously tests reachability and alerts on failure.","ans":1,"why":"Connection Monitor is ongoing. IP flow verify is a one-off check.","miss":false},{"id":"d055","d":5,"a":"Activity log","b":"Resource logs","clue":"Shows who deleted a resource.","ans":0,"why":"Control-plane events are in the activity log.","miss":false},{"id":"d056","d":5,"a":"Recovery Services vault","b":"Backup vault","clue":"Protects Azure managed disks with operational backup.","ans":1,"why":"Disks use a Backup vault.","miss":false},{"id":"d057","d":5,"a":"Azure Backup","b":"Azure Site Recovery","clue":"Keeps VMs replicated to another region for failover.","ans":1,"why":"Site Recovery is DR replication.","miss":false},{"id":"d058","d":5,"a":"Test failover","b":"Failover","clue":"Runs in an isolated network with no impact on production.","ans":0,"why":"Test failover is a drill.","miss":false},{"id":"d059","d":5,"a":"LRS vault","b":"GRS vault","clue":"Needed for Cross Region Restore.","ans":1,"why":"CRR needs GRS.","miss":false}]},"sc500":{"meta":{"id":"sc500","code":"SC-500","name":"Microsoft Cloud and AI Security Engineer Associate","quest":"SC-500 Quest","domains":{"1":"Manage identity, access, and governance","2":"Secure storage, databases, and networking","3":"Secure compute","4":"Manage and monitor security posture"},"weights":{"1":"20-25%","2":"25-30%","3":"20-25%","4":"20-25%"},"bosses":{"1":["The Standing Admin",""],"2":["The Open Endpoint",""],"3":["The Rogue Agent",""],"4":["The Blind SOC",""]},"mix":[12,14,12,12],"quickMix":[5,6,5,4],"fullMins":100,"quickMins":40,"hardMins":100,"passPct":70,"bookPct":80,"msUrl":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-500","studyGuide":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-500","taunts":{"1":["\"Permanent Global Admin.\"","\"Consent to everything.\"","\"Purge it, who cares.\"","\"Break-glass? Never heard.\""],"2":["\"Keys for everyone.\"","\"Public blobs are fine.\"","\"The NSG will save you.\"","\"DBAs can read it all.\""],"3":["\"Agents need no sponsor.\"","\"RDP open, always.\"","\"Detection mode forever.\"","\"Ignore the tool call.\""],"4":["\"Nobody reads alerts.\"","\"Free tier sees enough.\"","\"Logs? Delete them.\"","\"Shadow IT stays hidden.\""]}},"cards":[{"id":"c001","d":1,"topic":"Entra access","front":"PIM: eligible vs active assignment?","back":"**Eligible:** the user must **activate** the role when needed (can require MFA, justification, approval, a ticket) and it expires after a set time. **Active:** the role is on without activation. PIM gives **just-in-time, time-bound, audited** privileged access.","miss":false},{"id":"c002","d":1,"topic":"Entra access","front":"What can PIM manage?","back":"**Microsoft Entra roles**, **Azure resource roles** (Owner, Contributor and others at any scope) and **PIM for Groups** (just-in-time membership or ownership). Pair it with **access reviews** to remove assignments nobody needs.","miss":false},{"id":"c003","d":1,"topic":"Entra access","front":"Conditional Access: the building blocks?","back":"**Assignments** (users or workload/agent identities, target resources, conditions such as location, device platform, client app, sign-in risk, user risk) and **access controls**: **grant** (block, require MFA, authentication strength, compliant device) and **session** (sign-in frequency, app-enforced restrictions).","miss":false},{"id":"c004","d":1,"topic":"Entra access","front":"How do you roll out a Conditional Access policy safely?","back":"Start in **report-only** mode and check the sign-in logs. **Exclude emergency (break-glass) accounts.** Use the **What If** tool to test who a policy hits.","miss":false},{"id":"c005","d":1,"topic":"Entra access","front":"Phishing-resistant authentication methods?","back":"**Passkeys (FIDO2)**, **Windows Hello for Business** and **certificate-based authentication**. Enforce them with a Conditional Access **authentication strength**. SMS and voice are the weakest methods.","miss":false},{"id":"c006","d":1,"topic":"Entra access","front":"App registration vs enterprise application?","back":"**App registration:** the global **application object**, where you define the app (redirect URIs, API permissions, secrets or certificates). **Enterprise application:** the **service principal**, the app's local identity in a tenant, where you control sign-in, assignment and consent.","miss":false},{"id":"c007","d":1,"topic":"Entra access","front":"Delegated vs application permissions?","back":"**Delegated:** the app acts **as the signed-in user**, limited by what that user can do. **Application:** the app acts **as itself** with no user, and always needs **admin consent**.","miss":false},{"id":"c008","d":1,"topic":"Entra access","front":"Consent settings worth knowing?","back":"Limit **user consent** to verified publishers and low-risk permissions (or turn it off), and turn on the **admin consent workflow** so users can request approval. Review and revoke grants under Enterprise applications → Permissions.","miss":false},{"id":"c009","d":1,"topic":"Entra access","front":"System-assigned vs user-assigned managed identity?","back":"**System-assigned:** tied to one resource and deleted with it. **User-assigned:** a standalone resource you can attach to **many** resources. Both remove secrets from code; grant them Azure RBAC roles.","miss":false},{"id":"c010","d":1,"topic":"Key Vault","front":"What does Key Vault store, and which tiers exist?","back":"**Secrets** (passwords, connection strings), **keys** (cryptographic keys) and **certificates**. **Standard** protects keys with software; **Premium** adds **HSM-protected keys**. **Managed HSM** is a separate single-tenant HSM service.","miss":false},{"id":"c011","d":1,"topic":"Key Vault","front":"Key Vault access models?","back":"**Azure RBAC** (recommended): roles at vault, or even single-object scope. **Vault access policies** (legacy): per-vault permission lists. The **management plane** (create the vault, settings) and **data plane** (read secrets, use keys) are authorized separately.","miss":false},{"id":"c012","d":1,"topic":"Key Vault","front":"Key Vault data-plane RBAC roles to recognize?","back":"**Key Vault Administrator** (all data-plane), **Secrets Officer** (manage secrets), **Secrets User** (read secret values), **Crypto Officer** (manage keys), **Crypto User** (use keys), **Certificates Officer**, **Reader** (metadata only), **Purge Operator**.","miss":false},{"id":"c013","d":1,"topic":"Key Vault","front":"Soft delete in Key Vault?","back":"On by default and **cannot be turned off**. Deleted vaults and objects stay recoverable for **7 to 90 days** (default 90); the period is set at creation and **cannot be changed**. A deleted name cannot be reused until it is purged or expires.","miss":false},{"id":"c014","d":1,"topic":"Key Vault","front":"Purge protection?","back":"Optional, **off by default**. When on, **nobody, not even Microsoft**, can purge a deleted vault or object until the retention period ends, and it **cannot be disabled**. Required by services that use customer-managed keys.","miss":false},{"id":"c015","d":1,"topic":"Key Vault","front":"Key Vault network controls?","back":"Firewall: **disable public access** or allow **selected virtual networks and IP ranges**; use a **private endpoint** for private access. The **Allow trusted Microsoft services** exception lets named Azure services through the firewall. They still need permission to the data.","miss":false},{"id":"c016","d":1,"topic":"Key Vault","front":"Rotation and expiry?","back":"Set **expiration dates**. Keys support an **auto-rotation policy**. Certificates can **auto-renew** with an integrated CA. Secrets rotate with Event Grid 'near expiry' events and automation. Each object has **versions**.","miss":false},{"id":"c017","d":1,"topic":"Key Vault","front":"Secrets scanning with Defender CSPM, and Defender for Key Vault?","back":"**Defender CSPM agentless secrets scanning** finds plaintext secrets and keys on VMs and in cloud deployments, and shows them in recommendations and **attack paths**. **Defender for Key Vault** raises **alerts** on unusual or suspicious access to vaults.","miss":false},{"id":"c018","d":1,"topic":"Governance and compliance","front":"Built-in vs custom policy definitions?","back":"**Built-in:** maintained by Microsoft (allowed locations, require HTTPS…). **Custom:** your own JSON rule with `if` and `then.effect`. Group either into an **initiative** and **assign** at management group, subscription or resource group, with exclusions and **exemptions**.","miss":false},{"id":"c019","d":1,"topic":"Governance and compliance","front":"Security standards in Defender for Cloud?","back":"The **Microsoft cloud security benchmark (MCSB)** is assigned by default and drives **recommendations** and **secure score**. Add **regulatory standards** (ISO 27001, PCI DSS, NIST…) and custom standards. Standards are built on **Azure Policy** initiatives.","miss":false},{"id":"c020","d":1,"topic":"Governance and compliance","front":"Regulatory compliance dashboard?","back":"Shows each standard's controls as passed or failed, based on the assessed resources. Adding standards beyond the default needs a **paid Defender plan**. You can download reports and Microsoft's audit attestations.","miss":false},{"id":"c021","d":1,"topic":"Governance and compliance","front":"Managing recommendations?","back":"**Remediate** (often a Fix button), **exempt** a resource (waived or mitigated), **disable** a rule, or assign an **owner and due date** with governance rules. **Deny** and **Enforce** options stop new non-compliant resources.","miss":false},{"id":"c022","d":1,"topic":"Governance and compliance","front":"Custom Azure role: the parts?","back":"**Actions** and **NotActions** (management plane), **DataActions** and **NotDataActions** (data plane), and **AssignableScopes** (where it can be assigned). NotActions subtracts from Actions; it is **not** a deny.","miss":false},{"id":"c023","d":1,"topic":"Governance and compliance","front":"Custom Microsoft Entra roles?","back":"Built from Entra permissions (for example app registration management) and assigned tenant-wide or scoped to an object or administrative unit. They need **Microsoft Entra ID P1**.","miss":false},{"id":"c024","d":1,"topic":"Governance and compliance","front":"Finding and fixing overprivileged access?","back":"Use **Access control (IAM)** to review assignments at each scope, **PIM** to make standing roles eligible, **access reviews** to recertify, and swap broad roles (Owner, Contributor) for narrow or custom ones. Prefer **groups** over direct user assignments.","miss":false},{"id":"c025","d":1,"topic":"Governance and compliance","front":"Azure Backup security features?","back":"**Soft delete** (14 days default, up to 180, always-on option), **immutable vault** (blocks operations that would lose recovery points; can be **locked**), and **multi-user authorization** with a **Resource Guard** owned by a different admin.","miss":false},{"id":"c026","d":1,"topic":"Governance and compliance","front":"Security controls with infrastructure as code?","back":"Define controls in **Bicep, ARM templates or Terraform** (policy assignments, role assignments, locks, Defender plans) so every environment gets the same baseline. Add **what-if** and template scanning in the pipeline before deployment.","miss":false},{"id":"c027","d":2,"topic":"Storage security","front":"Baseline hardening for a storage account?","back":"**Require secure transfer** (HTTPS), **minimum TLS 1.2**, **disallow anonymous blob access**, **disallow Shared Key** access (forces Microsoft Entra authorization), restrict **network access**, and limit **SAS** lifetime with a SAS expiration policy.","miss":false},{"id":"c028","d":2,"topic":"Storage security","front":"Why disable Shared Key authorization?","back":"Account keys give **full access** and cannot be tied to a person. Disabling Shared Key means requests must use **Microsoft Entra ID** (RBAC data roles), which also blocks **account and service SAS**. User delegation SAS still works.","miss":false},{"id":"c029","d":2,"topic":"Storage security","front":"Storage firewall rules?","back":"Set public network access to **selected networks**: **virtual network rules** (need a service endpoint), **IP rules** (public ranges only), **resource instance rules**, and the **trusted Microsoft services** exception. Or disable public access and use **private endpoints**.","miss":false},{"id":"c030","d":2,"topic":"Storage security","front":"Encryption options for storage?","back":"Always encrypted at rest (AES-256). Choose **Microsoft-managed keys** or **customer-managed keys** in Key Vault/Managed HSM. **Infrastructure encryption** double-encrypts (set at creation). **Encryption scopes** give containers or blobs their own key.","miss":false},{"id":"c031","d":2,"topic":"Storage security","front":"Data roles for blob access with Entra ID?","back":"**Storage Blob Data Reader**, **Contributor** and **Owner** (Owner also sets POSIX ACLs and ownership). Management roles such as Contributor do **not** grant blob data access by themselves.","miss":false},{"id":"c032","d":2,"topic":"Storage security","front":"Stored access policies?","back":"Defined on a container, share, queue or table. A **service SAS** can point at one for its start, expiry and permissions. **Change or delete the policy to revoke** every SAS that uses it. Maximum **five** per container.","miss":false},{"id":"c033","d":2,"topic":"Storage security","front":"Defender for Storage: what does it do?","back":"**Activity monitoring** (alerts on unusual access, exfiltration, suspicious IPs; no resource logs needed), **malware scanning** (**on-upload** and **on-demand**, Microsoft Defender Antivirus, priced per GB) and **sensitive data threat detection** (no extra cost).","miss":false},{"id":"c034","d":2,"topic":"Storage security","front":"Malware scanning settings?","back":"A **monthly cap** on GB scanned per account, results as **blob index tags**, to **Event Grid** (automation) or **Log Analytics** (audit), and optional **soft delete of malicious blobs**. Hash reputation analysis is a lighter check that does not read the whole file.","miss":false},{"id":"c035","d":2,"topic":"Database security","front":"Azure SQL authentication options?","back":"**SQL authentication** (username and password in the database), **Microsoft Entra authentication** (users, groups, managed identities), or both. **Microsoft Entra-only authentication** turns SQL logins off. Set a **Microsoft Entra admin** on the server first.","miss":false},{"id":"c036","d":2,"topic":"Database security","front":"Azure SQL firewall rules?","back":"**Server-level IP rules** apply to every database on the logical server. **Database-level IP rules** apply to one database. **Virtual network rules** allow a subnet. 'Allow Azure services' opens the server to all of Azure, so prefer **private endpoints** and deny public access.","miss":false},{"id":"c037","d":2,"topic":"Database security","front":"Transparent data encryption (TDE)?","back":"Encrypts data files, logs and backups **at rest**, **on by default** for new databases. Uses a **service-managed key** or a **customer-managed key** in Key Vault. The app needs no changes.","miss":false},{"id":"c038","d":2,"topic":"Database security","front":"Always Encrypted?","back":"Encrypts chosen **columns in the client driver**, so the data stays encrypted in use and **database admins cannot see plaintext**. Keys stay with the client (for example in Key Vault).","miss":false},{"id":"c039","d":2,"topic":"Database security","front":"Dynamic data masking and row-level security?","back":"**Dynamic data masking** hides part of a column in query results for non-privileged users; the stored data is unchanged, so it is not encryption. **Row-level security** filters which rows a user can read or change.","miss":false},{"id":"c040","d":2,"topic":"Database security","front":"Azure SQL auditing: destinations and scope?","back":"Writes database events to a **storage account**, a **Log Analytics workspace** or **Event Hubs**, in any combination. A **server-level** policy covers all existing and new databases. If both server and database auditing are on, events are audited twice. Prefer server-level.","miss":false},{"id":"c041","d":2,"topic":"Database security","front":"Auditing for SQL Managed Instance?","back":"Configured **per instance** with T-SQL or the portal: create a server audit to a storage container (URL), or send audit events through **diagnostic settings** to Log Analytics or Event Hubs.","miss":false},{"id":"c042","d":2,"topic":"Database security","front":"Defender for Databases?","back":"Four plans: **Azure SQL databases**, **SQL servers on machines** (Azure, hybrid, multicloud), **open-source relational databases** (PostgreSQL, MySQL, MariaDB) and **Azure Cosmos DB**. Gives **threat alerts** (SQL injection, brute force, anomalous access) and, for SQL, **vulnerability assessment**.","miss":false},{"id":"c043","d":2,"topic":"Network security","front":"NSG and ASG essentials for SC-500?","back":"NSG rules: priority **100-4096**, lowest first, **first match wins**, stateful. Inbound is checked at the **subnet NSG then the NIC NSG**. **ASGs** let rules target roles (web, db) instead of IPs. Defaults end in **DenyAllInbound 65500**.","miss":false},{"id":"c044","d":2,"topic":"Network security","front":"Azure Virtual Network Manager security admin rules?","back":"Central rules applied to **network groups** of virtual networks, **evaluated before NSGs**. Actions: **Allow** (NSGs still evaluate after), **Deny** (stops; NSGs cannot override) and **Always Allow** (stops; NSGs cannot block). Priority **1-4096**.","miss":false},{"id":"c045","d":2,"topic":"Network security","front":"AVNM deployment rules?","back":"Rules live in **rule collections** inside a **security admin configuration**, which you **deploy** to regions. Only **one security admin configuration per region** (use several rule collections). Changes apply with a short delay (eventual consistency).","miss":false},{"id":"c046","d":2,"topic":"Network security","front":"Securing Azure Virtual WAN?","back":"Turn a virtual hub into a **secured virtual hub** by adding **Azure Firewall** (or a supported security partner) and manage it with **Azure Firewall Manager**. **Routing intent** sends internet and private traffic through the hub's firewall.","miss":false},{"id":"c047","d":2,"topic":"Network security","front":"VPN security options?","back":"**Site-to-site:** IPsec/IKE tunnels; use a **custom IPsec/IKE policy** for required algorithms. **Point-to-site:** authenticate with **Microsoft Entra ID** (supports Conditional Access and MFA), certificates or RADIUS, over OpenVPN or IKEv2.","miss":false},{"id":"c048","d":2,"topic":"Network security","front":"Microsoft Entra Private Access?","back":"Zero Trust network access to **private apps** without a VPN. Users run the **Global Secure Access client**; traffic reaches apps through **private network connectors** inside your network. Define apps with **Quick Access** or per-app segments and apply **Conditional Access** per app.","miss":false},{"id":"c049","d":2,"topic":"Network security","front":"Private endpoint vs Private Link service?","back":"**Private endpoint:** a NIC with a private IP in **your** VNet that connects to a PaaS resource (or to a Private Link service). **Private Link service:** **your own** service, behind a **Standard Load Balancer**, published so consumers connect with private endpoints; you approve connections.","miss":false},{"id":"c050","d":2,"topic":"Network security","front":"Azure Firewall SKUs and rule types?","back":"**Basic** (small sites), **Standard** (threat intelligence filtering, FQDN and network rules, DNS proxy), **Premium** (adds **TLS inspection**, **IDPS**, URL filtering, web categories). Rules: **DNAT**, **network**, **application**, managed in a **Firewall Policy**. Needs **AzureFirewallSubnet** and a UDR to steer traffic.","miss":false},{"id":"c051","d":2,"topic":"Network security","front":"Network Watcher tools for effective rules?","back":"**IP flow verify** (is this packet allowed, and by which rule), **NSG diagnostics** (also for ranges and service tags), **Effective security rules** (the combined rules on a NIC), **Next hop**, **Connection troubleshoot**. IP flow verify also checks **AVNM admin rules**.","miss":false},{"id":"c052","d":3,"topic":"Security for AI","front":"Finding overshared SharePoint data before Copilot uses it?","back":"Purview **Data Security Posture Management** runs a **data risk assessment every week for the top 100 SharePoint sites by usage**, with no setup. Add **custom assessments** for chosen sites. Results show overshared and unlabeled sensitive content with fixes (labels, restricting access).","miss":false},{"id":"c053","d":3,"topic":"Security for AI","front":"What does DSPM (for AI) give you?","back":"Insight into **AI activity** (Copilot, agents, third-party AI sites), **one-click policies** (DLP, collection, insider risk), **data risk assessments** and compliance controls. Needs **Purview Audit** on; third-party AI sites also need **onboarded devices** and the **Purview browser extension**. Allow about 24 hours for data.","miss":false},{"id":"c054","d":3,"topic":"Security for AI","front":"Real-time protection for Copilot Studio agents?","back":"Agents already block prompt injection (UPIA and XPIA) by default. Adding **Microsoft Defender** (or another provider) as the **external threat detection** system makes the agent ask it **before every tool invocation**; the system answers **allow or block**. Only for agents with **generative orchestration**.","miss":false},{"id":"c055","d":3,"topic":"Security for AI","front":"Microsoft Entra Agent ID: the objects?","back":"**Agent identity blueprint** (template; holds the credentials), **agent identity** (one per agent instance; no credentials of its own), optional **agent's user account**. Each needs a **sponsor** (business accountability) and should have an **owner** (technical admin).","miss":false},{"id":"c056","d":3,"topic":"Security for AI","front":"Conditional Access and governance for agent identities?","back":"Conditional Access can target **agent identities** and use **agent risk** from ID Protection. Apply policy at the **blueprint** so all its agents inherit it; **disabling a blueprint blocks all its agents**. Govern access with **access packages**; expiry notices go to the sponsor.","miss":false},{"id":"c057","d":3,"topic":"Security for AI","front":"Blast radius in Defender XDR?","back":"When an agent or identity is involved in an incident, the **incident and attack path graph** shows what it can reach: the data, tools and resources its permissions expose. Use it to judge impact, then disable the agent identity or its blueprint.","miss":false},{"id":"c058","d":3,"topic":"Security for AI","front":"AI Gateway for Microsoft Foundry?","back":"Backed by **Azure API Management**, enabled from the Foundry portal for a Foundry resource. It sits between clients and model deployments and enforces **tokens-per-minute limits and token quotas per project**, plus content safety, logging and semantic caching. Over the TPM limit returns **429**; over quota returns **403**.","miss":false},{"id":"c059","d":3,"topic":"Security for AI","front":"Defender for AI Services?","back":"A Defender for Cloud workload protection plan giving **threat protection for AI services**: alerts on jailbreaks, data leakage, credential theft and more, using **Prompt Shields** and threat intelligence, shown in Defender XDR. Optional **user prompt evidence** adds prompt snippets to alerts.","miss":false},{"id":"c060","d":3,"topic":"Security for AI","front":"Foundry guardrails?","back":"A **guardrail** is a set of **controls**; each has a **risk**, **intervention points** and an **action**. Points: **user input, tool call, tool response, output** (the two tool points are agents only). An **agent's guardrail fully overrides its model's**. Agents support **Annotate and block** only.","miss":false},{"id":"c061","d":3,"topic":"Security for AI","front":"Data and AI security dashboard, and agents in the Microsoft 365 admin center?","back":"**Defender for Cloud's Data and AI security dashboard** shows data and AI resources, protection coverage, top alerts, recommendations and attack paths; full use needs **Defender CSPM** with sensitive data discovery. The **Microsoft 365 admin center** is where you see, approve, block and assign **agents** for Microsoft 365 users.","miss":false},{"id":"c062","d":3,"topic":"Servers and VMs","front":"Disk encryption choices now?","back":"**Server-side encryption** is always on (platform-managed or customer-managed keys through a **disk encryption set**). **Encryption at host** also covers temp disks and caches end to end: use it for new VMs. **Azure Disk Encryption** (BitLocker/DM-Crypt) **retires 15 Sept 2028**. **Confidential disk encryption** binds keys to the VM's TPM.","miss":false},{"id":"c063","d":3,"topic":"Servers and VMs","front":"Azure Bastion planning?","back":"Managed RDP/SSH over **TLS 443** with **no public IP on the VMs**. Needs **AzureBastionSubnet (/26 or larger)** and a Standard public IP. **Basic**, **Standard** (native client, file transfer, shareable links, scaling) and **Premium** (**session recording**, private-only). Reaches peered VNets.","miss":false},{"id":"c064","d":3,"topic":"Servers and VMs","front":"Just-in-time (JIT) VM access?","back":"Part of **Defender for Servers Plan 2**. Management ports stay **closed**; an authorized user **requests access** for a port, source IP and limited time, and Defender for Cloud adds a temporary allow rule to the **NSG or Azure Firewall**, then removes it.","miss":false},{"id":"c065","d":3,"topic":"Servers and VMs","front":"Azure Arc for servers?","back":"Installs the **Connected Machine agent** on on-premises, AWS or GCP servers so they appear as Azure resources. Then you can apply **Azure Policy and Machine Configuration**, **Defender for Servers**, Azure Monitor and Update Manager to them.","miss":false},{"id":"c066","d":3,"topic":"Servers and VMs","front":"Defender for Servers Plan 1 vs Plan 2?","back":"**P1:** Defender for Endpoint **EDR** plus core vulnerability management. **P2:** all of P1 plus **agentless scanning**, **JIT VM access**, **file integrity monitoring**, **premium Defender Vulnerability Management**, OS configuration assessment, regulatory compliance and a **500 MB per machine daily ingestion benefit**.","miss":false},{"id":"c067","d":3,"topic":"Servers and VMs","front":"Onboarding hybrid and multicloud servers to Defender for Servers?","back":"On-premises: onboard with **Azure Arc**. AWS and GCP: create a **connector** in Defender for Cloud, which onboards machines through Arc. The **Defender for Endpoint extension** is then installed automatically on supported machines.","miss":false},{"id":"c068","d":3,"topic":"Servers and VMs","front":"Agentless scanning for VMs?","back":"Takes **disk snapshots** and analyzes them out of band, with **no agent and no performance impact**. Finds **vulnerabilities, secrets and malware** and builds software inventory. Included with **Defender for Servers P2** or **Defender CSPM**; on by default with P2. You can exclude machines.","miss":false},{"id":"c069","d":3,"topic":"Servers and VMs","front":"Trusted launch security features?","back":"Security type **Trusted launch** (the default for Gen2 VMs) gives **Secure Boot** (only signed boot components), **vTPM** (measured boot and key storage) and **boot integrity monitoring** through attestation. Other security types: **Standard** and **Confidential VMs**.","miss":false},{"id":"c070","d":3,"topic":"Servers and VMs","front":"Azure Machine Configuration?","back":"Formerly Guest Configuration. **Audits or enforces settings inside the OS** (password policy, security baselines, installed software) through **Azure Policy**. Needs the **Machine Configuration extension** and a **system-assigned managed identity**; works on Azure VMs and **Arc-enabled servers**.","miss":false},{"id":"c071","d":3,"topic":"App platform security","front":"Defender for Containers: what does it cover?","back":"**Posture** (agentless discovery of clusters, misconfiguration recommendations), **vulnerability assessment** of container images in registries and running workloads, and **runtime threat protection** through the **Defender sensor** on nodes plus control-plane audit logs. Works for AKS, and for EKS and GKE through connectors.","miss":false},{"id":"c072","d":3,"topic":"App platform security","front":"AKS access hardening?","back":"Integrate with **Microsoft Entra ID**, use **Azure RBAC for Kubernetes authorization**, and **disable local accounts**. Protect the API server with a **private cluster** or **authorized IP ranges**. Give pods identity with **Microsoft Entra Workload ID**.","miss":false},{"id":"c073","d":3,"topic":"App platform security","front":"AKS workload hardening?","back":"**Network policies** restrict pod-to-pod traffic. **Azure Policy for Kubernetes** audits or denies risky pod settings (privileged containers, host paths). Pull secrets from **Key Vault** with the Secrets Store CSI driver. Keep node images and Kubernetes versions patched.","miss":false},{"id":"c074","d":3,"topic":"App platform security","front":"Azure Container Registry security?","back":"**Disable the admin user**; pull with a **managed identity** and **AcrPull**. **Premium** adds **private endpoints** and more. Restrict public network access, and let Defender for Containers scan images for vulnerabilities.","miss":false},{"id":"c075","d":3,"topic":"App platform security","front":"Securing ACI and Container Apps?","back":"Use **managed identities** instead of stored credentials, deploy into a **virtual network**, keep **secrets** in Key Vault references, and limit **ingress** (Container Apps: internal-only ingress, IP restrictions, built-in authentication).","miss":false},{"id":"c076","d":3,"topic":"App platform security","front":"Azure Functions: authentication and network access?","back":"**Function keys** are shared secrets, fine for simple callers. For real identity use **App Service Authentication (Easy Auth)** with Microsoft Entra ID. Network: **access restrictions**, **private endpoints** (inbound) and **VNet integration** (outbound).","miss":false},{"id":"c077","d":3,"topic":"App platform security","front":"Azure Logic Apps security?","back":"Request triggers are protected by a **SAS signature in the URL**; add **Microsoft Entra OAuth** policies and **IP restrictions**. Turn on **secure inputs and outputs** to hide data in run history. Connect to other services with a **managed identity**.","miss":false},{"id":"c078","d":3,"topic":"App platform security","front":"App Service security settings?","back":"**HTTPS Only**, **minimum TLS version**, **managed identity**, **Key Vault references** for app settings, **built-in authentication**, **access restrictions** and **private endpoints**; turn off FTP and basic-auth publishing.","miss":false},{"id":"c079","d":3,"topic":"App platform security","front":"Azure Web Application Firewall?","back":"Runs on **Application Gateway**, **Front Door** (and Azure CDN). **Managed rule sets** (OWASP-based, bot protection) plus **custom rules** (IP, geo, rate limit). **Detection mode** only logs; **Prevention mode** blocks. Use **exclusions** to fix false positives.","miss":false},{"id":"c080","d":3,"topic":"App platform security","front":"Protecting back-end APIs with API Management?","back":"Policies: **validate-jwt** / validate-azure-ad-token (check tokens), **rate-limit** and **quota** (throttle), **ip-filter**, subscription keys. Authenticate to back ends with a **managed identity** or client certificate. **Defender for APIs** adds inventory, posture and threat detection.","miss":false},{"id":"c081","d":4,"topic":"Defender for Cloud posture","front":"Foundational CSPM vs Defender CSPM?","back":"**Foundational CSPM (free):** recommendations, secure score, MCSB. **Defender CSPM (paid):** adds **attack path analysis**, **cloud security explorer**, **agentless scanning**, **data security posture** (sensitive data discovery), **governance rules** and risk prioritization.","miss":false},{"id":"c082","d":4,"topic":"Defender for Cloud posture","front":"Attack path analysis and cloud security explorer?","back":"**Attack paths** show chains an attacker could follow from an exposed entry point to a valuable target (for example internet-exposed VM → vulnerable → has permission to a Key Vault). **Cloud security explorer** lets you query the same graph yourself.","miss":false},{"id":"c083","d":4,"topic":"Defender for Cloud posture","front":"Workload protection plans?","back":"Paid plans enabled **per subscription** (some per resource): **Servers, Containers, Storage, Databases, App Service, Key Vault, Resource Manager, APIs, AI Services**. They raise **security alerts**. Turn on with Environment settings or at scale with **Azure Policy**.","miss":false},{"id":"c084","d":4,"topic":"Defender for Cloud posture","front":"Connecting AWS and GCP?","back":"Add a **connector** under Environment settings. **AWS:** deploy the generated **CloudFormation** template (management account or single account). **GCP:** run the generated script in Cloud Shell (organization or project). Servers come in through **Azure Arc**. CSPM is agentless.","miss":false},{"id":"c085","d":4,"topic":"Defender for Cloud posture","front":"Compliance against security frameworks?","back":"The **regulatory compliance dashboard** scores controls for assigned standards across Azure, AWS and GCP. MCSB is default; add standards per subscription or connector, or build **custom standards** and recommendations.","miss":false},{"id":"c086","d":4,"topic":"Defender for Cloud posture","front":"Defender Vulnerability Management for Azure VMs?","back":"The built-in vulnerability scanner for Defender for Servers. **Agent-based** (Defender for Endpoint sensor, P1 and P2) and **agentless** (P2). Findings appear as recommendations with CVEs and software inventory. BYOL scanners are the alternative.","miss":false},{"id":"c087","d":4,"topic":"Defender for Cloud posture","front":"Defender External Attack Surface Management (EASM)?","back":"Maps your **internet-facing assets from the outside**: domains, hosts, IPs, pages, certificates. Starts from **seeds** and discovers connected infrastructure with **no agents or credentials**, exposing unknown and unmanaged ('shadow') assets and their vulnerabilities.","miss":false},{"id":"c088","d":4,"topic":"Defender for Cloud posture","front":"Secure score basics?","back":"A percentage from the MCSB recommendations. Each **control** has a maximum score; you earn it only when **all** its recommendations are fixed for a resource. Exempting a resource removes it from the calculation.","miss":false},{"id":"c089","d":4,"topic":"Microsoft Sentinel","front":"Workspaces in Microsoft Sentinel?","back":"Sentinel is enabled on a **Log Analytics workspace**. One workspace is simplest; use more for data residency or separate tenants. Onboard the workspace to the **Microsoft Defender portal** for unified incidents; one workspace is **primary**.","miss":false},{"id":"c090","d":4,"topic":"Microsoft Sentinel","front":"Sentinel built-in roles?","back":"**Reader** (view data, incidents, workbooks), **Responder** (Reader + manage incidents), **Contributor** (Responder + create and edit rules, workbooks, install solutions), **Playbook Operator** (list and run playbooks), **Automation Contributor** (for Sentinel's own account to run playbooks from automation rules; **not for users**). Assign at the **resource group**.","miss":false},{"id":"c091","d":4,"topic":"Microsoft Sentinel","front":"Content hub?","back":"Where you install **solutions**: packages of data connectors, analytics rules, workbooks, hunting queries, parsers and playbooks for a product or scenario. Install, then **configure** the connector and enable the rule templates.","miss":false},{"id":"c092","d":4,"topic":"Microsoft Sentinel","front":"Syslog and CEF collection?","back":"Use the **Syslog via AMA** and **Common Event Format via AMA** connectors: a **Linux log forwarder** with the **Azure Monitor Agent** and a **data collection rule**. Syslog lands in the **Syslog** table, CEF in **CommonSecurityLog**.","miss":false},{"id":"c093","d":4,"topic":"Microsoft Sentinel","front":"Windows Security events and WEF?","back":"**Windows Security Events via AMA:** AMA on each machine plus a **DCR** choosing All, Common, Minimal or custom (XPath) events → **SecurityEvent** table. **Windows Forwarded Events:** AMA on a **Windows Event Collector** server that receives events by **WEF** → **WindowsEvent** table.","miss":false},{"id":"c094","d":4,"topic":"Microsoft Sentinel","front":"Custom log tables?","back":"Create a table ending in **_CL** and send data with the **Logs ingestion API** through a **data collection rule** (and endpoint), which can **transform** data with KQL at ingestion. Pick the table's tier: analytics or data lake.","miss":false},{"id":"c095","d":4,"topic":"Microsoft Sentinel","front":"Automation rules vs playbooks?","back":"**Automation rules** run on **incident created, incident updated or alert created**: assign owner, change severity or status, add tags or tasks, suppress, and **run playbooks**, in a set order. **Playbooks** are **Azure Logic Apps** workflows that act on other systems.","miss":false},{"id":"c096","d":4,"topic":"Microsoft Sentinel","front":"Data tiers and retention in Sentinel?","back":"**Analytics tier:** hot data for rules, hunting and workbooks; Sentinel tables keep **90 days** at no extra retention charge, extendable to **2 years**. **Data lake tier:** low-cost storage with **total retention up to 12 years**; no real-time analytics rules; query with KQL jobs and notebooks.","miss":false},{"id":"c097","d":4,"topic":"Microsoft Sentinel","front":"Querying Purview Audit in Defender XDR?","back":"Audit search is available from the **Defender portal** as well as the Purview portal. In **advanced hunting**, Microsoft 365 audit activity is in **CloudAppEvents** (needs the Microsoft 365 app connector in Defender for Cloud Apps). You need audit read permissions.","miss":false},{"id":"c098","d":4,"topic":"Security Copilot","front":"What is a Security Compute Unit (SCU)?","back":"The unit of capacity that runs Security Copilot workloads, in the standalone portal, embedded experiences and **agents**. Capacity is an **Azure resource** attached to a **workspace**. Microsoft 365 E5 includes a monthly SCU allowance.","miss":false},{"id":"c099","d":4,"topic":"Security Copilot","front":"Security Copilot workspaces?","back":"A **workspace** is a scoped, tenant-bound environment where users, plugins, promptbooks and agents operate, with its own **capacity** and role assignments. Auto-provisioned tenants get a **default workspace**.","miss":false},{"id":"c100","d":4,"topic":"Security Copilot","front":"Security Copilot roles?","back":"**Owner** and **Contributor**. They are **not Entra roles** and give access to the **platform only**, never to security data. **Owners** manage capacity, plugins, role assignment, data sharing and file upload settings. **Contributors** create sessions and use Copilot. At least **two owners** are always kept.","miss":false},{"id":"c101","d":4,"topic":"Security Copilot","front":"Who gets the roles by default?","back":"Certain Entra roles **inherit Owner** (Global Administrator, Security Administrator and a few others). Contributor defaults to the **Recommended Microsoft Security roles** group; the older **Everyone** default should be removed. Best practice: assign roles to a **security group**.","miss":false},{"id":"c102","d":4,"topic":"Security Copilot","front":"Why can a Contributor still see no data?","back":"Copilot acts **on behalf of the user**. Each plugin needs the user's own role in that product: for example **Microsoft Sentinel Reader** for the Sentinel plugin, an **Intune** role for Intune. Copilot never goes beyond the user's access.","miss":false},{"id":"c103","d":4,"topic":"Security Copilot","front":"Plugins?","back":"Connect Copilot to data and tools: **Microsoft** plugins (Defender XDR, Sentinel, Entra, Intune, Purview…), **non-Microsoft** plugins and **custom** plugins. Turn them on under **Manage sources**; some need extra setup. Owners control **who can add and manage custom plugins**.","miss":false},{"id":"c104","d":4,"topic":"Security Copilot","front":"Agents in Security Copilot?","back":"Agents run tasks with a configured **identity, triggers and permissions**. Find **Microsoft agents** in the agent library and **partner agents** in the **Security Store**; after setup they appear under **Active agents**. Running agents **uses SCUs**. Store subscriptions are billed separately.","miss":false},{"id":"c105","d":4,"topic":"Security Copilot","front":"Provisioning capacity: who can do it?","back":"You need **Azure Owner or Contributor** on the subscription or resource group (capacity is an Azure resource) and **Security Administrator** or higher in the tenant.","miss":false}],"questions":[{"id":"q001","d":1,"topic":"Entra access","q":"Admins must hold the Security Administrator role only when they need it, after approval, for at most four hours. What should you configure?","opts":["An eligible assignment in Privileged Identity Management with approval required","An active permanent assignment","A Conditional Access policy that blocks the role","A dynamic group with the role"],"ans":[0],"why":"Eligible PIM assignments are activated just in time, with approval and a time limit.","kind":"one","miss":false},{"id":"q002","d":1,"topic":"Entra access","q":"You are about to enforce MFA for all users with Conditional Access. What should you do first to avoid locking out the tenant?","opts":["Exclude the emergency access accounts and run the policy in report-only mode","Assign the policy to Global Administrators only","Delete legacy authentication protocols from the tenant","Disable security defaults and all other policies"],"ans":[0],"why":"Break-glass accounts are excluded, and report-only shows the impact before enforcement.","kind":"one","miss":false},{"id":"q003","d":1,"topic":"Entra access","q":"A daemon service with no signed-in user must read all users' mailboxes through Microsoft Graph. Which permission type is needed?","opts":["Delegated permissions with admin consent","No permissions; daemons are trusted","Application permissions with admin consent","Delegated permissions with user consent"],"ans":[2],"why":"With no user present the app acts as itself, which needs application permissions and admin consent.","kind":"one","miss":false},{"id":"q004","d":1,"topic":"Entra access","q":"Which TWO authentication methods are phishing-resistant?","opts":["Windows Hello for Business","SMS one-time code","Voice call","Passkey (FIDO2)"],"ans":[0,3],"why":"FIDO2 passkeys and Windows Hello for Business are bound to the device and origin. SMS and voice can be intercepted or phished.","kind":"two","miss":false},{"id":"q005","d":1,"topic":"Entra access","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["An application permission can be granted by any user through user consent.","A user-assigned managed identity can be attached to more than one Azure resource.","PIM can require MFA when a user activates a role."],"ans":[0,1,1],"why":"Application permissions always need admin consent. User-assigned identities are shareable. PIM activation settings include MFA.","miss":false},{"id":"q006","d":1,"topic":"Entra access","type":"match","kind":"match","q":"Match each need to the Entra feature.","rows":["Just-in-time admin roles","Require a compliant device for an app","Let users ask an admin to approve an app","VM reads Key Vault with no stored secret"],"choices":["Managed identity","Conditional Access","Privileged Identity Management","Admin consent workflow"],"ans":[2,1,3,0],"why":"One feature per job.","miss":false},{"id":"q007","d":1,"topic":"Entra access","q":"Where do you restrict which users may sign in to a SaaS app that is integrated with Entra ID?","opts":["On the app registration's redirect URIs","In the tenant's custom domain settings","On the enterprise application (service principal): require assignment and assign users","In the app's API permissions"],"ans":[2],"why":"User assignment and sign-in controls live on the enterprise application.","kind":"one","miss":false},{"id":"q008","d":1,"topic":"Entra access","q":"Users keep approving risky third-party apps. You want them to request approval instead of granting consent themselves. What should you configure?","opts":["Restrict user consent and enable the admin consent workflow","Disable all enterprise applications","Grant tenant-wide admin consent to all apps","Make all users Cloud Application Administrators"],"ans":[0],"why":"Limiting user consent stops the risky grants, and the workflow routes requests to reviewers.","kind":"one","miss":false},{"id":"q009","d":1,"topic":"Key Vault","q":"An app's managed identity must read secret values from one vault and nothing else. Which role should you assign?","opts":["Key Vault Secrets Officer","Key Vault Administrator","Key Vault Secrets User","Key Vault Reader"],"ans":[2],"why":"Secrets User reads secret contents. Reader sees metadata only. Officer can also create and
