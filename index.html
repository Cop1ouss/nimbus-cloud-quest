e endpoint**), **public IP ranges** (not private RFC 1918 addresses), **resource instances**, and **trusted Microsoft services** as an exception.","miss":false},{"id":"c030","d":2,"topic":"Storage access","front":"Storage account access keys?","back":"Two keys, **key1 and key2**, each gives **full access** to the account. Rotate one while apps use the other. Store them in **Key Vault**. You can **disallow Shared Key** authorization to force Entra ID.","miss":false},{"id":"c031","d":2,"topic":"Storage access","front":"The three SAS types?","back":"**User delegation SAS:** signed with **Microsoft Entra** credentials; Blob and Data Lake only; **recommended**. **Service SAS:** signed with the **account key**, one service. **Account SAS:** signed with the account key, **one or more services**, plus service-level operations.","miss":false},{"id":"c032","d":2,"topic":"Storage access","front":"What is in a SAS token?","back":"Signed fields such as **sp** (permissions), **st/se** (start and expiry), **sip** (allowed IPs), **spr** (HTTPS only), **sr** (resource) and the **sig** signature. Anyone holding the URL has that access until it expires.","miss":false},{"id":"c033","d":2,"topic":"Storage access","front":"Stored access policy?","back":"Defined on a **container, file share, queue or table**. A **service SAS** can reference it for start, expiry and permissions. **Max five per container.** Revoke every SAS that uses it by **deleting or changing the policy**, without rotating keys.","miss":false},{"id":"c034","d":2,"topic":"Storage access","front":"How do you revoke an ad hoc service SAS with no stored access policy?","back":"**Regenerate the account key** that signed it (or wait for expiry). That breaks every SAS and app using that key.","miss":false},{"id":"c035","d":2,"topic":"Storage access","front":"Azure Files identity-based access: the three identity sources?","back":"**On-premises AD DS** (hybrid users synced to Entra), **Microsoft Entra Domain Services**, **Microsoft Entra Kerberos** (no line of sight to a domain controller needed). **One source per storage account.** Kerberos must be enabled in SMB security settings.","miss":false},{"id":"c036","d":2,"topic":"Storage access","front":"Share-level vs file-level permissions in Azure Files?","back":"**Share level:** Azure RBAC roles such as **Storage File Data SMB Share Reader / Contributor / Elevated Contributor**, or a **default share-level permission** for all authenticated users. **Directory and file level:** Windows **NTFS ACLs**. Both must allow access.","miss":false},{"id":"c037","d":2,"topic":"Storage access","front":"Azure Files over SMB: which port must be open?","back":"**TCP 445** outbound. Many ISPs block it; use VPN, ExpressRoute or Azure File Sync if so.","miss":false},{"id":"c038","d":2,"topic":"Storage accounts","front":"Storage account types?","back":"**Standard general-purpose v2** (blobs, files, queues, tables; most uses). **Premium block blobs**, **Premium file shares**, **Premium page blobs** (SSD, low latency, one service each).","miss":false},{"id":"c039","d":2,"topic":"Storage accounts","front":"LRS, ZRS, GRS, GZRS?","back":"**LRS:** 3 copies in one datacenter. **ZRS:** 3 copies across **availability zones**. **GRS:** LRS plus an async copy (LRS) in the **paired region**. **GZRS:** ZRS plus a copy in the paired region. Add **RA-** for **read access** to the secondary.","miss":false},{"id":"c040","d":2,"topic":"Storage accounts","front":"Which redundancy survives what?","back":"LRS: a rack or drive. **ZRS:** a whole **zone** (datacenter). **GRS/GZRS:** a whole **region**. **RA-GRS/RA-GZRS:** read from the secondary **without** waiting for failover.","miss":false},{"id":"c041","d":2,"topic":"Storage accounts","front":"Premium storage redundancy options?","back":"Premium accounts support **LRS and ZRS** only. No geo-redundancy.","miss":false},{"id":"c042","d":2,"topic":"Storage accounts","front":"What can't you change after creating a storage account?","back":"The **name** (globally unique, 3-24 lowercase letters and numbers) and the **region**. The **performance tier** (Standard vs Premium) also cannot be changed. Redundancy can be changed, sometimes needing a conversion.","miss":false},{"id":"c043","d":2,"topic":"Storage accounts","front":"Object replication requirements?","back":"Copies **block blobs** asynchronously between accounts. Needs **versioning on both** accounts and **change feed on the source**. GPv2 or premium block blob. Not with **hierarchical namespace**. **Snapshots are not replicated.** Archive tier blobs break replication.","miss":false},{"id":"c044","d":2,"topic":"Storage accounts","front":"Storage encryption basics?","back":"**Always on**, AES-256, cannot be disabled. Keys: **Microsoft-managed** (default) or **customer-managed** in **Key Vault** or Managed HSM (the vault needs **soft delete and purge protection**). **Infrastructure encryption** (double) must be chosen **at creation**. **Encryption scopes** use different keys per container or blob.","miss":false},{"id":"c045","d":2,"topic":"Storage accounts","front":"AzCopy vs Storage Explorer?","back":"**AzCopy:** command line for fast copy and **sync** to and from blobs and files (`azcopy copy`, `azcopy sync`), auth with Entra or SAS. **Storage Explorer:** desktop GUI to browse and manage blobs, files, queues and tables.","miss":false},{"id":"c046","d":2,"topic":"Storage accounts","front":"Hierarchical namespace?","back":"Turns blob storage into **Azure Data Lake Storage Gen2**: real directories and POSIX ACLs for analytics. Some blob features (for example object replication) are not supported with it.","miss":false},{"id":"c047","d":2,"topic":"Files and Blob","front":"Azure file share basics?","back":"Fully managed **SMB** (port 445) or **NFS** (premium only) shares. Set a **quota** (size). Mount from Windows, Linux or macOS. **Azure File Sync** caches shares on Windows Servers.","miss":false},{"id":"c048","d":2,"topic":"Files and Blob","front":"Azure File Sync parts?","back":"**Storage Sync Service** → **sync group** → one **cloud endpoint** (the Azure file share) + **server endpoints** (folders on registered servers). **Cloud tiering** keeps hot files local and leaves cold files as pointers.","miss":false},{"id":"c049","d":2,"topic":"Files and Blob","front":"Share snapshots and soft delete for Azure Files?","back":"**Share snapshots:** read-only, point-in-time copies of the **whole share**; restore single files from them. **Soft delete:** keeps a **deleted share** for **1-365 days** so you can undelete it. Deleting a share deletes its snapshots too.","miss":false},{"id":"c050","d":2,"topic":"Files and Blob","front":"Blob container access levels?","back":"**Private** (no anonymous access), **Blob** (anonymous read of blobs only), **Container** (anonymous read and list). Anonymous access must also be **allowed at the account level**, which is off by default for new accounts.","miss":false},{"id":"c051","d":2,"topic":"Files and Blob","front":"Access tiers and minimum days?","back":"**Hot** (frequent access), **Cool** (30 days), **Cold** (90 days), **Archive** (180 days, **offline**). Deleting or moving earlier than the minimum charges an **early deletion** fee. Hot or Cool can be the account default; Archive is set **per blob**.","miss":false},{"id":"c052","d":2,"topic":"Files and Blob","front":"How do you read an archived blob?","back":"**Rehydrate** it: change its tier to Hot, Cool or Cold, or **copy** it to an online tier. **Standard priority** can take up to **15 hours**; **High priority** usually under **1 hour**.","miss":false},{"id":"c053","d":2,"topic":"Files and Blob","front":"Blob lifecycle management?","back":"Rules (JSON) per account that **move blobs to cooler tiers** or **delete** them after N days since **last modification**, **creation** or **last access** (needs access tracking). Filter by **prefix** or blob index tag. Also manages **versions** and **snapshots**. Runs about once a day.","miss":false},{"id":"c054","d":2,"topic":"Files and Blob","front":"Blob versioning vs blob soft delete vs snapshots?","back":"**Versioning:** every overwrite keeps the **previous version** automatically. **Soft delete:** deleted blobs are kept for a retention period (1-365 days). **Snapshots:** read-only copies you take **by hand**. **Point-in-time restore** needs versioning, change feed and soft delete.","miss":false},{"id":"c055","d":2,"topic":"Files and Blob","front":"Immutable blob storage?","back":"WORM: **time-based retention** (cannot modify or delete for N days) and **legal hold** (until cleared). Set at container or version level. For regulatory records.","miss":false},{"id":"c056","d":3,"topic":"ARM and Bicep","front":"Sections of an ARM template?","back":"**$schema**, **contentVersion**, **parameters** (values at deploy time), **variables** (computed values), **functions**, **resources** (required), **outputs** (values returned).","miss":false},{"id":"c057","d":3,"topic":"ARM and Bicep","front":"Bicep file building blocks?","back":"`param` (inputs), `var` (computed values), `resource` (symbolic name + type@apiVersion), `module` (another Bicep file), `output`. Bicep **compiles to an ARM JSON template**; no state file.","miss":false},{"id":"c058","d":3,"topic":"ARM and Bicep","front":"Convert between Bicep and ARM JSON?","back":"`az bicep build` turns **Bicep into JSON**. `az bicep decompile` turns **JSON into Bicep** (best effort, review the result).","miss":false},{"id":"c059","d":3,"topic":"ARM and Bicep","front":"How do you export a template from what already exists?","back":"Resource group or resource → **Export template** (current state), or **Deployments** history → a deployment's template (what was deployed). Exports may need cleanup and parameterizing.","miss":false},{"id":"c060","d":3,"topic":"ARM and Bicep","front":"Incremental vs Complete deployment mode?","back":"**Incremental (default):** adds and updates resources in the template, **leaves others alone**. **Complete:** also **deletes** resources in the resource group that are **not in the template**. Use **what-if** to preview.","miss":false},{"id":"c061","d":3,"topic":"ARM and Bicep","front":"Commands to deploy a template to a resource group?","back":"CLI: `az deployment group create -g RG1 --template-file main.bicep --parameters @params.json`. PowerShell: `New-AzResourceGroupDeployment`. Other scopes: `az deployment sub/mg/tenant create`.","miss":false},{"id":"c062","d":3,"topic":"ARM and Bicep","front":"What does dependsOn do?","back":"Makes Resource Manager deploy one resource **after** another (for example a NIC before the VM). Bicep usually adds it **automatically** when you reference another resource's symbolic name.","miss":false},{"id":"c063","d":3,"topic":"ARM and Bicep","front":"Common template functions?","back":"`resourceGroup().location`, `uniqueString()` (deterministic hash for unique names), `concat()` / string interpolation in Bicep, `resourceId()`, `parameters()` and `variables()` in JSON.","miss":false},{"id":"c064","d":3,"topic":"ARM and Bicep","front":"Parameter file and secure parameters?","back":"A **parameters file** (`.parameters.json` or `.bicepparam`) supplies values per environment. Mark passwords `securestring` / `@secure()` and pull them from **Key Vault** with a reference, not plain text.","miss":false},{"id":"c065","d":3,"topic":"Virtual machines","front":"VM size families to recognize?","back":"**B** burstable (cheap, low steady use), **D** general purpose, **E** memory optimized, **F** compute optimized, **L** storage optimized, **N** GPU, **M** very large memory.","miss":false},{"id":"c066","d":3,"topic":"Virtual machines","front":"Resizing a VM?","back":"Pick a new size; the VM **restarts**. If the size is **not available** on the current hardware cluster, you must **deallocate (stop)** the VM first to see and choose it.","miss":false},{"id":"c067","d":3,"topic":"Virtual machines","front":"VM disk roles?","back":"**OS disk** (boot, persistent), **temporary disk** (local, **data lost** on deallocate, redeploy or host move; D: on Windows), **data disks** (persistent, attach several).","miss":false},{"id":"c068","d":3,"topic":"Virtual machines","front":"Managed disk types, fast to slow?","back":"**Ultra Disk** and **Premium SSD v2** (data disks only, adjustable IOPS), **Premium SSD** (production), **Standard SSD** (light use), **Standard HDD** (backup, dev). You can **grow** a disk but **not shrink** it.","miss":false},{"id":"c069","d":3,"topic":"Virtual machines","front":"Availability set facts?","back":"Spreads VMs across **fault domains** (shared power and network, **max 3**) and **update domains** (rebooted together, **max 20**, default 5). Set at VM creation. **99.95%** SLA for 2+ VMs. Protects against rack failure, not datacenter failure.","miss":false},{"id":"c070","d":3,"topic":"Virtual machines","front":"Availability zones?","back":"Separate datacenters with independent power, cooling and network in one region. VMs in **2+ zones** get a **99.99%** SLA. You cannot use an availability set and a zone for the same VM.","miss":false},{"id":"c071","d":3,"topic":"Virtual machines","front":"VM Scale Sets: Flexible vs Uniform?","back":"**Flexible (recommended):** mix VM sizes, up to 1000 VMs, full VM control, spread across zones and fault domains. **Uniform:** identical VMs from one model. Orchestration mode is **fixed at creation**.","miss":false},{"id":"c072","d":3,"topic":"Virtual machines","front":"Scale set autoscale settings?","back":"**Minimum, maximum and default** instance counts. **Scale-out** and **scale-in** rules on metrics (for example CPU over 70% for 10 min), a **cooldown**, or schedules. **Scale-in policy** decides which VM is removed first.","miss":false},{"id":"c073","d":3,"topic":"Virtual machines","front":"Disk encryption options for VMs?","back":"**Server-side encryption** is always on. **Encryption at host** also encrypts temp disks and caches end to end; **use it for new VMs**. **Azure Disk Encryption** (BitLocker/DM-Crypt with Key Vault) is **retiring on 15 Sept 2028**; migrate to encryption at host.","miss":false},{"id":"c074","d":3,"topic":"Virtual machines","front":"Moving a VM?","back":"**Another resource group or subscription:** Move (with its disks, NIC, IP and other dependencies); the VM's **resource ID changes**, its region does not. **Another region:** **Azure Resource Mover** (uses Site Recovery replication) or Site Recovery directly.","miss":false},{"id":"c075","d":3,"topic":"Containers","front":"Azure Container Registry SKUs?","back":"**Basic** (learning, small), **Standard** (more storage and throughput), **Premium** (adds **geo-replication**, **private endpoints**, content trust, more throughput). All are private registries.","miss":false},{"id":"c076","d":3,"topic":"Containers","front":"How should apps pull images from ACR?","back":"With a **managed identity** or service principal that has the **AcrPull** role. The **admin user** is **disabled by default** and is for testing only.","miss":false},{"id":"c077","d":3,"topic":"Containers","front":"Build an image in Azure without Docker locally?","back":"`az acr build --registry myreg --image app:v1 .` uses **ACR Tasks** to build in the cloud and push to the registry.","miss":false},{"id":"c078","d":3,"topic":"Containers","front":"Azure Container Instances (ACI)?","back":"Run containers **without managing servers or orchestration**. Billed per second. Good for simple apps, tasks and burst jobs. A **container group** is containers that share host, network, storage and lifecycle (like a pod). Multi-container groups are **Linux only**.","miss":false},{"id":"c079","d":3,"topic":"Containers","front":"ACI sizing and scaling?","back":"Set **CPU and memory** per container at deploy time; to change them you **redeploy**. ACI has **no built-in autoscale**: run more container groups yourself. Restart policy: **Always, OnFailure, Never**.","miss":false},{"id":"c080","d":3,"topic":"Containers","front":"Azure Container Apps?","back":"Serverless containers for microservices and APIs on a managed Kubernetes base. **KEDA** autoscaling (HTTP, TCP, CPU, memory, queues and events), **scale to zero**, **revisions** with traffic splitting, ingress, Dapr. You don't manage the cluster.","miss":false},{"id":"c081","d":3,"topic":"Containers","front":"Container Apps scale settings?","back":"**Min and max replicas** per revision. **HTTP rule:** add a replica when concurrent requests per replica pass the threshold (default 10). Min replicas 0 = **scale to zero** (no usage charge while idle). **Vertical scaling is not supported.**","miss":false},{"id":"c082","d":3,"topic":"Containers","front":"Container Apps revisions?","back":"A revision is an **immutable snapshot** of the app. Changing **scale rules** or the container creates a new revision. In **multiple revision mode** you split traffic between revisions (blue-green, canary).","miss":false},{"id":"c083","d":3,"topic":"Containers","front":"ACI vs Container Apps vs AKS?","back":"**ACI:** one-off or simple containers, no autoscale. **Container Apps:** serverless microservices with autoscale and scale to zero. **AKS:** full Kubernetes control, you manage more.","miss":false},{"id":"c084","d":3,"topic":"App Service","front":"What does an App Service plan define?","back":"The **region**, **OS** (Windows or Linux), **pricing tier** (features) and **instance size and count**. **All apps in the plan share** those instances, and scale settings apply to **every app in the plan**.","miss":false},{"id":"c085","d":3,"topic":"App Service","front":"App Service tiers in one line each?","back":"**Free/Shared:** shared VMs, dev only. **Basic:** dedicated, manual scale, custom domains and TLS. **Standard:** autoscale, **deployment slots**, backups. **Premium v3:** more scale and power. **Isolated v2:** dedicated **network isolation** (App Service Environment).","miss":false},{"id":"c086","d":3,"topic":"App Service","front":"Maximum instances by tier?","back":"**Basic 3**, **Standard 10**, **Premium 30**, **Isolated 100**. Autoscale rules start at **Standard**.","miss":false},{"id":"c087","d":3,"topic":"App Service","front":"Custom domain mapping?","back":"Add a **CNAME** (subdomain) or **A record** (root) pointing to the app, plus a **TXT record `asuid`** to prove ownership. Needs a **paid tier** (not Free).","miss":false},{"id":"c088","d":3,"topic":"App Service","front":"TLS certificates for App Service?","back":"**App Service managed certificate** (free, auto-renew, **not wildcard**), import from **Key Vault**, or upload a **PFX**. Bind with **SNI SSL** or IP SSL. Turn on **HTTPS Only** and set **minimum TLS 1.2**. TLS binding needs **Basic or higher**.","miss":false},{"id":"c089","d":3,"topic":"App Service","front":"App Service backup?","back":"Backs up **app content, configuration and a linked database**. Custom backups need **Basic or higher**. **Basic:** production slot only. Standard and up: more slots and higher limits.","miss":false},{"id":"c090","d":3,"topic":"App Service","front":"App Service networking: inbound vs outbound?","back":"**Inbound:** **access restrictions** (allow/deny by IP, service tag, VNet) and **private endpoints** (private IP). **Outbound:** **VNet integration** lets the app reach resources in a VNet; **Hybrid Connections** reach on-premises endpoints.","miss":false},{"id":"c091","d":3,"topic":"App Service","front":"Deployment slots?","back":"Live apps with their own host names (staging, test) in **Standard or higher** (Standard has 5). **Swap** warms up the target instances first, so **no downtime**. **Swap back** to roll back. **Slot settings (sticky)** stay with the slot. Route a percentage of traffic to a slot to test in production.","miss":false},{"id":"c092","d":3,"topic":"App Service","front":"Scale up vs scale out for App Service?","back":"**Scale up:** bigger tier or instance size (more CPU, memory, features). **Scale out:** more instances, manual or **autoscale** rules (Standard+), or **automatic scaling** in Premium.","miss":false},{"id":"c093","d":4,"topic":"Virtual networks","front":"How many IPs does Azure reserve in each subnet?","back":"**Five:** the network address, the **first three** host addresses (gateway and Azure DNS) and the **broadcast** (last) address. A /24 gives **251** usable addresses. The smallest IPv4 subnet is **/29** (3 usable).","miss":false},{"id":"c094","d":4,"topic":"Virtual networks","front":"Address space rules for VNets?","back":"Use private ranges (10/8, 172.16/12, 192.168/16). **Peered or connected VNets must not overlap.** You can **add** address ranges to a VNet later. A subnet in use cannot be resized past its resources.","miss":false},{"id":"c095","d":4,"topic":"Virtual networks","front":"Virtual network peering facts?","back":"Connects two VNets over the **Microsoft backbone** with private IPs, low latency. **Regional or global** (cross-region). **Not transitive**: A↔B and B↔C does not give A↔C. Needs **Network Contributor** (or equivalent) on both sides. Address spaces must not overlap.","miss":false},{"id":"c096","d":4,"topic":"Virtual networks","front":"Gateway transit in hub-spoke?","back":"The **hub** peering sets **Allow gateway transit**; the **spoke** peering sets **Use remote gateways**. The spoke then uses the hub's VPN/ExpressRoute gateway. A spoke that **has its own gateway** cannot use remote gateways.","miss":false},{"id":"c097","d":4,"topic":"Virtual networks","front":"Public IP SKUs?","back":"**Standard:** always **static**, **secure by default** (closed until an NSG allows), zone-redundant or zonal, works with Standard Load Balancer. **Basic:** static or dynamic, open by default, **retired**. Dynamic IPs can change on deallocation.","miss":false},{"id":"c098","d":4,"topic":"Virtual networks","front":"User-defined routes (UDRs)?","back":"A **route table** with routes (prefix → next hop), **associated to subnets**. Next hop types: **Virtual appliance** (an NVA IP), **Virtual network gateway** (VPN), **Virtual network**, **Internet**, **None** (drop).","miss":false},{"id":"c099","d":4,"topic":"Virtual networks","front":"How does Azure pick a route?","back":"**Longest prefix match** first. If prefixes tie: **UDR** beats **BGP** beats **system** routes. A UDR can override system routes, including peering routes.","miss":false},{"id":"c100","d":4,"topic":"Virtual networks","front":"Spoke-to-spoke traffic in hub-spoke?","back":"Peering isn't transitive, so add **UDRs** in each spoke sending the other spoke's range to an **NVA or Azure Firewall** in the hub (with IP forwarding on), or use **Azure Virtual Network Manager** / Virtual WAN.","miss":false},{"id":"c101","d":4,"topic":"Virtual networks","front":"Tools to troubleshoot connectivity?","back":"**Effective routes** on a NIC, Network Watcher **Next hop** (which route wins), **IP flow verify** (which NSG rule allows or denies), **Connection troubleshoot** (end-to-end test), **Effective security rules**.","miss":false},{"id":"c102","d":4,"topic":"Network security","front":"How are NSG rules evaluated?","back":"By **priority, 100 to 4096**, **lowest number first**. The **first match wins** and processing stops. Rules match on source, destination, port, protocol (5-tuple). NSGs are **stateful**: return traffic is allowed.","miss":false},{"id":"c103","d":4,"topic":"Network security","front":"Default NSG rules?","back":"**Inbound:** 65000 AllowVNetInBound, 65001 AllowAzureLoadBalancerInBound, **65500 DenyAllInbound**. **Outbound:** 65000 AllowVnetOutBound, 65001 AllowInternetOutBound, 65500 DenyAllOutBound. You **cannot delete** them, only override with lower numbers.","miss":false},{"id":"c104","d":4,"topic":"Network security","front":"NSG on both the subnet and the NIC?","back":"**Inbound:** subnet NSG first, then NIC NSG. **Outbound:** NIC NSG first, then subnet NSG. Traffic must be **allowed by both**. Check the result with **Effective security rules** or **IP flow verify**.","miss":false},{"id":"c105","d":4,"topic":"Network security","front":"Application security groups (ASGs)?","back":"Group **NICs by role** (WebServers, DbServers) and use the ASG as source or destination in NSG rules instead of IP addresses. All NICs in an ASG must be in the **same VNet**.","miss":false},{"id":"c106","d":4,"topic":"Network security","front":"Service tags?","back":"Named groups of Microsoft IP prefixes kept up to date by Azure, for NSG rules: **Internet, VirtualNetwork, AzureLoadBalancer, Storage, Sql, AzureCloud**, and regional versions like **Storage.WestEurope**.","miss":false},{"id":"c107","d":4,"topic":"Network security","front":"Azure Bastion SKUs?","back":"**Developer:** free, shared, one connection, no subnet. **Basic:** dedicated, 2 instances. **Standard:** native client, shareable links, IP-based connect, custom ports, file transfer, scaling 2-50. **Premium:** session recording, private-only. You can **upgrade, not downgrade**.","miss":false},{"id":"c108","d":4,"topic":"Network security","front":"Bastion deployment requirements?","back":"A subnet named exactly **AzureBastionSubnet**, **/26 or larger**, and a **Standard static public IP** (except Premium private-only). Users connect over **TLS 443** from the portal; target VMs need **no public IP**. Peered VNets are reachable (not with Developer).","miss":false},{"id":"c109","d":4,"topic":"Network security","front":"Service endpoint?","back":"Enabled **per subnet per service** (Microsoft.Storage, Microsoft.Sql…). Traffic to that service goes over the **Azure backbone** with the subnet's identity, so the PaaS firewall can allow the subnet. The service **keeps its public IP**. Free. Not reachable from on-premises.","miss":false},{"id":"c110","d":4,"topic":"Network security","front":"Private endpoint?","back":"A **NIC with a private IP** from your VNet mapped to **one specific resource** (a storage account's blob service, a SQL server). Reachable from **peered VNets and on-premises** (VPN/ExpressRoute). Needs **private DNS** (for example `privatelink.blob.core.windows.net`). Billed per hour and per GB.","miss":false},{"id":"c111","d":4,"topic":"DNS and load balancing","front":"Azure DNS public zones?","back":"Host your domain's records in Azure. **Delegate** by setting the four Azure **NS records** at your registrar. Azure DNS does **not** sell domains. Records: A, AAAA, **CNAME (not at the zone apex)**, MX, NS, SOA, SRV, TXT, CAA, PTR.","miss":false},{"id":"c112","d":4,"topic":"DNS and load balancing","front":"Alias record sets?","back":"Point an A, AAAA or CNAME record at an **Azure resource** (public IP, Traffic Manager, Front Door) so it **updates automatically** if the IP changes. Alias records **can be at the zone apex**, unlike CNAME.","miss":false},{"id":"c113","d":4,"topic":"DNS and load balancing","front":"Azure Private DNS zones?","back":"Resolve names **only from VNets linked** to the zone. **Autoregistration** creates A records for **VMs** (primary NIC) in the linked VNet. A VNet can have **one registration zone**; a zone can have many registration VNets.","miss":false},{"id":"c114","d":4,"topic":"DNS and load balancing","front":"Custom DNS server and private zones?","back":"If a VNet uses a **custom DNS server**, it **bypasses** Azure DNS and private zones. Forward to **168.63.129.16** (Azure-provided DNS) or use **Azure DNS Private Resolver**.","miss":false},{"id":"c115","d":4,"topic":"DNS and load balancing","front":"Azure Load Balancer basics?","back":"**Layer 4** (TCP/UDP). **Public** (internet-facing frontend) or **internal** (private frontend). Parts: **frontend IP**, **backend pool**, **health probe**, **load-balancing rule**, **inbound NAT rule**, **outbound rule**. Basic SKU **retired 30 Sept 2025**.","miss":false},{"id":"c116","d":4,"topic":"DNS and load balancing","front":"Standard Load Balancer facts?","back":"**Secure by default:** traffic needs an **NSG allow**. **Zone-redundant**, **99.99%** SLA, backend pool in **one VNet**, probes **TCP, HTTP, HTTPS**. Needs a **Standard public IP**. **HA ports** rule on internal LB balances all ports.","miss":false},{"id":"c117","d":4,"topic":"DNS and load balancing","front":"Session persistence modes?","back":"**None** (5-tuple hash, default), **Client IP** (2-tuple: source and destination IP), **Client IP and protocol** (3-tuple). Use Client IP when a user must keep hitting the same VM.","miss":false},{"id":"c118","d":4,"topic":"DNS and load balancing","front":"Load Balancer vs Application Gateway vs Front Door?","back":"**Load Balancer:** regional Layer 4. **Application Gateway:** regional Layer 7 (URL path routing, TLS termination, **WAF**, cookie affinity, needs its own subnet). **Front Door:** **global** Layer 7 with CDN and WAF.","miss":false},{"id":"c119","d":4,"topic":"DNS and load balancing","front":"Troubleshooting a load balancer?","back":"Check the **health probe** (backend must answer on the probe port/path; probes come from **168.63.129.16** and the **AzureLoadBalancer** tag must be allowed), the **NSG** allows client traffic (Standard), the backends are in the **pool**, and the app listens on the backend port. Use **Insights** metrics: Health Probe Status, Data Path Availability.","miss":false},{"id":"c120","d":5,"topic":"Monitoring","front":"Metrics vs logs in Azure Monitor?","back":"**Metrics:** numeric time series, near real time, lightweight, kept **93 days**; view in **Metrics explorer**. **Logs:** records of many types in a **Log Analytics workspace**, queried with **KQL**.","miss":false},{"id":"c121","d":5,"topic":"Monitoring","front":"Activity log?","back":"Subscription-level record of **control-plane** events (who created, changed or deleted what, service health). Kept **90 days**. Send it to a workspace with a diagnostic setting to keep longer or query with KQL.","miss":false},{"id":"c122","d":5,"topic":"Monitoring","front":"Diagnostic settings?","back":"Route a resource's **resource logs** and **platform metrics** to a **Log Analytics workspace**, a **storage account** (archive), **Event Hubs** (stream) or a partner. **Resource logs are not collected until you create one.**","miss":false},{"id":"c123","d":5,"topic":"Monitoring","front":"Collecting VM data?","back":"Install the **Azure Monitor Agent (AMA)** and create a **data collection rule (DCR)** that says what to collect (performance counters, Windows events, Syslog) and where to send it. The old Log Analytics agent is **retired**. **VM insights** uses AMA.","miss":false},{"id":"c124","d":5,"topic":"Monitoring","front":"KQL basics to recognize?","back":"`Heartbeat | where TimeGenerated > ago(1h) | summarize count() by Computer`. Operators: **where** (filter), **summarize** (aggregate), **project** (choose columns), **take** (sample), **sort**, **render timechart**. Tables: Heartbeat, Perf, Event, Syslog, AzureActivity.","miss":false},{"id":"c125","d":5,"topic":"Monitoring","front":"Alert rule types?","back":"**Metric** (threshold on a metric), **Log search** (KQL query on a schedule), **Activity log** (an event such as VM deleted, plus **Service Health** and **Resource Health** alerts), Smart detection, Prometheus.","miss":false},{"id":"c126","d":5,"topic":"Monitoring","front":"Action group vs alert processing rule?","back":"**Action group:** *who and how* to notify or act (email, SMS, push, voice, webhook, Logic App, Function, Automation runbook, ITSM). **Alert processing rule:** changes **fired** alerts: **add action groups** or **suppress** notifications, at a scope, on a **schedule** (maintenance windows). Suppression wins over adding.","miss":false},{"id":"c127","d":5,"topic":"Monitoring","front":"Azure Monitor Insights?","back":"Curated views per service: **VM insights** (performance, map of dependencies), **Storage insights** (capacity, availability, latency), **Network insights** (topology, health). Built on metrics and logs.","miss":false},{"id":"c128","d":5,"topic":"Monitoring","front":"Network Watcher tools?","back":"**IP flow verify** (allowed or denied, and by which rule), **NSG diagnostics**, **Next hop**, **Effective security rules**, **Connection troubleshoot**, **Packet capture**, **VPN troubleshoot**. **Connection Monitor** tests connectivity **continuously** and alerts. **VNet flow logs** replace NSG flow logs (no new NSG flow logs since 30 June 2025).","miss":false},{"id":"c129","d":5,"topic":"Backup and recovery","front":"Recovery Services vault vs Backup vault?","back":"**Recovery Services vault:** **Azure VMs**, SQL and SAP HANA in VMs, **Azure Files**, MARS agent, MABS/DPM, and **Site Recovery**. **Backup vault:** **Azure Disks**, **Azure Blobs**, **Azure Database for PostgreSQL**, AKS.","miss":false},{"id":"c130","d":5,"topic":"Backup and recovery","front":"Vault region rules?","back":"Backup is **within a region**: the vault must be in the **same region** as the VMs it protects. You need a vault per region. Vaults can move between resource groups and subscriptions, **not regions**.","miss":false},{"id":"c131","d":5,"topic":"Backup and recovery","front":"Backup policy for VMs?","back":"**Schedule** (Standard: once a day; **Enhanced**: multiple times a day, hourly) and **retention** (daily, weekly, monthly, yearly). **Instant restore** snapshots are kept locally for fast restores. One policy can protect many VMs.","miss":false},{"id":"c132","d":5,"topic":"Backup and recovery","front":"Vault storage redundancy?","back":"**LRS, ZRS or GRS**. You can change it **only before** any items are backed up. **Cross Region Restore** (restore in the paired region any time) needs **GRS**.","miss":false},{"id":"c133","d":5,"topic":"Backup and recovery","front":"VM restore options?","back":"**Create a new VM**, **restore disks** (then build a VM yourself), **replace existing** disks, or **file recovery** (a script mounts the recovery point so you copy files).","miss":false},{"id":"c134","d":5,"topic":"Backup and recovery","front":"Soft delete for Azure Backup?","back":"Deleted backup data is kept **14 days by default** (configurable **14-180**) at no cost for the first 14. **Enhanced soft delete** can be made **always-on**. You **cannot delete a vault** while it holds items, including soft-deleted ones.","miss":false},{"id":"c135","d":5,"topic":"Backup and recovery","front":"Azure Site Recovery for Azure VMs?","back":"**Replicates** VMs continuously to a **secondary region** (the Recovery Services vault is in the **target** region). Recovery points: **crash-consistent** (about every 5 minutes) and **app-consistent**. **Recovery plans** group VMs, set start order and add scripts.","miss":false},{"id":"c136","d":5,"topic":"Backup and recovery","front":"Site Recovery failover steps?","back":"**Test failover** into an isolated VNet (no impact; then **clean up**). **Failover** to a recovery point → **Commit** → **Re-protect** (replicate back to primary) → **Failback** → re-protect again.","miss":false},{"id":"c137","d":5,"topic":"Backup and recovery","front":"Backup reports and alerts?","back":"**Backup reports** need **diagnostic settings** sending vault data to a **Log Analytics workspace**. **Built-in Azure Monitor alerts** fire for failures; route them with an **alert processing rule** and an **action group**. Metric alerts can alert on successful jobs.","miss":false}],"questions":[{"id":"q001","d":1,"topic":"Entra users and groups","q":"You need users from the Marketing department to be added to a group automatically when their department attribute is set. What should you create?","opts":["A security group with assigned membership","A Microsoft 365 group with assigned membership","An administrative unit","A security group with dynamic user membership"],"ans":[3],"why":"Dynamic user membership evaluates a rule on user attributes. It needs Microsoft Entra ID P1.","kind":"one","miss":false},{"id":"q002","d":1,"topic":"Entra users and groups","q":"You try to assign a Microsoft 365 license to a new user and the option is unavailable. What should you set first?","opts":["The user's manager","The user's usage location","The user's job title","The user's department"],"ans":[1],"why":"Usage location is required for license assignment because not every service is offered in every country.","kind":"one","miss":false},{"id":"q003","d":1,"topic":"Entra users and groups","q":"A partner company's staff need access to one of your apps. They must use their own company credentials. What should you do?","opts":["Create a Microsoft 365 group for them","Sync their accounts with Microsoft Entra Connect","Invite them as B2B guest users","Create cloud-only member accounts for them"],"ans":[2],"why":"B2B collaboration lets external users sign in with their own identity and appear as guests in your tenant.","kind":"one","miss":false},{"id":"q004","d":1,"topic":"Entra users and groups","q":"Which TWO can be members of a security group in Microsoft Entra ID?","opts":["Other groups","Storage accounts","Subscriptions","Devices"],"ans":[0,3],"why":"Security groups can contain users, devices, service principals and other groups. Azure resources are not members.","kind":"two","miss":false},{"id":"q005","d":1,"topic":"Entra users and groups","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["You can manually add a user to a group that has dynamic user membership.","Group-based licensing removes the license when a user leaves the group.","A deleted user can be restored within 30 days."],"ans":[0,1,1],"why":"Dynamic groups are rule-only. Group licensing follows membership. Deleted users stay restorable for 30 days.","miss":false},{"id":"q006","d":1,"topic":"Entra users and groups","q":"You enable SSPR for a group named SSPR-Users. A Global Administrator who is not in the group forgets their password. What happens?","opts":["Only another Global Administrator can reset it, by design","They cannot use SSPR until added to SSPR-Users","They can reset it with one method","They can reset it with two methods, because admins are always enabled for SSPR"],"ans":[3],"why":"Administrator roles always have SSPR on with a two-gate policy, whatever the SSPR scope.","kind":"one","miss":false},{"id":"q007","d":1,"topic":"Entra users and groups","type":"match","kind":"match","q":"Match each requirement to the group type or setting.","rows":["Shared mailbox and Teams for a project","Grant an Azure role to a set of users","Members added by department attribute","All Windows devices added automatically"],"choices":["Security group","Microsoft 365 group","Dynamic device membership","Dynamic user membership"],"ans":[1,0,3,2],"why":"Microsoft 365 groups are for collaboration. Security groups grant access. Dynamic rules can target users or devices, not both in one group.","miss":false},{"id":"q008","d":1,"topic":"Entra users and groups","q":"You need to create 500 user accounts from a spreadsheet with the least effort in the portal. What should you use?","opts":["Bulk create with the CSV template","An access review","Microsoft Entra Connect Sync","Invite users one by one"],"ans":[0],"why":"Bulk create in the Entra admin center takes a CSV built from the template.","kind":"one","miss":false},{"id":"q009","d":1,"topic":"Entra users and groups","q":"Which license do you need to let cloud users reset forgotten passwords themselves?","opts":["No license; it is included in every tenant","Microsoft Entra ID P1","Microsoft Entra ID Free","Microsoft Defender for Identity"],"ans":[1],"why":"SSPR reset needs P1 or higher. Changing a known password is free.","kind":"one","miss":false},{"id":"q010","d":1,"topic":"Azure RBAC","q":"A user must create and manage all resources in a resource group but must not grant access to others. Which role should you assign at the resource group?","opts":["Reader","Contributor","Owner","User Access Administrator"],"ans":[1],"why":"Contributor manages resources but cannot assign roles. Owner can assign roles.","kind":"one","miss":false},{"id":"q011","d":1,"topic":"Azure RBAC","q":"You assign Reader to User1 at the subscription and Contributor to User1 on RG1. What can User1 do on a VM in RG1?","opts":["Nothing, because the assignments conflict","Manage the VM","Only view the VM","Assign roles on the VM"],"ans":[1],"why":"RBAC is additive. Contributor on RG1 is inherited by the VM.","kind":"one","miss":false},{"id":"q012","d":1,"topic":"Azure RBAC","q":"You must allow a help desk group to assign roles on RG1 without being able to change any resources. Which role is least privileged?","opts":["Owner","Virtual Machine Contributor","Role Based Access Control Administrator","Contributor"],"ans":[2],"why":"RBAC Administrator can manage role assignments only. Owner can also change resources.","kind":"one","miss":false},{"id":"q013","d":1,"topic":"Azure RBAC","q":"Which TWO are valid scopes for an Azure role assignment?","opts":["Resource group","Microsoft Entra administrative unit","Availability zone","Management group"],"ans":[0,3],"why":"Azure RBAC scopes are management group, subscription, resource group and resource.","kind":"two","miss":false},{"id":"q014","d":1,"topic":"Azure RBAC","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A role assigned at a subscription is inherited by every resource group in it.","Contributor can assign roles to other users.","The Owner role always lets a user read blob data when using Microsoft Entra authorization."],"ans":[1,0,0],"why":"Inheritance flows down. Contributor cannot assign roles. Blob data access through Entra needs a data role such as Storage Blob Data Reader.","miss":false},{"id":"q015","d":1,"topic":"Azure RBAC","type":"match","kind":"match","q":"Match each need to the least-privileged built-in role.","rows":["View everything, change nothing","Manage resources, no role assignments","Manage role assignments only","Read blobs with Entra ID"],"choices":["Reader","User Access Administrator","Storage Blob Data Reader","Contributor"],"ans":[0,3,1,2],"why":"Pick the smallest role that does the job.","miss":false},{"id":"q016","d":1,"topic":"Azure RBAC","q":"An app running on a VM must read secrets from Azure Key Vault without storing credentials. Which security principal should receive the role?","opts":["The VM's network interface","The admin's user account","The VM's managed identity","A Microsoft 365 group"],"ans":[2],"why":"A managed identity is a security principal Azure manages for the resource, so no secrets are stored.","kind":"one","miss":false},{"id":"q017","d":1,"topic":"Azure RBAC","q":"A user is Global Administrator in Microsoft Entra ID but cannot see any subscriptions. What can they do to manage access to all subscriptions?","opts":["Add themselves to a Microsoft 365 group","Create a new tenant","Elevate access to become User Access Administrator at root scope","Assign themselves the Reader role in Entra ID"],"ans":[2],"why":"Entra roles do not grant Azure resource access. Global Administrators can elevate access to the root scope.","kind":"one","miss":false},{"id":"q018","d":1,"topic":"Governance","q":"You must prevent anyone, including subscription Owners, from deleting a production resource group, while still allowing changes to its resources. What should you apply?","opts":["A CanNotDelete lock on the resource group","A ReadOnly lock on the resource group","Remove the Owner role from all users","An Azure Policy with the Audit effect"],"ans":[0],"why":"CanNotDelete blocks deletion but allows modification, and it applies to Owners too.","kind":"one","miss":false},{"id":"q019","d":1,"topic":"Governance","q":"You need to make sure resources can only be created in East US and West US. What should you use?","opts":["A management group tag","An RBAC custom role","Azure Policy with the Allowed locations definition","A resource lock"],"ans":[2],"why":"Policy controls resource properties such as location, whatever role the creator has.","kind":"one","miss":false},{"id":"q020","d":1,"topic":"Governance","q":"A Department tag is set on RG1. A new storage account is created in RG1. What tags does the storage account have?","opts":["Department, but only after 24 hours","None, unless a policy or the creator adds them","All tags of the subscription","Department, inherited from RG1"],"ans":[1],"why":"Tags are not inherited. Use a Modify policy to inherit them.","kind":"one","miss":false},{"id":"q021","d":1,"topic":"Governance","q":"Which TWO policy effects can change or create resources through a remediation task?","opts":["Deny","DeployIfNotExists","Audit","Modify"],"ans":[1,3],"why":"Modify and DeployIfNotExists use a managed identity and remediation tasks. Audit only reports, Deny only blocks.","kind":"two","miss":false},{"id":"q022","d":1,"topic":"Governance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A ReadOnly lock on a resource group stops you from creating a new VM in it.","A budget automatically shuts down resources when the limit is reached.","Resources in a resource group can be in different regions from the group."],"ans":[1,0,1],"why":"ReadOnly blocks writes. Budgets alert and can trigger actions but do not stop resources by themselves. Resource group location only holds metadata.","miss":false},{"id":"q023","d":1,"topic":"Governance","type":"match","kind":"match","q":"Match each requirement to the governance tool.","rows":["Block VMs larger than a set size","Stop accidental deletion of a database","Alert when forecasted spend passes 80%","Recommend resizing underused VMs"],"choices":["Budget","Resource lock","Azure Advisor","Azure Policy"],"ans":[3,1,0,2],"why":"Policy shapes resources. Locks protect them. Budgets watch spend. Advisor recommends.","miss":false},{"id":"q024","d":1,"topic":"Governance","q":"You need to apply the same policies and role assignments to 30 subscriptions. What should you configure?","opts":["A tag on each subscription","A single resource lock","A management group that contains the subscriptions","A resource group in each subscription"],"ans":[2],"why":"Assignments at a management group are inherited by all subscriptions under it.","kind":"one","miss":false},{"id":"q025","d":1,"topic":"Governance","q":"A storage account has a ReadOnly lock. An admin with Owner tries to list the access keys in the portal and fails. Why?","opts":["Owners cannot read storage keys","The keys were rotated","The lock is only on the resource group","Listing keys is a POST (write) operation that ReadOnly blocks"],"ans":[3],"why":"List Keys is a POST action, so ReadOnly blocks it even for Owners.","kind":"one","miss":false},{"id":"q026","d":2,"topic":"Storage access","q":"A contractor needs read access to one container for 48 hours. You must be able to revoke the access early without affecting other apps that use the account keys. What should you use?","opts":["An account SAS","Share the storage account key","Regenerate key1 after 48 hours","A service SAS that references a stored access policy"],"ans":[3],"why":"Deleting or changing the stored access policy revokes the SAS without rotating keys.","kind":"one","miss":false},{"id":"q027","d":2,"topic":"Storage access","q":"Which SAS type is signed with Microsoft Entra credentials and recommended by Microsoft?","opts":["Ad hoc SAS","Service SAS","User delegation SAS","Account SAS"],"ans":[2],"why":"A user delegation SAS uses a key obtained with Entra credentials instead of the account key.","kind":"one","miss":false},{"id":"q028","d":2,"topic":"Storage access","q":"VMs in Subnet1 must reach a storage account while all other networks are blocked. What should you configure on Subnet1 and the storage account?","opts":["A Microsoft.Storage service endpoint and a virtual network rule","A NAT gateway and an IP rule for 10.0.1.0/24","An NSG rule allowing port 443","A user-defined route to the internet"],"ans":[0],"why":"Storage virtual network rules need the subnet's service endpoint. Private IP ranges cannot be used in IP rules.","kind":"one","miss":false},{"id":"q029","d":2,"topic":"Storage access","q":"Which TWO identity sources can provide identity-based SMB access to Azure Files?","opts":["Microsoft Entra Kerberos","On-premises Active Directory Domain Services","Azure Key Vault","Microsoft Entra B2C local accounts"],"ans":[0,1],"why":"Azure Files supports AD DS, Entra Domain Services and Entra Kerberos.","kind":"two","miss":false},{"id":"q030","d":2,"topic":"Storage access","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A stored access policy can be used with a user delegation SAS.","A container can have up to five stored access policies.","Each storage account access key grants full access to the account."],"ans":[0,1,1],"why":"Stored access policies work with service SAS only. Five per container. Account keys are all-powerful.","miss":false},{"id":"q031","d":2,"topic":"Storage access","type":"match","kind":"match","q":"Match each requirement to the access method.","rows":["Revoke many SAS tokens without changing keys","SAS signed with Entra credentials","One SAS for blobs and queues together","Grant an SMB share to an AD group"],"choices":["Account SAS","Stored access policy","User delegation SAS","Storage File Data SMB Share Contributor"],"ans":[1,2,0,3],"why":"Pick by what signs the token and what it covers.","miss":false},{"id":"q032","d":2,"topic":"Storage access","q":"Users mount an Azure file share with AD credentials. They can connect but get Access denied on one folder. Share-level roles are correct. What should you check?","opts":["The blob container access level","The storage account firewall","The SAS expiry time","The NTFS permissions on the folder"],"ans":[3],"why":"After the share-level check, Windows ACLs decide directory and file access.","kind":"one","miss":false},{"id":"q033","d":2,"topic":"Storage access","q":"An ad hoc service SAS signed u can turn off encryption at rest for a standard storage account.","Infrastructure (double) encryption can be enabled after the account is created.","Premium file shares support zone-redundant storage."],"ans":[0,0,1],"why":"Encryption is always on. Infrastructure encryption is set at creation. Premium supports LRS and ZRS.","miss":false},{"id":"q039","d":2,"topic":"Storage accounts","type":"match","kind":"match","q":"Match each copy of data to the redundancy option.","rows":["3 copies in one datacenter","3 copies across availability zones","Copies in the paired region, readable any time","Zone copies plus a paired region copy"],"choices":["ZRS","GZRS","RA-GRS","LRS"],"ans":[3,0,2,1],"why":"Count where the copies live.","miss":false},{"id":"q040","d":2,"topic":"Storage accounts","q":"You need to copy 2 TB from an on-premises file server to a blob container from a script, and re-run it later copying only changes. What should you use?","opts":["Azure Storage Explorer","Object replication","The Azure portal upload button","AzCopy with the sync command"],"ans":[3],"why":"AzCopy is scriptable and azcopy sync copies only differences.","kind":"one","miss":false},{"id":"q041","d":2,"topic":"Storage accounts","q":"Which storage account type should you choose for Azure file shares that need consistent low latency on SSDs?","opts":["Standard general-purpose v2","Premium file shares (FileStorage)","Premium page blobs","Premium block blobs"],"ans":[1],"why":"Premium file shares are the SSD account kind for Azure Files.","kind":"one","miss":false},{"id":"q042","d":2,"topic":"Files and Blob","q":"Blobs are rarely read after 30 days and never after 180 days, but must be kept for 7 years. You need to minimize cost automatically. What should you configure?","opts":["A lifecycle management rule that moves blobs to Cool, then Archive","A stored access policy","Object replication","Blob versioning"],"ans":[0],"why":"Lifecycle rules tier and delete blobs by age automatically.","kind":"one","miss":false},{"id":"q043","d":2,"topic":"Files and Blob","q":"A user needs to read an archived blob within one hour. What should you do?","opts":["Create a snapshot of the blob","Enable soft delete","Change the blob tier to Hot with high rehydration priority","Read the blob directly from the Archive tier"],"ans":[2],"why":"Archive is offline. High priority rehydration usually completes in under an hour.","kind":"one","miss":false},{"id":"q044","d":2,"topic":"Files and Blob","q":"Users accidentally overwrite important blobs. You need to restore the previous content automatically kept on each write. What should you enable?","opts":["Anonymous read access","A lifecycle management rule","Blob versioning","Container soft delete"],"ans":[2],"why":"Versioning keeps the previous version on every write. Soft delete protects against deletes.","kind":"one","miss":false},{"id":"q045","d":2,"topic":"Files and Blob","q":"Which TWO features let you recover a deleted Azure file share or a file in it?","opts":["Object replication","Soft delete for file shares","Blob versioning","Share snapshots"],"ans":[1,3],"why":"Share soft delete restores the share. Snapshots restore earlier versions of files.","kind":"two","miss":false},{"id":"q046","d":2,"topic":"Files and Blob","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Archive tier can be set as the default access tier of a storage account.","Moving a blob out of Cool after 10 days can incur an early deletion charge.","Point-in-time restore for block blobs requires versioning, change feed and soft delete."],"ans":[0,1,1],"why":"Archive is per blob only. Cool has a 30-day minimum. PITR needs all three.","miss":false},{"id":"q047","d":2,"topic":"Files and Blob","type":"match","kind":"match","q":"Match each requirement to the feature.","rows":["Keep files local on a branch office server","Restore a folder from yesterday's share copy","Lock records so no one can delete them for 58","d":3,"topic":"ARM and Bicep","q":"A Bicep file deploys a VM that references a NIC by its symbolic name. Do you need to add dependsOn?","opts":["Yes, Bicep never infers dependencies","No, because NICs are deployed last","Yes, but only in Complete mode","No, Bicep adds the dependency from the reference"],"ans":[3],"why":"Referencing another resource's symbolic name creates an implicit dependency.","kind":"one","miss":false},{"id":"q059","d":3,"topic":"Virtual machines","q":"You try to resize VM1 but the size you need does not appear in the list. What should you do first?","opts":["Detach the data disks","Delete the OS disk","Stop (deallocate) VM1","Move VM1 to another resource group"],"ans":[2],"why":"Sizes not available on the current cluster appear after the VM is deallocated.","kind":"one","miss":false},{"id":"q060","d":3,"topic":"Virtual machines","q":"An app stores data on the D: drive of a Windows VM. After maintenance the data is gone. Why?","opts":["The VM was in an availability set","D: is the temporary disk, which is not persistent","The OS disk was reimaged","The data disk was Standard HDD"],"ans":[1],"why":"Temporary disks are lost on deallocation, redeploy or host move.","kind":"one","miss":false},{"id":"q061","d":3,"topic":"Virtual machines","q":"You need the highest SLA for two VMs running the same app in one region. How should you deploy them?","opts":["In two different availability zones","On one dedicated host","In the same availability set","In the same fault domain"],"ans":[0],"why":"Zones give 99.99%. Availability sets give 99.95%.","kind":"one","miss":false},{"id":"q062","d":3,"topic":"Virtual machines","q":"You are deploying new VMs that must have encrypted temp disks and caches. Azure Disk Encryption is retiring. What should you enable?","opts":["Infrastructure encryption on a storage account","A stored access policy","Storage Service Encryption only","Encryption at host"],"ans":[3],"why":"Encryption at host covers temp disks and caches and replaces ADE.","kind":"one","miss":false},{"id":"q063","d":3,"topic":"Virtual machines","q":"You need to move a VM from West Europe to North Europe. Which service should you use?","opts":["Azure Migrate app containerization","Azure Advisor","Azure Resource Mover","Move to another resource group"],"ans":[2],"why":"Moving between resource groups or subscriptions keeps the region. Resource Mover moves across regions.","kind":"one","miss":false},{"id":"q064","d":3,"topic":"Virtual machines","q":"Which TWO statements about availability sets are true?","opts":["They protect against a full datacenter failure","They give a 99.99% SLA","A VM must be added to the set when it is created","They spread VMs across up to 3 fault domains"],"ans":[2,3],"why":"Availability sets protect within a datacenter (99.95%). Zones protect against datacenter loss (99.99%).","kind":"two","miss":false},{"id":"q065","d":3,"topic":"Virtual machines","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["You can reduce the size of a managed disk from 256 GiB to 128 GiB.","Ultra Disks can be used as OS disks.","Moving a VM to another resource group changes its resource ID."],"ans":[0,0,1],"why":"Disks can only grow. Ultra Disks are data disks only. The resource ID includes the resource group.","miss":false},{"id":"q066","d":3,"topic":"Virtual machines","type":"match","kind":"match","q":"Match each workload to the VM family.","rows":["Web server that idles most of the day","In-memory database cache","Batch math with high CPU","Machine learning training on GPUs"],"choices":["E-series","N-series","B-series","F-series"],"ans":[2,0,3,1],"why":"B burst, E memory, F compute, N GPU.","miss":false},{"id":"q067","d":3,"topic":"Virtual machines","q":"A scale set must add VMs when average CPU is above 75% and remove them below 25%, never going under 2 VMs. What should you configure?","opts":["Manual scale with 2 instances","Autoscale with scale-out and scale-in rules and a minimum of 2","A larger VM size","An availability set with 2 fault domains"],"ans":[1],"why":"Metric rules with min/max counts automate scaling.","kind":"one","miss":false},{"id":"q068","d":3,"topic":"Containers","q":"You need an Azure Container Registry with replicas in three regions and access only over private endpoints. Which SKU is required?","opts":["Premium","Any SKU with the admin user enabled","Standard","Basic"],"ans":[0],"why":"Geo-replication and private endpoints are Premium features.","kind":"one","miss":false},{"id":"q069","d":3,"topic":"Containers","q":"A containerized API must scale to zero when idle and scale out based on HTTP traffic. What should you use?","opts":["An Azure VM with Docker","Azure Container Registry","Azure Container Instances","Azure Container Apps"],"ans":[3],"why":"Container Apps uses KEDA to scale on HTTP requests and supports scale to zero.","kind":"one","miss":false},{"id":"q070","d":3,"topic":"Containers","q":"A container in ACI needs more memory. What must you do?","opts":["Add a scale rule","Resize the underlying VM","Enable autoscale on the container group","Redeploy the container group with the new memory setting"],"ans":[3],"why":"ACI resources are set at deployment. Change them by redeploying.","kind":"one","miss":false},{"id":"q071","d":3,"topic":"Containers","q":"An AKS cluster must pull images from ACR without storing passwords. What should you grant?","opts":["The AcrPull role to the cluster's managed identity","The Owner role on the subscription","Enable the ACR admin user","Make the registry public"],"ans":[0],"why":"Use identity plus AcrPull, not admin credentials.","kind":"one","miss":false},{"id":"q072","d":3,"topic":"Containers","q":"Which TWO are true about an ACI container group?","opts":["It scales automatically on CPU","Containers in it share a lifecycle and network","Multi-container groups are supported on Linux","It must run on a VM you manage"],"ans":[1,2],"why":"A container group is like a pod. Multi-container groups are Linux only, and ACI has no autoscale.","kind":"two","miss":false},{"id":"q073","d":3,"topic":"Containers","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Changing a Container Apps scale rule creates a new revision.","Azure Container Apps supports vertical scaling of replicas.","The ACR admin user is enabled by default."],"ans":[1,0,0],"why":"Scale changes create revisions. Container Apps scales out, not up. Admin user is off by default.","miss":false},{"id":"q074","d":3,"topic":"Containers","type":"match","kind":"match","q":"Match each scenario to the service.","rows":["Nightly batch job in one container, no servers","Microservices that scale on queue length","Store and version private images","Full control of a Kubernetes cluster"],"choices":["Azure Container Registry","Azure Kubernetes Service","Azure Container Instances","Azure Container Apps"],"ans":[2,3,0,1],"why":"Pick by how much you want to manage.","miss":false},{"id":"q075","d":3,"topic":"Containers","q":"You must build a container image from source code and push it to ACR, but the build machine has no Docker. What should you run?","opts":["docker push","az aks create","az acr build","az container create"],"ans":[2],"why":"ACR Tasks build images in the cloud.","kind":"one","miss":false},{"id":"q076","d":3,"topic":"Containers","q":"A Container App has an HTTP rule with 50 concurrent requests and max replicas 5. Traffic is zero for an hour and min replicas is 0. How many replicas run?","opts":["0","50","5","1"],"ans":[0],"why":"With min replicas 0, the app scales to zero when idle.","kind":"one","miss":false},{"id":"q077","d":3,"topic":"App Service","q":"You need to deploy a new version to a staging environment, test it, then move it to production with no downtime. What is the minimum tier?","opts":["Basic","Standard","Shared","Free"],"ans":[1],"why":"Deployment slots start at Standard.","kind":"one","miss":false},{"id":"q078","d":3,"topic":"App Service","q":"An app in the Basic tier needs 6 instances. What should you do?","opts":["Enable VNet integration","Add a deployment slot","Scale up to Standard or higher","Scale out to 6 instances"],"ans":[2],"why":"Basic allows at most 3 instances. Standard allows 10.","kind":"one","miss":false},{"id":"q079","d":3,"topic":"App Service","q":"You map www.contoso.com to an App Service app. Which TWO DNS records are needed?","opts":["A TXT record asuid.www with the verification ID","A CNAME record for www pointing to the app","A PTR record for the app's IP","An MX record for www"],"ans":[0,1],"why":"Subdomains use CNAME plus the asuid TXT record for verification.","kind":"two","miss":false},{"id":"q080","d":3,"topic":"App Service","q":"An app must call a database on a private IP in VNet1. What should you configure on the app?","opts":["A deployment slot","An access restriction","VNet integration","A private endpoint"],"ans":[2],"why":"VNet integration is for outbound traffic from the app into the VNet. Private endpoints are for inbound.","kind":"one","miss":false},{"id":"q081","d":3,"topic":"App Service","q":"You need a free TLS certificate for www.contoso.com that renews automatically. What should you use?","opts":["A wildcard certificate from App Service","A Key Vault secret with a password","An App Service managed certificate","A self-signed certificate in the app settings"],"ans":[2],"why":"Managed certificates are free and auto-renew but are not wildcard.","kind":"one","miss":false},{"id":"q082","d":3,"topic":"App Service","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Autoscale rules are available in the Basic tier.","Slot settings marked as deployment slot settings move with the app during a swap.","Two apps in the same App Service plan share the same instances."],"ans":[0,0,1],"why":"Autoscale starts at Standard. Sticky settings stay with the slot. Apps in a plan share compute.","miss":false},{"id":"q083","d":3,"topic":"App Service","type":"match","kind":"match","q":"Match each requirement to the App Service feature.","rows":["Allow traffic only from the office IP range","App reaches a VM in a VNet","Users reach the app on a private IP","Send 10% of users to the new version"],"choices":["Deployment slot traffic routing","Private endpoint","VNet integration","Access restrictions"],"ans":[3,2,1,0],"why":"Inbound vs outbound, and slots for testing.","miss":false},{"id":"q084","d":3,"topic":"App Service","q":"After a swap, the new production version has a bug. What is the fastest way to restore the previous version?","opts":["Scale out the plan","Redeploy from source control","Swap the slots back","Restore from backup"],"ans":[2],"why":"The previous version is now in the staging slot, so swapping back restores it.","kind":"one","miss":false},{"id":"q085","d":3,"topic":"App Service","q":"You scale an App Service plan out to 4 instances. The plan hosts App1 and App2. How many instances does App2 run on?","opts":["1","It depends on App2's own scale setting","4","2"],"ans":[2],"why":"Scale settings apply to all apps in the plan.","kind":"one","miss":false},{"id":"q086","d":4,"topic":"Virtual networks","q":"You create a subnet with the address range 10.0.1.0/24. How many IP addresses can you assign to VMs?","opts":["256","251","250","254"],"ans":[1],"why":"Azure reserves 5 addresses in every subnet.","kind":"one","miss":false},{"id":"q087","d":4,"topic":"Virtual networks","q":"VNet1 is peered to VNet2, and VNet2 is peered to VNet3. VMs in VNet1 cannot reach VNet3. Why?","opts":["VNet2 needs a public IP","Peering is not transitive","The NSGs block port 443","Global peering is not supported"],"ans":[1],"why":"You need a direct peering or routing through an NVA in VNet2.","kind":"one","miss":false},{"id":"q088","d":4,"topic":"Virtual networks","q":"Spoke VNets must use the VPN gateway in the hub VNet. Which TWO settings are needed?","opts":["Allow forwarded traffic on the gateway subnet","A public IP on each spoke","Allow gateway transit on the hub peering","Use remote gateways on the spoke peering"],"ans":[2,3],"why":"Gateway transit is set on the hub. Use remote gateways is set on the spoke.","kind":"two","miss":false},{"id":"q089","d":4,"topic":"Virtual networks","q":"All internet-bound traffic from Subnet1 must pass through a firewall appliance at 10.0.0.4. What should you create?","opts":["An NSG rule denying the internet","A route table with 0.0.0.0/0 and next hop Virtual appliance 10.0.0.4, associated to Subnet1","A service endpoint for Microsoft.Storage","A peering to the firewall's VNet only"],"ans":[1],"why":"A default route UDR sends traffic to the NVA.","kind":"one","miss":false},{"id":"q090","d":4,"topic":"Virtual networks","q":"You cannot peer VNetA (10.1.0.0/16) with VNetB. VNetB uses 10.1.128.0/17. What is the cause?","opts":["Peering needs a Basic public IP","The address spaces overlap","VNetB has no gateway","The VNets are in different regions"],"ans":[1],"why":"Peered VNets cannot have overlapping address spaces.","kind":"one","miss":false},{"id":"q091","d":4,"topic":"Virtual networks","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A Standard public IP address can be dynamic.","A UDR can override a system route.","Global VNet peering connects VNets in different regions."],"ans":[0,1,1],"why":"Standard IPs are always static. UDRs win on tie. Global peering is cross-region.","miss":false},{"id":"q092","d":4,"topic":"Virtual networks","type":"match","kind":"match","q":"Match each next hop type to its use.","rows":["Send traffic to a firewall VM","Drop the traffic","Send traffic to an on-premises VPN","Send traffic out to public addresses"],"choices":["Internet","None","Virtual network gateway","Virtual appliance"],"ans":[3,1,2,0],"why":"Next hop decides where packets go.","miss":false},{"id":"q093","d":4,"topic":"Virtual networks","q":"A VM cannot reach another subnet. You want to see which route wins for the destination IP. Which Network Watcher tool should you use?","opts":["Next hop","Packet capture","IP flow verify","Connection Monitor"],"ans":[0],"why":"Next hop shows the route type, next hop IP and route table used.","kind":"one","miss":false},{"id":"q094","d":4,"topic":"Virtual networks","q":"Two routes match 10.2.1.5: a system route for 10.2.0.0/16 and a UDR for 10.2.1.0/24. Which is used?","opts":["Neither; traffic is dropped","The UDR for 10.2.1.0/24","The system route for 10.2.0.0/16","Both, load-balanced"],"ans":[1],"why":"Longest prefix match wins first.","kind":"one","miss":false},{"id":"q095","d":4,"topic":"Network security","q":"An NSG has rule 200 Allow TCP 3389 from Any and rule 100 Deny TCP 3389 from Any. What happens to RDP traffic?","opts":["It is allowed because allow rules win","It is denied by rule 100","It is allowed by rule 200","It is denied by the default rule 65500"],"ans":[1],"why":"Lowest priority number is processed first, and processing stops at the first match.","kind":"one","miss":false},{"id":"q096","d":4,"topic":"Network security","q":"The subnet NSG allows inbound TCP 80. The NIC NSG has only the default rules. Can internet clients reach the VM on port 80?","opts":["Yes, NSGs are stateful","No, the NIC NSG's DenyAllInbound blocks it","Yes, the subnet NSG allows it","No, because subnet NSGs are evaluated last"],"ans":[1],"why":"Inbound traffic must be allowed by both the subnet and the NIC NSG.","kind":"one","miss":false},{"id":"q097","d":4,"topic":"Network security","q":"You need admins to RDP to VMs from the Azure portal without any public IP on the VMs. What should you deploy?","opts":["A Standard public IP on each VM","A NAT gateway","Azure Bastion","An application security group"],"ans":[2],"why":"Bastion provides RDP and SSH over TLS in the browser.","kind":"one","miss":false},{"id":"q098","d":4,"topic":"Network security","q":"On-premises users must reach a storage account over the VPN by a private IP, with public access disabled. What should you configure?","opts":["A service endpoint on the gateway subnet","A private endpoint and a private DNS zone","Anonymous blob access","A storage firewall IP rule for the on-premises range"],"ans":[1],"why":"Private endpoints give a private IP reachable from on-premises. Service endpoints only work from the VNet.","kind":"one","miss":false},{"id":"q099","d":4,"topic":"Network security","q":"Which TWO are requirements for a Standard Azure Bastion deployment?","opts":["A public IP on each target VM","A /29 subnet","A Standard SKU public IP address","A subnet named AzureBastionSubnet"],"ans":[2,3],"why":"AzureBastionSubnet must be /26 or larger, with a Standard public IP.","kind":"two","miss":false},{"id":"q100","d":4,"topic":"Network security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["You can delete the default DenyAllInbound rule in an NSG.","An ASG can be used as the destination of an NSG rule.","Service endpoints give a PaaS resource a private IP in your VNet."],"ans":[0,1,0],"why":"Defaults can only be overridden. ASGs work as source or destination. Private endpoints, not service endpoints, give a private IP.","miss":false},{"id":"q101","d":4,"topic":"Network security","type":"match","kind":"match","q":"Match each requirement to the feature.","rows":["Allow web servers by role, not IP","Allow all Azure Storage IPs in West Europe","RDP from the browser with no public IP","Find which rule blocked a packet"],"choices":["Service tag","Azure Bastion","Application security group","IP flow verify"],"ans":[2,0,1,3],"why":"Group by role, by Microsoft range, by access path, by diagnosis.","miss":false},{"id":"q102","d":4,"topic":"Network security","q":"Which Bastion SKU do you need to connect with the native RDP client on your PC?","opts":["Developer","Standard","Any SKU","Basic"],"ans":[1],"why":"Native client support starts at Standard.","kind":"one","miss":false},{"id":"q103","d":4,"topic":"Network security","q":"A storage account must accept traffic only from Subnet1. Cost must be minimal and on-premises access is not needed. What should you use?","opts":["Azure Bastion","A VPN gateway","A private endpoint","A service endpoint and a virtual network rule"],"ans":[3],"why":"Service endpoints are free and meet the requirement.","kind":"one","miss":false},{"id":"q104","d":4,"topic":"DNS and load balancing","q":"You want contoso.com (the zone apex) to point to a public IP of a load balancer and update automatically if the IP changes. What should you create?","opts":["A CNAME record at the apex","An MX record","An alias A record at the apex","A PTR record"],"ans":[2],"why":"CNAME cannot be at the apex. An alias record tracks the Azure resource.","kind":"one","miss":false},{"id":"q105","d":4,"topic":"DNS and load balancing","q":"VMs in VNet1 must resolve each other by name in contoso.internal, with records created automatically. What should you configure?","opts":["A private DNS zone linked to VNet1 with autoregistration enabled","A public DNS zone with NS delegation","Host files on each VM","A custom DNS server with no forwarders"],"ans":[0],"why":"Autoregistration adds A records for VMs in a registration-linked VNet.","kind":"one","miss":false},{"id":"q106","d":4,"topic":"DNS and load balancing","q":"A web app needs URL path-based routing (/images to one pool, /api to another) and a WAF. Which service should you use?","opts":["Azure Traffic Manager","An internal load balancer with HA ports","Azure Application Gateway","Azure Load Balancer Standard"],"ans":[2],"why":"Path routing and WAF are Layer 7 features of Application Gateway.","kind":"one","miss":false},{"id":"q107","d":4,"topic":"DNS and load balancing","q":"After deploying a Standard public load balancer, clients cannot reach the backend VMs on port 80. Probes are healthy. What is the most likely cause?","opts":["Standard Load Balancer needs a Basic public IP","No NSG rule allows inbound TCP 80 to the backend","Session persistence is set to None","The backend pool must contain an availability set"],"ans":[1],"why":"Standard LB is secure by default; an NSG must allow the traffic.","kind":"one","miss":false},{"id":"q108","d":4,"topic":"DNS and load balancing","q":"Which TWO components must exist for a load balancer to distribute HTTP traffic to backend VMs?","opts":["A private DNS zone","A load-balancing rule","A health probe","An inbound NAT rule"],"ans":[1,2],"why":"Rules map frontend to backend, and probes decide which backends get traffic.","kind":"two","miss":false},{"id":"q109","d":4,"topic":"DNS and load balancing","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Azure DNS can be used to buy a domain name.","A CNAME record can be created at the zone apex.","Health probes come from the IP address 168.63.129.16."],"ans":[0,0,1],"why":"Buy domains elsewhere (or App Service domains). CNAME is not allowed at the apex. 168.63.129.16 is the probe source.","miss":false},{"id":"q110","d":4,"topic":"DNS and load balancing","type":"match","kind":"match","q":"Match each requirement to the service.","rows":["Balance TCP traffic for internal VMs","Path-based routing with WAF in one region","Global HTTP routing with CDN","Resolve VM names inside a VNet"],"choices":["Azure Front Door","Internal Load Balancer","Private DNS zone","Application Gateway"],"ans":[1,3,0,2],"why":"Layer and scope decide.","miss":false},{"id":"q111","d":4,"topic":"DNS and load balancing","q":"A VNet uses a custom DNS server, and VMs can no longer resolve names in a linked private DNS zone. What should you do?","opts":["Enable autoregistration on a second zone","Delete the virtual network link","Add a CNAME at the apex","Configure the custom DNS server to forward to 168.63.129.16"],"ans":[3],"why":"Custom DNS bypasses Azure DNS unless it forwards to it.","kind":"one","miss":false},{"id":"q112","d":4,"topic":"DNS and load balancing","q":"Users of a shopping app lose their session when sent to a different backend VM. What should you set on the load-balancing rule?","opts":["Floating IP","An outbound rule","Session persistence to Client IP","Idle timeout to 30 minutes"],"ans":[2],"why":"Client IP affinity keeps a client on the same backend.","kind":"one","miss":false},{"id":"q113","d":5,"topic":"Monitoring","q":"You need to be notified by SMS when a VM's CPU stays above 90% for 15 minutes. What should you create?","opts":["A diagnostic setting to Event Hubs","An activity log alert","An alert processing rule only","A metric alert rule with an action group that sends SMS"],"ans":[3],"why":"Metric alerts watch thresholds. Action groups send notifications.","kind":"one","miss":false},{"id":"q114","d":5,"topic":"Monitoring","q":"No alert notifications should be sent for VMs in RG1 every Saturday from 01:00 to 05:00, but alerts must still be recorded. What should you create?","opts":["A resource lock on RG1","An alert processing rule that suppresses notifications on a recurring schedule","Delete the action group","Disable the alert rules every Saturday"],"ans":[1],"why":"Alert processing rules suppress action groups on a schedule while alerts still fire.","kind":"one","miss":false},{"id":"q115","d":5,"topic":"Monitoring","q":"You need to keep a storage account's resource logs for 2 years at the lowest cost. Where should the diagnostic setting send them?","opts":["A storage account","An action group","Metrics explorer","Event Hubs"],"ans":[0],"why":"Archive to storage is cheapest for long retention.","kind":"one","miss":false},{"id":"q116","d":5,"topic":"Monitoring","q":"You need to be alerted when anyone deletes a VM in the subscription. Which alert type should you use?","opts":["Metric alert","Log search alert on Perf","Smart detection alert","Activity log alert"],"ans":[3],"why":"Deletes are control-plane events in the activity log.","kind":"one","miss":false},{"id":"q117","d":5,"topic":"Monitoring","q":"Which TWO are needed to collect Windows event logs from VMs into a Log Analytics workspace?","opts":["A data collection rule","An NSG flow log","An alert processing rule","The Azure Monitor Agent"],"ans":[0,3],"why":"AMA plus a DCR define and send the data.","kind":"two","miss":false},{"id":"q118","d":5,"topic":"Monitoring","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Resource logs are collected automatically without a diagnostic setting.","Activity log data is kept for 90 days by default.","An alert processing rule can add action groups to fired alerts."],"ans":[0,1,1],"why":"Resource logs need a diagnostic setting. Activity log keeps 90 days. Processing rules add or suppress action groups.","miss":false},{"id":"q119","d":5,"topic":"Monitoring","type":"match","kind":"match","q":"Match each question to the Network Watcher tool.","rows":["Which NSG rule blocks this packet?","Which route does traffic to 10.1.0.4 use?","Alert me when latency to the app server rises","Record all traffic metadata in a VNet"],"choices":["IP flow verify","Connection Monitor","VNet flow logs","Next hop"],"ans":[0,3,1,2],"why":"One tool per question.","miss":false},{"id":"q120","d":5,"topic":"Monitoring","q":"Which KQL operator groups rows and counts them, as in counting heartbeats per computer?","opts":["take","summarize","where","project"],"ans":[1],"why":"summarize aggregates. project picks columns. where filters.","kind":"one","miss":false},{"id":"q121","d":5,"topic":"Monitoring","q":"You want to see dependencies between VMs and the processes that connect them. What should you enable?","opts":["Storage insights","Packet capture","VM insights","An activity log alert"],"ans":[2],"why":"VM insights includes a dependency map.","kind":"one","miss":false},{"id":"q122","d":5,"topic":"Backup and recovery","q":"You need to back up Azure VMs in East US a
