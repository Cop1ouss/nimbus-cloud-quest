"Match each example to the defense-in-depth layer.","rows":["Badge access to the datacenter building","Multifactor authentication for sign-in","Patching virtual machine operating systems","Encrypting a database"],"choices":["Identity and access","Data","Physical","Compute"],"ans":[2,0,3,1],"why":"Physical is the building. Identity and access controls who signs in. Compute covers VMs and endpoints. Data is the innermost layer.","miss":false},{"id":"q009","d":1,"topic":"Identity concepts","q":"A user enters a password and then approves a prompt on their phone. Which process is this?","opts":["Federation","Authorization","Auditing","Authentication"],"ans":[3],"why":"Proving who you are is authentication. Authorization happens afterwards and decides what you can access.","kind":"one","miss":false},{"id":"q010","d":1,"topic":"Identity concepts","q":"After sign-in, a user can read a SharePoint site but cannot edit it. Which process decided that?","opts":["Single sign-on","Administration","Authorization","Authentication"],"ans":[2],"why":"Authorization sets the level of access an authenticated identity gets.","kind":"one","miss":false},{"id":"q011","d":1,"topic":"Identity concepts","q":"Users at Contoso sign in to a partner's app with their Contoso accounts. The partner's identity provider trusts Contoso's. What is this called?","opts":["Password hash synchronization","Multifactor authentication","Conditional Access","Federation"],"ans":[3],"why":"Federation is a trust relationship between identity providers across organizations.","kind":"one","miss":false},{"id":"q012","d":1,"topic":"Identity concepts","q":"Which statement about Active Directory Domain Services (AD DS) is true?","opts":["It is an on-premises directory service that does not natively support SaaS apps and modern authentication","It replaces the need for any authentication","It is the cloud identity provider included with Microsoft 365","It only stores device objects"],"ans":[0],"why":"AD DS is the on-premises directory. Microsoft Entra ID is the cloud identity provider built for modern authentication.","kind":"one","miss":false},{"id":"q013","d":1,"topic":"Identity concepts","q":"With modern authentication, what does the identity provider give the client after a successful sign-in?","opts":["A firewall rule","An encryption key for the disk","The user's password","A security token"],"ans":[3],"why":"The identity provider issues a security token that the client presents to apps. Apps trust the token, not the password.","kind":"one","miss":false},{"id":"q014","d":1,"topic":"Identity concepts","q":"Which TWO are pillars of an identity infrastructure?","opts":["Authentication","Encryption at rest","Auditing","Virtualization"],"ans":[0,2],"why":"The four pillars are administration, authentication, authorization and auditing.","kind":"two","miss":false},{"id":"q015","d":1,"topic":"Identity concepts","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Authorization happens before authentication.","In a federation, trust between two identity providers is always bidirectional.","Single sign-on lets a user sign in once and access multiple applications."],"ans":[0,0,1],"why":"Authentication comes first. Federation trust can be one-way. SSO means one sign-in for many apps.","miss":false},{"id":"q016","d":2,"topic":"Entra ID and identities","q":"An Azure VM needs to read secrets from Key Vault. You do not want to store or rotate any credentials. What should you use?","opts":["A shared administrator password","A device identity","A guest user account","A managed identity"],"ans":[3],"why":"Managed identities are managed by Azure, so there are no credentials in code or to rotate.","kind":"one","miss":false},{"id":"q017","d":2,"topic":"Entra ID and identities","q":"A managed identity must be used by five different virtual machines and should exist independently of them. Which type fits?","opts":["Guest identity","System-assigned managed identity","Hybrid joined device","User-assigned managed identity"],"ans":[3],"why":"User-assigned identities are standalone and can be shared. System-assigned is tied to exactly one resource.","kind":"one","miss":false},{"id":"q018","d":2,"topic":"Entra ID and identities","q":"An employee wants to use a personal phone for work email. Which device identity type fits a personal device?","opts":["Microsoft Entra hybrid joined","Managed identity","Microsoft Entra registered","Microsoft Entra joined"],"ans":[2],"why":"Registered is for personally owned (BYOD) devices. Joined and hybrid joined are for organization-owned devices.","kind":"one","miss":false},{"id":"q019","d":2,"topic":"Entra ID and identities","q":"A company wants on-premises AD users to sign in to Microsoft 365 with the same password, and wants sign-in to keep working if the on-premises servers go down. Which method fits?","opts":["Pass-through authentication","Password hash synchronization","Security defaults","Federation with AD FS"],"ans":[1],"why":"With password hash sync, authentication happens in the cloud, so it does not depend on on-premises servers. Pass-through and federation both need on-premises components at sign-in.","kind":"one","miss":false},{"id":"q020","d":2,"topic":"Entra ID and identities","q":"A vendor's staff must access your SharePoint site using their own company accounts. What should you use?","opts":["Microsoft Entra B2B collaboration","A system-assigned managed identity","Pass-through authentication","Microsoft Entra joined devices"],"ans":[0],"why":"B2B collaboration invites external users as guests who sign in with their own identity.","kind":"one","miss":false},{"id":"q021","d":2,"topic":"Entra ID and identities","q":"Which TWO are workload identities?","opts":["Managed identity","Microsoft Entra registered device","Guest user","Service principal"],"ans":[0,3],"why":"Workload identities are for software: applications, service principals and managed identities. Guests are human identities.","kind":"two","miss":false},{"id":"q022","d":2,"topic":"Entra ID and identities","type":"match","kind":"match","q":"Match each description to the identity type.","rows":["An employee's work account","A partner invited as a guest","An app that authenticates to call an API","A company laptop joined to Entra"],"choices":["External identity","Device identity","Workload identity","Workforce user identity"],"ans":[3,0,2,1],"why":"Human identities are workforce or external. Workload identities are for software. Devices have their own identity.","miss":false},{"id":"q023","d":2,"topic":"Authentication","q":"A user signs in with a password and a PIN they memorized. Is this multifactor authentication?","opts":["Yes, a PIN is something you have","Yes, because two items were entered","No, both are something you know","No, MFA requires three factors"],"ans":[2],"why":"MFA needs factors from different categories. A password and a memorized PIN are both knowledge factors.","kind":"one","miss":false},{"id":"q024","d":2,"topic":"Authentication","q":"Which sign-in method is passwordless?","opts":["A complex 20-character password","A FIDO2 passkey on a security key","A password plus a voice call","A password plus an SMS code"],"ans":[1],"why":"Passkeys (FIDO2), Windows Hello for Business and Microsoft Authenticator phone sign-in remove the password.","kind":"one","miss":false},{"id":"q025","d":2,"topic":"Authentication","q":"A small company has no Conditional Access licenses but wants MFA for all users and legacy authentication blocked. What should it turn on?","opts":["Microsoft Entra ID Protection","Privileged Identity Management","Password hash synchronization","Security defaults"],"ans":[3],"why":"Security defaults give a free baseline: MFA registration for all, MFA for admins, legacy authentication blocked.","kind":"one","miss":false},{"id":"q026","d":2,"topic":"Authentication","q":"Help desk calls for forgotten passwords are costing too much. Which feature lets users fix this themselves?","opts":["Custom banned password list","Access reviews","Microsoft Entra Connect","Self-service password reset"],"ans":[3],"why":"SSPR lets users reset or unlock their own accounts after verifying identity.","kind":"one","miss":false},{"id":"q027","d":2,"topic":"Authentication","q":"You want to stop users choosing passwords that contain your company name. What should you configure?","opts":["Custom banned password list","Global banned password list","Smart lockout","Security defaults"],"ans":[0],"why":"The custom list holds organization-specific terms. The global list is maintained by Microsoft and cannot be edited.","kind":"one","miss":false},{"id":"q028","d":2,"topic":"Authentication","q":"Which TWO are authentication factors that count as something you have?","opts":["A registered phone running Microsoft Authenticator","A password","A fingerprint","A FIDO2 security key"],"ans":[0,3],"why":"A phone or key is something you have. A fingerprint is something you are. A password is something you know.","kind":"two","miss":false},{"id":"q029","d":2,"topic":"Authentication","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Windows Hello for Business replaces passwords with a credential tied to the device.","Self-service password reset requires a help desk agent to approve each reset.","The global banned password list is applied automatically to all users."],"ans":[1,0,1],"why":"Windows Hello uses a device-bound credential unlocked by PIN or biometrics. SSPR needs no help desk. The global list is automatic.","miss":false},{"id":"q030","d":2,"topic":"Access management","q":"You must require MFA only when users sign in from outside the corporate network. Which feature should you use?","opts":["Security defaults","Conditional Access","Self-service password reset","Access reviews"],"ans":[1],"why":"Conditional Access applies controls based on signals such as location. Security defaults cannot target conditions.","kind":"one","miss":false},{"id":"q031","d":2,"topic":"Access management","q":"In a Conditional Access policy, what is the user's sign-in location an example of?","opts":["An enforcement","A role assignment","A signal","A decision"],"ans":[2],"why":"Signals are the inputs (user, location, device, app, risk). The decision is block or grant. Enforcement applies it.","kind":"one","miss":false},{"id":"q032","d":2,"topic":"Access management","q":"A help desk worker must reset user passwords in Microsoft Entra ID but must not manage Azure virtual machines. Which kind of role should you assign?","opts":["A sensitivity label","A managed identity","An Azure role at subscription scope","A Microsoft Entra role"],"ans":[3],"why":"Entra roles manage directory objects such as users and passwords. Azure roles manage Azure resources.","kind":"one","miss":false},{"id":"q033","d":2,"topic":"Access management","q":"Which role has the broadest permissions across Microsoft Entra ID and should be limited to very few people?","opts":["Reader","Billing Administrator","User Administrator","Global Administrator"],"ans":[3],"why":"Global Administrator can manage everything in Entra ID. Least privilege means few people hold it.","kind":"one","miss":false},{"id":"q034","d":2,"topic":"Access management","q":"Which outcome can a Conditional Access policy NOT produce by itself?","opts":["Granting access only from a compliant device","Automatically deleting the user account","Granting access with MFA required","Blocking access"],"ans":[1],"why":"Conditional Access blocks or grants access with requirements. It does not delete accounts.","kind":"one","miss":false},{"id":"q035","d":2,"topic":"Access management","q":"Which TWO can be used as signals in a Conditional Access policy?","opts":["The size of the user's mailbox","The application being accessed","The Azure region of a VM","The device platform"],"ans":[1,3],"why":"Common signals are user or group, location, device, application and risk.","kind":"two","miss":false},{"id":"q036","d":2,"topic":"Access management","type":"match","kind":"match","q":"Match each Conditional Access example to its part of the policy.","rows":["The user signs in from an unfamiliar country","Grant access, but require MFA","The requirement is applied when the user opens the app"],"choices":["Enforcement","Decision","Signal"],"ans":[2,1,0],"why":"Signals are inputs, the decision is block or grant with requirements, and enforcement applies it at access time.","miss":false},{"id":"q037","d":2,"topic":"Identity governance","q":"Administrators should hold the Global Administrator role only for the hour they need it, after approval. Which feature provides this?","opts":["Microsoft Entra ID Protection","Privileged Identity Management","Security defaults","Access reviews"],"ans":[1],"why":"PIM gives just-in-time, time-bound, approval-based role activation.","kind":"one","miss":false},{"id":"q038","d":2,"topic":"Identity governance","q":"Every quarter, group owners must confirm that members still need access, and unconfirmed members should be removed. What should you use?","opts":["Self-service password reset","Conditional Access","Privileged Identity Management","Access reviews"],"ans":[3],"why":"Access reviews recertify access on a schedule and can remove access automatically.","kind":"one","miss":false},{"id":"q039","d":2,"topic":"Identity governance","q":"A user's credentials are found in a leaked list on the dark web. Which type of risk does Microsoft Entra ID Protection raise?","opts":["Insider risk","Compliance risk","User risk","Sign-in risk"],"ans":[2],"why":"Leaked credentials suggest the identity itself is compromised, which is user risk. Sign-in risk is about a specific sign-in attempt.","kind":"one","miss":false},{"id":"q040","d":2,"topic":"Identity governance","q":"A sign-in comes from an anonymous IP address in a country the user has never visited. Which risk type is this?","opts":["Compliance score","Sign-in risk","User risk","Secure score"],"ans":[1],"why":"Sign-in risk is the probability that a given sign-in was not performed by the identity owner.","kind":"one","miss":false},{"id":"q041","d":2,"topic":"Identity governance","q":"New project members need a set of groups, an app and a SharePoint site, with access that expires after 90 days. Which feature bundles this?","opts":["Microsoft Entra Connect Sync","Azure Bastion","Custom banned password list","Entitlement management access packages"],"ans":[3],"why":"Access packages bundle resources with approval and expiration policies.","kind":"one","miss":false},{"id":"q042","d":2,"topic":"Identity governance","q":"Which TWO can PIM require before a user activates an eligible role?","opts":["Deleting their mailbox","Multifactor authentication","Approval from a designated approver","A new device purchase"],"ans":[1,2],"why":"PIM activation can require MFA, justification and approval, and is time-limited.","kind":"two","miss":false},{"id":"q043","d":2,"topic":"Identity governance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Privileged Identity Management provides time-bound access to roles.","Access reviews can only be completed by Global Administrators.","Microsoft Entra ID Protection can feed risk into Conditional Access policies."],"ans":[1,0,1],"why":"PIM is just-in-time and time-bound. Reviewers can be owners, managers or the users themselves. Risk is a Conditional Access signal.","miss":false},{"id":"q044","d":3,"topic":"Azure infrastructure security","q":"Admins need to RDP to Azure VMs without giving the VMs public IP addresses. What should you deploy?","opts":["Azure Bastion","Azure DDoS Protection","Azure Firewall","A network security group"],"ans":[0],"why":"Bastion provides RDP and SSH through the portal over TLS, so VMs need no public IP.","kind":"one","miss":false},{"id":"q045","d":3,"topic":"Azure infrastructure security","q":"A public website must be protected against SQL injection and cross-site scripting. What should you use?","opts":["Network security group","Azure DDoS Protection","Azure Bastion","Web Application Firewall"],"ans":[3],"why":"WAF inspects web requests at layer 7 for common exploits. NSGs filter by IP, port and protocol only.","kind":"one","miss":false},{"id":"q046","d":3,"topic":"Azure infrastructure security","q":"You need to allow only port 443 into one subnet and deny everything else. What is the simplest tool?","opts":["Web Application Firewall","Network security group","Azure Key Vault","Microsoft Sentinel"],"ans":[1],"why":"NSGs filter traffic to subnets or network interfaces with allow and deny rules.","kind":"one","miss":false},{"id":"q047","d":3,"topic":"Azure infrastructure security","q":"An application's connection strings are stored in its source code. Where should they be stored instead?","opts":["An NSG rule","Azure Key Vault","Azure Bastion","A sensitivity label"],"ans":[1],"why":"Key Vault centrally stores secrets, keys and certificates with controlled, logged access.","kind":"one","miss":false},{"id":"q048","d":3,"topic":"Azure infrastructure security","q":"You need one central, stateful firewall that filters outbound traffic by fully qualified domain name for several virtual networks. What should you use?","opts":["Azure Firewall","Network security group","Azure Bastion","Azure DDoS Protection"],"ans":[0],"why":"Azure Firewall is a managed, stateful firewall with application (FQDN) rules, used centrally. NSGs cannot filter by FQDN.","kind":"one","miss":false},{"id":"q049","d":3,"topic":"Azure infrastructure security","q":"Which TWO can be stored in Azure Key Vault?","opts":["Encryption keys","Certificates","NSG flow logs","Virtual machine images"],"ans":[0,1],"why":"Key Vault stores secrets, keys and certificates.","kind":"two","miss":false},{"id":"q050","d":3,"topic":"Azure infrastructure security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A network security group can be associated with a subnet.","Azure Bastion requires each virtual machine to have a public IP address.","Azure DDoS Protection helps keep an application available during a traffic flood."],"ans":[1,0,1],"why":"NSGs attach to subnets or NICs. Bastion removes the need for public IPs. DDoS Protection defends availability.","miss":false},{"id":"q051","d":3,"topic":"Azure infrastructure security","type":"match","kind":"match","q":"Match each need to the Azure service.","rows":["Absorb a flood of malicious traffic","Block SQL injection against a web app","Store an API key safely","SSH to a VM with no public IP"],"choices":["Azure Key Vault","Web Application Firewall","Azure DDoS Protection","Azure Bastion"],"ans":[2,1,0,3],"why":"Each service covers one job: availability under attack, web exploits, secret storage, and secure remote access.","miss":false},{"id":"q052","d":3,"topic":"Defender for Cloud","q":"Which Defender for Cloud feature gives one number that summarizes your security posture?","opts":["Access reviews","Workbooks","Compliance score","Secure score"],"ans":[3],"why":"Secure score is the Defender for Cloud posture measure. Compliance score belongs to Microsoft Purview Compliance Manager.","kind":"one","miss":false},{"id":"q053","d":3,"topic":"Defender for Cloud","q":"Which standard is applied by default when you enable Defender for Cloud on a subscription?","opts":["GDPR","Microsoft cloud security benchmark","PCI DSS","ISO 27001"],"ans":[1],"why":"MCSB is the default standard. Others can be added in the regulatory compliance dashboard.","kind":"one","miss":false},{"id":"q054","d":3,"topic":"Defender for Cloud","q":"You want to find misconfigured resources and get hardening guidance at no extra cost. Which capability provides this?","opts":["Defender for Servers","Microsoft Sentinel playbooks","Foundational CSPM","Azure Bastion"],"ans":[2],"why":"Foundational CSPM is free and provides recommendations and secure score.","kind":"one","miss":false},{"id":"q055","d":3,"topic":"Defender for Cloud","q":"Management ports on VMs should stay closed and open only when an admin requests access for a short time. Which feature does this?","opts":["Network security group default rules","Azure Bastion","Privileged Identity Management","Just-in-time VM access"],"ans":[3],"why":"JIT VM access in Defender for Cloud opens ports on request for a limited time.","kind":"one","miss":false},{"id":"q056","d":3,"topic":"Defender for Cloud","q":"What is the purpose of the Defender plans such as Defender for Servers and Defender for Storage?","opts":["Classifying documents with labels","Storing encryption keys","Reviewing guest user access","Cloud workload protection with threat detection and alerts"],"ans":[3],"why":"The Defender plans are the cloud workload protection pillar. They detect threats against specific resource types.","kind":"one","miss":false},{"id":"q057","d":3,"topic":"Defender for Cloud","q":"Which TWO environments besides Azure can Defender for Cloud protect?","opts":["On-premises servers","Amazon Web Services","Exchange Online mailboxes","Microsoft Teams chats"],"ans":[0,1],"why":"Defender for Cloud is multicloud (AWS, GCP) and hybrid. Email and Teams are covered by Defender for Office 365.","kind":"two","miss":false},{"id":"q058","d":3,"topic":"Defender for Cloud","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A higher secure score indicates a lower identified risk level.","Security recommendations in Defender for Cloud are generated by assessing resources against security standards.","Foundational CSPM requires a paid Defender plan."],"ans":[1,1,0],"why":"Higher score means lower risk. Recommendations come from standards built on Azure Policy. Foundational CSPM is free.","miss":false},{"id":"q059","d":3,"topic":"Microsoft Sentinel","q":"Which statement describes a SIEM system?","opts":["It stores secrets and certificates","It filters traffic between subnets","It classifies documents with labels","It collects log data from across the estate, analyzes it and raises alerts and incidents"],"ans":[3],"why":"SIEM is security information and event management: collect, correlate, alert.","kind":"one","miss":false},{"id":"q060","d":3,"topic":"Microsoft Sentinel","q":"You want Sentinel to automatically disable a user account when a specific incident is created. What should you build?","opts":["A data connector","A workbook","A sensitivity label","A playbook"],"ans":[3],"why":"Playbooks are automated response workflows based on Azure Logic Apps.","kind":"one","miss":false},{"id":"q061","d":3,"topic":"Microsoft Sentinel","q":"Which Sentinel feature brings in sign-in logs from Microsoft Entra ID?","opts":["A data connector","A playbook","An analytics rule","A notebook"],"ans":[0],"why":"Data connectors ingest data. Analytics rules then detect threats in it.","kind":"one","miss":false},{"id":"q062","d":3,"topic":"Microsoft Sentinel","q":"A security analyst wants to search proactively for signs of an attacker before any alert is raised. Which Sentinel capability is this?","opts":["Playbooks","Data connectors","Workbooks","Hunting"],"ans":[3],"why":"Hunting is proactive searching with queries. Workbooks visualize, playbooks respond.","kind":"one","miss":false},{"id":"q063","d":3,"topic":"Microsoft Sentinel","q":"Which term describes automating the response to security alerts with workflows?","opts":["CASB","SIEM","SOAR","CSPM"],"ans":[2],"why":"SOAR is security orchestration, automation and response.","kind":"one","miss":false},{"id":"q064","d":3,"topic":"Microsoft Sentinel","q":"Which TWO describe Microsoft Sentinel?","opts":["SOAR solution","Password manager","Cloud access security broker","Cloud-native SIEM"],"ans":[0,3],"why":"Sentinel is a SIEM and SOAR solution. The CASB is Defender for Cloud Apps.","kind":"two","miss":false},{"id":"q065","d":3,"topic":"Microsoft Sentinel","type":"match","kind":"match","q":"Match each Sentinel feature to what it does.","rows":["Data connectors","Analytics rules","Workbooks","Playbooks"],"choices":["Automate response","Visualize and monitor","Detect threats","Collect data"],"ans":[3,2,1,0],"why":"Connectors collect, analytics detect, workbooks visualize, playbooks respond.","miss":false},{"id":"q066","d":3,"topic":"Defender XDR","q":"Users are receiving phishing emails with malicious links. Which service protects against this?","opts":["Microsoft Defender for Identity","Azure Firewall","Microsoft Defender for Cloud","Microsoft Defender for Office 365"],"ans":[3],"why":"Defender for Office 365 protects email and collaboration from phishing, malicious links and attachments.","kind":"one","miss":false},{"id":"q067","d":3,"topic":"Defender XDR","q":"You want to discover which unsanctioned SaaS apps employees are using (shadow IT). Which service should you use?","opts":["Microsoft Defender for Endpoint","Microsoft Defender for Cloud","Microsoft Defender for Office 365","Microsoft Defender for Cloud Apps"],"ans":[3],"why":"Defender for Cloud Apps is the CASB that discovers and controls cloud app use. Defender for Cloud protects Azure and multicloud workloads.","kind":"one","miss":false},{"id":"q068","d":3,"topic":"Defender XDR","q":"Which service uses on-premises Active Directory signals to detect lateral movement and compromised identities?","opts":["Microsoft Purview Audit","Microsoft Defender for Identity","Microsoft Defender for Endpoint","Microsoft Entra ID Protection"],"ans":[1],"why":"Defender for Identity monitors on-premises AD signals. Entra ID Protection detects risk on cloud identities.","kind":"one","miss":false},{"id":"q069","d":3,"topic":"Defender XDR","q":"Which service provides endpoint detection and response (EDR) for laptops and servers?","opts":["Azure Bastion","Microsoft Defender for Cloud Apps","Microsoft Defender for Office 365","Microsoft Defender for Endpoint"],"ans":[3],"why":"Defender for Endpoint protects devices and includes EDR.","kind":"one","miss":false},{"id":"q070","d":3,"topic":"Defender XDR","q":"Which service continuously finds and prioritizes software weaknesses on devices by risk?","opts":["Microsoft Sentinel workbooks","Microsoft Defender Threat Intelligence","Microsoft Purview Compliance Manager","Microsoft Defender Vulnerability Management"],"ans":[3],"why":"Defender Vulnerability Management discovers assets, assesses vulnerabilities and prioritizes by risk.","kind":"one","miss":false},{"id":"q071","d":3,"topic":"Defender XDR","q":"Which TWO are available in the Microsoft Defender portal?","opts":["Sensitivity label publishing","Incidents that combine alerts from several Defender services","Retention label policies","Advanced hunting"],"ans":[1,3],"why":"The Defender portal unifies incidents, alerts and hunting. Labels and retention live in the Microsoft Purview portal.","kind":"two","miss":false},{"id":"q072","d":3,"topic":"Defender XDR","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Microsoft Defender for Cloud Apps is a cloud access security broker.","Microsoft Defender for Endpoint is designed to protect email from phishing.","Microsoft Defender XDR correlates signals across endpoints, identities, email and apps."],"ans":[1,0,1],"why":"Cloud Apps is the CASB. Email protection is Defender for Office 365. XDR correlates across domains.","miss":false},{"id":"q073","d":3,"topic":"Defender XDR","type":"match","kind":"match","q":"Match each Defender service to what it protects.","rows":["Defender for Office 365","Defender for Endpoint","Defender for Identity","Defender for Cloud Apps"],"choices":["SaaS applications","Devices","Email and collaboration","On-premises Active Directory identities"],"ans":[2,1,3,0],"why":"Each Defender XDR service covers one domain, and the portal joins their signals.","miss":false},{"id":"q074","d":4,"topic":"Trust and privacy","q":"An auditor asks for Microsoft's SOC 2 audit report for Azure. Where can you download it?","opts":["Service Trust Portal","Microsoft Entra admin center","Azure Advisor","Microsoft Defender portal"],"ans":[0],"why":"The Service Trust Portal publishes independent audit reports and compliance documents.","kind":"one","miss":false},{"id":"q075","d":4,"topic":"Trust and privacy","q":"Which Microsoft privacy principle says your email and chat content is not used to target ads?","opts":["Transparency","No content-based targeting","Benefits to you","Strong legal protections"],"ans":[1],"why":"No content-based targeting: personal content is not used for advertising.","kind":"one","miss":false},{"id":"q076","d":4,"topic":"Trust and privacy","q":"Which privacy principle is about Microsoft being open about what data it collects and how it is used?","opts":["Security","Transparency","Benefits to you","Control"],"ans":[1],"why":"Transparency is being open about collection and use. Control is about your choices over the data.","kind":"one","miss":false},{"id":"q077","d":4,"topic":"Trust and privacy","q":"On the Service Trust Portal, which feature lets you save documents and get notified when they are updated?","opts":["Secure score","My Library","Compliance Manager","Content explorer"],"ans":[1],"why":"My Library pins documents and can notify you of updates.","kind":"one","miss":false},{"id":"q078","d":4,"topic":"Trust and privacy","q":"Which of these is NOT one of Microsoft's six privacy principles?","opts":["Control","Strong legal protections","Zero standing access","Security"],"ans":[2],"why":"The six are control, transparency, security, strong legal protections, no content-based targeting and benefits to you.","kind":"one","miss":false},{"id":"q079","d":4,"topic":"Trust and privacy","q":"Which TWO can you find on the Service Trust Portal?","opts":["Penetration test and security assessment reports","Independent audit reports for Microsoft cloud services","Your organization's secure score","Your tenant's sign-in logs"],"ans":[0,1],"why":"The portal publishes Microsoft's own compliance evidence. Tenant data lives in your admin portals.","kind":"two","miss":false},{"id":"q080","d":4,"topic":"Trust and privacy","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["The Service Trust Portal shows how Microsoft cloud services meet compliance standards.","Under Microsoft's privacy principles, customer content is used to target advertising.","'Control' means customers have tools and choices to manage their own data."],"ans":[1,0,1],"why":"The portal provides compliance evidence. Content is never used for ad targeting. Control puts the customer in charge.","miss":false},{"id":"q081","d":4,"topic":"Compliance management","q":"You must track your organization's progress toward GDPR requirements with recommended actions. Which tool should you use?","opts":["Service Trust Portal","Compliance Manager","Azure Policy","Microsoft Sentinel"],"ans":[1],"why":"Compliance Manager has prebuilt assessments for regulations, improvement actions and a compliance score.","kind":"one","miss":false},{"id":"q082","d":4,"topic":"Compliance management","q":"What does the compliance score measure?","opts":["The percentage of emails encrypted","The number of blocked sign-ins","Progress in completing improvement actions that reduce compliance risk","How many resources pass Azure Policy"],"ans":[2],"why":"The compliance score reflects completed improvement actions, weighted by risk.","kind":"one","miss":false},{"id":"q083","d":4,"topic":"Compliance management","q":"In Compliance Manager, a control that Microsoft implements on your behalf is called what?","opts":["Your control","Technical control","Shared control","Microsoft-managed control"],"ans":[3],"why":"Microsoft-managed controls are Microsoft's responsibility. Your controls are yours. Shared controls are both.","kind":"one","miss":false},{"id":"q084","d":4,"topic":"Compliance management","q":"Where do you open Compliance Manager?","opts":["Microsoft Purview portal","Azure portal Cost Management","Microsoft Entra admin center","Microsoft Defender portal"],"ans":[0],"why":"Compliance Manager is a Microsoft Purview solution.","kind":"one","miss":false},{"id":"q085","d":4,"topic":"Compliance management","q":"Your compliance score is 85%. What does that tell you?","opts":["You have completed most recommended improvement actions, but it does not prove legal compliance","85% of your users have MFA","Microsoft has audited your tenant","You are certified as compliant with all regulations"],"ans":[0],"why":"The score measures progress on actions. It is not a certification or a guarantee.","kind":"one","miss":false},{"id":"q086","d":4,"topic":"Compliance management","q":"Which TWO does Compliance Manager provide?","opts":["Real-time blocking of phishing emails","Prebuilt assessments for common regulations","Step-by-step guidance on improvement actions","Just-in-time VM access"],"ans":[1,2],"why":"Compliance Manager provides assessments, improvement actions and the compliance score.","kind":"two","miss":false},{"id":"q087","d":4,"topic":"Compliance management","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Compliance Manager includes templates for regulations and standards.","A high compliance score guarantees that the organization is compliant with a regulation.","Shared controls are implemented by both Microsoft and the customer."],"ans":[1,0,1],"why":"Templates create assessments. The score is not a guarantee. Shared controls belong to both.","miss":false},{"id":"q088","d":4,"topic":"Information protection","q":"A document must stay encrypted and show a 'Confidential' watermark even after it is emailed outside the company. What should you apply?","opts":["A sensitivity label","A retention label","An access review","An NSG rule"],"ans":[0],"why":"Sensitivity labels are persistent and can encrypt and mark content. Retention labels control how long content is kept.","kind":"one","miss":false},{"id":"q089","d":4,"topic":"Information protection","q":"You need to see that a user copied a labeled file to a USB drive yesterday. Which tool shows this?","opts":["Compliance Manager","Service Trust Portal","Activity explorer","Content explorer"],"ans":[2],"why":"Activity explorer shows the history of actions on labeled content. Content explorer shows what exists and where.","kind":"one","miss":false},{"id":"q090","d":4,"topic":"Information protection","q":"Users must be warned and blocked when they try to email credit card numbers outside the company. What should you configure?","opts":["A sensitivity label policy","A Conditional Access policy","A data loss prevention policy","A retention policy"],"ans":[2],"why":"DLP detects sensitive information in use and blocks or warns about inappropriate sharing.","kind":"one","miss":false},{"id":"q091","d":4,"topic":"Information protection","q":"All email in every mailbox must be kept for seven years and then deleted. What is the simplest configuration?","opts":["A sensitivity label","A retention policy applied to Exchange mailboxes","An eDiscovery hold","A DLP policy"],"ans":[1],"why":"A retention policy applies the same retention settings across a whole location.","kind":"one","miss":false},{"id":"q092","d":4,"topic":"Information protection","q":"Which classification method recognizes content such as resumes by learning from example documents?","opts":["Sensitive information types","Retention labels","Trainable classifiers","Exact keyword match"],"ans":[2],"why":"Trainable classifiers use AI trained on examples. Sensitive information types match patterns.","kind":"one","miss":false},{"id":"q093","d":4,"topic":"Information protection","q":"Which TWO statements about sensitivity labels are true?","opts":["An item can have only one sensitivity label at a time","Labels are removed when a file is emailed","The label stays with the content when it moves","Labels can only be applied by administrators"],"ans":[0,2],"why":"Labels are persistent and one per item. Users apply them, or they are applied automatically.","kind":"two","miss":false},{"id":"q094","d":4,"topic":"Information protection","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A document can have multiple retention labels applied at the same time.","Content explorer shows where sensitive items are located.","DLP policies can show a policy tip to warn users before they share sensitive data."],"ans":[0,1,1],"why":"One retention label per item. Content explorer shows location and labels. Policy tips educate users at the moment of sharing.","miss":false},{"id":"q095","d":4,"topic":"Information protection","type":"match","kind":"match","q":"Match each need to the Microsoft Purview capability.","rows":["Encrypt and watermark a file","Stop credit card numbers leaving in email","Keep contracts for 10 years","Lock an item so it cannot be deleted"],"choices":["Data loss prevention","Retention label","Sensitivity label","Records management"],"ans":[2,0,1,3],"why":"Labels protect, DLP prevents leaks, retention governs lifetime, records management locks important items.","miss":false},{"id":"q096","d":4,"topic":"Insider risk, eDiscovery, audit","q":"An employee who has resigned is downloading large numbers of confidential files. Which solution is designed to detect this?","opts":["Azure DDoS Protection","eDiscovery","Compliance Manager","Insider Risk Management"],"ans":[3],"why":"Insider Risk Management detects risky activity by insiders such as data theft by departing employees.","kind":"one","miss":false},{"id":"q097","d":4,"topic":"Insider risk, eDiscovery, audit","q":"Legal needs all email and Teams messages about a lawsuit preserved and exported. Which solution should you use?","opts":["Insider Risk Management","Audit (Standard)","eDiscovery","Data loss prevention"],"ans":[2],"why":"eDiscovery cases let you hold, search and export content as legal evidence.","kind":"one","miss":false},{"id":"q098","d":4,"topic":"Insider risk, eDiscovery, audit","q":"You need to find out which admin changed a mailbox permission last week. Where do you look?","opts":["Service Trust Portal","Compliance score","Content explorer","Microsoft Purview Audit"],"ans":[3],"why":"The unified audit log records user and admin activities.","kind":"one","miss":false},{"id":"q099","d":4,"topic":"Insider risk, eDiscovery, audit","q":"How long does Audit (Standard) keep audit records by default?","opts":["1 year","30 days","10 years","180 days"],"ans":[3],"why":"Audit (Standard) retains records for 180 days. Longer retention needs Audit (Premium).","kind":"one","miss":false},{"id":"q100","d":4,"topic":"Insider risk, eDiscovery, audit","q":"In eDiscovery, what does placing a hold do?","opts":["Encrypts the content with a sensitivity label","Deletes the content after export","Blocks the user from signing in","Preserves content so it cannot be permanently deleted during the case"],"ans":[3],"why":"A hold preserves content relevant to a case.","kind":"one","miss":false},{"id":"q101","d":4,"topic":"Insider risk, eDiscovery, audit","q":"Which TWO are Audit (Premium) capabilities?","opts":["Blocking phishing links","Retention of audit records for up to 10 years with an add-on","Audit log retention policies","Creating access packages"],"ans":[1,2],"why":"Audit (Premium) adds retention policies, longer retention and intelligent insights.","kind":"two","miss":false},{"id":"q102","d":4,"topic":"Insider risk, eDiscovery, audit","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Insider Risk Management pseudonymizes usernames by default.","Audit (Standard) must be manually purchased and turned on before any activity is recorded.","eDiscovery can search content in Exchange mailboxes and Microsoft Teams."],"ans":[1,0,1],"why":"Pseudonymization protects privacy. Audit (Standard) is on by default. eDiscovery searches Microsoft 365 locations.","miss":false}],"sections":[{"id":"s1","d":1,"title":"Security and compliance concepts","label":"High","note":"Small domain, but these ideas show up inside questions in every other domain. Two 3D models below.","why":"","obj":["Shared responsibility model","defense-in-depth","Zero Trust model","encryption and hashing","Governance, Risk, and Compliance (GRC) concepts"],"cold":["**Shared responsibility:** you always own **data, devices, accounts and identities**. Microsoft always owns the **physical datacenter, network and hosts**. The middle varies by IaaS, PaaS, SaaS.","**Defense in depth:** seven layers. Physical, identity and access, perimeter, network, compute, application, data.","**CIA triad:** confidentiality, integrity, availability.","**Zero Trust:** verify explicitly, use least privilege access, assume breach. Six pillars: identities, devices, applications, data, infrastructure, networks.","**Encryption:** symmetric = one key, asymmetric = public/private pair. At rest, in transit, in use.","**Hashing:** one-way, fixed length, same input gives same output. Used for passwords, with a salt.","**GRC:** governance (rules), risk management (identify and respond), compliance (follow laws). **Residency** = where data is stored. **Sovereignty** = whose laws apply."],"traps":["Hashing is not encryption. It cannot be reversed.","'Trust the internal network' is never a Zero Trust answer.","Perimeter (DDoS, edge firewall) vs network (segmentation inside)."],"hooks":["Never trust, always verify.","Know, Have, Are is MFA. Verify, Least, Assume is Zero Trust."],"topics":["Security concepts"],"qtopics":["Security concepts"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-security-concepts-methodologies/","modTitle":"Describe security and compliance concepts","units":[],"models":["shared","did","zt"]},{"id":"s2","d":1,"title":"Identity concepts","label":"Medium","note":"Authentication vs authorization is the most common pair on the exam.","why":"","obj":["Identity as the primary security perimeter","authentication","authorization","identity providers","directory services and Active Directory","federation"],"cold":["**Identity is the new perimeter** because apps, devices and people are outside the corporate network.","**Four pillars:** administration, authentication, authorization, auditing.","**AuthN** = who are you. **AuthZ** = what may you do.","**Identity provider:** issues security tokens that apps trust. Enables **single sign-on**.","**AD DS** = on-premises directory. **Microsoft Entra ID** = cloud identity provider.","**Federation:** trust between identity providers of different organizations. Not always two-way."],"traps":["Authentication always comes before authorization.","AD DS is not Entra ID."],"hooks":["AuthN = who. AuthZ = what."],"topics":["Identity concepts"],"qtopics":["Identity concepts"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-identity-principles-concepts/","modTitle":"Describe identity concepts","units":[]},{"id":"s3","d":2,"title":"Microsoft Entra ID and identity types","label":"High","note":"Know each identity type and the three hybrid sign-in methods.","why":"","obj":["Microsoft Entra ID","types of identities, including workload identities","hybrid identity"],"cold":["**Microsoft Entra ID:** cloud identity and access management. Every Microsoft 365 and Azure tenant has one.","**Identity types:** human (workforce, external), workload (apps, service principals, managed identities), device, and agent identities for AI.","**Managed identity:** Azure manages the credentials. System-assigned = one resource. User-assigned = shared, standalone.","**Devices:** registered (personal), joined (company, cloud), hybrid joined (company, on-premises AD plus Entra).","**External ID B2B:** guests sign in with their own identity.","**Hybrid identity:** Entra Connect Sync or Cloud Sync. Sign-in by password hash sync, pass-through authentication, or federation."],"traps":["Registered = personal device. Joined = company device.","Password hash sync still works if on-premises is down. Pass-through does not.","Guest users are human identities, not workload identities."],"hooks":["No secrets in code: managed identity."],"topics":["Entra ID and identities"],"qtopics":["Entra ID and identities"],"mod":"https://learn.microsoft.com/en-us/training/modules/explore-basic-services-identity-types/","modTitle":"Describe the function and identity types of Microsoft Entra ID","units":[]},{"id":"s4","d":2,"title":"Authentication in Microsoft Entra ID","label":"High","note":"MFA factors and passwordless methods are near-certain questions.","why":"","obj":["Authentication methods","multifactor authentication (MFA)","password protection and management capabilities"],"cold":["**MFA:** two or more of know, have, are.","**Passwordless:** Windows Hello for Business, Microsoft Authenticator, passkeys (FIDO2).","**Security defaults:** free baseline. MFA registration for all, MFA for admins, legacy authentication blocked.","**SSPR:** users reset their own passwords. Fewer help desk calls.","**Password protection:** global banned list (Microsoft, automatic) and custom banned list (your terms). Works for on-premises AD too."],"traps":["Password plus PIN is not MFA: both are 'know'.","Security questions are for SSPR only, not for sign-in MFA.","A Windows Hello PIN never leaves the device."],"hooks":["Know, Have, Are."],"topics":["Authentication"],"qtopics":["Authentication"],"mod":"https://learn.microsoft.com/en-us/training/modules/explore-authentication-capabilities/","modTitle":"Describe the authentication capabilities of Microsoft Entra ID","units":[]},{"id":"s5","d":2,"title":"Access management in Microsoft Entra","label":"High","note":"Conditional Access: signal, decision, enforcement.","why":"","obj":["Microsoft Entra Conditional Access","Microsoft Entra roles and role-based access control (RBAC)"],"cold":["**Conditional Access:** if-then policies. **Signals** in (user, location, device, app, risk), **decision** (block or grant with requirements), **enforcement**.","**Entra roles** manage Entra resources (users, groups, apps). **Azure roles** manage Azure resources (VMs, storage).","**Built-in** roles are ready-made. **Custom** roles need a premium license.","**Least privilege:** the smallest role that does the job.","**Global Secure Access:** Entra Internet Access and Entra Private Access (Security Service Edge)."],"traps":["Global Administrator is an Entra role. Owner is an Azure role.","Security defaults and Conditional Access are not used together."],"hooks":["Conditional Access = if this, then that."],"topics":["Access management"],"qtopics":["Access management"],"mod":"https://learn.microsoft.com/en-us/training/modules/explore-access-management-capabilities/","modTitle":"Describe access management capabilities of Microsoft Entra","units":[],"models":["ca","hier"]},{"id":"s6","d":2,"title":"Identity protection and governance","label":"High","note":"Four tools that get mixed up: ID Governance, access reviews, PIM, ID Protection.","why":"","obj":["Microsoft Entra ID Governance","access reviews","Microsoft Entra Privileged Identity Management","Microsoft Entra ID Protection"],"cold":["**ID Governance:** right people, right access, right resources, right time. Entitlement management uses **access packages**.","**Access reviews:** regularly confirm who still needs access. Remove what is not confirmed.","**PIM:** just-in-time, time-bound, approval-based activation of privileged roles.","**ID Protection:** detects **user risk** (identity compromised) and **sign-in risk** (this sign-in is suspicious). Remediates with risk-based Conditional Access."],"traps":["Leaked credentials = user risk. Anonymous IP or atypical travel = sign-in risk.","PIM activates roles. Access reviews recertify them."],"hooks":["PIM = admin only when needed."],"topics":["Identity governance"],"qtopics":["Identity governance"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-identity-protection-governance-capabilities/","modTitle":"Describe the identity protection and governance capabilities of Microsoft Entra","units":[]},{"id":"s7","d":3,"title":"Core infrastructure security in Azure","label":"High","note":"Overlaps with AZ-900 Domain 2. Know which service does which job.","why":"","obj":["Azure DDoS Protection","Azure Firewall","Web Application Firewall (WAF)","network segmentation with Azure virtual networks","network security groups (NSGs)","Azure Bastion","Azure Key Vault"],"cold":["**DDoS Protection:** keeps apps available during traffic floods. Network Protection (per VNet) or IP Protection (per public IP).","**Azure Firewall:** managed, stateful, central firewall. Filters by IP, port and FQDN.","**WAF:** protects web apps from SQL injection and cross-site scripting. On Application Gateway or Front Door.","**VNets** isolate. **Subnets** segment inside a VNet.","**NSG:** allow and deny rules by priority on a subnet or network interface.","**Bastion:** RDP and SSH from the portal over TLS. No public IP on the VM.","**Key Vault:** secrets, keys, certificates."],"traps":["NSG cannot filter by domain name. Azure Firewall can.","WAF is for web apps (layer 7). Azure Firewall is for network traffic.","Just-in-time VM access is Defender for Cloud, not Bastion."],"hooks":["Bastion = the safe gate to your VMs."],"topics":["Azure infrastructure security"],"qtopics":["Azure infrastructure security"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-basic-security-capabilities-azure/","modTitle":"Describe core infrastructure security services in Azure","units":[],"models":["vnet"]},{"id":"s8","d":3,"title":"Microsoft Defender for Cloud","label":"High","note":"Posture (CSPM) vs protection (workload plans).","why":"","obj":["Microsoft Defender for Cloud","Cloud Security Posture Management (CSPM)","security policies, standards, and recommendations","enhanced security features provided by cloud workload protection"],"cold":["**Defender for Cloud:** CNAPP covering Azure, AWS, GCP and on-premises.","**CSPM:** finds misconfigurations, gives recommendations. **Foundational CSPM is free.** Defender CSPM is paid.","**Secure score:** higher is better.","**Microsoft cloud security benchmark** is the default standard. Standards are built on Azure Policy.","**Workload protection:** paid Defender plans (Servers, Storage, Containers, Databases and more) that raise security alerts.","**JIT VM access:** opens management ports only on request, for a limited time."],"traps":["Secure score is Defender. Compliance score is Purview.","Defender for Cloud is not Defender for Cloud Apps."],"hooks":["Posture = how well set up. Protection = catching attacks."],"topics":["Defender for Cloud"],"qtopics":["Defender for Cloud"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/","modTitle":"Describe the security management capabilities in Azure","units":[]},{"id":"s9","d":3,"title":"Microsoft Sentinel","label":"Medium","note":"Know SIEM vs SOAR and which Sentinel feature does what.","why":"","obj":["security information and event management (SIEM) and security orchestration automated response (SOAR)","threat detection and mitigation capabilities in Microsoft Sentinel"],"cold":["**SIEM** collects and correlates. **SOAR** automates response. **Sentinel is both**, cloud-native.","**Collect** (data connectors), **Detect** (analytics rules), **Investigate** (incidents, hunting), **Respond** (playbooks).","**Playbooks** are built on Azure Logic Apps.","**Workbooks** are dashboards.","Sentinel now lives in the **Microsoft Defender portal**."],"traps":["Workbook shows. Playbook acts.","Sentinel is not a CASB and not an endpoint tool."],"hooks":["Collect, Detect, Investigate, Respond."],"topics":["Microsoft Sentinel"],"qtopics":["Microsoft Sentinel"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-security-capabilities-of-azure-sentinel/","modTitle":"Describe security capabilities of Microsoft Sentinel","units":[]},{"id":"s10","d":3,"title":"Threat protection with Microsoft Defender XDR","label":"High","note":"The largest group in the largest domain. One job per Defender service.","why":"","obj":["Microsoft Defender XDR services","Microsoft Defender for Office 365","Microsoft Defender for Endpoint","Microsoft Defender for Cloud Apps","Microsoft Defender for Identity","Microsoft Defender Vulnerability Management","Microsoft Threat Intelligence","Microsoft Defender portal"],"cold":["**Defender XDR:** joins signals across endpoints, identities, email and apps into one incident.","**Defender for Office 365:** email and collaboration. Phishing, Safe Links, Safe Attachments.","**Defender for Endpoint:** devices. EDR.","**Defender for Cloud Apps:** CASB. Shadow IT and SaaS control.","**Defender for Identity:** on-premises Active Directory signals.","**Defender Vulnerability Management:** find and prioritize weaknesses.","**Defender Threat Intelligence:** who the attackers are and how they work.","**Defender portal:** security.microsoft.com."],"traps":["Defender for Identity = on-premises AD. Entra ID Protection = cloud identities.","Defender for Cloud Apps (SaaS) is not Defender for Cloud (Azure workloads)."],"hooks":["Office = email. Endpoint = device. Identity = AD. Cloud Apps = SaaS."],"topics":["Defender XDR"],"qtopics":["Defender XDR"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-threat-protection-with-microsoft-365-defender/","modTitle":"Describe threat protection with Microsoft Defender XDR","units":[],"models":["xdr"]},{"id":"s11","d":4,"title":"Service Trust Portal and privacy principles","label":"Medium","note":"Short stop. Memorize the six principles.","why":"","obj":["Service Trust Portal offerings","privacy principles of Microsoft"],"cold":["**Service Trust Portal:** Microsoft's audit reports, certifications and compliance guides. My Library saves documents.","**Six privacy principles:** control, transparency, security, strong legal protections, no content-based targeting, benefits to you."],"traps":["The Service Trust Portal shows Microsoft's compliance, not yours.","Transparency = Microsoft tells you. Control = you decide."],"hooks":["Microsoft runs on trust."],"topics":["Trust and privacy"],"qtopics":["Trust and privacy"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-compliance-management-capabilities-microsoft/","modTitle":"Describe Microsoft's Service Trust portal and privacy principles","units":[]},{"id":"s12","d":4,"title":"Compliance management in Microsoft Purview","label":"Medium","note":"Compliance Manager and its score.","why":"","obj":["Microsoft Purview portal","Compliance Manager","uses and benefits of compliance score"],"cold":["**Purview portal:** purview.microsoft.com.","**Compliance Manager:** assessments from regulation templates, improvement actions, compliance score.","**Controls:** Microsoft-managed, your controls, shared.","**Compliance score:** risk-based progress on improvement actions. Not a guarantee of compliance."],"traps":["Compliance score is not secure score.","A high score is not a certificate."],"hooks":["Compliance Manager = your to-do list for regulations."],"topics":["Compliance management"],"qtopics":["Compliance management"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/","modTitle":"Describe the data compliance solutions of Microsoft Purview","units":[]},{"id":"s13","d":4,"title":"Information protection and data lifecycle","label":"High","note":"Sensitivity labels, DLP and retention are asked from many angles.","why":"","obj":["data classification capabilities","Content explorer and Activity explorer","sensitivity labels and sensitivity label policies","data loss prevention (DLP)","records management","retention policies, retention labels, and retention label policies"],"cold":["**Classification:** sensitive information types (patterns) and trainable classifiers (learned from examples).","**Content explorer** = what exists and where. **Activity explorer** = what was done to it.","**Sensitivity labels:** persistent, can encrypt and mark content. One per item. Published with label policies.","**DLP:** stops sensitive data leaving through email, Teams, SharePoint, OneDrive and devices.","**Retention policy** = whole location. **Retention label** = one item. One retention label per item.","**Records management:** lock important items and review before disposal."],"traps":["Sensitivity label protects. Retention label keeps or deletes.","Content explorer vs Activity explorer."],"hooks":["Know, Protect, Prevent, Govern."],"topics":["Information protection"],"qtopics":["Information protection"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-purview-data-solutions/","modTitle":"Describe the data security solutions of Microsoft Purview","units":[]},{"id":"s14","d":4,"title":"Insider risk, eDiscovery and audit","label":"Medium","note":"Three tools for investigations.","why":"","obj":["insider risk management","eDiscovery solutions in Microsoft Purview","audit solutions in Microsoft Purview"],"cold":["**Insider Risk Management:** risky activity by insiders. Usernames pseudonymized by default.","**eDiscovery:** find, hold and export content as legal evidence.","**Audit (Standard):** on by default, 180 days.","**Audit (Premium):** one year by default for core services, up to 10 years with an add-on, retention policies."],"traps":["eDiscovery hold is for a legal case. Retention policy is general.","Audit answers 'who did what, when'."],"hooks":["Insider = people. eDiscovery = evidence. Audit = activity."],"topics":["Insider risk, eDiscovery, audit"],"qtopics":["Insider risk, eDiscovery, audit"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-purview-risk-compliance-governance/","modTitle":"Describe the data compliance solutions of Microsoft Purview","units":[]}],"duels":[{"id":"d001","d":1,"a":"Encryption","b":"Hashing","clue":"One-way. Cannot be reversed to get the original.","ans":1,"why":"Hashing is one-way and fixed-length. Encryption can be reversed with the right key.","miss":false},{"id":"d002","d":1,"a":"Symmetric encryption","b":"Asymmetric encryption","clue":"Uses a public and private key pair.","ans":1,"why":"Asymmetric uses a key pair. Symmetric uses one shared key.","miss":false},{"id":"d003","d":1,"a":"Data residency","b":"Data sovereignty","clue":"Data falls under the laws of the country where it is held.","ans":1,"why":"Sovereignty is about which laws apply. Residency is about where data may physically be stored.","miss":false},{"id":"d004","d":1,"a":"Verify explicitly","b":"Assume breach","clue":"Segment access and monitor so an intruder cannot spread.","ans":1,"why":"Assume breach minimizes blast radius. Verify explicitly checks every request on all available signals.","miss":false},{"id":"d005","d":1,"a":"Authentication","b":"Authorization","clue":"Decides what you are allowed to do.","ans":1,"why":"Authorization grants access levels. Authentication proves identity.","miss":false},{"id":"d006","d":1,"a":"Active Directory Domain Services","b":"Microsoft Entra ID","clue":"Cloud identity provider built for modern authentication.","ans":1,"why":"Entra ID is cloud-based. AD DS is the on-premises directory.","miss":false},{"id":"d007","d":1,"a":"Single sign-on","b":"Federation","clue":"A trust between identity providers of different organizations.","ans":1,"why":"Federation is the trust. SSO is the one-sign-in experience it can enable.","miss":false},{"id":"d008","d":2,"a":"System-assigned managed identity","b":"User-assigned managed identity","clue":"Deleted automatically when its one resource is deleted.","ans":0,"why":"System-assigned shares the lifecycle of one resource. User-assigned is standalone.","miss":false},{"id":"d009","d":2,"a":"Microsoft Entra registered","b":"Microsoft Entra joined","clue":"Organization-owned device signed in with a work account.","ans":1,"why":"Joined is for organization-owned devices. Registered is for personal devices.","miss":false},{"id":"d010","d":2,"a":"Password hash synchronization","b":"Pass-through authentication","clue":"Password is validated by an on-premises agent. Nothing stored in the cloud.","ans":1,"why":"Pass-through validates on-premises. Password hash sync stores a hash of the hash in Entra.","miss":false},{"id":"d011","d":2,"a":"Global banned password list","b":"Custom banned password list","clue":"You add your own company and product names.","ans":1,"why":"Custom holds your terms. Global is maintained by Microsoft.","miss":false},{"id":"d012","d":2,"a":"Security defaults","b":"Conditional Access","clue":"Free baseline that turns on MFA for everyone with no policy design.","ans":0,"why":"Security defaults are preset and free. Conditional Access gives granular if-then policies and needs a premium license.","miss":false},{"id":"d013","d":2,"a":"Something you have","b":"Something you are","clue":"A fingerprint or face scan.","ans":1,"why":"Biometrics are something you are. Phones and keys are something you have.","miss":false},{"id":"d014","d":2,"a":"Microsoft Entra roles","b":"Azure roles","clue":"Owner, Contributor and Reader on a resource group.","ans":1,"why":"Those are Azure RBAC roles for Azure resources. Entra roles manage directory objects.","miss":false},{"id":"d015","d":2,"a":"Signal","b":"Decision","clue":"Block access, or grant access with MFA.","ans":1,"why":"Block and grant are decisions. Signals are the inputs such as user, location and risk.","miss":false},{"id":"d016","d":2,"a":"Microsoft Entra Internet Access","b":"Microsoft Entra Private Access","clue":"Reach internal company apps without a traditional VPN.","ans":1,"why":"Private Access is for private apps. Internet Access secures internet and SaaS traffic.","miss":false},{"id":"d017","d":2,"a":"Privileged Identity Management","b":"Access reviews","clue":"Activate an admin role for two hours with approval.","ans":0,"why":"PIM handles just-in-time activation. Access reviews recertify existing access.","miss":false},{"id":"d018","d":2,"a":"User risk","b":"Sign-in risk","clue":"Atypical travel detected on one sign-in.","ans":1,"why":"Atypical travel relates to a specific sign-in. User risk is about the identity being compromised.","miss":false},{"id":"d019","d":2,"a":"Microsoft Entra ID Protection","b":"Microsoft Entra ID Governance","clue":"Detects leaked credentials and risky sign-ins.","ans":0,"why":"ID Protection detects and remediates risk. ID Governance manages who has access and for how long.","miss":false},{"id":"d020","d":3,"a":"Azure Firewall","b":"Network security group","clue":"Managed stateful firewall, central, can filter by FQDN.","ans":0,"why":"Azure Firewall is the central, fully featured firewall. NSGs are basic allow and deny rules on subnets or NICs.","miss":false},{"id":"d021","d":3,"a":"Azure Firewall","b":"Web Application Firewall","clue":"Stops SQL injection and cross-site scripting.","ans":1,"why":"WAF protects web apps at layer 7. Azure Firewall filters network traffic generally.","miss":false},{"id":"d022","d":3,"a":"Azure Bastion","b":"Azure Key Vault","clue":"Secure RDP and SSH from the portal.","ans":0,"why":"Bastion is remote access. Key Vault stores secrets, keys and certificates.","miss":false},{"id":"d023","d":3,"a":"DDoS Network Protection","b":"DDoS IP Protection","clue":"Billed per protected public IP address.","ans":1,"why":"IP Protection is per public IP. Network Protection covers a virtual network.","miss":false},{"id":"d024","d":3,"a":"CSPM","b":"Cloud workload protection","clue":"Finds misconfigurations and gives hardening recommendations.","ans":0,"why":"CSPM is posture. Workload protection detects active threats on specific workloads.","miss":false},{"id":"d025","d":3,"a":"Secure score","b":"Compliance score","clue":"Shown in Microsoft Defender for Cloud.","ans":0,"why":"Secure score is Defender for Cloud. Compliance score is Purview Compliance Manager.","miss":false},{"id":"d026","d":3,"a":"Foundational CSPM","b":"Defender CSPM","clue":"Paid. Adds attack path analysis.","ans":1,"why":"Defender CSPM is the paid plan with attack paths and agentless scanning.","miss":false},{"id":"d027","d":3,"a":"SIEM","b":"SOAR","clue":"Automates response workflows.","ans":1,"why":"SOAR automates the response. SIEM collects and correlates logs.","miss":false},{"id":"d028","d":3,"a":"Workbook","b":"Playbook","clue":"Runs an automated response built on Logic Apps.","ans":1,"why":"Playbooks act. Workbooks display data.","miss":false},{"id":"d029","d":3,"a":"Microsoft Sentinel","b":"Microsoft Defender for Cloud","clue":"Cloud-native SIEM and SOAR.","ans":0,"why":"Sentinel is the SIEM/SOAR. Defender for Cloud is posture management and workload protection.","miss":false},{"id":"d030","d":3,"a":"Microsoft Defender for Cloud","b":"Microsoft Defender for Cloud Apps","clue":"Cloud access security broker for SaaS apps.","ans":1,"why":"Cloud Apps is the CASB. Defender for Cloud is CSPM and workload protection for Azure, AWS and GCP.","miss":false},{"id":"d031","d":3,"a":"Microsoft Defender for Identity","b":"Microsoft Entra ID Protection","clue":"Monitors on-premises Active Directory signals.","ans":0,"why":"Defender for Identity watches on-premises AD. ID Protection covers Entra cloud identities.","miss":false},{"id":"d032","d":3,"a":"Microsoft Defender for Endpoint","b":"Microsoft Defender for Office 365","clue":"Safe Links and Safe Attachments.","ans":1,"why":"Those are Defender for Office 365 features for email and collaboration.","miss":false},{"id":"d033","d":3,"a":"Microsoft Defender Vulnerability Management","b":"Microsoft Defender Threat Intelligence","clue":"Threat actor profiles and indicators of compromise.","ans":1,"why":"Threat Intelligence describes attackers. Vulnerability Management finds weaknesses in your own assets.","miss":false},{"id":"d034","d":4,"a":"Service Trust Portal","b":"Microsoft Purview portal","clue":"Download Microsoft's ISO and SOC audit reports.","ans":0,"why":"The Service Trust Portal holds Microsoft's audit reports. The Purview portal is where you manage your own compliance.","miss":false},{"id":"d035","d":4,"a":"Control","b":"Transparency","clue":"Microsoft is open about what it collects and why.","ans":1,"why":"Transparency is openness. Control is your ability to manage the data.","miss":false},{"id":"d036","d":4,"a":"Security","b":"No content-based targeting","clue":"Your files and email are not used for ads.","ans":1,"why":"That is no content-based targeting. Security is protecting data with strong safeguards and encryption.","miss":false},{"id":"d037","d":4,"a":"Compliance score","b":"Secure score","clue":"Progress toward meeting regulations such as GDPR.","ans":0,"why":"Compliance score is about regulations. Secure score is about security posture.","miss":false},{"id":"d038","d":4,"a":"Microsoft-managed control","b":"Your control","clue":"You implement it yourself.","ans":1,"why":"Your controls are customer-managed. Microsoft-managed are done by Microsoft.","miss":false},{"id":"d039","d":4,"a":"Compliance Manager","b":"Service Trust Portal","clue":"Tracks your own improvement actions.","ans":0,"why":"Compliance Manager manages your compliance. The Service Trust Portal shows Microsoft's evidence.","miss":false},{"id":"d040","d":4,"a":"Sensitivity label","b":"Retention label","clue":"Controls how long content is kept before deletion.","ans":1,"why":"Retention labels govern lifetime. Sensitivity labels classify and protect.","miss":false},{"id":"d041","d":4,"a":"Content explorer","b":"Activity explorer","clue":"History of what users did with labeled files.","ans":1,"why":"Activity explorer is the history. Content explorer is the current inventory.","miss":false},{"id":"d042","d":4,"a":"Retention policy","b":"Retention label","clue":"Applies at item level, such as one document.","ans":1,"why":"Labels are per item. Policies cover a whole location.","miss":false},{"id":"d043","d":4,"a":"Sensitive information types","b":"Trainable classifiers","clue":"Pattern matching, such as a credit card number format.","ans":0,"why":"Sensitive information types use patterns. Trainable classifiers learn from examples.","miss":false},{"id":"d044","d":4,"a":"Audit (Standard)","b":"Audit (Premium)","clue":"Keeps records up to 10 years with an add-on license.","ans":1,"why":"Premium extends retention. Standard is 180 days.","miss":false},{"id":"d045","d":4,"a":"eDiscovery","b":"Insider Risk Management","clue":"Find and export evidence for a legal case.","ans":0,"why":"eDiscovery is for legal evidence. Insider Risk Management detects risky user activity.","miss":false},{"id":"d046","d":4,"a":"eDiscovery hold","b":"Retention policy","clue":"Preserves content tied to a specific legal case.","ans":0,"why":"Holds are case-based. Retention policies apply broadly for compliance.","miss":false}]},"az104":{"meta":{"id":"az104","code":"AZ-104","name":"Microsoft Azure Administrator","quest":"AZ-104 Quest","domains":{"1":"Manage Azure identities and governance","2":"Implement and manage storage","3":"Deploy and manage Azure compute resources","4":"Implement and manage virtual networking","5":"Monitor and maintain Azure resources"},"weights":{"1":"20-25%","2":"15-20%","3":"20-25%","4":"15-20%","5":"10-15%"},"bosses":{"1":["The Permission Hydra",""],"2":["The Blob Leviathan",""],"3":["The Runaway Fleet",""],"4":["The Routing Minotaur",""],"5":["The Silent Outage",""]},"mix":[12,9,12,9,8],"quickMix":[5,4,5,4,2],"fullMins":100,"quickMins":40,"hardMins":100,"passPct":70,"bookPct":80,"msUrl":"https://learn.microsoft.com/en-us/credentials/certifications/azure-administrator/practice/assessment?assessment-type=practice&assessmentId=21&practice-assessment-type=certification","studyGuide":"https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104","taunts":{"1":["\"Everyone gets Owner.\"","\"Tags inherit, right?\"","\"Who needs a lock?\"","\"Policy? Just audit it.\""],"2":["\"Share the account key.\"","\"LRS survives anything.\"","\"Read from Archive now!\"","\"SAS that never expires.\""],"3":["\"Save it on the D: drive.\"","\"One VM, no zones.\"","\"Deploy in Complete mode.\"","\"Slots? Just push to prod.\""],"4":["\"Peering chains forever.\"","\"Priority 4096 goes first.\"","\"RDP open to the world.\"","\"CNAME at the apex.\""],"5":["\"No one reads the alerts.\"","\"Backups? Next quarter.\"","\"Fail over without a test.\"","\"Logs collect themselves.\""]}},"cards":[{"id":"c001","d":1,"topic":"Entra users and groups","front":"Security group vs Microsoft 365 group?","back":"**Security group:** grants access to resources (Azure roles, apps, licenses). Members can be users, devices, service principals and other groups. **Microsoft 365 group:** collaboration (shared mailbox, calendar, SharePoint, Teams). Members are users only.","miss":false},{"id":"c002","d":1,"topic":"Entra users and groups","front":"Assigned vs dynamic membership?","back":"**Assigned:** an admin adds and removes members by hand. **Dynamic user / dynamic device:** a rule on attributes (for example `user.department -eq \"Sales\"`) adds and removes members automatically. Dynamic groups need **Microsoft Entra ID P1**, and you **cannot add members by hand**.","miss":false},{"id":"c003","d":1,"topic":"Entra users and groups","front":"How do you create many users at once?","back":"**Bulk create** in the Entra admin center: download the CSV template, fill it, upload it. PowerShell (Microsoft Graph) and the Graph API also work.","miss":false},{"id":"c004","d":1,"topic":"Entra users and groups","front":"What must be set on a user before you assign a license?","back":"The **usage location** (country). Some services are not available in every country, so a license cannot be assigned without it.","miss":false},{"id":"c005","d":1,"topic":"Entra users and groups","front":"Group-based licensing: what is it and what does it need?","back":"Assign a license to a **group** and every member gets it; members who leave lose it. Needs a paid Entra plan such as **P1** (or Microsoft 365 E3/Business Premium). Errors show per user, for example when no licenses are left.","miss":false},{"id":"c006","d":1,"topic":"Entra users and groups","front":"How do external (B2B) users work?","back":"You **invite** them with their own email. They sign in with **their own** identity (work account, Microsoft account, Google, one-time passcode). They appear as **UserType: Guest** and get access you grant, like any other user.","miss":false},{"id":"c007","d":1,"topic":"Entra users and groups","front":"SSPR: what license does password reset need, and who can configure it?","back":"Self-service password **reset** needs **Microsoft Entra ID P1** (password *change* is free for cloud users). Writeback to on-premises needs P1/P2. Configure it as an **Authentication Policy Administrator**, scoped to **None, Selected (one group), or All**.","miss":false},{"id":"c008","d":1,"topic":"Entra users and groups","front":"SSPR for administrators?","back":"Admin accounts are **always enabled** for SSPR and **always need two methods** (a two-gate policy). You cannot turn that off for admins with the SSPR scope setting.","miss":false},{"id":"c009","d":1,"topic":"Entra users and groups","front":"What happens to a deleted user?","back":"It goes to **Deleted users** and can be **restored for 30 days** with its group memberships and licenses. After 30 days it is permanently deleted.","miss":false},{"id":"c010","d":1,"topic":"Azure RBAC","front":"The four fundamental Azure built-in roles?","back":"**Owner:** full access, including assigning roles. **Contributor:** full access to manage resources, **cannot assign roles**. **Reader:** view only. **User Access Administrator:** manage user access (role assignments) only.","miss":false},{"id":"c011","d":1,"topic":"Azure RBAC","front":"Role Based Access Control Administrator?","back":"Can **assign roles** (and can be limited with conditions to certain roles or principals), but cannot manage the resources themselves. A least-privilege alternative to Owner for delegating access.","miss":false},{"id":"c012","d":1,"topic":"Azure RBAC","front":"The four Azure RBAC scopes, top to bottom?","back":"**Management group → Subscription → Resource group → Resource.** A role assigned at a scope is **inherited** by everything below it.","miss":false},{"id":"c013","d":1,"topic":"Azure RBAC","front":"What makes up a role assignment?","back":"**Security principal** (user, group, service principal, managed identity) + **role definition** (what actions) + **scope** (where).","miss":false},{"id":"c014","d":1,"topic":"Azure RBAC","front":"How do multiple role assignments combine?","back":"**Additively.** Effective permissions are the union of all assignments. Reader at the subscription plus Contributor on one resource group = Contributor on that group, Reader everywhere else. **Deny assignments** win over allows.","miss":false},{"id":"c015","d":1,"topic":"Azure RBAC","front":"Actions vs DataActions in a role definition?","back":"**Actions** = management plane (create, delete, configure). **DataActions** = data plane (read blob contents, send queue messages). Owner does **not** automatically read blob data through Entra auth; you need roles such as **Storage Blob Data Reader**.","miss":false},{"id":"c016","d":1,"topic":"Azure RBAC","front":"Azure roles vs Microsoft Entra roles?","back":"**Azure roles** control Azure resources (VMs, storage, networks) at management group to resource scope. **Entra roles** control directory objects (users, groups, apps), for example Global Administrator or User Administrator. A Global Administrator can **elevate** to User Access Administrator at root scope.","miss":false},{"id":"c017","d":1,"topic":"Azure RBAC","front":"Virtual Machine Contributor can do what?","back":"Manage **virtual machines**, but **not** sign in to them and **not** manage the virtual network or storage account they connect to.","miss":false},{"id":"c018","d":1,"topic":"Azure RBAC","front":"How do you check what someone can do?","back":"Resource → **Access control (IAM)** → **Check access**, or the **Role assignments** tab. It shows direct and **inherited** assignments and the scope each came from.","miss":false},{"id":"c019","d":1,"topic":"Governance","front":"Azure Policy vs RBAC?","back":"**RBAC:** *who* can do *what* actions. **Policy:** *what* resources may look like, whoever creates them (allowed regions, required tags, allowed SKUs). Policy can deny even an Owner.","miss":false},{"id":"c020","d":1,"topic":"Governance","front":"Common Azure Policy effects?","back":"**Deny** (block the request), **Audit** (log non-compliance), **Append** / **Modify** (add or change properties such as tags), **AuditIfNotExists** / **DeployIfNotExists** (check or deploy a related resource), **Disabled**.","miss":false},{"id":"c021","d":1,"topic":"Governance","front":"Policy definition vs initiative vs assignment?","back":"**Definition:** one rule. **Initiative:** a group of definitions managed together. **Assignment:** applies a definition or initiative to a scope, with optional **exclusions** and parameters.","miss":false},{"id":"c022","d":1,"topic":"Governance","front":"What happens to existing resources when you assign a Deny policy?","back":"They are **not deleted or changed**. They show as **non-compliant**. Fix them with a **remediation task** (for Modify and DeployIfNotExists, which use a **managed identity**) or by hand.","miss":false},{"id":"c023","d":1,"topic":"Governance","front":"The two resource lock types?","back":"**CanNotDelete (Delete):** can read and modify, cannot delete. **ReadOnly:** can read, cannot modify or delete. Locks are **inherited** by child resources and apply to **everyone, including Owners**.","miss":false},{"id":"c024","d":1,"topic":"Governance","front":"Who can create or remove locks?","back":"Anyone with `Microsoft.Authorization/locks/*`: **Owner** and **User Access Administrator** among built-in roles. Contributor cannot.","miss":false},{"id":"c025","d":1,"topic":"Governance","front":"Are tags inherited?","back":"**No.** A tag on a resource group or subscription is **not** applied to the resources in it. Use Azure Policy (for example *Inherit a tag from the resource group*, a **Modify** policy) to copy tags. Up to **50 tags** per resource.","miss":false},{"id":"c026","d":1,"topic":"Governance","front":"Key resource group rules?","back":"A resource is in **exactly one** resource group. The group has a location for its **metadata**, but its resources can be in **any region**. Deleting a group **deletes everything in it**. Resource groups cannot be nested.","miss":false},{"id":"c027","d":1,"topic":"Governance","front":"Management groups: limits?","back":"Organize subscriptions for policy and RBAC. A **root management group** per tenant. Up to **six levels** of depth below root (not counting the subscription level). Each subscription and management group has **one parent**.","miss":false},{"id":"c028","d":1,"topic":"Governance","front":"Budgets vs cost alerts vs Advisor?","back":"**Budget:** a spending limit with alert thresholds (actual or forecasted). It **does not stop resources** by itself; it can trigger an **action group**. **Cost alerts:** budget, credit and quota alerts, plus anomaly alerts. **Azure Advisor:** recommendations such as resizing or shutting down underused VMs and buying reservations.","miss":false},{"id":"c029","d":2,"topic":"Storage access","front":"Storage firewall: default action and options?","back":"Set public network access to **Enabled from selected virtual networks and IP addresses**. Allow **VNet subnets** (needs a **Microsoft.Storage servic
