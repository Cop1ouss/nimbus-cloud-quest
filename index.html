ty, privacy and compliance content.","kind":"one","miss":false},{"id":"q059","d":3,"topic":"Monitoring","q":"You want to know whether a specific VM has a problem and whether it is on Azure's side or yours. Which view?","opts":["Azure Status","Service Health","Resource Health","Cost analysis"],"ans":[2],"why":"Resource Health covers individual resources. Service Health covers the services and regions you use; Azure Status is global.","kind":"one","miss":false},{"id":"q060","d":3,"topic":"Management","q":"Which TWO can Azure Arc manage outside Azure?","opts":["Servers","Kubernetes clusters","Microsoft 365 mailboxes","Azure Virtual Desktop host pools in Azure"],"ans":[0,1],"why":"Arc covers servers, Kubernetes clusters, Azure data services, SQL Server and (preview) VMs.","kind":"two","miss":false},{"id":"q061","d":3,"topic":"Management","q":"Which is a declarative language, simpler than JSON ARM templates, for deploying Azure resources?","opts":["Bicep","Azure CLI","Azure Policy","Cloud Shell"],"ans":[0],"why":"Bicep is declarative and deploys through ARM.","kind":"one","miss":false},{"id":"q062","d":3,"topic":"Monitoring","q":"What decides who is notified, and what happens, when an Azure Monitor alert fires?","opts":["An action group","A budget","A resource lock","An initiative"],"ans":[0],"why":"An alert rule defines the condition; an action group defines the response.","kind":"one","miss":false},{"id":"q063","d":3,"topic":"Monitoring","q":"Which Azure Monitor feature tracks response times and failure rates of a web application?","opts":["Application Insights","Azure Advisor","Azure Arc","Service Trust Portal"],"ans":[0],"why":"Application Insights monitors web app performance and usage.","kind":"one","miss":false},{"id":"q064","d":1,"topic":"Benefits","q":"A team runs a development environment only during business hours. Which action best supports sustainability and cost efficiency?","opts":["Run the VMs 24/7 so they are always ready","Automatically shut the environment down overnight and on weekends","Overprovision capacity to avoid slowdowns","Move the workload back on premises"],"ans":[1],"why":"Turning off or deallocating unused resources reduces waste. Learn ties sustainability to right-sizing, automating, monitoring and optimizing.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5a-describe-sustainability-cloud","learn":true},{"id":"q065","d":2,"topic":"Compute","q":"You want to add speech and vision features to an app through APIs without training your own model. Which should you use?","opts":["Azure Machine Learning","Azure AI services","Azure IoT Hub","Azure Virtual Desktop"],"ans":[1],"why":"Azure AI services provide prebuilt AI features through APIs. Azure Machine Learning is for building and training custom models.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q066","d":2,"topic":"Compute","q":"Your data scientists must build, train and manage a custom machine learning model. Which Azure service fits?","opts":["Azure AI services","Azure Machine Learning","Azure IoT Central","Azure App Service"],"ans":[1],"why":"Use Azure Machine Learning for custom model development, experimentation and lifecycle management.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q067","d":2,"topic":"Compute","q":"Which service enables secure, two-way communication between cloud services and IoT devices?","opts":["Azure IoT Edge","Azure Functions","Azure IoT Hub","Azure Bastion"],"ans":[2],"why":"IoT Hub is the messaging hub between the cloud and devices. IoT Edge runs workloads on the devices themselves.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q068","d":2,"topic":"Compute","q":"You need cloud analytics logic to run on devices close to where the data is generated. Which service extends the cloud to those devices?","opts":["Azure IoT Edge","Azure IoT Central","Azure Machine Learning","Azure Virtual Network"],"ans":[0],"why":"Azure IoT Edge extends cloud capabilities to edge devices so workloads run near the data.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services","learn":true},{"id":"q069","d":2,"topic":"Compute","q":"Which TWO workloads can Azure App Service host? Choose 2.","opts":["Web apps","Mobile app back ends","Active Directory domain controllers","Hypervisor hosts"],"ans":[0,1],"why":"App Service hosts web apps, API apps, WebJobs and mobile app back ends without you managing the infrastructure.","kind":"two","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options","learn":true},{"id":"q070","d":2,"topic":"Regions and zones","q":"Which Azure service does NOT require you to choose a region when you create it?","opts":["Azure Virtual Machines","Microsoft Entra ID","A storage account","Azure SQL Database"],"ans":[1],"why":"Global services such as Microsoft Entra ID, Azure Traffic Manager and Azure DNS do not need a region.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"q071","d":2,"topic":"Regions and zones","q":"What is the minimum number of separate availability zones in an availability zone-enabled region?","opts":["Two","Three","Four","Five"],"ans":[1],"why":"Every zone-enabled region has at least three separate zones. Not all regions support zones.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"q072","d":2,"topic":"Regions and zones","q":"Which TWO are advantages of Azure region pairs? Choose 2.","opts":["One region of each pair is prioritized for recovery after a large outage","Planned updates are rolled out to paired regions one at a time","All data is replicated to every Azure region automatically","Paired regions are always in different geographies"],"ans":[0,1],"why":"Pairs get prioritized recovery and staggered updates. Data stays in the same geography (Brazil South is the exception) and not every service replicates automatically.","kind":"two","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure","learn":true},{"id":"q073","d":2,"topic":"Networking","q":"What is the main purpose of an alias record set in Azure DNS?","opts":["To buy a domain name","To follow an Azure resource automatically when its IP address changes","To encrypt DNS queries","To connect on-premises networks to Azure"],"ans":[1],"why":"An alias record points to an Azure resource (public IP, Traffic Manager, CDN endpoint) and updates itself when the IP changes.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"q074","d":2,"topic":"Networking","q":"You must register contoso.com and manage its records in Azure. What should you do?","opts":["Buy it in Azure DNS","Buy it from App Service domains or a registrar, then host it in Azure DNS","Create a private DNS zone","Deploy a VPN Gateway"],"ans":[1],"why":"You cannot buy a domain with Azure DNS. Purchase elsewhere, then host the domain in Azure DNS.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system","learn":true},{"id":"q075","d":2,"topic":"Identity","q":"Which Microsoft Entra Domain Services statement is true?","opts":["Changes sync from the managed domain back to Entra ID","Sync is one-way from Microsoft Entra ID to the managed domain","You must deploy and patch the domain controllers yourself","It replaces Microsoft Entra Connect"],"ans":[1],"why":"A managed domain syncs one way from Entra ID. Microsoft runs the two domain controllers for you.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services","learn":true},{"id":"q076","d":2,"topic":"Security","q":"Which Zero Trust principle is about just-in-time and just-enough-access?","opts":["Verify explicitly","Use least privilege access","Assume breach","Trust the network perimeter"],"ans":[1],"why":"Least privilege access limits access with JIT/JEA and risk-based adaptive policies.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model","learn":true},{"id":"q077","d":2,"topic":"Security","q":"In defense in depth, DDoS protection belongs to which layer?","opts":["Physical","Perimeter","Compute","Data"],"ans":[1],"why":"The perimeter layer uses DDoS protection to filter large-scale attacks and perimeter firewalls to alert on malicious activity.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth","learn":true},{"id":"q078","d":2,"topic":"Security","q":"Storing application secrets in Azure Key Vault belongs to which defense-in-depth layer?","opts":["Application","Network","Physical","Identity and access"],"ans":[0],"why":"The application layer keeps sensitive application secrets in secure storage such as Key Vault.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth","learn":true},{"id":"q079","d":2,"topic":"Security","q":"Which TWO items can Azure Key Vault securely store? Choose 2.","opts":["Encryption keys","Certificates","Virtual machine images","Resource group templates"],"ans":[0,1],"why":"Key Vault stores secrets, encryption keys and certificates, with access control, rotation and auditing.","kind":"two","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9a-describe-encryption-key-management","learn":true},{"id":"q080","d":2,"topic":"Security","q":"Which Microsoft Defender for Cloud feature summarizes your overall security posture as a number?","opts":["Secure score","Cost analysis","Service Health","Resource lock"],"ans":[0],"why":"Recommendations are grouped into security controls and rolled into a secure score.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"q081","d":2,"topic":"Security","q":"To protect on-premises servers with Defender for Cloud, which Azure service do you deploy?","opts":["Azure Arc","Azure Bastion","Azure Front Door","Azure Backup"],"ans":[0],"why":"Azure Arc extends Defender plans to non-Azure machines.","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"q082","d":2,"topic":"Security","q":"Which three needs does Microsoft Defender for Cloud address?","opts":["Assess, secure, defend","Plan, build, ship","Deploy, scale, retire","Backup, restore, archive"],"ans":[0],"why":"Defender for Cloud continuously assesses, helps secure (harden) and defends (alerts and threat protection).","kind":"one","miss":false,"u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud","learn":true},{"id":"q083","d":1,"topic":"Cloud models","q":"A company runs workloads in Azure and in another cloud provider at the same time. Which cloud model is this?","opts":["Hybrid cloud","Multi-cloud","Private cloud","Community cloud"],"ans":[1],"why":"Multi-cloud means using more than one public cloud provider. Hybrid means combining public cloud with private or on-premises resources.","kind":"one","miss":false},{"id":"q084","d":1,"topic":"Cloud models","q":"Which Azure service lets you manage servers and Kubernetes clusters in on-premises, multi-cloud and Azure environments from one place?","opts":["Azure Arc","Azure VMware Solution","Azure Migrate","Azure Resource Manager templates"],"ans":[0],"why":"Azure Arc extends Azure management to resources outside Azure, so hybrid and multi-cloud environments can be managed together.","kind":"one","miss":false},{"id":"q085","d":1,"topic":"Cloud models","q":"A company wants to run its existing VMware workloads in Azure with minimal changes. Which service fits?","opts":["Azure Virtual Desktop","Azure Arc","Azure VMware Solution","Azure Container Instances"],"ans":[2],"why":"Azure VMware Solution runs VMware workloads in Azure with seamless integration and scalability.","kind":"one","miss":false},{"id":"q086","d":1,"topic":"Cost model","q":"Which is NOT a characteristic of the consumption-based model?","opts":["No upfront infrastructure costs","Pay for additional resources only when needed","Stop paying for resources you no longer need","A large upfront investment in hardware"],"ans":[3],"why":"Consumption-based pricing means no upfront hardware purchase. You pay for what you use and stop paying when you stop using it.","kind":"one","miss":false},{"id":"q087","d":1,"topic":"Cost model","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Operational expenditure (OpEx) is spending on products and services as you use them.","Capital expenditure (CapEx) is typically a one-time, upfront spend on physical infrastructure.","Paying monthly for Azure resources you consume is an example of CapEx."],"ans":[1,1,0],"why":"Cloud consumption is OpEx: you pay as you use. CapEx is upfront spending on things like buildings and servers.","miss":false},{"id":"q088","d":1,"topic":"Shared responsibility","q":"Which item is ALWAYS the cloud provider's responsibility, whatever the service type?","opts":["Physical hosts, network and datacenter","Accounts and identities","Devices (mobile and PCs)","Information and data"],"ans":[0],"why":"Microsoft always owns the physical layer. The customer always owns their data, devices, accounts and identities.","kind":"one","miss":false},{"id":"q089","d":1,"topic":"Shared responsibility","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["With SaaS, the customer patches the operating system.","With IaaS, the customer manages the operating system.","The customer is always responsible for the information and data they store."],"ans":[0,1,1],"why":"In SaaS the provider manages the OS and the app. In IaaS you manage the OS. Data is always the customer's responsibility.","miss":false},{"id":"q090","d":1,"topic":"Benefits","q":"What does high availability focus on?","opts":["Making sure resources stay available, even when something goes wrong","Lowering the cost of storage","Adding resources when demand rises","Meeting regulatory requirements"],"ans":[0],"why":"High availability is about keeping resources available with maximum uptime, as described in service-level agreements (SLAs).","kind":"one","miss":false},{"id":"q091","d":1,"topic":"Benefits","type":"match","kind":"match","q":"Match each example to the cloud benefit it shows.","rows":["Resources are added automatically when demand rises","A workload keeps running when one datacenter fails","You forecast next month's bill with the pricing calculator","Policies make every deployment meet company standards"],"choices":["Scalability","Reliability","Predictability","Governance"],"ans":[0,1,2,3],"why":"Scalability adjusts resources to demand. Reliability means recovering from failures. Predictability covers performance and cost forecasting. Governance uses policies and templates to keep deployments compliant.","miss":false},{"id":"q092","d":1,"topic":"Benefits","q":"Managing Azure through the portal, CLI, APIs or PowerShell is an example of which benefit?","opts":["Management in the cloud","Management of the cloud","Predictability","Security"],"ans":[0],"why":"Management in the cloud is HOW you manage: portal, CLI, APIs, PowerShell. Management of the cloud is WHAT the cloud does for you, like autoscaling and alerts.","kind":"one","miss":false},{"id":"q093","d":1,"topic":"Benefits","q":"Automatically scaling resources based on need and getting alerts from monitoring are examples of what?","opts":["Management in the cloud","Management of the cloud","Capital expenditure","Shared responsibility"],"ans":[1],"why":"Management of the cloud covers managing your resources: autoscaling, templates, monitoring alerts and automatic replacement of failing resources.","kind":"one","miss":false},{"id":"q094","d":1,"topic":"Service types","type":"match","kind":"match","q":"Match each scenario to the cloud service type.","rows":["Lift-and-shift an on-premises server to a cloud VM","Use Microsoft 365 for company email","Deploy a web app to Azure App Service without managing the OS"],"choices":["IaaS","PaaS","SaaS"],"ans":[0,2,1],"why":"IaaS gives you VMs to manage. PaaS manages the platform so you deploy code. SaaS is a finished app you subscribe to.","miss":false},{"id":"q095","d":1,"topic":"Service types","q":"Which cloud service type leaves the customer the least management responsibility?","opts":["IaaS","PaaS","SaaS","On-premises"],"ans":[2],"why":"With SaaS the provider manages almost everything. You manage your data, devices, and accounts and identities.","kind":"one","miss":false},{"id":"q096","d":1,"topic":"Service types","q":"Serverless computing, such as Azure Functions, is most like which service type?","opts":["IaaS","PaaS","SaaS","On-premises"],"ans":[1],"why":"Like PaaS, serverless removes infrastructure management so developers focus on code.","kind":"one","miss":false},{"id":"q097","d":1,"topic":"Service types","q":"Which is an example of IaaS?","opts":["Azure Virtual Machines","Azure App Service","Microsoft 365","Azure Functions"],"ans":[0],"why":"Virtual machines give you control of the OS and software, which is infrastructure as a service.","kind":"one","miss":false},{"id":"q098","d":2,"topic":"Regions and zones","q":"What is the minimum number of availability zones in a region that supports them?","opts":["Two","Three","Four","Six"],"ans":[1],"why":"Each region that supports availability zones has a minimum of three separate zones.","kind":"one","miss":false},{"id":"q099","d":2,"topic":"Regions and zones","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Most regions are paired with another region in the same geography.","If a large outage affects both regions in a pair, one of them is prioritized for recovery.","Planned Azure updates roll out to both regions in a pair at the same time."],"ans":[1,1,0],"why":"Updates roll out to one region in a pair at a time to limit downtime. Pairs sit in the same geography, and one region per pair gets recovery priority.","miss":false},{"id":"q100","d":2,"topic":"Regions and zones","q":"A US government agency needs a physically isolated instance of Azure. Which should it use?","opts":["Azure Government regions","A region pair","An availability zone","Azure China (operated by 21Vianet)"],"ans":[0],"why":"Sovereign regions such as US DoD Central and US Gov Virginia are physically and logically isolated instances of Azure for government agencies and partners.","kind":"one","miss":false},{"id":"q101","d":2,"topic":"Regions and zones","q":"Which Azure services are always available from Azure geographies and are resilient to zone-wide and region-wide outages?","opts":["Zonal services","Zone-redundant services","Non-regional services","Sovereign services"],"ans":[2],"why":"Non-regional services are always available from Azure geographies. Zonal services pin to one zone; zone-redundant services replicate across zones.","kind":"one","miss":false},{"id":"q102","d":2,"topic":"Hierarchy","type":"match","kind":"match","q":"Match each description to the Azure organizing structure.","rows":["A single VM or storage account","A logical container that can't be nested","A unit of billing and an access boundary","Groups subscriptions so policy and access apply at scale"],"choices":["Resource","Resource group","Subscription","Management group"],"ans":[0,1,2,3],"why":"Resources live in resource groups, resource groups live in subscriptions, and management groups organize subscriptions.","miss":false},{"id":"q103","d":2,"topic":"Hierarchy","q":"How many levels of depth can a management group tree support, not counting the root level or the subscription level?","opts":["Three","Six","Ten","Unlimited"],"ans":[1],"why":"A management group tree supports up to six levels of depth. One directory can hold up to 10,000 management groups.","kind":"one","miss":false},{"id":"q104","d":2,"topic":"Hierarchy","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A resource can belong to two resource groups at the same time.","Deleting a resource group deletes every resource inside it.","Resource groups can be nested inside other resource groups."],"ans":[0,1,0],"why":"Each resource is in exactly one resource group, groups can't be nested, and deleting a group deletes everything in it.","miss":false},{"id":"q105","d":2,"topic":"Compute","q":"Which feature spreads VMs across racks with separate power and networking, so one rack failure doesn't take them all down?","opts":["Fault domains in an availability set","Update domains in an availability set","Virtual machine scale sets","Region pairs"],"ans":[0],"why":"Fault domains group VMs by common power source and network switch. Update domains group VMs that can be rebooted together during maintenance.","kind":"one","miss":false},{"id":"q106","d":2,"topic":"Compute","q":"You need to centrally manage and update a large number of identical, load-balanced VMs that scale with demand. What should you use?","opts":["Availability sets","Virtual machine scale sets","Azure Virtual Desktop","Azure Container Instances"],"ans":[1],"why":"Virtual machine scale sets create and manage a group of identical, load-balanced VMs and can scale automatically.","kind":"one","miss":false},{"id":"q107","d":2,"topic":"Compute","q":"Which service provides desktop and app virtualization in the cloud, including multi-session Windows?","opts":["Azure Virtual Desktop","Azure App Service","Azure Functions","Azure Arc"],"ans":[0],"why":"Azure Virtual Desktop delivers a full Windows desktop and apps from the cloud to almost any device.","kind":"one","miss":false},{"id":"q108","d":2,"topic":"Compute","q":"You want to run a single container quickly without managing VMs or an orchestrator. Which service fits?","opts":["Azure Kubernetes Service","Azure Container Instances","Azure Virtual Machines","Azure Virtual Desktop"],"ans":[1],"why":"Azure Container Instances is the fastest, simplest way to run a container in Azure as a PaaS offering.","kind":"one","miss":false},{"id":"q109","d":2,"topic":"Compute","type":"match","kind":"match","q":"Match each need to the compute service.","rows":["Event-driven code that runs only when triggered","Host a web app or REST API without managing servers","Full control of the operating system","Orchestrate many containerized microservices"],"choices":["Azure Functions","Azure App Service","Azure Virtual Machines","Azure Kubernetes Service"],"ans":[0,1,2,3],"why":"Functions is event-driven serverless code. App Service hosts web apps and APIs. VMs give OS control. AKS orchestrates containers.","miss":false},{"id":"q110","d":2,"topic":"Networking","q":"Which kind of VPN gateway is the preferred connection method for on-premises devices?","opts":["Policy-based","Route-based","Peering-based","DNS-based"],"ans":[1],"why":"Route-based VPN gateways use routes in the IP forwarding table to direct packets and are the preferred, more resilient option.","kind":"one","miss":false},{"id":"q111","d":2,"topic":"Networking","q":"Two Azure virtual networks must talk to each other directly, with traffic staying on the Microsoft backbone. What should you configure?","opts":["Virtual network peering","A public endpoint","Azure DNS","A resource lock"],"ans":[0],"why":"Virtual network peering connects VNets directly. Traffic between peered networks is private and stays on the Microsoft backbone.","kind":"one","miss":false},{"id":"q112","d":2,"topic":"Networking","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Azure DNS can host your DNS domains and manage their records.","You can buy a domain name through Azure DNS.","Azure DNS supports private DNS zones for names inside virtual networks."],"ans":[1,0,1],"why":"Azure DNS hosts domains and supports private zones, but you can't buy a domain name with Azure DNS. You buy it from a registrar.","miss":false},{"id":"q113","d":2,"topic":"Networking","q":"An Azure resource must be reachable only from inside your virtual network, not from the internet. What should you use?","opts":["A public endpoint","A private endpoint","A VPN gateway","Azure DNS"],"ans":[1],"why":"A private endpoint gives the resource a private IP address in your VNet, so it isn't exposed on the public internet.","kind":"one","miss":false},{"id":"q114","d":2,"topic":"Storage","type":"match","kind":"match","q":"Match each redundancy option to its description.","rows":["Three copies in one datacenter","Three copies across three availability zones in one region","Locally redundant copies plus copies in a secondary region","Zone-redundant copies plus copies in a secondary region"],"choices":["LRS","ZRS","GRS","GZRS"],"ans":[0,1,2,3],"why":"LRS is one datacenter. ZRS spreads across zones. GRS adds a secondary region to LRS. GZRS adds a secondary region to ZRS.","miss":false},{"id":"q115","d":2,"topic":"Storage","q":"Data is rarely accessed but must be stored at least 90 days and still be readable in milliseconds, at lower cost than the cool tier. Which tier?","opts":["Hot","Cool","Cold","Archive"],"ans":[2],"why":"The cold tier is online with fast retrieval, costs less to store than cool, and has a 90-day minimum. Archive is offline.","kind":"one","miss":false},{"id":"q116","d":2,"topic":"Storage","q":"Which statement about the archive access tier is true?","opts":["Data is offline and must be rehydrated before it can be read","Data can be read in milliseconds","It has no minimum storage duration","It has the highest storage cost"],"ans":[0],"why":"Archive is offline with the lowest storage cost. Data must be rehydrated (hours) and should stay at least 180 days.","kind":"one","miss":false},{"id":"q117","d":2,"topic":"Storage","q":"Which service offers fully managed file shares that can be mounted over SMB or NFS?","opts":["Azure Blob Storage","Azure Files","Azure Queue Storage","Azure Disk Storage"],"ans":[1],"why":"Azure Files provides fully managed file shares accessible over SMB and NFS.","kind":"one","miss":false},{"id":"q118","d":2,"topic":"Storage","q":"You must move a very large amount of data to Azure, and your network connection is too slow. What should you use?","opts":["Azure Data Box","AzCopy","Azure Storage Explorer","Azure File Sync"],"ans":[0],"why":"Azure Data Box is a physical device shipped to you to move large amounts of data offline.","kind":"one","miss":false},{"id":"q119","d":2,"topic":"Storage","q":"Which command-line utility copies blobs or files to or from a storage account?","opts":["AzCopy","Azure Data Box","Azure Migrate","Azure Arc"],"ans":[0],"why":"AzCopy is a command-line tool for copying blobs or files to or from your storage account.","kind":"one","miss":false},{"id":"q120","d":2,"topic":"Storage","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["With GRS, you can read data from the secondary region at any time.","The archive tier stores data offline.","Data in the cool tier should be stored for at least 30 days."],"ans":[0,1,1],"why":"Plain GRS doesn't allow reads from the secondary. You need RA-GRS or RA-GZRS for that. Archive is offline. Cool has a 30-day minimum.","miss":false},{"id":"q121","d":2,"topic":"Security","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Zero Trust assumes a breach and verifies each request.","Zero Trust trusts devices on the corporate network by default.","Using least-privileged access is a Zero Trust principle."],"ans":[1,0,1],"why":"Zero Trust principles: verify explicitly, use least-privileged access, and assume breach. Nothing is trusted just because it is on the corporate network.","miss":false},{"id":"q122","d":2,"topic":"Security","q":"Which defense-in-depth layer focuses on limiting network connectivity between resources to only what is required?","opts":["Physical security","Network","Application","Data"],"ans":[1],"why":"The network layer limits communication between resources through segmentation and access controls.","kind":"one","miss":false},{"id":"q123","d":2,"topic":"Identity","q":"Users signing in from the office should sign in normally, but sign-ins from unknown locations must use MFA. What enforces this?","opts":["Conditional Access","Azure Policy","Resource locks","Microsoft Entra Domain Services"],"ans":[0],"why":"Conditional Access uses signals such as user, location and device to allow access, require MFA or block it.","kind":"one","miss":false},{"id":"q124","d":2,"topic":"Identity","q":"Which TWO are passwordless authentication methods?","opts":["Windows Hello for Business","FIDO2 security keys","A password plus security questions","A shared team password"],"ans":[0,1],"why":"Passwordless options include Windows Hello for Business, the Microsoft Authenticator app and FIDO2 security keys.","kind":"two","miss":false},{"id":"q125","d":2,"topic":"Identity","q":"A legacy app needs domain join, Kerberos and LDAP, but you don't want to deploy domain controllers. What should you use?","opts":["Microsoft Entra Domain Services","Conditional Access","Azure Arc","Azure Policy"],"ans":[0],"why":"Microsoft Entra Domain Services provides managed domain services such as domain join, Group Policy, LDAP and Kerberos without running your own domain controllers.","kind":"one","miss":false},{"id":"q126","d":2,"topic":"Identity","q":"Partner users must sign in to your apps with their own credentials. Which capability supports this?","opts":["External identities (B2B collaboration)","Resource locks","Azure Policy initiatives","Availability zones"],"ans":[0],"why":"External identities let people outside your organization use their own identity to access your apps and resources.","kind":"one","miss":false},{"id":"q127","d":3,"topic":"Cost","type":"match","kind":"match","q":"Match each need to the tool.","rows":["Estimate the monthly cost of new Azure services","Compare on-premises costs with running in Azure","Track actual spending and set budgets","Get recommendations such as shutting down underused VMs"],"choices":["Pricing calculator","TCO calculator","Microsoft Cost Management","Azure Advisor"],"ans":[0,1,2,3],"why":"The pricing calculator estimates new Azure costs. The TCO calculator compares on-premises with Azure. Cost Management tracks real spend and budgets. Advisor recommends savings.","miss":false},{"id":"q128","d":3,"topic":"Cost","q":"Which network traffic is generally free?","opts":["Inbound data transfers into Azure datacenters","Outbound data transfers out of Azure datacenters","Data transferred between regions","All bandwidth"],"ans":[0],"why":"Some inbound data transfers, such as data going into Azure datacenters, are free. Outbound transfers are usually charged.","kind":"one","miss":false},{"id":"q129","d":3,"topic":"Cost","q":"Which Cost Management alert tells you when spending reaches a threshold you set?","opts":["Budget alert","Credit alert","Department spending quota alert","Service Health alert"],"ans":[0],"why":"Budget alerts fire when spending, based on usage or cost, reaches or exceeds the amount in the budget alert condition.","kind":"one","miss":false},{"id":"q130","d":3,"topic":"Cost","q":"You want to group resources by cost center so billing reports can be broken down by team. What should you use?","opts":["Resource tags","Resource locks","Availability zones","Management groups only"],"ans":[0],"why":"Tags are name-value pairs such as CostCenter=Finance. They help organize resources and report costs by team or project.","kind":"one","miss":false},{"id":"q131","d":3,"topic":"Cost","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["The same resource can cost different amounts in different regions.","Third-party solutions from Azure Marketplace can add to your bill.","Reserved instances increase the cost of steady, predictable workloads."],"ans":[1,1,0],"why":"Geography affects price, Marketplace solutions can add charges, and reservations lower costs for steady workloads when you commit for one or three years.","miss":false},{"id":"q132","d":3,"topic":"Governance","q":"You want to stop a resource from being deleted but still allow changes to it. Which lock?","opts":["Delete (CanNotDelete) lock","Read-only lock","Azure Policy deny","Conditional Access"],"ans":[0],"why":"A Delete lock allows reads and changes but blocks deletion. A ReadOnly lock blocks both changes and deletion.","kind":"one","miss":false},{"id":"q133","d":3,"topic":"Governance","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["A ReadOnly lock prevents both changes and deletion.","Resource locks apply even to users with the Owner role.","Once a resource lock is applied, it can never be removed."],"ans":[1,1,0],"why":"Locks apply to everyone, including Owners. To delete or change the resource you first remove the lock, which takes a deliberate extra step.","miss":false},{"id":"q134","d":3,"topic":"Governance","q":"In Azure Policy, what is a group of related policy definitions tracked together toward one goal?","opts":["An initiative","A blueprint lock","A management group","A resource tag"],"ans":[0],"why":"An initiative groups related policies so you can assign and track them together, for example to meet a security standard.","kind":"one","miss":false},{"id":"q135","d":3,"topic":"Governance","q":"Which service helps you discover, classify and govern data across on-premises, multicloud and SaaS sources?","opts":["Microsoft Purview","Azure Advisor","Azure Arc","Microsoft Cost Management"],"ans":[0],"why":"Microsoft Purview is a family of data governance, risk and compliance solutions for a unified view of your data.","kind":"one","miss":false},{"id":"q136","d":3,"topic":"Governance","q":"Where can you get Microsoft's compliance and audit reports, such as ISO and SOC reports?","opts":["Service Trust Portal","Azure Advisor","Azure status page","Azure Cloud Shell"],"ans":[0],"why":"The Service Trust Portal gives access to Microsoft's security, privacy and compliance reports and documents.","kind":"one","miss":false},{"id":"q137","d":3,"topic":"Management","type":"match","kind":"match","q":"Match each need to the tool.","rows":["A browser-based shell with Bash or PowerShell and nothing to install","Declarative JSON files for repeatable deployments","A language that compiles to ARM JSON with simpler syntax","Manage on-premises and other-cloud servers as if they were in Azure"],"choices":["Azure Cloud Shell","ARM templates","Bicep","Azure Arc"],"ans":[0,1,2,3],"why":"Cloud Shell runs in the browser. ARM templates are declarative JSON. Bicep is a simpler language for the same deployments. Arc extends Azure management beyond Azure.","miss":false},{"id":"q138","d":3,"topic":"Management","q":"What does it mean that ARM templates are idempotent?","opts":["You can deploy the same template many times and get the same resources in the same state","The template runs only once","The template must be written in PowerShell","Resources deploy one at a time in a fixed order"],"ans":[0],"why":"Idempotent means repeated deployments of the same template produce the same result.","kind":"one","miss":false},{"id":"q139","d":3,"topic":"Management","q":"Requests from the Azure portal, CLI, PowerShell and REST APIs all go through which service?","opts":["Azure Resource Manager","Azure Monitor","Azure Advisor","Microsoft Entra ID"],"ans":[0],"why":"Azure Resource Manager is the deployment and management layer that receives requests from all Azure tools.","kind":"one","miss":false},{"id":"q140","d":3,"topic":"Monitoring","type":"match","kind":"match","q":"Match each description to the tool.","rows":["A global view of the health of all Azure services in all regions","A personalized view of the services and regions you use","The health of one specific VM","Best-practice recommendations in five categories"],"choices":["Azure status","Azure Service Health","Azure Resource Health","Azure Advisor"],"ans":[0,1,2,3],"why":"Azure status is global. Service Health is personalized to your services and regions. Resource Health is one resource. Advisor gives recommendations.","miss":false},{"id":"q141","d":3,"topic":"Monitoring","type":"yn","kind":"yn","q":"For each statement, select Yes if it is true. Otherwise, select No.","stmts":["Azure Advisor recommendations are based on your resource configuration and usage.","Azure Advisor gives recommendations about cost.","Azure Advisor is a paid add-on."],"ans":[1,1,0],"why":"Advisor is free. It gives recommendations for reliability, security, performance, operational excellence and cost.","miss":false},{"id":"q142","d":3,"topic":"Monitoring","q":"Which Azure Monitor tool lets you write queries against the log data it collects?","opts":["Log Analytics","Azure Advisor","Service Trust Portal","Azure status"],"ans":[0],"why":"Log Analytics is the Azure portal tool for writing and running log queries on data collected by Azure Monitor.","kind":"one","miss":false},{"id":"q143","d":3,"topic":"Monitoring","q":"You want to monitor a web app's request rates, response times and failures. Which feature fits?","opts":["Application Insights","Resource Health","Cost Management","Azure Policy"],"ans":[0],"why":"Application Insights, part of Azure Monitor, monitors web applications: requests, failures, response times and more.","kind":"one","miss":false},{"id":"q144","d":3,"topic":"Monitoring","q":"You want to be notified when a VM's CPU stays above 90% for 5 minutes. What should you set up?","opts":["An Azure Monitor alert","A resource lock","A budget alert","A Service Trust Portal report"],"ans":[0],"why":"Azure Monitor alerts notify you when a condition in your monitoring data is met.","kind":"one","miss":false},{"id":"q200","d":1,"topic":"Benefits","q":"Deploying an app and its data to regional datacenters around the world, so users everywhere get good performance, is called what?","opts":["High availability","Geo-distribution","Vertical scaling","Elasticity"],"ans":[1],"why":"Geo-distribution means deploying to regional datacenters around the globe. High availability is about staying up when something fails.","kind":"one","miss":true},{"id":"q201","d":1,"topic":"Shared responsibility","q":"Who manages the operating system of an Azure virtual machine?","opts":["The customer, because VMs are IaaS","Microsoft, because it is SaaS","Microsoft, because it is PaaS","Nobody, Azure patches it automatically"],"ans":[0],"why":"VMs are IaaS, so the customer manages the OS and apps. In PaaS and SaaS the provider manages the OS.","kind":"one","miss":true},{"id":"q202","d":2,"topic":"Identity","q":"What must you use to sync on-premises Active Directory users into Microsoft Entra ID to create hybrid identities?","opts":["Microsoft Entra Connect (Sync)","Azure Resource Manager","Conditional Access","Azure Arc"],"ans":[0],"why":"Microsoft Entra Connect syncs identities from on-premises AD DS to Microsoft Entra ID, so users can use SSO, MFA and self-service password reset in both.","kind":"one","miss":true},{"id":"q203","d":2,"topic":"Networking","q":"Which scenario is a use case for a VPN gateway?","opts":["Connecting an on-premises datacenter to an Azure virtual network over the internet","Filtering outbound network traffic","Hosting DNS records","Load balancing web traffic"],"ans":[0],"why":"A VPN gateway sends encrypted traffic between an Azure virtual network and an on-premises location (site-to-site). Filtering traffic is a firewall job.","kind":"one","miss":true},{"id":"q204","d":2,"topic":"Storage","q":"Which TWO protocols can be used to access Azure file shares?","opts":["Server Message Block (SMB)","Network File System (NFS)","FTP","SMTP"],"ans":[0,1],"why":"Azure Files shares are accessible over the industry-standard SMB and NFS protocols.","kind":"two","miss":true},{"id":"q205","d":3,"topic":"Cost","q":"Which TWO can you do with Microsoft Cost Management?","opts":["Create and manage budgets","Review historical costs and forecast future spending","Estimate on-premises total cost of ownership before moving","Restrict which regions resources can be deployed to"],"ans":[0,1],"why":"Cost Management tracks real spending: budgets, cost analysis, historical reports and forecasts. TCO estimates come from the TCO calculator. Region restrictions are Azure Policy.","kind":"two","miss":true},{"id":"q206","d":3,"topic":"Cost","q":"Which TWO factors affect Azure costs?","opts":["The region a resource is deployed in","Outbound data transfers","The number of resource groups in a subscription","Using ARM templates for deployment"],"ans":[0,1],"why":"Price varies by region, and outbound data transfer is billed. Resource groups and ARM templates are free organizing and deployment tools.","kind":"two","miss":true},{"id":"q207","d":3,"topic":"Governance","q":"You need to make sure VMs can only be deployed with four or fewer vCPUs, or only in approved regions. What should you use?","opts":["Azure Policy","Resource locks","RBAC","Resource tags"],"ans":[0],"why":"Azure Policy evaluates and enforces rules about resource properties, like allowed sizes and locations. Locks only prevent deletion or changes to existing resources.","kind":"one","miss":true},{"id":"q208","d":3,"topic":"Management","q":"What lets you define the resources you want to deploy in a declarative JSON format?","opts":["ARM templates","Azure CLI","Azure PowerShell","Azure portal"],"ans":[0],"why":"ARM templates are declarative JSON: you describe the end state. The CLI and PowerShell run imperative commands step by step.","kind":"one","miss":true},{"id":"q209","d":3,"topic":"Monitoring","q":"Where do you find planned maintenance and root cause analysis (RCA) reports for Azure service issues that affect you?","opts":["Azure Service Health","Log Analytics","Azure Advisor","Azure status page only"],"ans":[0],"why":"Service Health gives a personalized view of service issues, planned maintenance and health advisories, plus RCA reports after outages.","kind":"one","miss":true}],"sections":[{"id":"s1","d":1,"title":"Cloud computing","label":"High","note":"Shared responsibility and cloud models appear on almost every attempt.","why":"","obj":["Define cloud computing","shared responsibility model","public, private, hybrid and use cases","consumption-based model","pricing models","serverless."],"cold":["**Cloud computing**: services (servers, storage, databases, networking, software) over the internet, on demand.","**Public**: provider-owned, shared hardware, no upfront hardware cost. **Private**: one organization, you manage hardware. **Hybrid**: both, workloads move between.","**Shared responsibility**: Microsoft always owns physical datacenter, network, hosts. You always own data, devices, accounts and identities. OS, network controls, applications and identity infrastructure vary by service type.","**CapEx** = upfront spend on hardware. **OpEx** = pay as you go. Consumption-based = pay only for what you use.","**Use cases:** public = variable load and test/dev; private = strict compliance or control; hybrid = sensitive data on-premises plus public capacity.","**Pricing models:** pay-as-you-go (flexible), Reservations and savings plans (commit 1 or 3 years, cheaper if steady), Spot (interruptible, lowest price). Azure Hybrid Benefit reuses existing licenses.","**Serverless**: you run code, the provider manages servers and scales automatically (Azure Functions)."],"traps":["Which model buys hardware: private. Which is pay-as-you-go: public.","\"Who patches the OS?\" depends on IaaS (you) vs PaaS/SaaS (Microsoft).","Hybrid is not \"multiple public clouds\"."],"hooks":["Public = shared. Private = yours. Hybrid = both.","CapEx = buy it. OpEx = rent it."],"topics":["Cloud models","Pricing and cost model","Shared responsibility"],"qtopics":["Cloud models","Cost model","Shared responsibility"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/","modTitle":"Describe cloud computing","units":[{"t":"Introduction to cloud computing","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/2-introduction-cloud-compute"},{"t":"What is cloud computing","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute"},{"t":"The shared responsibility model","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model"},{"t":"Define cloud models","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models"},{"t":"The consumption-based model","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model"}],"models":["shared"]},{"id":"s2","d":1,"title":"Benefits of cloud services","label":"High","note":"Includes the SLA math you've missed in practice.","why":"","obj":["High availability and scalability","reliability and predictability","security and governance","manageability."],"cold":["**Scale up (vertical)** = bigger resource. **Scale out (horizontal)** = more instances.","**Scalability** = add or remove resources for load. **Elasticity** = do it automatically with demand.","**Reliability** = resiliency, redundancy, failover. **Predictability** = performance (autoscale, load balance, HA) and cost.","**Composite SLA = multiply** the SLAs; result is lower than any single one.","Downtime per year: 99% ≈ 3.65 days · 99.9% ≈ 8.76 hrs · 99.99% ≈ 52.6 min.","Management **of** the cloud (autoscale, templates, monitoring) vs management **in** the cloud (portal, CLI, PowerShell, APIs)."],"traps":["Scalability vs elasticity (weak area).","Adding a component to a chain lowers the composite SLA."],"hooks":["Up = bigger box. Out = more boxes.","Composite SLA = multiply."],"topics":["Benefits of the cloud"],"qtopics":["Benefits"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/","modTitle":"Describe the benefits of using cloud services","units":[{"t":"High availability and scalability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud"},{"t":"Reliability and predictability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud"},{"t":"Security and governance","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud"},{"t":"Manageability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud"},{"t":"Sustainability","u":"https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5a-describe-sustainability-cloud"}]},{"id":"s3","d":1,"title":"Cloud service types","label":"High","note":"IaaS shared responsibility is a current weak area.","why":"","obj":["IaaS, PaaS, SaaS and their use cases."],"cold":["**IaaS**: rent VMs, storage, networks. You manage OS, apps, data. Lift and shift, test/dev.","**PaaS**: build and deploy apps without managing servers or OS. You manage app and data.","**SaaS**: finished software, usually subscription (Microsoft 365). You manage data and access.","Moving IaaS → PaaS → SaaS, Microsoft manages more."],"traps":["Azure VMs are IaaS: you patch the OS.","App Service, Functions are PaaS/serverless."],"hooks":["Moving right, Microsoft manages more."],"topics":["Service types"],"qtopics":["Service types"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/","modTitle":"Describe cloud service types","units":[{"t":"IaaS","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service"},{"t":"PaaS","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service"},{"t":"SaaS","u":"https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service"}]},{"id":"s4","d":2,"title":"Core architectural components","label":"High","note":"7 official objectives","why":"The first and most visible objective in Domain 2, and the hierarchy shows up again in Domain 3 (Policy, RBAC, locks, cost tags all apply at these scopes). Learn it once, use it everywhere.","obj":["Azure regions, region pairs, sovereign regions","Availability zones","Azure datacenters","Azure resources and resource groups","Subscriptions","Management groups","The hierarchy of resource groups, subscriptions and management groups"],"cold":["Geography → region → availability zone → datacenter","Region pair = same geography, at least 300 miles apart; Brazil South is the one-way exception","Zonal vs zone-redundant vs non-regional services","Hierarchy: Tenant Root Group → management groups → subscriptions → resource groups → resources","Resource group rules: one group per resource, no nesting, no renaming, delete group = delete contents","Subscription = billing boundary + access control boundary","Management groups: 6 levels deep, 10,000 per directory, one parent"],"traps":["Mixing up availability zones (inside a region) with region pairs (two regions)","Thinking a resource can be in two resource groups","Forgetting that group settings apply to current and future resources (module quiz miss)"],"hooks":["Mom Sells Real Rugs = Management group, Subscription, Resource group, Resource","300 miles = a pair; zones are neighbors","A group is a box: trash the box, trash the contents"],"topics":["Regions and zones","Management hierarchy"],"qtopics":["Regions and zones","Hierarchy"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/","modTitle":"Describe the core architectural components of Azure","units":[{"t":"What is Microsoft Azure","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/2-what-microsoft-azure"},{"t":"Azure accounts","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/3-get-started-azure-accounts"},{"t":"Physical infrastructure","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/5-describe-azure-physical-infrastructure"},{"t":"Management infrastructure","u":"https://learn.microsoft.com/en-us/training/modules/describe-core-architectural-components-of-azure/6-describe-azure-management-infrastructure"}],"models":["hier","regions"]},{"id":"s5","d":2,"title":"Compute","label":"High","note":"4 official objectives (compute half of 'compute and networking'","why":"Questions here are scenario-style: pick the right compute option for a described need. The control ladder (VMs → containers → App Service → Functions) also reinforces the IaaS/PaaS/serverless weak area.","obj":["Compare compute types: containers, virtual machines, functions","VM options: Azure VMs, scale sets, availability sets, Azure Virtual Desktop","Resources required for virtual machines","Application hosting: web apps, containers, virtual machines"],"cold":["VMs are IaaS: you patch the OS","Scale set = identical VMs that auto scale; availability set = update and fault domains inside one region","VM name decoder: Standard_D2s_v5","Container Instances vs Container Apps vs AKS","Functions: event-driven, serverless, pay only while running; Durable Functions = stateful","App Service types: web apps, API apps, WebJobs, mobile apps","AI services (prebuilt) vs Machine Learning (custom) vs IoT"],"traps":["Confusing scale sets (scale) with availability sets (resiliency)","Update domain (planned reboots) vs fault domain (shared power or network)","Picking a VM when the scenario says 'no infrastructure to manage'"],"hooks":["Update = planned, Fault = failure","One container = ACI, smart scaling = Apps, a fleet = AKS","Event in, code runs, pay only while it runs"],"topics":["Compute"],"qtopics":["Compute"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/","modTitle":"Describe Azure compute services","units":[{"t":"Virtual machines","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/2-virtual-machines"},{"t":"Virtual Desktop","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/4-virtual-desktop"},{"t":"Containers","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/5-containers"},{"t":"Functions","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/6-functions"},{"t":"AI, ML and IoT/Edge","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/12a-describe-ai-ml-iot-edge-services"},{"t":"Application hosting options","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-compute-networking-services/7-describe-application-hosting-options"}]},{"id":"s6","d":2,"title":"Networking","label":"Medium-High","note":"2 official objectives (virtual networking; public and private endpoints), but they cover a lot of ground","why":"Fewer objective lines than other sections, but each one is a service you must tell apart. The VPN vs ExpressRoute comparison is a classic exam question.","obj":["Virtual networking: virtual networks, subnets, peering, Azure DNS, VPN Gateway, ExpressRoute","Public and private endpoints"],"cold":["VNet = private IP space split into subnets; NSGs filter, route tables and UDRs route","Peering joins VNets privately over the Microsoft backbone, even across regions","VPN Gateway: encrypted over the internet; site-to-site, point-to-site, network-to-network","VPN HA: active/standby, active/active, ExpressRoute failover, zone-redundant","ExpressRoute: private circuit through a provider, no public internet; DNS, certificate checks and CDN still use the internet","Azure DNS: anycast, Resource Manager (RBAC, logs, locks), private zones, alias records","Public endpoint = public IP; private endpoint = private IP inside the VNet"],"traps":["VPN vs ExpressRoute: encrypted-over-internet vs private line","Point-to-site is one device, site-to-site is a building","Assuming ExpressRoute sends absolutely everything privately (DNS and CDN still go over the internet)"],"hooks":["Subnets slice it, NSGs guard it, peering joins it","Site = building, Point = person, Network = VNet","ExpressRoute = your own private road"],"topics":["Networking"],"qtopics":["Networking"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/","modTitle":"Describe Azure networking services","units":[{"t":"Virtual networking","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/2-virtual-network"},{"t":"VPN Gateway","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/3-virtual-private-networks"},{"t":"ExpressRoute","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/4-expressroute"},{"t":"Azure DNS","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-networking-services/5-domain-name-system"}],"models":["vnet"]},{"id":"s7","d":2,"title":"Storage","label":"High","note":"6 official objectives","why":"The most list-like section: six objectives, each with clear terms to memorize. Redundancy (LRS, ZRS, GRS, GZRS, RA variants) and blob tiers are very testable and build on your zones and region pairs notes.","obj":["Compare Azure Storage services","Describe storage tiers","Describe redundancy options","Describe storage account options and storage types","Options for moving files: AzCopy, Azure Storage Explorer, Azure File Sync","Migration options: Azure Migrate and Azure Data Box"],"cold":["Five services: Blobs, Files, Queues, Disks, Tables","Tiers: hot, cool (30 days), cold (90 days), archive (180 days); account level has no archive","Storage account names: 3-24 characters, lowercase and numbers, unique in Azure","Account types: standard general-purpose v2, premium block blobs, premium file shares, premium page blobs","LRS 11 nines, ZRS 12 nines, GRS and GZRS 16 nines; RA = read access to the secondary","AzCopy one-way, Storage Explorer graphical, File Sync two-way","Azure Migrate (whole move) vs Data Box (up to 80 TB, shipped)"],"traps":["Confusing ZRS (zones, one region) with GRS (second region)","Thinking the secondary region is readable by default (needs RA-GRS or RA-GZRS)","Mixing AzCopy (one-way) with File Sync (two-way)"],"hooks":["BFQDT = Blobs, Files, Queues, Disks, Tables","30 / 90 / 180: the longer it sleeps, the cheaper the bed","Z = zones, G = geo, RA = read access","Migrate = the whole move, Data Box = a truck for the data"],"topics":["Storage"],"qtopics":["Storage"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/","modTitle":"Describe Azure storage services","units":[{"t":"Storage accounts","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/2-accounts"},{"t":"Redundancy","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/3-redundancy"},{"t":"Storage services","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/4-describe-azure-storage-services"},{"t":"Data migration options","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/6-identify-azure-data-migration-options"},{"t":"File movement options","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-storage-services/7-identify-azure-file-movement-options"}]},{"id":"s8","d":2,"title":"Identity, access and security","label":"High","note":"8 official objectives (the longest list in Domain 2","why":"The longest objective list in Domain 2, and the foundation of your whole security track: SC-900 and SC-500 build directly on these ideas. Time spent here pays off beyond AZ-900.","obj":["Directory services: Microsoft Entra ID and Entra Domain Services","Authentication methods: SSO, MFA, passwordless","External identities","Microsoft Entra Conditional Access","Azure role-based access control (RBAC)","Zero Trust","Defense in depth","Microsoft Defender for Cloud"],"cold":["Entra ID = cloud identity; Entra Connect syncs on-prem AD; Domain Services = managed domain for legacy apps","SSO is only as secure as the first sign-in; MFA = know, have, are","Passwordless: Windows Hello for Business, Microsoft Authenticator, FIDO2 keys","B2B collaboration (guests in your directory) vs B2B direct connect (not in your directory) vs External ID for customers","Conditional Access: signals → decision → enforcement","RBAC: role + scope, inherits downward, enforced through Resource Manager, allow model","Zero Trust: verify explicitly, least privilege, assume breach","Defense in depth: 7 layers, data at the center","Key Vault stores secrets, keys and certificates; Defender for Cloud: assess, secure, defend"],"traps":["Entra ID vs Entra Domain Services","RBAC (what you can do) vs Conditional Access (whether you get in)","Forgetting RBAC does not enforce permissions inside an application or at the data level"],"hooks":["Passwordless = high security AND high convenience","Signal → Decision → Enforcement","Never trust, always verify","Pat Is Proud Never Cooking Any Dinner = Physical, Identity, Perimeter, Network, Compute, Application, Data","Assess, Secure, Defend"],"topics":["Identity and security"],"qtopics":["Identity","Security"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/","modTitle":"Describe Azure identity, access, and security","units":[{"t":"Directory services","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/2-directory-services"},{"t":"Authentication methods","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/3-authentication-methods"},{"t":"External identities","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/4-external-identities"},{"t":"Conditional Access","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/5-conditional-access"},{"t":"Role-based access control","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/6-role-based-access-control"},{"t":"Zero Trust","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/7-describe-zero-trust-model"},{"t":"Defense in depth","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/8-describe-defense-depth"},{"t":"Encryption and key management","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9a-describe-encryption-key-management"},{"t":"Defender for Cloud","u":"https://learn.microsoft.com/en-us/training/modules/describe-azure-identity-access-security/9-describe-microsoft-defender-for-cloud"}],"models":["did","zt","ca"]},{"id":"s9","d":3,"title":"Cost management","label":"High","note":"You missed all three cost questions on practice test 1.","why":"","obj":["Factors that affect cost","pricing calculator","Cost Management","tags","cost optimization (Reservations, savings plans, Spot)."],"cold":["**Six cost factors:** resource type, consumption, maintenance, geography, subscription type, Azure Marketplace.","**Billing zones** group regions for data-transfer pricing (not availability zones). Some inbound is free; outbound is priced by zone.","**Pricing calculator:** estimate before you deploy. Nothing is provisioned or charged. TCO calculator is retired.","**Cost Management:** cost analysis, cost alerts, budgets. Alerts: budget, credit (90% and 100%), department spending quota (EA). Budgets can trigger automation that suspends or changes resources.","**Tags:** name-value metadata for resource, cost, operations, security, governance and automation use. NOT inherited. Policy can require or reapply them.","**Pricing options:** pay-as-you-go (flexible), Reservations (stable, 1 or 3 years), savings plan for compute (hourly spend, flexible across compute), Spot (interruptible, can be evicted)."],"traps":["Cost Management does not estimate before deployment. The pricing calculator does.","Tags do not flow down from resource groups.","Reservation is tied to specific resources; savings plan is tied to spend."],"hooks":["\"Calculator = before. Cost Management = after.\"","\"Reserve it, plan it, or spot it.\""],"topics":["Cost management"],"qtopics":["Cost"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/","modTitle":"Describe cost management in Azure","units":[{"t":"Factors that affect costs","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/2-describe-factors-affect-costs-azure"},{"t":"Pricing calculator","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/3-compare-pricing-total-cost-of-ownership-calculators"},{"t":"Cost Management","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/6-describe-azure-tool"},{"t":"Tags","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7-describe-purpose-of-tags"},{"t":"Cost optimization options","u":"https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/7a-describe-cost-optimization-options"}]},{"id":"s10","d":3,"title":"Governance and compliance","label":"High","note":"## Objectives","why":"","obj":["Purview","Azure Policy","resource locks","Service Trust Portal."],"cold":["**Purview:** data governance, risk and compliance. Automated discovery, sensitive-data classification, end-to-end lineage across on-premises, multicloud and SaaS.","**Azure Policy:** create, assign and manage rules that audit or enforce configuration (allowed regions, VM sizes, required tags). Inherited downward. Evaluates new and existing resources. Can remediate. Groups of policies are initiatives.","**Resource locks:** Delete and ReadOnly. Inherited. Apply regardless of RBAC. Remove the lock first to make a change.","**Service Trust Portal:** Microsoft's security, privacy and compliance documents and audit reports. Sign in with an Entra work or school account; NDA for some content."],"traps":["Policy controls what resources can be. RBAC controls what users can do. Locks stop accidental change or deletion.","An Owner is still blocked by a lock."],"hooks":["\"Policy = rules. Lock = brake. RBAC = keys.\""],"topics":["Governance"],"qtopics":["Governance"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/","modTitle":"Describe features and tools for governance and compliance","units":[{"t":"Microsoft Purview","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/2-describe-purpose-microsoft-purview"},{"t":"Azure Policy","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/3-describe-purpose-azure-policy"},{"t":"Resource locks","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/4-describe-purpose-resource-locks"},{"t":"Service Trust Portal","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-azure-for-governance-compliance/6-describe-purpose-service-trust-portal"}]},{"id":"s11","d":3,"title":"Managing and deploying resources","label":"High","note":"## Objectives","why":"","obj":["Azure portal","Cloud Shell, CLI and PowerShell","Azure Arc","Azure Resource Manager and ARM templates (plus Bicep, IaC)."],"cold":["**Portal:** web GUI; dashboards; resilient, presence in every datacenter.","**Cloud Shell:** browser-based, no install, already authenticated; choose PowerShell or CLI (Bash).","**PowerShell vs CLI:** equivalent; cmdlets vs Bash-style commands; both scriptable.","**Arc:** extends Azure management and governance to servers, Kubernetes, data services, SQL Server, VMs outside Azure, through ARM.","**ARM:** every request from any tool goes through it (authenticate, authorize, send to service). ARM templates are declarative JSON: repeatable, orchestrated, modular. Bicep is a simpler declarative language.","**Copilot in Azure:** AI assistant; validate its output."],"traps":["Arc manages non-Azure resources without migrating them. Advisor does not.","\"Create a VM from a phone\" means portal or Cloud Shell.","ARM is a management layer, not a tool you install."],"hooks":["\"Everything goes through ARM.\"","\"Arc brings outside things in.\""],"topics":["Managing and deploying"],"qtopics":["Management"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/","modTitle":"Describe features and tools for managing and deploying Azure resources","units":[{"t":"Tools for interacting with Azure","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/2-describe-interacting-azure"},{"t":"Azure Arc","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/3-describe-purpose-of-azure-arc"},{"t":"Resource Manager and ARM templates","u":"https://learn.microsoft.com/en-us/training/modules/describe-features-tools-manage-deploy-azure-resources/4-describe-azure-resource-manager-azure-arm-templates"}]},{"id":"s12","d":3,"title":"Monitoring tools","label":"High","note":"Advisor, Service Health and Monitor are easy to mix up.","why":"","obj":["Azure Advisor","Azure Service Health","Azure Monitor (Log Analytics, alerts, Application Insights)."],"cold":["**Advisor:** recommendations in five categories: Reliability, Security, Performance, Operational Excellence, Cost.","**Service Health:** Azure Status (global), Service Health (your services and regions: outages, planned maintenance, advisories), Resource Health (one resource).","**Monitor:** collects metrics and logs; Log Analytics = queries; Alerts = rule + action group (metric or log based); Application Insights = web app performance and usage. Drives autoscale.","Action groups are reusable across Monitor, Service Health and Advisor."],"traps":["Outage or planned maintenance → Service Health, not Advisor.","CPU over 80% alert → Monitor.","Recommendation to cut cost → Advisor."],"hooks":["\"Advisor advises. Service Health warns. Monitor measures.\""],"topics":["Monitoring"],"qtopics":["Monitoring"],"mod":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/","modTitle":"Describe monitoring tools in Azure","units":[{"t":"Azure Advisor","u":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/2-describe-purpose-of-azure-advisor"},{"t":"Azure Service Health","u":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/3-describe-azure-service-health"},{"t":"Azure Monitor","u":"https://learn.microsoft.com/en-us/training/modules/describe-monitoring-tools-azure/4-describe-azure-monitor"}]}],"duels":[{"id":"d001","d":1,"a":"Public cloud","b":"Private cloud","clue":"You buy and maintain the hardware.","ans":1,"why":"Private cloud means you buy and maintain the hardware (CapEx) and control security. Public is shared and pay-as-you-go.","miss":true},{"id":"d002","d":1,"a":"CapEx","b":"OpEx","clue":"Upfront, one-time spend on hardware.","ans":0,"why":"CapEx is upfront spending. OpEx is billed as you use the service.","miss":true},{"id":"d003","d":1,"a":"Scale up","b":"Scale out","clue":"Add more virtual machines to handle load.","ans":1,"why":"Adding instances is scaling out (horizontal). Scaling up adds CPU or RAM to one instance.","miss":true},{"id":"d004","d":1,"a":"Elasticity","b":"Scalability","clue":"Resources grow and shrink automatically with demand.","ans":0,"why":"Elasticity is automatic, in both directions. Scalability is the ability to add or remove resources.","miss":true},{"id":"d005","d":1,"a":"High availability","b":"Scalability","clue":"Spread across multiple regions to survive an outage.","ans":0,"why":"Multiple regions keep a service running when one region fails. That is high availability.","miss":true},{"id":"d006","d":1,"a":"IaaS","b":"PaaS","clue":"You patch the operating system.","ans":0,"why":"In IaaS you manage the OS. In PaaS Microsoft does.","miss":true},{"id":"d007","d":1,"a":"PaaS","b":"SaaS","clue":"Azure App Service.","ans":0,"why":"App Service hosts your app without you managing servers: PaaS. Microsoft 365 is SaaS.","miss":true},{"id":"d008","d":1,"a":"PaaS","b":"IaaS","clue":"Azure Cosmos DB.","ans":0,"why":"Cosmos DB is a managed database platform: PaaS. Azure VMs and virtual networks are IaaS.","miss":true},{"id":"d009","d":1,"a":"Hybrid cloud","b":"Public cloud","clue":"Keep sensitive data on-premises but use cloud capacity at peak times.","ans":0,"why":"Hybrid connects private or on-premises resources with the public cloud.","miss":false},{"id":"d010","d":1,"a":"Serverless","b":"IaaS","clue":"Run code on events and pay only while it executes.","ans":0,"why":"Serverless (such as Azure Functions) hides the servers and bills for execution time.","miss":false},{"id":"d011","d":2,"a":"Availability zone","b":"Region pair","clue":"Separate datacenters inside one Azure region.","ans":0,"why":"Zones sit inside a region. A region pair is two regions in the same geography.","miss":true},{"id":"d012","d":2,"a":"Availability zone","b":"Region pair","clue":"Two regions in the same geography, at least 300 miles apart.","ans":1,"why":"Region pairs are for disaster recovery across regions. Zones are inside one region.","miss":true},{"id":"d013","d":2,"a":"Resource","b":"Resource group","clue":"A storage account named storage001.","ans":0,"why":"A storage account is a resource. A resource group is a container for resources.","miss":true},{"id":"d014","d":2,"a":"Management group","b":"Administrative unit","clue":"Applies policy and access across multiple subscriptions.","ans":0,"why":"Management groups sit above subscriptions. Administrative units are for Microsoft Entra resources.","miss":true},{"id":"d015","d":2,"a":"Subscription","b":"Resource group","clue":"A billing boundary.","ans":0,"why":"A subscription is a billing and access boundary. Resource groups organize resources inside it.","miss":false},{"id":"d016","d":2,"a":"Availability set","b":"Scale set","clue":"Identical, load-balanced VMs that autoscale.","ans":1,"why":"Scale sets autoscale identical VMs. Availability sets spread VMs across update and fault domains.","miss":false},{"id":"d017","d":2,"a":"Update domain","b":"Fault domain","clue":"VMs that reboot together during planned maintenance.","ans":0,"why":"Update domains are planned maintenance. Fault domains share power and network.","miss":false},{"id":"d018","d":2,"a":"Azure Functions","b":"App Service","clue":"Event-driven serverless code.","ans":0,"why":"Functions run code when triggered. App Service hosts web apps and APIs.","miss":false},{"id":"d019","d":2,"a":"Container Instances","b":"Kubernetes Service (AKS)","clue":"Kubernetes orchestration for containers.","ans":1,"why":"AKS is Azure's managed Kubernetes. Container Instances runs simple containers fast.","miss":false},{"id":"d020","d":2,"a":"VPN Gateway","b":"ExpressRoute","clue":"An encrypted tunnel over the public internet.","ans":0,"why":"A VPN Gateway tunnels over the internet. ExpressRoute is a private line.","miss":true},{"id":"d021","d":2,"a":"VPN Gateway","b":"ExpressRoute","clue":"A private connection through a provider that does not use the public internet.","ans":1,"why":"ExpressRoute is private. DNS, certificate checks and CDN still use the internet.","miss":true},{"id":"d022","d":2,"a":"VNet peering","b":"Point-to-site VPN","clue":"Connect two Azure virtual networks.","ans":0,"why":"Peering links VNets over Microsoft's backbone. Point-to-site connects one device.","miss":true},{"id":"d023","d":2,"a":"Service endpoint","b":"Private endpoint","clue":"Gives the Azure service a private IP inside your VNet.","ans":1,"why":"A private endpoint uses a private IP. A service endpoint keeps traffic on the backbone but the service keeps its public address.","miss":true},{"id":"d024","d":2,"a":"Service endpoint","b":"ExpressRoute","clue":"Connect Azure SQL to a VNet over the Azure backbone.","ans":0,"why":"Service endpoints extend a VNet to Azure services. ExpressRoute connects on-premises.","miss":true},{"id":"d025","d":2,"a":"NSG","b":"Route table","clue":"Allow or deny traffic by port and protocol.","ans":0,"why":"An NSG filters traffic. A route table decides where it goes.","miss":false},{"id":"d026","d":2,"a":"Azure Firewall","b":"Azure Bastion","clue":"Browser-based RDP and SSH to VMs without public IPs.","ans":1,"why":"Bastion gives secure remote access. Azure Firewall is a managed stateful firewall.","miss":false},{"id":"d027","d":2,"a":"Blob storage","b":"Azure Files","clue":"Mount a share as a drive on many VMs.","ans":1,"why":"Azure Files provides SMB and NFS shares you can mount. Blob stores unstructured objects.","miss":true},{"id":"d028","d":2,"a":"Blob storage","b":"Azure Files","clue":"Serve images directly to a browser.","ans":0,"why":"Blob is built for unstructured data such as images, backups and archives.","miss":true},{"id":"d029","d":2,"a":"Cold tier","b":"Archive tier","clue":"Offline; must be rehydrated before use.","ans":1,"why":"Archive is offline with the lowest storage cost and highest access cost.","miss":true},{"id":"d030","d":2,"a":"Hot tier","b":"Cool tier","clue":"Highest storage cost and fastest access.","ans":0,"why":"Hot is for frequently accessed data. Cool lowers storage cost and has a 30-day minimum.","miss":true},{"id":"d031","d":2,"a":"LRS","b":"GRS","clue":"Survives the loss of an entire region.","ans":1,"why":"GRS copies to a second region. LRS keeps copies in one datacenter.","miss":false},{"id":"d032","d":2,"a":"AzCopy","b":"Azure File Sync","clue":"Two-way sync between an on-premises file server and Azure Files.","ans":1,"why":"File Sync is two-way. AzCopy is a one-way command-line copy.","miss":false},{"id":"d033","d":2,"a":"Azure Migrate","b":"Data Box","clue":"A physical device for large offline transfers.","ans":1,"why":"Data Box ships data offline. Azure Migrate assesses and moves servers.","miss":false},{"id":"d034","d":2,"a":"Entra Domain Services","b":"Managed identities","clue":"Managed AD DS without deploying domain controllers.","ans":0,"why":"Domain Services provides domain join, group policy and LDAP. Managed identities give apps a credential-free identity.","miss":true},{"id":"d035","d":2,"a":"Entra Connect","b":"Entra Domain Services","clue":"Syncs on-premises Active Directory to Microsoft Entra ID.","ans":0,"why":"Entra Connect is the sync tool. Domain Services is a managed domain.","miss":false},{"id":"d036","d":2,"a":"B2B collaboration","b":"External ID for customers","clue":"Partners sign in as guests with their own credentials.","ans":0,"why":"B2B is for partners. External ID for customers is for your customers' apps.","miss":false},{"id":"d037","d":2,"a":"Conditional Access","b":"RBAC","clue":"Require MFA when a sign-in looks risky or is off-network.","ans":0,"why":"Conditional Access evaluates signals and then allows, blocks or requires MFA.","miss":false},{"id":"d038","d":2,"a":"RBAC","b":"Azure Policy","clue":"Decides what a user is allowed to do.","ans":0,"why":"RBAC grants permissions to users. Policy governs what resources may be.","miss":true},{"id":"d039","d":2,"a":"SSO","b":"MFA","clue":"Sign in once to reach many apps.","ans":0,"why":"SSO reuses one sign-in. MFA adds a second proof such as a phone code.","miss":false},{"id":"d040","d":2,"a":"Authentication","b":"Authorization","clue":"Proves who you are.","ans":0,"why":"Authentication verifies identity. Authorization decides what you can do.","miss":false},{"id":"d041","d":2,"a":"Defender for Cloud","b":"Key Vault","clue":"Secure score and security recommendations.","ans":0,"why":"Defender for Cloud assesses and protects. Key V
